 bağlantıları, yüksek sıcaklık boru hatları ve makine şaftları.","pitfalls":["Akma altında kalmanın yorulmayı tamamen önlediğini düşünmek.","Sürünmeyi yalnız ani aşırı yükle karıştırmak.","Yüzey kalitesi, kaynak detayı ve çentik etkisini ihmal etmek."],"checkq":"Yorulma hasarı için gerilmenin mutlaka akma dayanımını aşması gerekir mi?","checka":"Hayır. Yeterli çevrim sayısı ve gerilme aralığında akma altındaki gerilmeler de yorulma hasarı oluşturabilir."},"malzeme_9":{"objective":"Elektrokimyasal korozyon mekanizmasını, korozyon türlerini ve yapı çeliğini koruma yollarını açıklamak.","prerequisites":"Metal, elektrolit, oksijen, anot ve katot kavramları.","explanation":"Korozyon, metalin çevresiyle kimyasal veya elektrokimyasal etkileşimi sonucu bozulmasıdır. Sulu ortamda anot bölgesinde metal çözünür ve elektron bırakır; katot bölgesinde indirgenme reaksiyonu gerçekleşir. Elektriksel bağlantı ve elektrolit varlığı galvanik hücre oluşturabilir. Farklı metallerin temasında daha aktif metal anot hâline gelerek hızla korozyona uğrayabilir. Koruma yöntemleri ortamı kontrol etme, kaplama, uygun malzeme seçimi, katodik koruma ve tasarım detaylarını iyileştirmeyi içerir.","eq_title":"Elektrokimyasal temel","eq":"Anot: M → Mⁿ⁺ + ne⁻;  Katot: indirgenme reaksiyonu","eq_note":"Korozyon hızı ortam pH’ı, klorür, nem, sıcaklık, oksijen ve metal çiftine bağlıdır.","example_title":"Galvanik korozyon örneği","example":"Deniz suyu gibi iletken bir elektrolitte çelik ve bakır elektriksel olarak temas ederse galvanik çift oluşabilir. Çelik daha aktif davranıyorsa anot olarak çözünmesi hızlanabilir. Elektriksel yalıtım, uygun bağlantı malzemesi ve tasarlanmış katodik koruma risk azaltabilir.","steps":["Ortamın nem, tuz/klorür, pH ve sıcaklık koşullarını belirle.","Metal yüzeylerinde anot-katot bölgelerinin oluşabileceğini değerlendir.","Farklı metallerin elektriksel temasını ve alan oranlarını incele.","Kaplama, drenaj, yalıtım veya katodik koruma gibi önlemleri seç.","Bakım ve muayene planını tasarıma dahil et."],"engineering":"Donatı korozyonu, köprü elemanları, kıyı yapıları, gömülü borular ve demiryolu altyapısındaki metal bileşenler.","pitfalls":["Korozyonu yalnız yüzey pası olarak görmek.","Kaplama hasarı ve su birikmesini tasarımda göz ardı etmek.","Farklı metalleri doğrudan temas ettirirken galvanik etkiyi değerlendirmemek."],"checkq":"Elektrokimyasal korozyonda metal çözünmesi hangi bölgede gerçekleşir?","checka":"Anot bölgesinde gerçekleşir."},"malzeme_10":{"objective":"Polimer, seramik ve kompozit malzemelerin özelliklerini ve yapı mühendisliğinde uygun kullanım alanlarını karşılaştırmak.","prerequisites":"Malzeme sınıfları, bağ türleri, dayanım ve rijitlik.","explanation":"Polimerler uzun zincirli moleküllerden oluşur; düşük yoğunluk, korozyon direnci ve şekillendirilebilirlik sağlayabilir, ancak sıcaklık ve sünme etkileri önemlidir. Seramikler çoğunlukla yüksek sertlik, basınç dayanımı ve sıcaklık direnci gösterir; çekme ve darbe altında gevrek olabilir. Kompozitler iki veya daha fazla farklı fazı birleştirerek hedef özellikler elde eder; lif takviyeli polimerler buna örnektir. Kompozitte performans lif yönlenmesi, ara yüzey, matris ve üretim kusurlarına bağlıdır.","eq_title":"Kompozit mantığı","eq":"Kompozit performansı = takviye + matris + ara yüzey + yerleşim/yönlenme","eq_note":"Kompozitlerde özellikler çoğu kez yön bağımlıdır (anizotropi). Tasarım yük yönü ile lif yönü uyumlu olmalıdır.","example_title":"Lif takviyeli eleman","example":"Karbon veya cam lifleri polimer matris içine belirli doğrultuda yerleştirildiğinde lif doğrultusunda yüksek çekme rijitliği elde edilebilir. Ancak liflere dik yöndeki dayanım daha düşük olabilir; bağlantı ve delik çevresinde ara yüzey hasarı ayrıca incelenmelidir.","steps":["Servis ortamını, sıcaklığı ve yük türünü belirle.","Gerekli dayanım, rijitlik, yoğunluk ve dayanıklılık ölçütlerini sıral.","Polimer, seramik veya kompozitin güçlü ve zayıf yönlerini karşılaştır.","Kompozitte lif yönü, matris ve ara yüzey davranışını incele.","Maliyet, bakım, üretim ve geri dönüşüm koşullarını seçim kararına kat."],"engineering":"FRP donatı ve levha güçlendirme, kompozit köprü elemanları, seramik kaplamalar, polimer borular ve yalıtım malzemeleri.","pitfalls":["Kompozitin bütün yönlerde aynı dayanım gösterdiğini varsaymak.","Seramiklerin çekme/darbe altındaki gevrekliğini göz ardı etmek.","Polimerlerde sıcaklık ve zamana bağlı sünmeyi ihmal etmek."],"checkq":"Lif takviyeli kompozitte yönlenme neden önemlidir?","checka":"Çünkü lif doğrultusu boyunca özellikler genellikle daha iyi, liflere dik yönde farklı ve daha düşük olabilir; malzeme anizotrop davranır."},"din_0":{"objective":"Kinematik ile kinetiği ayırmak; parçacık ve rijit cisim modellerinin ne zaman kullanılacağını anlamak.","prerequisites":"Vektörler, konum, hız, ivme, kuvvet ve kütle.","explanation":"Dinamik, hareketi ve hareketin nedenlerini inceler. Kinematik, hareketi kuvvetleri dikkate almadan konum-hız-ivme üzerinden tanımlar. Kinetik, bu hareketi oluşturan kuvvet ve momentlerle ilişki kurar. Boyutları ihmal edilebilen veya yalnız kütle merkezinin hareketi incelenen cisim parçacık modeliyle ele alınabilir. Şekil değiştirmesi ihmal edilen fakat dönmesi önemli olan cisim rijit cisim modelidir. Model seçimi, denklemlerin ve bilinmeyenlerin sayısını belirler.","eq_title":"Dinamikte temel ayrım","eq":"Kinematik: r(t), v(t), a(t);  Kinetik: ΣF=m a","eq_note":"Kuvveti bilmeden hareket tanımlanabilir; ancak neden oluştuğunu açıklamak için kinetik gerekir.","example_title":"Model seçimi","example":"Ray üzerinde ilerleyen bir trenin yalnız kütle merkezinin doğrusal hareketi inceleniyorsa parçacık modeli yeterli olabilir. Aynı trenin tekerlek dönmesi ve kayma koşulu inceleniyorsa rijit cisim dönme kinematiği de gerekir.","steps":["Soruda yalnız hareket mi, yoksa kuvvet-hareket ilişkisi mi istendiğini belirle.","Cismin dönmesi ve boyutları çözümü etkiliyor mu kontrol et.","Parçacık veya rijit cisim modelini seç.","Referans eksenini ve işaret yönünü tanımla."],"engineering":"Araç hareketi, vinç, kaldırma sistemleri, raylı sistemler, makine elemanları ve titreşim başlangıç analizleri.","pitfalls":["Kinematik denklemine kuvvet eklemek.","Parçacık modeli kullanırken dönme etkisini ihmal ettiğini belirtmemek.","Referans eksenini problem boyunca değiştirmek."],"checkq":"Kinematik ile kinetik arasındaki temel fark nedir?","checka":"Kinematik hareketi tanımlar; kinetik hareketi kuvvet ve momentlerle ilişkilendirir."},"din_1":{"objective":"Doğrusal hareket için konum, hız ve ivme bağıntılarını kurmak ve sabit ivmeli hareket problemlerini çözmek.","prerequisites":"Türev-integral, konum, zaman ve birim dönüşümü.","explanation":"Doğrusal harekette cisim tek bir eksen boyunca hareket eder. Konum x(t), hız v=dx/dt, ivme a=dv/dt’dir. Sabit ivmede hız zamana göre doğrusal, konum zamana göre ikinci dereceden değişir. Hızın işareti hareket yönünü; ivmenin işareti seçilen eksene göre hız değişim yönünü gösterir. İvme ile hız aynı işaretliyse sürat artar, zıt işaretliyse sürat azalır.","eq_title":"Sabit ivmeli hareket","eq":"v=v₀+at;  x−x₀=v₀t+½at²;  v²=v₀²+2a(x−x₀)","eq_note":"x m, v m/s, a m/s², t s. Bu bağıntılar sabit ivme için kullanılır.","example_title":"Sabit ivmeli araç","example":"Başlangıç hızı 2 m/s, ivme 1,5 m/s² ve süre 4 s. Son hız v=2+1,5×4=8 m/s. Yer değiştirme Δx=2×4+0,5×1,5×4²=8+12=20 m.","steps":["Pozitif hareket yönünü belirle.","Verilenleri v₀, a, t, x₀ biçiminde listele.","İstenen bilinmeyeni içeren en kısa bağıntıyı seç.","İşaretleri koruyarak hesapla.","Son hız ve yer değiştirme değerlerini fiziksel olarak yorumla."],"engineering":"Tren hızlanma-frenleme, iş makinesi hareketleri, vinç kaldırma ve araç takip mesafesi analizleri.","pitfalls":["Hızın yönü ile süratin büyüklüğünü aynı kavram sanmak.","Sabit ivme olmayan durumda sabit ivme denklemlerini kullanmak.","km/h değerini m/s’ye çevirmemek."],"checkq":"Hız ile ivme zıt işaretliyse cisim hangi koşulda yavaşlar?","checka":"Hareket yönündeki hızın büyüklüğü azalır; yani sürat azalır."},"din_2":{"objective":"Eğrisel harekette hız ve ivmeyi teğetsel-normal bileşenlerine ayırarak eğri yörüngeyi çözümlemek.","prerequisites":"Vektör türevi, hız, ivme ve dairesel hareket.","explanation":"Eğrisel harekette hız vektörü yörüngeye teğettir. İvme, süratin değişmesinden kaynaklanan teğetsel bileşen a_t=dv/dt ve hız yönünün değişmesinden kaynaklanan normal bileşen a_n=v²/ρ içerir. Normal ivme eğrilik merkezine doğru yönelir. Dairesel harekette eğrilik yarıçapı sabitse ρ=r olur. Sürat sabit olsa bile yön değiştiği için normal ivme sıfır değildir.","eq_title":"Teğetsel ve normal ivme","eq":"a = a_t e_t + a_n e_n;  a_t=dv/dt;  a_n=v²/ρ","eq_note":"a_t ve a_n m/s²; v m/s, ρ m. Normal birim vektör eğrilik merkezini gösterir.","example_title":"Viraj alan araç","example":"Araç 10 m/s süratle 20 m yarıçaplı virajı sabit süratle alıyor. a_t=0; a_n=10²/20=5 m/s² ve viraj merkezine doğrudur.","steps":["Yörüngenin teğet yönünü çiz.","Hızın büyüklüğü değişiyor mu değerlendir; a_t hesapla.","Yörünge eğrilik yarıçapını bul; a_n=v²/ρ kullan.","Bileşenleri vektörel birleştir ve ivme yönünü çiz."],"engineering":"Karayolu viraj tasarımı, araç dinamiği, raylı sistemlerde kurp hareketi, merkezkaç etkisi ve makine parçaları.","pitfalls":["Sabit süratte ivme sıfırdır sanmak.","Normal ivmeyi yörünge dışına yöneltmek.","Eğrilik yarıçapı ile çapı karıştırmak."],"checkq":"Sabit süratle dairesel hareket yapan cismin ivmesi var mıdır?","checka":"Evet. Yön değiştiği için merkeze doğru v²/r normal ivmesi vardır."},"din_3":{"objective":"Bağıl konum, hız ve ivme bağıntılarını kullanarak iki cismin hareketini aynı referans sisteminde ifade etmek.","prerequisites":"Vektör çıkarma, koordinat ekseni ve hareket tanımı.","explanation":"Bağıl hareket, bir cismin konum veya hızını başka bir cisme göre tanımlamaktır. Aynı referans çerçevesinde r_A/B=r_A−r_B ve v_A/B=v_A−v_B yazılır. Bir doğrultudaki hareketlerde işaret seçimi önemlidir; ters yönler negatif alınır. Hareketli bir taşıyıcı, tren veya bant üzerindeki cismin hızı, taşıyıcının yere göre hızı ile cismin taşıyıcıya göre hızının vektörel toplamıdır.","eq_title":"Bağıl hareket","eq":"v_A/B = v_A − v_B;  v_A = v_B + v_A/B","eq_note":"Bütün hız vektörleri aynı referans sisteminde ve aynı eksenlerle ifade edilmelidir.","example_title":"İki trenin bağıl hızı","example":"A treni doğuya 20 m/s, B treni doğuya 12 m/s gidiyorsa A’nın B’ye göre hızı 20−12=8 m/s doğudur. B batıya 12 m/s gidiyor olsaydı A’ya göre yaklaşma hızı 20−(−12)=32 m/s olurdu.","steps":["Ortak referans ekseni ve pozitif yönü seç.","Her cismin yere göre hızını işaretiyle yaz.","Bağıl hız için v_A/B=v_A−v_B uygula.","Sonucun işareti ve büyüklüğünü hareket yönleriyle kontrol et."],"engineering":"Karşılıklı tren hareketi, konveyör bant, hareketli merdiven, gemi-akıntı ve rüzgâr-uçak problemleri.","pitfalls":["Hız büyüklüklerini her koşulda doğrudan toplamak.","Referans sistemini belirtmemek.","Zıt yönlü hareketlerde işaretleri yanlış almak."],"checkq":"Aynı yönde 20 m/s ve 12 m/s hızla giden iki cismin bağıl hız büyüklüğü kaçtır?","checka":"20−12=8 m/s."},"din_4":{"objective":"Newton’un ikinci kanununu serbest cisim diyagramı ile uygulayarak ivme, gerilme ve tepki kuvvetlerini bulmak.","prerequisites":"Kuvvet bileşenleri, ağırlık, normal tepki ve sürtünme.","explanation":"Kinetik çözümde önce cisim sistemden ayrılır ve yalnız cisme etkiyen dış kuvvetler gösterilir. Bu serbest cisim diyagramında ağırlık mg, temas yüzeyinin normali, sürtünme, ip gerilmesi ve uygulanan kuvvetler bulunur. Sonra ΣF_x=ma_x ve ΣF_y=ma_y yazılır. Normal tepki her zaman ağırlığa eşit değildir; düşey ivme veya eğik düzlem varsa değişir. Sürtünme yönü, olası/gerçek bağıl kayma eğilimine zıt seçilir.","eq_title":"Newton’un ikinci kanunu","eq":"ΣF = m a","eq_note":"N=kg·m/s². Her eksen için ayrı denge/kinetik denklemi yaz; kuvvetlerin yönlerini vektörel dikkate al.","example_title":"Yatay düzlemde araba","example":"Kütlesi 1200 kg olan aracın yatay doğrultudaki net kuvveti 2400 N ise a=ΣF/m=2400/1200=2 m/s² olur. Net kuvvet, çekiş kuvveti eksi direnç kuvvetlerinin toplamıdır.","steps":["Cismi izole et ve tüm dış kuvvetleri çiz.","Koordinat eksenlerini en uygun doğrultuda seç.","Kuvvetleri eksenlere ayır.","Her eksen için ΣF=ma yaz.","Bulduğun ivmenin yönünü ve kuvvet büyüklüklerini fiziksel olarak kontrol et."],"engineering":"Araç hızlanması, vinç yükleri, eğik düzlemde malzeme hareketi, frenleme ve makine mekanizmaları.","pitfalls":["Normal kuvveti her zaman mg almak.","Sürtünmeyi hareket yönünde çizmek.","Net kuvvet yerine tek bir uygulanan kuvveti m·a’ya eşitlemek.","Kütle yerine ağırlığı kullanmak."],"checkq":"Yatay düzlemde ivme sıfırsa yatay kuvvetlerin cebirsel toplamı nedir?","checka":"Sıfırdır; kuvvetler birbirini dengeler."},"din_5":{"objective":"İş–enerji ilkesini kullanarak kuvvet, yer değiştirme, hız ve potansiyel enerji arasındaki ilişkiyi çözmek.","prerequisites":"Kuvvet, yer değiştirme, hız, kütle ve enerji birimleri.","explanation":"Bir kuvvetin yaptığı iş, kuvvetin yer değiştirme doğrultusundaki bileşeninin yol boyunca integralidir. Net iş kinetik enerjideki değişime eşittir. Ağırlık ve yay kuvveti konservatif kuvvetlerdir; bunların potansiyel enerji tanımı yapılabilir. Sürtünme gibi konservatif olmayan kuvvetlerin işi mekanik enerjiyi azaltabilir. İş–enerji yöntemi ivmeyi zamanın fonksiyonu olarak bulmayı gerektirmeden başlangıç-son durum hızlarını ilişkilendirebilir.","eq_title":"İş–enerji","eq":"W_net = T₂−T₁;  T=½mv²;  U_g=mgh;  U_yay=½kx²","eq_note":"İş ve enerji joule (J), kütle kg, hız m/s, yükseklik m, yay katsayısı N/m.","example_title":"Net işten son hız","example":"10 kg kütleli cisim durgun hâlden başlayıp üzerine 200 J net iş yapılıyor. T₂−0=200; ½×10×v²=200. v²=40 ve v≈6,32 m/s.","steps":["Başlangıç ve son durumları tanımla.","Kinetik ve potansiyel enerjileri yaz.","Uygulanan kuvvetlerin yaptığı işleri belirle; sürtünme varsa negatif işi ekle.","W_net=T₂−T₁ veya enerji denkleminden son hızı bul.","Enerji kayıp/kazanımlarının işaretini kontrol et."],"engineering":"Araç frenleme, vinç kaldırma, düşen cisim, yaylı tampon ve makine enerji aktarımı.","pitfalls":["İş ile kuvveti karıştırmak.","Kuvvet hareket yönüne dikse işin sıfır olduğunu unutmak.","Sürtünme işini pozitif yazmak.","Potansiyel enerji referans seviyesini belirtmemek."],"checkq":"Net iş pozitifse cismin kinetik enerjisi nasıl değişir?","checka":"Artar."},"din_6":{"objective":"İmpuls–momentum ilkesini kullanarak çarpışma, darbe ve kısa süreli kuvvet problemlerini çözmek.","prerequisites":"Kütle, hız, kuvvet-zaman grafiği ve vektör.","explanation":"Doğrusal momentum p=mv’dir. Bir kuvvetin belirli zaman aralığında oluşturduğu impuls, kuvvetin zamana göre integralidir ve momentum değişimine eşittir. Ortalama kuvvet sabit kabul edilirse J=F_ort Δt olur. Çarpışmalarda sistem dış kuvvetlerinin impulsu ihmal edilebiliyorsa toplam momentum korunur. Momentum vektörel olduğu için çarpışma öncesi ve sonrası yönler işaretleriyle alınır.","eq_title":"İmpuls–momentum","eq":"∫F dt = m v₂ − m v₁","eq_note":"İmpuls N·s, momentum kg·m/s birimindedir ve bu iki birim eşdeğerdir.","example_title":"Kısa süreli hız değişimi","example":"2 kg cisim 3 m/s hızdan aynı doğrultuda 5 m/s hıza çıkıyor. İmpuls J=m(v₂−v₁)=2×(5−3)=4 N·s. Kuvvet 0,2 s boyunca ortalama sabitse F_ort=4/0,2=20 N.","steps":["Hareket doğrultusunu pozitif seç.","Başlangıç ve son hız vektörlerini işaretli yaz.","Kuvvet-zaman alanından impulsu bul.","J=m(v₂−v₁) ile bilinmeyeni çöz.","Çarpışma sisteminde dış impulsun ihmal edilip edilemeyeceğini değerlendir."],"engineering":"Araç çarpışmaları, tampon tasarımı, çekiç-darbe, raylı sistem kuplörleri ve düşen yüklerin durdurulması.","pitfalls":["Kuvvet-zaman grafiğinde alan yerine tepe kuvvetini kullanmak.","Momentumun vektörel olduğunu unutmak.","Çarpışmada momentum korunumu ile kinetik enerji korunumu koşullarını aynı sanmak."],"checkq":"İmpuls hangi büyüklüğün değişimine eşittir?","checka":"Doğrusal momentum değişimine eşittir."},"din_7":{"objective":"Parçacık sistemlerinde kütle merkezi ve toplam momentum kavramlarını kullanmak; dış kuvvet yokluğunda momentum korunmasını uygulamak.","prerequisites":"Parçacık momentumu, kütle ve konum.","explanation":"Parçacık sistemi birden fazla cismin birlikte incelendiği modeldir. Sistemin kütle merkezi, kütlelerin konumlarla ağırlıklandırılmış ortalamasıdır. Toplam doğrusal momentum, parçacık momentumlarının vektörel toplamıdır ve kütle merkezi hızına bağlıdır. Sistem üzerindeki net dış kuvvet toplam momentumun değişim hızını belirler. İç kuvvetler Newton’un üçüncü kanunuyla çiftler hâlinde birbirini götürdüğünden, dış impuls yoksa toplam momentum korunur.","eq_title":"Kütle merkezi ve momentum","eq":"r_G = (Σmᵢrᵢ)/(Σmᵢ);  P = Σmᵢvᵢ","eq_note":"Kütle merkezi konum ve hız vektörlerinin ağırlıklı ortalamasıdır.","example_title":"İki cismin kütle merkezi","example":"2 kg ve 3 kg kütleli iki cisim x=0 m ve x=4 m konumlarında olsun. x_G=(2×0+3×4)/(2+3)=12/5=2,4 m. Kütle merkezi daha ağır cisme daha yakındır.","steps":["Sistem sınırını ve sistemdeki parçacıkları belirle.","Her parçanın kütle ve konum/hız vektörünü yaz.","Kütle merkezini ağırlıklı ortalamayla bul.","Net dış kuvvet/impuls olup olmadığını incele.","Uygunsa toplam momentum korunumu denklemini uygula."],"engineering":"Araç çarpışmaları, iki parçalı sistemler, patlama/ayrılma, makine hareketli parçaları ve yük taşıma düzenekleri.","pitfalls":["Kütle merkezini geometrik orta nokta sanmak.","İç kuvvetleri toplam dış kuvvet olarak almak.","Momentum korunumu için dış impuls koşulunu kontrol etmemek."],"checkq":"Net dış impuls sıfırsa toplam momentum nasıl değişir?","checka":"Korunur; başlangıçtaki toplam momentum son toplam momentuma eşittir."},"din_8":{"objective":"Rijit cisim öteleme, dönme ve düzlemsel genel hareketini; açısal konum, hız ve ivme ile tanımlamak.","prerequisites":"Vektörler, açısal ölçü, doğrusal hız ve dairesel hareket.","explanation":"Rijit cisimde herhangi iki nokta arasındaki uzaklık sabit kabul edilir. Ötelemede bütün noktalar aynı anda aynı hız ve ivmeye sahiptir. Sabit eksen etrafında dönmede her noktanın açısal hızı aynıdır; doğrusal hız eksene uzaklıkla artar. Düzlemsel genel harekette hareket, bir referans noktasının ötelemesi ile o nokta etrafındaki dönmenin toplamı olarak ele alınabilir. Kaymadan yuvarlanmada temas noktasının yere göre anlık hızı sıfırdır.","eq_title":"Açısal ve doğrusal kinematik","eq":"v = ωr;  a_t=αr;  a_n=ω²r","eq_note":"ω rad/s, α rad/s², r m; doğrusal hız m/s ve ivme m/s².","example_title":"Tekerlek çevresindeki hız","example":"Yarıçapı 0,30 m olan tekerlek 10 rad/s açısal hızla dönüyor. Dış çeperin teğetsel hızı v=ωr=10×0,30=3 m/s olur.","steps":["Hareketin öteleme, sabit eksenli dönme veya genel hareket olduğunu belirle.","Açısal konum, hız ve ivmeyi tanımla.","İlgili noktanın eksene uzaklığını belirle.","v=ωr ve a bileşenlerini uygula.","Kaymadan yuvarlanma varsa v_G=ωR koşulunu işaretleriyle kullan."],"engineering":"Tekerlek-ray teması, vinç tamburları, makara sistemleri, döner makineler ve yapı ekipmanları.","pitfalls":["Açısal hız birimini derece/s olarak bırakmak.","Merkez hızı ile çeper hızını aynı sanmak.","Kaymadan yuvarlanma koşulunu her temas durumunda geçerli saymak."],"checkq":"Sabit eksen etrafında dönen rijit cisimde bütün noktaların açısal hızı nasıldır?","checka":"Aynıdır; doğrusal teğetsel hız ise eksene uzaklığa bağlıdır."},"din_9":{"objective":"Rijit cismin dönme dinamiğinde atalet momenti, tork, açısal ivme ve dönme enerjisini ilişkilendirmek.","prerequisites":"Açısal hız, tork, kütle dağılımı ve enerji.","explanation":"Dönme hareketinde kütlenin dönme eksenine göre dağılımını kütlesel atalet momenti I temsil eder. Aynı tork altında I büyükse açısal ivme daha küçük olur. Sabit eksen etrafında dönme için ΣM=Iα yazılır. Dönme kinetik enerjisi ½Iω²’dir. Bir kuvvetin torku, kuvvetin dönme eksenine dik moment koluyla çarpımına eşittir; kuvvet doğrultusu eksenden geçerse tork sıfır olabilir.","eq_title":"Dönme dinamiği","eq":"ΣM = Iα;  T_rot=½Iω²","eq_note":"M N·m, I kg·m², α rad/s², ω rad/s. Atalet momenti yalnız kütleye değil, kütlenin eksene uzaklığına da bağlıdır.","example_title":"Dönme enerjisi","example":"I=2 kg·m² ve ω=5 rad/s olan rijit cismin dönme kinetik enerjisi T=½×2×5²=25 J’dür.","steps":["Dönme eksenini açıkça tanımla.","Kuvvetlerin bu eksene göre momentlerini bul.","Kütle dağılımından veya verilen tablodan I değerini seç.","ΣM=Iα ile açısal ivmeyi çöz.","Enerji isteniyorsa ½Iω² bağıntısını uygula."],"engineering":"Motor, şaft, tambur, volan, döner ekipman, vinç ve dönen tekerleklerin hızlanma/frenleme hesabı.","pitfalls":["Kütlesel atalet momenti I ile alan atalet momenti I’yi karıştırmak.","Tork kolunu kuvvet doğrultusuna dik uzaklık yerine toplam mesafe almak.","Derece/s ile rad/s karıştırmak."],"checkq":"Aynı tork altında kütlesel atalet momenti artarsa açısal ivme nasıl değişir?","checka":"Azalır; α=ΣM/I."}};

const fallTopicRows = {"myd1":[["İnşaat mühendisliği; buildings, bridges, roads, railways and water infrastructure gibi altyapı ve üstyapı sistemlerini kapsar. Teknik isim gruplarında ana isim çoğu kez sondadır; kelimeleri bağlam içinde birlikte çevirmek gerekir.","Teknik isim grubu","adjective + noun; noun + noun; subject + verb + object","İsim gruplarında ana ismi bul; sıfat ve isim tamlamalarını bu isme bağla.","“The bridge structure transfers vehicle loads to the foundations.” cümlesinde bridge structure özne, transfers fiil ve vehicle loads nesnedir. Anlamı: Köprü taşıyıcı sistemi araç yüklerini temellere aktarır.","Load-bearing structure ne demektir?","Yük taşıyan/taşıyıcı yapı.","Infrastructure ne demektir?","Altyapı.","Construction kelimesini yalnız bina yapımı olarak çevirmek.",[["structure","yapı / taşıyıcı sistem"],["load","yük"],["foundation","temel"],["infrastructure","altyapı"]]],["Concrete, steel, timber, masonry and aggregates yaygın yapı malzemeleridir. Strength, stiffness, durability ve workability farklı özelliklerdir. Beton çoğunlukla basınç; çelik donatı çekme etkisi bakımından önemlidir.","Malzeme ve özellik dili","material + property; be made of; resist + load","Strength taşıma kapasitesi, stiffness rijitlik, durability dayanıklılıktır; birbirinin yerine kullanılmaz.","“Reinforced concrete is made of concrete and steel reinforcement.” Betonarme beton ve çelik donatıdan oluşur. “Concrete resists compression.” Beton basınca karşı koyar.","Strength ile stiffness farkı nedir?","Strength taşıma kapasitesi; stiffness deformasyona karşı rijitliktir.","Aggregate nedir?","Betondaki kum, çakıl veya kırmataş gibi taneli malzemedir.","Hardness, strength, stiffness ve toughness kavramlarını eş anlamlı çevirmek.",[["concrete","beton"],["reinforcement","donatı"],["aggregate","agrega"],["durability","dayanıklılık"]]],["Şantiyede excavator kazı yapar, loader gevşek malzeme taşır, crane yük kaldırır, roller zemini sıkıştırır. Teknik fiiller yapılan işi, nesne ise etkilenen malzemeyi gösterir.","Ekipman ve işlem fiilleri","equipment + action verb + material","Fiili bulduktan sonra fiilin nesnesini ve ekipmanı eşleştir; işlem sırasını zaman bağlaçlarıyla ifade et.","“The excavator removes soil. The dump truck transports it. The roller compacts the fill.” Sırasıyla kazı, taşıma ve sıkıştırma yapılır.","The roller compacts the soil ne demektir?","Silindir zemini sıkıştırır.","The crane lifts the precast beam cümlesinde ne kaldırılır?","Önyapımlı kiriş kaldırılır.","Transport ile lift fiillerini veya ekipman ile yapılan işi karıştırmak.",[["excavator","ekskavatör"],["loader","yükleyici"],["crane","vinç"],["compaction","sıkıştırma"]]],["Döşeme yükü kirişlere/duvarlara, kirişler kolonlara, kolonlar temele aktarabilir. Bu yük aktarım zinciri load path olarak adlandırılır. Load-bearing wall taşıyıcı duvar; partition wall bölme duvardır.","Yapı elemanlarının işlevi","slab → beam / wall → column → foundation","Ok yönleri idealize edilmiş yük aktarımını gösterir; gerçek yük yolu proje taşıyıcı şemasından doğrulanır.","“The slab transfers the floor load to the beams. The beams transfer the load to the columns.” Döşeme yükü kirişlere, kirişler kolonlara aktarır.","Load-bearing wall ile partition wall farkı nedir?","Taşıyıcı duvar yük aktarır; bölme duvarı temel olarak mekânı ayırır.","Beam hangi temel davranışla ilişkilidir?","Çoğunlukla eğilme davranışıyla.","Her wall ifadesini taşıyıcı duvar diye çevirmek.",[["slab","döşeme"],["beam","kiriş"],["column","kolon"],["partition wall","bölme duvar"]]],["Plan, elevation, section ve detail çizim türleridir. Dimension ölçü, scale çizim ile gerçek boy arasındaki orandır. Teknik çizimde birim ve tolerans ifadeleri aynen korunmalıdır.","Ölçek ve ölçülendirme","drawing length = actual length / scale denominator","1:100 ölçekte çizimde 1 birim gerçek hayatta 100 birimdir; gerçek ve çizim ölçüsünü ayır.","Gerçek uzunluğu 3,20 m olan eleman 1:100 ölçekte 3,20/100=0,032 m=32 mm çizilir.","Section drawing neyi gösterir?","Kesit düzleminden görülen iç düzeni ve katmanları.","1:50 ölçekte gerçek uzunluğu 4 m olan eleman kaç mm çizilir?","4.000/50=80 mm.","Ölçek oranını ters kullanmak.",[["plan","plan / kat planı"],["elevation","görünüş / cephe"],["section","kesit"],["dimension","ölçü"]]],["Uzunluk m, alan m², hacim m³, kütle kg veya tonne ile ölçülür. Quantity take-off çizimlerden imalat miktarı çıkarmaktır. Bill of quantities iş kalemlerini, birimleri ve miktarları listeler.","Miktar ve birim","A = length × width; V = length × width × height","Birim, çarpılan boyutların birimlerinden türetilir; alan ve hacim karıştırılmaz.","5 m uzunluk, 0,30 m genişlik ve 0,40 m yükseklikte kiriş için geometrik hacim V=5×0,30×0,40=0,60 m³ olur.","Quantity take-off ne demektir?","Çizimlerden imalat miktarlarını ölçüp çıkarmaktır.","2,5 m² kaç cm²'dir?","25.000 cm².","m² ile m³'ü veya metraj miktarıyla birim fiyatı karıştırmak.",[["quantity","miktar"],["volume","hacim"],["area","alan"],["unit rate","birim fiyat"]]],["Must/have to zorunluluk; must not yasak; should tavsiye; may izin veya olasılık bildirir. PPE, personal protective equipment kısaltmasıdır. Olumsuzluk kelimesi talimatın anlamını tersine çevirebilir.","Modal fiiller","must = obligation; must not = prohibition; should = advice","Must not “zorunda değil” değil “yapmamalı/yasaktır” anlamındadır.","“Workers must wear a helmet. They must not enter the lifting area.” Çalışanlar baret takmalı ve kaldırma alanına girmemelidir.","Must not ne bildirir?","Yasak bildirir.","PPE açılımı nedir?","Personal Protective Equipment: kişisel koruyucu donanım.","Must not ifadesini “zorunda değil” diye çevirmek.",[["PPE","kişisel koruyucu donanım"],["hazard","tehlike kaynağı"],["warning","uyarı"],["emergency","acil durum"]]],["Measure, install, reinforce, inspect, apply, cure ve maintain teknik fiillerdir. Present simple passive am/is/are + past participle ile kurulur. Emir cümlesi fiilin yalın hâliyle başlar.","Edilgen yapı ve emir","am / is / are + past participle; imperative = base verb","Edilgen yapı işlemi/nesneyi öne çıkarır; emir cümlesi doğrudan talimat verir.","Active: “The engineer checks the dimensions.” Passive: “The dimensions are checked by the engineer.” Ölçüler mühendis tarafından kontrol edilir.","The samples are tested hangi yapıdır?","Present simple passive.","Install the reinforcement ne demektir?","Donatıyı yerleştir/tak; emir cümlesidir.","Edilgen yapıda yardımcı fiili veya past participle biçimini atlamak.",[["measure","ölçmek"],["install","yerleştirmek"],["inspect","kontrol etmek"],["cure","kür uygulamak"]]],["Teknik metin amaç, girdi, işlem ve sonuç içerir. Skimming ana fikri; scanning belirli sayı, birim veya terimi bulmayı sağlar. At least, approximately, higher/lower ve not gibi ifadeler anlamı değiştirir.","Teknik okuma stratejisi","main idea → key data → procedure → result","Önce sorunun istediği bilgiyi belirle; sonra sayı, birim ve bağlamı birlikte doğrula.","“The soil layer was compacted in 200 mm lifts. Field density was measured and compared with the specified value.” Zemin 200 mm kademelerle sıkıştırılmış, saha yoğunluğu ölçülüp belirtilen değerle karşılaştırılmıştır.","Scanning ne için kullanılır?","Metindeki belirli sayı, terim veya bilgiyi hızlı bulmak için.","At least 95% ne demektir?","En az %95 demektir.","At least, approximately ve not less than ifadelerini aynı anlamda kullanmak.",[["specified","belirtilen"],["approximately","yaklaşık"],["at least","en az"],["result","sonuç"]]]],"istatistik":[["Nitel değişken kategori; nicel değişken sayısal ölçümdür. Kesikli değişken sayılabilir değerler, sürekli değişken aralıktaki değerleri alır. Anakütle hedef grup, örneklem incelenen alt gruptur.","Veri türü ve anakütle","N = anakütle büyüklüğü; n = örneklem büyüklüğü","Tanımlayıcı istatistik veriyi özetler; çıkarımsal istatistik örneklemden anakütleye ilişkin sonuç üretir.","Bir partiden seçilen 40 beton numunesinin basınç dayanımı nicel/sürekli değişkendir. Numune türü kategoriktir; 40 numune örneklemdir.","Beton basınç dayanımı hangi değişkendir?","Nicel ve sürekli değişkendir.","Partiden seçilen 20 numune hangi kavramdır?","Örneklemdir.","Örneklem ortalamasını anakütle ortalamasıyla özdeş saymak."],["Frekans sınıftaki gözlem sayısı; göreli frekans toplam içindeki paydır. Kümülatif frekans biriken sayıyı verir. Histogram nicel veriyi sınıf aralıklarıyla gösterir.","Frekans ve göreli frekans","hᵢ = fᵢ/n; Σhᵢ = 1","Göreli frekans toplamı 1 (yüzdeyle 100) olmalıdır. Eşit olmayan sınıf genişliklerinde yoğunluğu dikkate al.","20 ölçümün sınıflara dağılımı 5, 9, 6 ise göreli frekanslar 0,25; 0,45; 0,30 olur.","5/20 göreli frekansı kaçtır?","0,25 yani %25.","Histogram ile sütun grafiği farkı nedir?","Histogram nicel sınıf aralıklarını; sütun grafiği kategorileri gösterir.","Sınıf sınırlarını veya göreli frekans toplamını kontrol etmemek."],["Ortalama tüm gözlemleri kullanır ve uç değerlere duyarlıdır. Medyan sıralı verinin ortası, mod en sık değerdir. Çarpık dağılımda medyan daha dayanıklı olabilir.","Merkezi eğilim ölçüleri","x̄ = Σxᵢ/n; medyan = sıralı orta değer; mod = en sık değer","Çift sayıda veri varsa ortadaki iki değerin ortalaması medyandır.","2, 4, 4, 6, 9 verisinde ortalama 5, medyan 4 ve mod 4'tür; 9 değeri ortalamayı yükseltir.","2,4,4,6,9 verisinin medyanı nedir?","4.","Uç değer bulunan çarpık dağılımda hangi ölçü daha dayanıklıdır?","Medyan.","Veriyi sıralamadan medyan bulmak veya modu ortalamayla karıştırmak."],["Varyans ortalamadan kareli sapmaları, standart sapma bunların karekökünü özetler. Anakütle varyansında N, örneklem varyansında n−1 kullanılır.","Örneklem varyansı","s² = Σ(xᵢ−x̄)²/(n−1); s = √s²","Standart sapma ölçülen değişkenle aynı birimdedir; varyans birimin karesindedir.","2,4,6 için ortalama 4; kareli sapmalar toplamı 8; örneklem varyansı 8/2=4 ve standart sapma 2 olur.","2,4,6 örnekleminin standart sapması nedir?","2.","Standart sapmanın birimi nedir?","Ölçülen değişkenle aynı birimdir.","Anakütle ve örneklem varyansı paydasını karıştırmak."],["Örnek uzay tüm olası sonuçları; olay sonuçların alt kümesini tanımlar. Eş olasılıklı sonlu sonuçlarda olasılık uygun sonuç sayısı/toplam sonuç sayısıdır. Tümleyen olay gerçekleşmeme durumudur.","Temel olasılık","P(A)=uygun sonuç/tüm sonuç; P(Aᶜ)=1−P(A)","Bağımsızlık, ayrıklık ve eş olasılıklılık farklı kavramlardır; örneklem oranı anakütleye otomatik genellenmez.","10 numuneden 4'ü kusurluysa gözlenen örneklem kusur oranı 0,40'tır. Anakütle tahmini için temsil gücü olan örneklem gerekir.","P(A)=0,3 ise P(Aᶜ) nedir?","0,7.","Zarda çift sayı gelme olasılığı nedir?","3/6=1/2.","Örneklem oranını koşulsuz biçimde gerçek anakütle olasılığı saymak."],["Koşullu olasılık B bilindiğinde A'nın olasılığıdır. Bağımsız olaylarda P(A|B)=P(A). Bayes gözlenen kanıtla başlangıç olasılığını günceller.","Koşullu olasılık ve Bayes","P(A|B)=P(A∩B)/P(B); P(A|B)=P(B|A)P(A)/P(B)","P(B)>0 olmalı; Bayes paydasında tüm olası kaynakların olasılığı bulunur.","100 numunenin 20'si kusurlu; kusurluların 15'i düşük yoğunlukluysa kusurlu olduğu bilinen numunede olasılık 15/20=0,75'tir.","P(A∩B)=0,12 ve P(B)=0,30 ise P(A|B) kaçtır?","0,40.","Bağımsız olaylarda kesişim olasılığı nasıl yazılır?","P(A∩B)=P(A)P(B).","Bayes hesabında başlangıç sıklığını göz ardı etmek."],["Kesikli rassal değişken sayılabilir değerler alır; olasılıklarının toplamı 1 olmalıdır. Beklenen değer uzun dönem ortalaması, varyans değişkenlik ölçüsüdür.","Beklenen değer ve varyans","E[X]=ΣxP(X=x); Var(X)=E[X²]−(E[X])²","Bernoulli değişkeninde E[X]=p ve Var(X)=p(1−p). Beklenen değer tek deneyin zorunlu sonucu değildir.","Kusur göstergesi X=1 kusurlu, X=0 kusursuz olsun. p=0,10 ise E[X]=0,10 ve Var(X)=0,09 olur.","Bernoulli p=0,2 ise E[X] kaçtır?","0,2.","Olasılık dağılımındaki olasılıkların toplamı kaç olmalıdır?","1.","Beklenen değeri tek deneyde kesin gerçekleşecek değer sanmak."],["Sürekli değişkende tek noktanın olasılığı sıfır; aralık olasılığı eğri altındaki alandır. Normal dağılım ortalama ve standart sapmayla tanımlanır.","Normal dağılım ve z skoru","z=(x−μ)/σ","Z skoru ortalamadan kaç standart sapma uzaklığı gösterir; olasılığı doğrudan vermez.","μ=100 MPa, σ=15 MPa ve x=130 MPa için z=30/15=2; değer ortalamanın iki standart sapma üzerindedir.","μ=50, σ=5, x=60 ise z kaçtır?","2.","Sürekli dağılımda P(X=μ) neden sıfırdır?","Tek noktanın eğri altındaki alanı sıfırdır.","Z skorunu olasılık yüzdesi sanmak."],["Standart hata örneklem istatistiğinin örneklemler arasında değişimini ölçer. σ biliniyorsa ortalama standart hatası σ/√n'dir. σ bilinmiyorsa çoğu durumda t dağılımı kullanılır.","Standart hata ve güven aralığı","SE(x̄)=σ/√n; x̄ ± z_(α/2)σ/√n","Normal kritik değerli aralık σ biliniyor ve koşullar sağlanıyorsa uygundur; σ bilinmiyorsa çoğunlukla s ve t kullanılır.","n=16, x̄=50 MPa, σ=8 MPa için SE=2 MPa. %95 z≈1,96; aralık 50±3,92=[46,08;53,92] MPa olur.","σ=10 ve n=25 ise standart hata kaçtır?","2.","n artarsa standart hata nasıl değişir?","Azalır.","Güven aralığını tekil gözlem aralığı veya toleransla karıştırmak."],["H₀ başlangıç, H₁ alternatif hipotezdir. p-değeri H₀ doğru varsayılırken gözlenen kadar veya daha uç verinin olasılığıdır. p≤α ise H₀ reddedilir; reddedilememesi kanıtlandığı anlamına gelmez.","Hipotez testi karar kuralı","p-değeri ≤ α ⇒ H₀ reddedilir","α Tip I hata riskini sınırlar. İstatistiksel anlamlılık ve pratik mühendislik etkisi ayrı değerlendirilir.","H₀: ortalama dayanım 30 MPa; H₁: farklı. α=0,05 ve p=0,03 ise H₀ reddedilir; etki büyüklüğü ayrıca yorumlanır.","α=0,05 ve p=0,08 ise karar nedir?","H₀ reddedilemez; bu kanıtlandığı anlamına gelmez.","Tip I hata nedir?","Doğru H₀ hipotezini reddetmektir.","p-değerini H₀'ın doğru olma olasılığı sanmak."]],"diferansiyel":[["Mertebe en yüksek türevin mertebesidir. Lineer denklemde bilinmeyen fonksiyon ve türevleri birinci kuvvettedir. Tek bağımsız değişkenli denklem ODE, birden fazla bağımsız değişkenli denklem PDE'dir.","Denklemi sınıflandırma","aₙ(x)y⁽ⁿ⁾+…+a₁(x)y′+a₀(x)y=g(x)","Mertebe ile derece aynı değildir; lineer denklem katsayıları değişken olabilir.","y″+3y′−2y=sin x ikinci mertebe, lineer adi diferansiyel denklemdir.","y′+xy=0 kaçıncı mertebedir?","Birinci mertebedir ve lineerdir.","∂u/∂t=c²∂²u/∂x² hangi türdür?","Kısmi diferansiyel denklem.","Mertebeyi en yüksek üs veya lineerliği sabit katsayı koşuluyla karıştırmak."],["y′=g(x)h(y) biçiminde değişkenler ayrılır; dy/h(y)=g(x)dx yazılıp iki taraf integre edilir. Bölme nedeniyle kaybolabilecek sabit çözümler ayrıca kontrol edilir.","Değişkenleri ayırma","dy/h(y)=g(x)dx","İntegrasyon sabiti korunmalı; h(y)=0 denkleminin çözümleri ayrıca incelenmelidir.","y′=2xy için dy/y=2x dx; ln|y|=x²+C ve y=Ce^(x²) elde edilir.","y′=3x² genel çözümü nedir?","y=x³+C.","Ayrılabilir denklemde hangi terimler ayrılır?","y terimleri dy, x terimleri dx tarafına alınır.","Sıfır çözümünü veya integrasyon sabitini unutmak."],["Birinci mertebe lineer denklem y′+P(x)y=Q(x) biçimine getirilir. μ=e^(∫Pdx) çarpanı kullanıldığında sol taraf (μy)' olur.","İntegrasyon çarpanı","μ=e^(∫Pdx); (μy)′=μQ","Önce y′ katsayısı 1 yapılır; başlangıç koşulu genel çözümden sonra uygulanır.","y′+y=2 için μ=e^x; (e^xy)'=2e^x. İntegral alıp y yalnız bırakılınca y=2+Ce^(−x) bulunur.","y′+2y=0 için μ nedir?","e^(2x).","P ve Q nasıl belirlenir?","Denklem y′ katsayısı 1 olacak biçime getirilir; y katsayısı P, sağ taraf Q olur.","Standart biçime getirmeden çarpan hesaplamak."],["M(x,y)dx+N(x,y)dy=0 denklemi uygun bölgede M_y=N_x koşulunu sağlıyorsa tamdır. F_x=M, F_y=N olacak potansiyel fonksiyon bulunur; çözüm F=C'dir.","Tam diferansiyel denklem","M_y=N_x; F(x,y)=C","İlk integralde y'ye bağlı fonksiyon eklenmelidir; türevlerin sürekliliği ve bölge koşulları önemlidir.","(2x+y)dx+(x+2y)dy=0 için M_y=N_x=1. F=x²+xy+g(y); F_y=x+g′=x+2y ⇒ g=y². Sonuç x²+xy+y²=C.","M=3x²+2y, N=2x+4y tam mıdır?","Evet; M_y=N_x=2.","Potansiyel F hangi türevleri sağlamalıdır?","F_x=M ve F_y=N.","İlk integrasyonda y'ye bağlı fonksiyonu atmak."],["Bernoulli denklemi y′+Py=Qyⁿ biçimindedir. n≠0,1 için v=y^(1−n) dönüşümüyle birinci mertebe lineer denklem elde edilir.","Bernoulli dönüşümü","v=y^(1−n)","Zincir kuralındaki (1−n) katsayısı korunmalı; geri dönüşüm ve özel çözümler kontrol edilmelidir.","y′+y=y² için n=2 ve v=1/y seçilir; v değişkeninde lineer denklem elde edilir.","y′+2y=3y³ denkleminde n kaçtır?","3.","Dönüşümden sonra hangi denklem sınıfı elde edilir?","Birinci mertebe lineer denklem.","Geri dönüşümü veya üssü unutmak."],["Başlangıç koşulu genel çözümdeki sabitleri belirler. n'inci mertebe denklem için genel durumda n bağımsız başlangıç koşulu gerekir.","Başlangıç değer problemi","y(x₀)=y₀","Varlık ve teklik ayrıca düzenlilik koşullarına bağlıdır; her denklem için otomatik değildir.","y′=3y için y=Ce^(3x). y(0)=2 ⇒ C=2 ve özel çözüm y=2e^(3x).","y′=2y, y(0)=5 için çözüm nedir?","y=5e^(2x).","İkinci mertebe denklem için genellikle kaç bağımsız koşul gerekir?","İki.","Başlangıç koşulunu genel çözümü bulmadan uygulamak."],["Homojen denklemde sağ taraf sıfırdır. Homojen olmayan lineer denklemde genel çözüm homojen genel çözüm ile bir özel çözümün toplamıdır.","Homojen ve özel çözüm","L[y]=g(x); y=y_h+y_p","Başlangıç koşulları toplam çözüme uygulanır; y_h ve y_p farklı işlev görür.","y″−3y′+2y=e^(3x) ikinci mertebe lineer ve homojen olmayan denklemdir; önce y_h, sonra y_p bulunur.","y″+4y=0 homojen midir?","Evet; sağ taraf sıfırdır.","Homojen olmayan çözüm nasıl kurulur?","y_h+y_p toplanır.","Homojen çözüm ile özel çözümü karıştırmak."],["Sabit katsayılı homojen denklemde y=e^(rx) denemesi karakteristik polinomu verir. Farklı, tekrarlı ve karmaşık kökler farklı çözüm biçimleri oluşturur. Karmaşık eşlenik kökler α±βi ise çözüm e^(αx)[C₁cos(βx)+C₂sin(βx)] biçimindedir; α zarfı, β salınımı belirler.","Karakteristik denklem","aₙrⁿ+…+a₁r+a₀=0","Tekrarlı kökte x çarpanlı terimler gerekir; köklerin çokluğu çözümdeki bağımsız terim sayısını etkiler.","y″−3y′+2y=0 için r²−3r+2=(r−1)(r−2); y=C₁e^x+C₂e^(2x). Tekrarlı kökte x çarpanlı bağımsız terim kullanılır; karmaşık kökte gerçek çözüm e^(αx)(C₁cosβx+C₂sinβx) biçimindedir.","y″−5y′+6y=0 kökleri nelerdir?","2 ve 3.","y″+4y=0 kökleri hangi türdedir?","±2i karmaşık eşlenik köklerdir.","Köklerin tekrarlı olup olmadığını kontrol etmemek."],["Lineer operatörde sağ tarafın toplamına karşılık özel çözümler toplanabilir. Deneme çözümü homojen çözümle çakışırsa x kuvvetiyle çarpılarak bağımsız hâle getirilir.","Süperpozisyon","L[y₁+y₂]=L[y₁]+L[y₂]","Süperpozisyon lineer operatörler için geçerlidir; özel çözüm yerine koyularak denetlenir.","y″−3y′+2y=e^(3x) için y_p=Ae^(3x). Yerine koyunca 2A=1, A=1/2 bulunur.","Sağ taraf g₁+g₂ ise ne yapılabilir?","Her parça için özel çözüm bulup toplamak mümkündür.","Deneme y_h ile çakışırsa ne yapılır?","Uygun x kuvvetiyle çarpılır.","Rezonansı veya yerine koyma kontrolünü atlamak."],["Belirsiz katsayılar yöntemi sabit katsayılı denklemlerde polinom, üstel ve trigonometrik sağ taraflar için uygundur. Deneme, türevlerle aynı fonksiyon ailesinde kalmalıdır.","Belirsiz katsayı denemesi","g=e^(ax) için y_p=Ae^(ax); çakışmada x^s çarpanı","Değişken katsayılı genel denklemlere doğrudan uygulanmaz; homojen çözümle çakışma denetlenmelidir.","y″−3y′+2y=e^x için e^x homojen çözümde bulunduğundan y_p=Axe^x denenir; yerine koyma A=−1 verir.","y″−y=5 için deneme biçimi nedir?","y_p=A sabit.","Sağ taraf sin(2x) ise deneme nedir?","Acos(2x)+Bsin(2x).","Rezonansı veya türevlerle kapanan fonksiyon ailesini gözden kaçırmak."],["Laplace dönüşümü zaman fonksiyonunu s domenine taşır. Türev dönüşümlerinde başlangıç değerleri doğrudan bulunur; cebirsel çözümden sonra ters Laplace yapılır.","Laplace türev dönüşümü","L{y′}=sY−y(0); L{y″}=s²Y−sy(0)−y′(0)","Başlangıç koşulları dönüşümden çıkarılmamalıdır; ters dönüşüm zaman alanına döndürür.","y′+2y=0, y(0)=3 için sY−3+2Y=0; Y=3/(s+2), y=3e^(−2t).","L{y′} ifadesi nedir?","sY(s)−y(0).","L{1} nedir?","1/s.","Başlangıç değerini dönüşümde unutmak."],["Yay-kütle-sönümleyici gibi sistemler Newton yasasıyla diferansiyel denklemle modellenir. Sistem sınırı, işaret yönü, idealizasyon ve başlangıç koşulları tanımlanmalıdır.","Yay-kütle-sönümleyici modeli","m x″+c x′+kx=F(t)","m kütle, c sönüm katsayısı, k yay rijitliği, x yer değiştirme, F dış kuvvettir; tüm terimler kuvvet boyutunda olmalıdır.","Dış kuvvetsiz ve sönümsüz m=2 kg, k=18 N/m sisteminde 2x″+18x=0; doğal açısal frekans √(k/m)=3 rad/s olur.","Sönümleyici kuvveti hangi büyüklükle orantılıdır?","Hız x′ ile.","Başlangıç koşulları neyi tanımlar?","Sistemin başlangıç konumunu ve hızını.","Model kabullerini gerçek sistemin her koşulunda geçerli saymak."]],"lineer":[["Matris toplamı için boyutlar aynı olmalıdır. Çarpımda ilk matrisin sütun sayısı ikinci matrisin satır sayısına eşit olmalıdır. AB genelde BA'ya eşit değildir.","Matris çarpım boyutu","A_(m×n)B_(n×p)=C_(m×p)","İç boyutlar eşleşir; sonuç dış boyutları alır.","A=[[1,2],[3,4]], B=[[2,0],[1,2]] için AB=[[4,4],[10,8]] olur.","2×3 ile 3×2 matris çarpılabilir mi?","Evet; sonuç 2×2 olur.","Matris çarpımında hangi boyutlar eşleşmelidir?","İlk matrisin sütun sayısı ve ikinci matrisin satır sayısı.","Matris çarpımını eleman eleman çarpma sanmak."],["Determinant kare matris için tanımlıdır. 2×2 determinant ad−bc'dir. Sıfır değilse matris terslenebilir; sıfırsa tekildir.","Determinant ve ters matris","det(A)=ad−bc; A⁻¹=(1/detA)[[d,−b],[−c,a]]","Ters yalnız det(A)≠0 ise vardır.","A=[[2,1],[3,2]] için determinant 4−3=1; tersi [[2,−1],[−3,2]] olur.","A=[[1,2],[2,4]] determinantı nedir?","0; matrisin tersi yoktur.","det(A)≠0 ne gösterir?","Matris terslenebilir.","Kare olmayan matrise determinant uygulamak."],["Lineer sistem Ax=b biçiminde ifade edilir. Çözüm varlığı rank(A)=rank([A|b]) koşuluna bağlıdır. Ortak rank bilinmeyen sayısına eşitse tek çözüm vardır.","Matris denklem ve rank","Ax=b; rank(A)=rank([A|b])","Ters matris yöntemi yalnız kare ve terslenebilir katsayı matrisinde doğrudan uygulanır.","2x+y=5, x−y=1 sisteminde x=y+1; 3y=3, y=1 ve x=2 bulunur.","2x+y=5 ve x−y=1 için çözüm nedir?","x=2, y=1.","Sistem ne zaman tutarsızdır?","rank(A)<rank([A|b]) ise çözüm yoktur.","Çözüm varlığını kontrol etmeden ters matris kullanmak."],["Gauss eliminasyonu genişletilmiş matris üzerinde satır değiştirme, ölçekleme ve satıra diğer satırın katını ekleme işlemleridir. Üst üçgensel sistem geriye yerine koymayla çözülür.","Temel satır işlemleri","Rᵢ↔Rⱼ; Rᵢ←kRᵢ; Rᵢ←Rᵢ+kRⱼ","Sağ taraf sütununa da aynı işlem uygulanır; sıfır pivotta satır değişimi yapılabilir.","x+y=3, 2x−y=0 için R₂←R₂−2R₁ sonrası [1 1|3; 0 −3|−6]; y=2, x=1.","Pivot sıfırsa ne yapılabilir?","Uygun satırla yer değiştirilir.","Satır işlemleri neyi korur?","Çözüm kümesini.","Sağ taraf sütununa aynı işlemi uygulamamak."],["Alt uzay sıfır vektörünü içerir, toplama ve skaler çarpma altında kapalıdır. Orijinden geçen doğru veya düzlem alt uzay olabilir.","Alt uzay testi","u,v∈W ⇒ u+v∈W; λu∈W; 0∈W","Üç koşul birlikte aranır; yalnız toplama kapanışı yeterli değildir.","W={(x,y):y=2x}. (1,2)+(3,6)=(4,8) yine W'dedir ve skaler katlar da W'de kalır.","y=2x+1 doğrusu alt uzay mıdır?","Hayır; orijinden geçmez ve sıfır vektörünü içermez.","Her alt uzay hangi vektörü içerir?","Sıfır vektörünü.","Yalnız toplama kapanışını denetlemek."],["Vektörler c₁v₁+…+cₖvₖ=0 denkleminin yalnız trivial çözümü varsa bağımsızdır. Baz, uzayı geren bağımsız kümedir.","Lineer bağımsızlık","Σcᵢvᵢ=0 ⇒ tüm cᵢ=0","Bir vektör diğerinin katıysa küme bağımlıdır; baz hem bağımsız hem geren kümedir.","(1,2) ve (2,4) bağımlıdır; (1,0) ve (0,1) R²'nin standart bazıdır.","(1,0) ve (0,1) R² için baz mıdır?","Evet; bağımsızdır ve R²'yi gerer.","İki vektör birbirinin katıysa bağımsız mıdır?","Hayır, bağımlıdır.","Bağımsızlık ile dikliği aynı kavram sanmak."],["Av=λv ve v≠0 ise λ özdeğer, v özvektördür. Önce det(A−λI)=0, sonra (A−λI)v=0 çözülür.","Özdeğer ve özvektör","det(A−λI)=0; Av=λv","Özvektör sıfır olamaz; sıfır olmayan katları aynı özdeğere ait özvektörlerdir.","A=[[2,1],[1,2]] için determinant denklemi (2−λ)²−1=0; λ=3 ve λ=1 bulunur.","A=[[2,0],[0,3]] özdeğerleri nedir?","2 ve 3.","Özvektör neden sıfır olamaz?","Sıfır vektörü her λ için eşitliği sağlar ve tanımı anlamsızlaştırır.","Karakteristik determinantı yanlış kurmak."],["Lineer dönüşüm toplamayı ve skaler çarpmayı korur. Standart baz görüntüleri dönüşüm matrisinin sütunlarını oluşturur. Matrisler döndürme, ölçekleme ve yansıtma gibi işlemleri temsil eder.","Dönüşüm matrisi","T(x)=Ax; 90° dönüşüm A=[[0,−1],[1,0]]","Matrisin sütunları baz vektörlerinin görüntüleridir; koordinat bazı değişirse matris gösterimi de değişebilir.","A=[[0,−1],[1,0]], v=(2,1) için Av=(−1,2); vektör 90° döner ve uzunluğu korunur.","Lineer dönüşümün iki temel özelliği nedir?","Toplama ve skaler çarpmayı korumak.","(3,0) vektörünün 90° karşı saat yönü görüntüsü nedir?","(0,3).","Matrisin sütunlarını satır gibi kullanmak."]],"muhmat":[["z=a+bi biçiminde a gerçek, b sanal kısımdır ve i²=−1. Modül orijine uzaklık, argüman pozitif gerçek eksenden açıdır. Kutupsal gösterim çarpma/bölmeyi kolaylaştırır.","Modül ve kutupsal biçim","|z|=√(a²+b²); z=r(cosθ+i sinθ)","Argüman bölgeye göre belirlenmelidir; yalnız arctan(b/a) kullanımı işaret hatası doğurabilir.","z=3+4i için modül 5 ve argüman yaklaşık 53,13° olur.","z=−3+4i modülü kaçtır?","5.","Gerçek kısım hangi eksendedir?","Yatay gerçek eksen.","Argümanı bölge kontrolü yapmadan hesaplamak."],["Kompleks fonksiyon f(z)=u(x,y)+iv(x,y) biçiminde ayrılır. Cauchy–Riemann koşulları ve uygun türev sürekliliği analitiklik için kullanılır.","Cauchy–Riemann denklemleri","u_x=v_y; u_y=−v_x","Tek bir noktada eşitlik kontrolü bütün bölgede analitikliği tek başına kanıtlamaz.","z=x+iy için z²=x²−y²+2ixy. u=x²−y², v=2xy; iki Cauchy–Riemann koşulu sağlanır.","z² için u(x,y) nedir?","x²−y².","Cauchy–Riemann koşulları nelerdir?","u_x=v_y ve u_y=−v_x.","Kompleks türevi tek değişkenli gerçek türev gibi düşünmek."],["f(x,y) iki değişkene bir değer eşler; grafiği z=f(x,y) yüzeyidir. f(x,y)=c seviye eğrisidir. Tanım bölgesi payda, kök ve logaritma koşullarıyla belirlenir.","Çok değişkenli fonksiyon","z=f(x,y); seviye eğrisi f(x,y)=c","Seviye eğrisi aynı fonksiyon değerine sahip noktaları birleştirir; tanım bölgesi ayrıca kontrol edilir.","f=x²+3xy+y² için (1,2)'de f=11; nokta f(x,y)=11 seviye eğrisindedir.","f=x²+y² için f(3,4) kaçtır?","25.","√(9−x²−y²) nerede gerçektir?","x²+y²≤9 diskinde.","Tanım bölgesini kontrol etmemek."],["Kısmi türev alınırken diğer bağımsız değişken sabit tutulur. Toplam diferansiyel küçük değişimlerde birinci mertebe yaklaşım verir.","Toplam diferansiyel","df≈f_x dx+f_y dy","Diferansiyel tam sonlu fark değildir; büyük değişimlerde doğrusal yaklaşım hatası artabilir.","f=x²y+3y için f_x=2xy, f_y=x²+3. (1,2)'de her ikisi 4; dx=0,1 ve dy=−0,05 için df≈0,20.","f=x²+xy için f_x ve f_y nedir?","f_x=2x+y; f_y=x.","Kısmi türev alırken diğer değişken ne yapılır?","Sabit tutulur.","df'yi büyük sonlu farkta tam değişim saymak."],["Çift integral bölgedeki fonksiyon değerlerini toplar; integrand 1 ise alanı verir. İntegral sınırları bölgenin geometrisine göre seçilir.","Çift integral","∬_D f(x,y)dA","İntegral sırası değiştiğinde iç sınırlar yeniden yazılmalıdır; üçgen ve dikdörtgen bölgeler farklıdır.","D=[0,2]×[0,3] için ∬_D1dA=2×3=6 birim² olur.","[0,2]×[0,3] dikdörtgeninin alanı kaçtır?","6 birim².","dA neyi temsil eder?","Sonsuz küçük alan elemanını.","Üçgensel bölgeye dikdörtgen sınırları kullanmak."],["Gradyan kısmi türevlerden oluşan vektördür ve en hızlı artış yönünü gösterir. Birim u yönündeki türev ∇f·u'dur.","Gradyan ve yönlü türev","∇f=(f_x,f_y); D_uf=∇f·u, |u|=1","Yön vektörü birim olmalıdır; gradyanın normu maksimum yönlü türevi verir.","f=x²+y² için (3,4)'te gradyan (6,8), normu 10'dur.","f=x²+y² için (1,2)'de gradyan nedir?","(2,4).","Gradyan hangi yönü gösterir?","En hızlı artış yönünü.","Yönlü türevde birim olmayan vektör kullanmak."],["Diverjans yerel net dışa akı eğilimini, rotasyonel yerel dönme eğilimini ölçer. Diverjans skaler, rotasyonel vektördür.","Diverjans ve rotasyonel","∇·F=P_x+Q_y+R_z; ∇×F","Alan türevlenebilir olmalı; işlemlerde kısmi türev sırası ve işaret korunmalıdır.","F=(x²,y²,z²) için diverjans 2x+2y+2z, rotasyonel sıfırdır. (1,1,1)'de diverjans 6'dır.","F=(x,y,z) alanının diverjansı kaçtır?","3.","Diverjans ve rotasyonelin çıktı türleri nedir?","Diverjans skaler, rotasyonel vektör.","Diverjansı çapraz türevlerle hesaplamak."],["Fourier serisi periyodik fonksiyonu sinüs ve kosinüs harmoniklerinin toplamıyla temsil eder. Çift/tek simetri bazı katsayıları sıfırlayabilir.","Fourier serisi","f(x)~a₀/2+Σ(aₙcos nω₀x+bₙsin nω₀x)","Periyot T ise temel açısal frekans ω₀=2π/T; sıçrama noktasında seri limitlerin ortalamasına yakınsar.","Periyodu 2π olan sin x fonksiyonunda yalnız b₁=1 katsayısı sıfırdan farklıdır.","Periyot T ise temel açısal frekans nedir?","ω₀=2π/T.","Çift fonksiyon için simetrik aralıkta sinüs katsayıları ne olur?","Sıfır olur.","Periyot ve temel frekansı karıştırmak."],["Matematiksel model gerçek sistemi sadeleştirilmiş değişken ve bağıntılarla temsil eder. Sistem sınırı, girdiler, çıktılar, parametreler ve kabuller belirtilir; sonuç boyut ve fiziksel makullükle denetlenir.","Model ve boyut kontrolü","çıktı=f(girdiler, parametreler, koşullar)","Model kabulleri geçerlilik alanını sınırlar; denklemde toplanan terimlerin fiziksel boyutları aynı olmalıdır.","b=0,30 m ve h=0,50 m dikdörtgen kesit için A=bh=0,15 m²; boşluk varsa net geometri kullanılır.","Varsayımlar neden açık yazılır?","Sonucun hangi koşullarda geçerli olduğunu göstermek için.","Boyut analizi neyi kontrol eder?","Denklem terimlerinin birim ve fiziksel boyut tutarlılığını.","Modeli her koşulda geçerli saymak."]]};
// Güz dönemi konu modüllerindeki bütün bağıntı ve öğrenme kalıplarını formül kartlarına da taşı.
const fallTopicFormulaCards = [];
for (const [course, rows] of Object.entries(fallTopicRows)) {
 rows.forEach((row, index) => {

 işin zamana göre değişim hızıdır. Kuvvet-hız veya moment-açısal hız birimleri watt verir."},{"course":"din","title":"Rijit cismin dönme kinetik enerjisi","expr":"T_rot = ½ I ω²","note":"I dönme eksenine göre kütle atalet momenti, ω açısal hızdır. Dönme ekseni açıkça belirtilmelidir."},{"course":"akiskan","title":"Yoğunluk ve özgül ağırlık","expr":"ρ = m/V  ;  γ = ρg","note":"ρ kütle yoğunluğu (kg/m³), γ özgül ağırlık (N/m³), g yerçekimi ivmesidir."},{"course":"akiskan","title":"Hidrostatik gösterge basıncı","expr":"p = ρ g h = γ h","note":"Durgun akışkanda serbest yüzeyden h derinlikteki gösterge basıncıdır. Mutlak basınç için yüzey/atmosfer basıncı eklenir."},{"course":"akiskan","title":"Düzlemsel yüzeye hidrostatik bileşke kuvvet","expr":"F_R = γ h_c A","note":"Düzlemsel yüzey için h_c alan ağırlık merkezinin serbest yüzeye düşey derinliğidir. Bileşke kuvvetin uygulama noktası basınç merkezidir."},{"course":"akiskan","title":"Kaldırma kuvveti","expr":"F_B = ρ g V_batırılan","note":"Kaldırma kuvveti yer değiştiren akışkanın ağırlığına eşittir. Yüzen cisimde denge için ağırlıkla kaldırma kuvveti eşitlenir."},{"course":"akiskan","title":"Debi ve süreklilik denklemi","expr":"Q = A V  ;  A₁V₁ = A₂V₂","note":"Kararlı, sıkıştırılamaz ve tek boyutlu ortalama hız yaklaşımında debi korunur. A kesit alanı, V ortalama hızdır."},{"course":"akiskan","title":"Bernoulli enerji denklemi","expr":"p/γ + V²/(2g) + z = sabit","note":"İdeal, kararlı, sıkıştırılamaz akımda aynı akım çizgisi boyunca kullanılır. Gerçek sistemde pompa, türbin ve enerji kayıpları eklenmelidir."},{"course":"akiskan","title":"Reynolds sayısı","expr":"Re = ρ V D/μ = V D/ν","note":"Atalet kuvvetlerinin viskoz kuvvetlere oranını temsil eder. Boru akımında rejim yorumu için geometri ve akış koşulu dikkate alınır."},{"course":"akiskan","title":"Darcy–Weisbach sürtünme kaybı","expr":"h_f = f_D (L/D) (V²/(2g))","note":"f_D Darcy sürtünme katsayısıdır; Fanning katsayısı değildir. Katsayı Reynolds sayısı ve bağıl pürüzlülükle ilişkilidir."},{"course":"akiskan","title":"Akışta doğrusal momentum denklemi","expr":"ΣF = ρ Q (V₂ − V₁)","note":"Kararlı, tek girişli-tek çıkışlı ve tek boyutlu hız yaklaşımı için vektörel momentum dengesi sadeleştirilmiş biçimde yazılmıştır."},{"course":"akiskan","title":"Pompa için hidrolik güç","expr":"P_gerekli = ρ g Q H/η","note":"Q debi, H toplam basma yüksekliği, η toplam verimdir. Bu ifade pompa giriş gücünü tahmin eder; birimler SI olmalıdır."},{"course":"malzeme","title":"Kütle yoğunluğu","expr":"ρ = m/V","note":"Malzemenin kütlesinin hacmine oranıdır. Numune hacmi, boşluk ve nem koşulları deney tanımına göre belirlenir."},{"course":"malzeme","title":"Ortalama normal gerilme","expr":"σ = F/A","note":"Kesite dik kuvvetin kesit alanına oranıdır. Gerilme hesabında kullanılan alanın başlangıç veya anlık alan olduğu belirtilmelidir."},{"course":"malzeme","title":"Mühendislik birim şekil değiştirmesi","expr":"ε = ΔL/L₀","note":"Uzama veya kısalmanın ilk boya oranıdır; boyutsuzdur. Çekme deneyinde L₀ başlangıç ölçü boyudur."},{"course":"malzeme","title":"Hooke kanunu","expr":"σ = E ε","note":"Doğrusal elastik bölgede normal gerilme ile birim şekil değiştirme arasındaki ilişkiyi verir. E elastisite modülüdür."},{"course":"malzeme","title":"Poisson oranı","expr":"ν = − ε_enine/ε_boyuna","note":"Tek eksenli elastik yüklemede enine ve boyuna birim şekil değiştirmelerin negatif oranıdır. İzotropik lineer elastik kabullerle yorumlanır."},{"course":"malzeme","title":"Kayma modülü bağıntısı","expr":"τ = G γ","note":"Doğrusal elastik kaymada kayma gerilmesi τ, kayma birim şekil değiştirmesi γ ve kayma modülü G ile ilişkilidir."},{"course":"malzeme","title":"Serbest ısıl birim şekil değiştirme","expr":"ε_T = α ΔT","note":"α doğrusal ısıl genleşme katsayısıdır. Serbest çubukta ısıl uzama ΔL=αΔT L olur; kısıt varsa mekanik gerilme de oluşabilir."},{"course":"malzeme","title":"Çekme dayanımı (mühendislik)","expr":"R_m = P_max/A₀","note":"Maksimum çekme kuvveti başlangıç kesit alanına bölünür. Numune geometrisi ve deney standardı raporlanmalıdır."},{"course":"malzeme","title":"Beton / malzeme basınç dayanımı","expr":"f_c = P_max/A","note":"Maksimum basınç yükü yüklenen alana bölünür. Numune şekli, yaşı, kür ve yükleme koşulu sonucu etkiler."},{"course":"malzeme","title":"Su/çimento oranı","expr":"w/c = m_su/m_çimento","note":"Kütle esaslı orandır. Agrega nemi ve su emmesi için düzeltme yapılmadan toplam eklenen suyu etkin su kabul etme."},{"course":"malzeme","title":"Yüzde uzama","expr":"A% = ((L_f − L₀)/L₀) × 100","note":"Çekme deneyi sonrasında ölçü boyundaki kalıcı artışın başlangıç ölçü boyuna oranıdır. Ölçü boyu standartla tanımlanır."},{"course":"malzeme","title":"Su emme oranı","expr":"WA% = ((m_sat − m_kuru)/m_kuru) × 100","note":"Kuru ve doygun-kuru yüzey koşullarındaki kütle farkını kuru kütleye oranlar. Deney standardındaki şartlandırma prosedürü uygulanmalıdır."}];
