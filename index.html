ans eksenini ve işaret yönünü tanımla."],"engineering":"Araç hareketi, vinç, kaldırma sistemleri, raylı sistemler, makine elemanları ve titreşim başlangıç analizleri.","pitfalls":["Kinematik denklemine kuvvet eklemek.","Parçacık modeli kullanırken dönme etkisini ihmal ettiğini belirtmemek.","Referans eksenini problem boyunca değiştirmek."],"checkq":"Kinematik ile kinetik arasındaki temel fark nedir?","checka":"Kinematik hareketi tanımlar; kinetik hareketi kuvvet ve momentlerle ilişkilendirir."},"din_1":{"objective":"Doğrusal hareket için konum, hız ve ivme bağıntılarını kurmak ve sabit ivmeli hareket problemlerini çözmek.","prerequisites":"Türev-integral, konum, zaman ve birim dönüşümü.","explanation":"Doğrusal harekette cisim tek bir eksen boyunca hareket eder. Konum x(t), hız v=dx/dt, ivme a=dv/dt’dir. Sabit ivmede hız zamana göre doğrusal, konum zamana göre ikinci dereceden değişir. Hızın işareti hareket yönünü; ivmenin işareti seçilen eksene göre hız değişim yönünü gösterir. İvme ile hız aynı işaretliyse sürat artar, zıt işaretliyse sürat azalır.","eq_title":"Sabit ivmeli hareket","eq":"v=v₀+at;  x−x₀=v₀t+½at²;  v²=v₀²+2a(x−x₀)","eq_note":"x m, v m/s, a m/s², t s. Bu bağıntılar sabit ivme için kullanılır.","example_title":"Sabit ivmeli araç","example":"Başlangıç hızı 2 m/s, ivme 1,5 m/s² ve süre 4 s. Son hız v=2+1,5×4=8 m/s. Yer değiştirme Δx=2×4+0,5×1,5×4²=8+12=20 m.","steps":["Pozitif hareket yönünü belirle.","Verilenleri v₀, a, t, x₀ biçiminde listele.","İstenen bilinmeyeni içeren en kısa bağıntıyı seç.","İşaretleri koruyarak hesapla.","Son hız ve yer değiştirme değerlerini fiziksel olarak yorumla."],"engineering":"Tren hızlanma-frenleme, iş makinesi hareketleri, vinç kaldırma ve araç takip mesafesi analizleri.","pitfalls":["Hızın yönü ile süratin büyüklüğünü aynı kavram sanmak.","Sabit ivme olmayan durumda sabit ivme denklemlerini kullanmak.","km/h değerini m/s’ye çevirmemek."],"checkq":"Hız ile ivme zıt işaretliyse cisim hangi koşulda yavaşlar?","checka":"Hareket yönündeki hızın büyüklüğü azalır; yani sürat azalır."},"din_2":{"objective":"Eğrisel harekette hız ve ivmeyi teğetsel-normal bileşenlerine ayırarak eğri yörüngeyi çözümlemek.","prerequisites":"Vektör türevi, hız, ivme ve dairesel hareket.","explanation":"Eğrisel harekette hız vektörü yörüngeye teğettir. İvme, süratin değişmesinden kaynaklanan teğetsel bileşen a_t=dv/dt ve hız yönünün değişmesinden kaynaklanan normal bileşen a_n=v²/ρ içerir. Normal ivme eğrilik merkezine doğru yönelir. Dairesel harekette eğrilik yarıçapı sabitse ρ=r olur. Sürat sabit olsa bile yön değiştiği için normal ivme sıfır değildir.","eq_title":"Teğetsel ve normal ivme","eq":"a = a_t e_t + a_n e_n;  a_t=dv/dt;  a_n=v²/ρ","eq_note":"a_t ve a_n m/s²; v m/s, ρ m. Normal birim vektör eğrilik merkezini gösterir.","example_title":"Viraj alan araç","example":"Araç 10 m/s süratle 20 m yarıçaplı virajı sabit süratle alıyor. a_t=0; a_n=10²/20=5 m/s² ve viraj merkezine doğrudur.","steps":["Yörüngenin teğet yönünü çiz.","Hızın büyüklüğü değişiyor mu değerlendir; a_t hesapla.","Yörünge eğrilik yarıçapını bul; a_n=v²/ρ kullan.","Bileşenleri vektörel birleştir ve ivme yönünü çiz."],"engineering":"Karayolu viraj tasarımı, araç dinamiği, raylı sistemlerde kurp hareketi, merkezkaç etkisi ve makine parçaları.","pitfalls":["Sabit süratte ivme sıfırdır sanmak.","Normal ivmeyi yörünge dışına yöneltmek.","Eğrilik yarıçapı ile çapı karıştırmak."],"checkq":"Sabit süratle dairesel hareket yapan cismin ivmesi var mıdır?","checka":"Evet. Yön değiştiği için merkeze doğru v²/r normal ivmesi vardır."},"din_3":{"objective":"Bağıl konum, hız ve ivme bağıntılarını kullanarak iki cismin hareketini aynı referans sisteminde ifade etmek.","prerequisites":"Vektör çıkarma, koordinat ekseni ve hareket tanımı.","explanation":"Bağıl hareket, bir cismin konum veya hızını başka bir cisme göre tanımlamaktır. Aynı referans çerçevesinde r_A/B=r_A−r_B ve v_A/B=v_A−v_B yazılır. Bir doğrultudaki hareketlerde işaret seçimi önemlidir; ters yönler negatif alınır. Hareketli bir taşıyıcı, tren veya bant üzerindeki cismin hızı, taşıyıcının yere göre hızı ile cismin taşıyıcıya göre hızının vektörel toplamıdır.","eq_title":"Bağıl hareket","eq":"v_A/B = v_A − v_B;  v_A = v_B + v_A/B","eq_note":"Bütün hız vektörleri aynı referans sisteminde ve aynı eksenlerle ifade edilmelidir.","example_title":"İki trenin bağıl hızı","example":"A treni doğuya 20 m/s, B treni doğuya 12 m/s gidiyorsa A’nın B’ye göre hızı 20−12=8 m/s doğudur. B batıya 12 m/s gidiyor olsaydı A’ya göre yaklaşma hızı 20−(−12)=32 m/s olurdu.","steps":["Ortak referans ekseni ve pozitif yönü seç.","Her cismin yere göre hızını işaretiyle yaz.","Bağıl hız için v_A/B=v_A−v_B uygula.","Sonucun işareti ve büyüklüğünü hareket yönleriyle kontrol et."],"engineering":"Karşılıklı tren hareketi, konveyör bant, hareketli merdiven, gemi-akıntı ve rüzgâr-uçak problemleri.","pitfalls":["Hız büyüklüklerini her koşulda doğrudan toplamak.","Referans sistemini belirtmemek.","Zıt yönlü hareketlerde işaretleri yanlış almak."],"checkq":"Aynı yönde 20 m/s ve 12 m/s hızla giden iki cismin bağıl hız büyüklüğü kaçtır?","checka":"20−12=8 m/s."},"din_4":{"objective":"Newton’un ikinci kanununu serbest cisim diyagramı ile uygulayarak ivme, gerilme ve tepki kuvvetlerini bulmak.","prerequisites":"Kuvvet bileşenleri, ağırlık, normal tepki ve sürtünme.","explanation":"Kinetik çözümde önce cisim sistemden ayrılır ve yalnız cisme etkiyen dış kuvvetler gösterilir. Bu serbest cisim diyagramında ağırlık mg, temas yüzeyinin normali, sürtünme, ip gerilmesi ve uygulanan kuvvetler bulunur. Sonra ΣF_x=ma_x ve ΣF_y=ma_y yazılır. Normal tepki her zaman ağırlığa eşit değildir; düşey ivme veya eğik düzlem varsa değişir. Sürtünme yönü, olası/gerçek bağıl kayma eğilimine zıt seçilir.","eq_title":"Newton’un ikinci kanunu","eq":"ΣF = m a","eq_note":"N=kg·m/s². Her eksen için ayrı denge/kinetik denklemi yaz; kuvvetlerin yönlerini vektörel dikkate al.","example_title":"Yatay düzlemde araba","example":"Kütlesi 1200 kg olan aracın yatay doğrultudaki net kuvveti 2400 N ise a=ΣF/m=2400/1200=2 m/s² olur. Net kuvvet, çekiş kuvveti eksi direnç kuvvetlerinin toplamıdır.","steps":["Cismi izole et ve tüm dış kuvvetleri çiz.","Koordinat eksenlerini en uygun doğrultuda seç.","Kuvvetleri eksenlere ayır.","Her eksen için ΣF=ma yaz.","Bulduğun ivmenin yönünü ve kuvvet büyüklüklerini fiziksel olarak kontrol et."],"engineering":"Araç hızlanması, vinç yükleri, eğik düzlemde malzeme hareketi, frenleme ve makine mekanizmaları.","pitfalls":["Normal kuvveti her zaman mg almak.","Sürtünmeyi hareket yönünde çizmek.","Net kuvvet yerine tek bir uygulanan kuvveti m·a’ya eşitlemek.","Kütle yerine ağırlığı kullanmak."],"checkq":"Yatay düzlemde ivme sıfırsa yatay kuvvetlerin cebirsel toplamı nedir?","checka":"Sıfırdır; kuvvetler birbirini dengeler."},"din_5":{"objective":"İş–enerji ilkesini kullanarak kuvvet, yer değiştirme, hız ve potansiyel enerji arasındaki ilişkiyi çözmek.","prerequisites":"Kuvvet, yer değiştirme, hız, kütle ve enerji birimleri.","explanation":"Bir kuvvetin yaptığı iş, kuvvetin yer değiştirme doğrultusundaki bileşeninin yol boyunca integralidir. Net iş kinetik enerjideki değişime eşittir. Ağırlık ve yay kuvveti konservatif kuvvetlerdir; bunların potansiyel enerji tanımı yapılabilir. Sürtünme gibi konservatif olmayan kuvvetlerin işi mekanik enerjiyi azaltabilir. İş–enerji yöntemi ivmeyi zamanın fonksiyonu olarak bulmayı gerektirmeden başlangıç-son durum hızlarını ilişkilendirebilir.","eq_title":"İş–enerji","eq":"W_net = T₂−T₁;  T=½mv²;  U_g=mgh;  U_yay=½kx²","eq_note":"İş ve enerji joule (J), kütle kg, hız m/s, yükseklik m, yay katsayısı N/m.","example_title":"Net işten son hız","example":"10 kg kütleli cisim durgun hâlden başlayıp üzerine 200 J net iş yapılıyor. T₂−0=200; ½×10×v²=200. v²=40 ve v≈6,32 m/s.","steps":["Başlangıç ve son durumları tanımla.","Kinetik ve potansiyel enerjileri yaz.","Uygulanan kuvvetlerin yaptığı işleri belirle; sürtünme varsa negatif işi ekle.","W_net=T₂−T₁ veya enerji denkleminden son hızı bul.","Enerji kayıp/kazanımlarının işaretini kontrol et."],"engineering":"Araç frenleme, vinç kaldırma, düşen cisim, yaylı tampon ve makine enerji aktarımı.","pitfalls":["İş ile kuvveti karıştırmak.","Kuvvet hareket yönüne dikse işin sıfır olduğunu unutmak.","Sürtünme işini pozitif yazmak.","Potansiyel enerji referans seviyesini belirtmemek."],"checkq":"Net iş pozitifse cismin kinetik enerjisi nasıl değişir?","checka":"Artar."},"din_6":{"objective":"İmpuls–momentum ilkesini kullanarak çarpışma, darbe ve kısa süreli kuvvet problemlerini çözmek.","prerequisites":"Kütle, hız, kuvvet-zaman grafiği ve vektör.","explanation":"Doğrusal momentum p=mv’dir. Bir kuvvetin belirli zaman aralığında oluşturduğu impuls, kuvvetin zamana göre integralidir ve momentum değişimine eşittir. Ortalama kuvvet sabit kabul edilirse J=F_ort Δt olur. Çarpışmalarda sistem dış kuvvetlerinin impulsu ihmal edilebiliyorsa toplam momentum korunur. Momentum vektörel olduğu için çarpışma öncesi ve sonrası yönler işaretleriyle alınır.","eq_title":"İmpuls–momentum","eq":"∫F dt = m v₂ − m v₁","eq_note":"İmpuls N·s, momentum kg·m/s birimindedir ve bu iki birim eşdeğerdir.","example_title":"Kısa süreli hız değişimi","example":"2 kg cisim 3 m/s hızdan aynı doğrultuda 5 m/s hıza çıkıyor. İmpuls J=m(v₂−v₁)=2×(5−3)=4 N·s. Kuvvet 0,2 s boyunca ortalama sabitse F_ort=4/0,2=20 N.","steps":["Hareket doğrultusunu pozitif seç.","Başlangıç ve son hız vektörlerini işaretli yaz.","Kuvvet-zaman alanından impulsu bul.","J=m(v₂−v₁) ile bilinmeyeni çöz.","Çarpışma sisteminde dış impulsun ihmal edilip edilemeyeceğini değerlendir."],"engineering":"Araç çarpışmaları, tampon tasarımı, çekiç-darbe, raylı sistem kuplörleri ve düşen yüklerin durdurulması.","pitfalls":["Kuvvet-zaman grafiğinde alan yerine tepe kuvvetini kullanmak.","Momentumun vektörel olduğunu unutmak.","Çarpışmada momentum korunumu ile kinetik enerji korunumu koşullarını aynı sanmak."],"checkq":"İmpuls hangi büyüklüğün değişimine eşittir?","checka":"Doğrusal momentum değişimine eşittir."},"din_7":{"objective":"Parçacık sistemlerinde kütle merkezi ve toplam momentum kavramlarını kullanmak; dış kuvvet yokluğunda momentum korunmasını uygulamak.","prerequisites":"Parçacık momentumu, kütle ve konum.","explanation":"Parçacık sistemi birden fazla cismin birlikte incelendiği modeldir. Sistemin kütle merkezi, kütlelerin konumlarla ağırlıklandırılmış ortalamasıdır. Toplam doğrusal momentum, parçacık momentumlarının vektörel toplamıdır ve kütle merkezi hızına bağlıdır. Sistem üzerindeki net dış kuvvet toplam momentumun değişim hızını belirler. İç kuvvetler Newton’un üçüncü kanunuyla çiftler hâlinde birbirini götürdüğünden, dış impuls yoksa toplam momentum korunur.","eq_title":"Kütle merkezi ve momentum","eq":"r_G = (Σmᵢrᵢ)/(Σmᵢ);  P = Σmᵢvᵢ","eq_note":"Kütle merkezi konum ve hız vektörlerinin ağırlıklı ortalamasıdır.","example_title":"İki cismin kütle merkezi","example":"2 kg ve 3 kg kütleli iki cisim x=0 m ve x=4 m konumlarında olsun. x_G=(2×0+3×4)/(2+3)=12/5=2,4 m. Kütle merkezi daha ağır cisme daha yakındır.","steps":["Sistem sınırını ve sistemdeki parçacıkları belirle.","Her parçanın kütle ve konum/hız vektörünü yaz.","Kütle merkezini ağırlıklı ortalamayla bul.","Net dış kuvvet/impuls olup olmadığını incele.","Uygunsa toplam momentum korunumu denklemini uygula."],"engineering":"Araç çarpışmaları, iki parçalı sistemler, patlama/ayrılma, makine hareketli parçaları ve yük taşıma düzenekleri.","pitfalls":["Kütle merkezini geometrik orta nokta sanmak.","İç kuvvetleri toplam dış kuvvet olarak almak.","Momentum korunumu için dış impuls koşulunu kontrol etmemek."],"checkq":"Net dış impuls sıfırsa toplam momentum nasıl değişir?","checka":"Korunur; başlangıçtaki toplam momentum son toplam momentuma eşittir."},"din_8":{"objective":"Rijit cisim öteleme, dönme ve düzlemsel genel hareketini; açısal konum, hız ve ivme ile tanımlamak.","prerequisites":"Vektörler, açısal ölçü, doğrusal hız ve dairesel hareket.","explanation":"Rijit cisimde herhangi iki nokta arasındaki uzaklık sabit kabul edilir. Ötelemede bütün noktalar aynı anda aynı hız ve ivmeye sahiptir. Sabit eksen etrafında dönmede her noktanın açısal hızı aynıdır; doğrusal hız eksene uzaklıkla artar. Düzlemsel genel harekette hareket, bir referans noktasının ötelemesi ile o nokta etrafındaki dönmenin toplamı olarak ele alınabilir. Kaymadan yuvarlanmada temas noktasının yere göre anlık hızı sıfırdır.","eq_title":"Açısal ve doğrusal kinematik","eq":"v = ωr;  a_t=αr;  a_n=ω²r","eq_note":"ω rad/s, α rad/s², r m; doğrusal hız m/s ve ivme m/s².","example_title":"Tekerlek çevresindeki hız","example":"Yarıçapı 0,30 m olan tekerlek 10 rad/s açısal hızla dönüyor. Dış çeperin teğetsel hızı v=ωr=10×0,30=3 m/s olur.","steps":["Hareketin öteleme, sabit eksenli dönme veya genel hareket olduğunu belirle.","Açısal konum, hız ve ivmeyi tanımla.","İlgili noktanın eksene uzaklığını belirle.","v=ωr ve a bileşenlerini uygula.","Kaymadan yuvarlanma varsa v_G=ωR koşulunu işaretleriyle kullan."],"engineering":"Tekerlek-ray teması, vinç tamburları, makara sistemleri, döner makineler ve yapı ekipmanları.","pitfalls":["Açısal hız birimini derece/s olarak bırakmak.","Merkez hızı ile çeper hızını aynı sanmak.","Kaymadan yuvarlanma koşulunu her temas durumunda geçerli saymak."],"checkq":"Sabit eksen etrafında dönen rijit cisimde bütün noktaların açısal hızı nasıldır?","checka":"Aynıdır; doğrusal teğetsel hız ise eksene uzaklığa bağlıdır."},"din_9":{"objective":"Rijit cismin dönme dinamiğinde atalet momenti, tork, açısal ivme ve dönme enerjisini ilişkilendirmek.","prerequisites":"Açısal hız, tork, kütle dağılımı ve enerji.","explanation":"Dönme hareketinde kütlenin dönme eksenine göre dağılımını kütlesel atalet momenti I temsil eder. Aynı tork altında I büyükse açısal ivme daha küçük olur. Sabit eksen etrafında dönme için ΣM=Iα yazılır. Dönme kinetik enerjisi ½Iω²’dir. Bir kuvvetin torku, kuvvetin dönme eksenine dik moment koluyla çarpımına eşittir; kuvvet doğrultusu eksenden geçerse tork sıfır olabilir.","eq_title":"Dönme dinamiği","eq":"ΣM = Iα;  T_rot=½Iω²","eq_note":"M N·m, I kg·m², α rad/s², ω rad/s. Atalet momenti yalnız kütleye değil, kütlenin eksene uzaklığına da bağlıdır.","example_title":"Dönme enerjisi","example":"I=2 kg·m² ve ω=5 rad/s olan rijit cismin dönme kinetik enerjisi T=½×2×5²=25 J’dür.","steps":["Dönme eksenini açıkça tanımla.","Kuvvetlerin bu eksene göre momentlerini bul.","Kütle dağılımından veya verilen tablodan I değerini seç.","ΣM=Iα ile açısal ivmeyi çöz.","Enerji isteniyorsa ½Iω² bağıntısını uygula."],"engineering":"Motor, şaft, tambur, volan, döner ekipman, vinç ve dönen tekerleklerin hızlanma/frenleme hesabı.","pitfalls":["Kütlesel atalet momenti I ile alan atalet momenti I’yi karıştırmak.","Tork kolunu kuvvet doğrultusuna dik uzaklık yerine toplam mesafe almak.","Derece/s ile rad/s karıştırmak."],"checkq":"Aynı tork altında kütlesel atalet momenti artarsa açısal ivme nasıl değişir?","checka":"Azalır; α=ΣM/I."}};

 if(!d)return '';
 const escp=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
 return `<div class="lesson-badge">AYRINTILI DERS NOTU · ${Object.keys(deepLessonData).includes(c.id+'_'+i)?'KONUYA ÖZEL':'GENEL'}</div>
 <section class="learn-section"><div class="learning-kicker">Öğrenme hedefi</div><h3>Bu konunun sonunda ne yapabilmelisin?</h3><p>${d.objective}</p></section>

 <section class="learn-section"><div class="learning-kicker">Çözümlü mühendislik örneği</div><div class="example-card"><h4>${d.example_title}</h4><p>${d.example}</p></div></section>
 <section class="learn-section"><div class="learning-kicker">Problem çözme yöntemi</div><h3>Bu tip soruyu nasıl çözmelisin?</h3><ol class="steps-list">${d.steps.map(x=>`<li>${x}</li>`).join('')}</ol></section>
 <section class="learn-section"><div class="learning-kicker">Mesleki bağlantı</div><h3>İnşaat mühendisliğinde nerede kullanılır?</h3><p>${d.engineering}</p></section>
 <section class="learn-section"><div class="learning-kicker">Hata önleme</div><h3>Sınavda ve uygulamada dikkat et</h3><ul class="pitfall-list">${d.pitfalls.map(x=>`<li>${x}</li>`).join('')}</ul></section>

 if(c.id==='muk1'&&i===1)formula=formulas[0];if(c.id==='akiskan'&&i===7)formula=formulas[10];if(c.id==='hidrolik'&&i===1)formula=formulas[11];if(c.id==='olcme'&&i===3)formula=formulas[14];
 const isdone=state.done.includes(c.id+'_'+i),deep=deepLessonData[c.id+'_'+i];
 return `<section class="lessonbox" id="lesson"><div class="row between"><span class="tag">KONU ${i+1} / ${c.topics.length}</span><span class="smalltext muted">${c.name}</span></div><h2>${t}</h2>
 <p class="lesson-intro">${deep?'Bu ders notu kavramdan uygulamaya ilerler. Önce fiziksel anlamı kavra; ardından formülün hangi kabullerle geçerli olduğunu ve çözümün nasıl kurulduğunu incele.':'Bu konu için yapılandırılmış öğrenme rehberi. Kavramı kendi ders notlarınla ve öğretim elemanının kullandığı gösterimle karşılaştırarak çalış.'}</p>
 ${deep?deepLessonHTML(c,i):`<section class="learn-section"><div class="learning-kicker">Konuya giriş</div><h3>Bu konunun amacı</h3><p>${lessonIntro(c,t)}</p>${specificLessonBox(c,i)}<h3>Öğrenme adımları</h3><ol><li>Temel tanım ve fiziksel anlamı kendi cümlenle açıkla.</li><li>Bir şekil, diyagram veya şema çizerek büyüklükleri göster.</li><li>Uygun denklem/ilkeyi seç; her sembolün anlamını ve birimini yaz.</li><li>İşlemi adım adım yap; sonucu birim ve fiziksel anlam bakımından kontrol et.</li></ol></section>`}
 ${formula?`<section class="learn-section"><div class="learning-kicker">Hızlı tekrar</div><h3>İlgili formül kartı</h3><div class="formula"><b>${formula.title}</b><br>${formula.expr}</div><p>${formula.note}</p></section>`:''}
 <section class="learn-section"><div class="learning-kicker">Saha ve proje bağlantısı</div><h3>Mühendislik uygulaması</h3><p>${deep?'Bu konunun uygulamasında model kabullerini, yük/akım/ölçü koşullarını ve standartların istediği kontrol adımlarını ayrıca doğrula.':application(c)}</p></section>
 <section class="learn-section"><div class="learning-kicker">Aktif öğrenme</div><h3>Kendi anlatımın ve notların</h3><p>Notlarını yalnız kopyalama. “Bu formül neden kullanılır, hangi durumda kullanılamaz, birim nasıl kontrol edilir?” sorularını kendi cümlelerinle yanıtla.</p><textarea class="field" id="lessonNote" rows="5" style="width:100%" placeholder="Bu konuyu kendi cümlelerinle anlat. Çözemediğin adımı ve hocanın vurguladığı noktayı yaz…">${esc(state.notes[c.id+'_'+i]||'')}</textarea></section>
 <div class="row between" style="margin-top:14px"><button class="btn ghost small" onclick="saveLessonNote('${c.id}',${i})">Notumu kaydet</button><div class="row"><button class="btn small teal" onclick="startCourseQuiz('${c.id}')">Bu dersten test çöz</button><button class="btn small ${isdone?'ghost':'gold'}" onclick="toggleDone('${c.id}',${i})">${isdone?'Tamamlandı ✓':'Konuyu tamamladım'}</button></div></div>
 <p class="lesson-disclaimer">Akademik doğrulama: Bu anlatım öğrenme desteğidir. Sayısal tasarım ve uygulamada dersin kullandığı yönetmelik, standart, ders notu ve öğretim elemanı kabulleri esas alınmalıdır.</p></section>`
}

function todayView(){const due=state.wrong.filter(w=>!w.resolved&&new Date(w.next)<=new Date());return `${head('Bugünkü çalışma planım','Süreyi çalışma gününe göre ayarla. Plan, kısa oturumlarla sürdürülebilir ilerleme sağlar.')}<div class="grid two"><section class="panel"><h3>Günlük çalışma hedefi</h3><div class="row"><button class="btn ghost small" onclick="setGoal()">Hedef: ${state.goal} dk · değiştir</button><span class="muted smalltext">Bugün kaydedilen: ${state.sessions.filter(s=>s.date===todayKey()).reduce((a,s)=>a+s.minutes,0)} dk</span></div><div class="progress" style="margin:15px 0"><i style="width:${Math.min(100,state.sessions.filter(s=>s.date===todayKey()).reduce((a,s)=>a+s.minutes,0)/state.goal*100)}%"></i></div><h3>Oturum süresi</h3><div class="timer" id="timer">00:00</div><div class="row"><button class="btn teal" id="timerStart" onclick="timerStart()">Başlat</button><button class="btn ghost" onclick="timerPause()">Duraklat</button><button class="btn gold" onclick="timerFinish()">Kaydet ve bitir</button></div><p class="smalltext muted">Sayaç bu sayfada açıkken çalışır. Bitirince çalışma süren kaydedilir.</p></section><section class="panel"><h3>Hızlı plan oluştur</h3><p class="muted smalltext">Süreye göre konu öğrenme, tekrar ve soru çözme blokları oluştur.</p><div class="row"><button class="btn small ghost" onclick="makePlan(25)">25 dakika</button><button class="btn small ghost" onclick="makePlan(45)">45 dakika</button><button class="btn small ghost" onclick="makePlan(60)">60 dakika</button><button class="btn small ghost" onclick="makePlan(90)">90 dakika</button></div><div id="planResult" style="margin-top:13px">${todayPlanHTML()}</div></section></div>${head('Tekrar kuyruğum',`${due.length} zamanında tekrar bekliyor.`)}<div class="panel">${due.length?due.slice(0,8).map(w=>`<div class="task"><span class="dot" style="background:var(--red)"></span><div><b>${w.question}</b><small>${courseBy(w.course)?.name||'Ders'} · ${new Date(w.next).toLocaleDateString('tr-TR')}</small></div><button class="btn small ghost" onclick="reviewComplete('${w.id}')">Tekrar ettim</button></div>`).join(''):'<div class="empty">Bugün için gecikmiş tekrar yok. Harika!</div>'}</div>`}
function todayPlanHTML(){return `<div class="task"><span class="dot"></span><div><b>1. Yeni konu · 20 dakika</b><small>En az ilerleme kaydettiğin güz dönemi zorunlu dersinden.</small></div></div><div class="task"><span class="dot" style="background:var(--red)"></span><div><b>2. Yanlış/tekrar · 10 dakika</b><small>Önceki hataları yeniden çöz.</small></div></div><div class="task"><span class="dot" style="background:var(--teal)"></span><div><b>3. Uygulama · 15 dakika</b><small>5–10 soru ve kısa öz değerlendirme.</small></div></div>`}
function makePlan(m){let parts=m===25?[['Kısa konu tekrarı',8],['Örnek çözümü',9],['Mini test',8]]:m===45?[['Yeni konu anlatımı',20],['Rehberli örnek',10],['Yanlışları tekrar',5],['Mini test',10]]:m===60?[['Yeni konu anlatımı',25],['Rehberli örnek',15],['Aralıklı tekrar',8],['Test ve analiz',12]]:[['Yeni konu anlatımı',30],['İki örnek çözümü',20],['Yanlış defteri',15],['Süreli test',15],['Gün sonu özeti',10]];document.getElementById('planResult').innerHTML=parts.map((p,i)=>`<div class="task"><span class="dot" style="background:${['var(--blue)','var(--teal)','var(--red)','var(--gold)'][i%4]}"></span><div><b>${p[0]}</b><small>${p[1]} dakika</small></div></div>`).join('')+`<button class="btn small teal" onclick="nav('quiz')">Test bölümüne geç</button>`}
function timerStart(){if(timerInt)return;timerInt=setInterval(()=>{seconds++;const e=document.getElementById('timer');if(e)e.textContent=fmt(seconds)},1000);document.getElementById('timerStart').textContent='Çalışıyor…'}function timerPause(){clearInterval(timerInt);timerInt=null;const b=document.getElementById('timerStart');if(b)b.textContent='Devam et'}function timerFinish(){timerPause();const m=Math.max(1,Math.round(seconds/60));addSession(m,'Zaman tutuculu çalışma');seconds=0;const e=document.getElementById('timer');if(e)e.textContent='00:00';const b=document.getElementById('timerStart');if(b)b.textContent='Başlat';toast(`${m} dakika kaydedildi.`);render()}
function startSession(){nav('today');setTimeout(timerStart,30)}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function addSession(m,type){state.sessions.push({date:todayKey(),minutes:m,type});save()}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function weeklyMinutes(){const now=new Date();return state.sessions.filter(s=>(now-new Date(s.date+'T00:00:00'))/86400000<7).reduce((a,s)=>a+s.minutes,0)}
function quizView(){return `${head('Soru çözme merkezi','Ders bazlı mini test veya karma sınav oluştur. Her yanlış cevap açıklamasıyla birlikte yanlış defterine eklenir.')}<div class="grid two"><section class="panel"><h3>Testini oluştur</h3><label class="smalltext muted">Ders seç</label><select class="field" id="quizCourse" style="width:100%;margin:5px 0 13px"><option value="all">Tüm dersler · karma</option>${allCourses().map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select><label class="smalltext muted">Soru sayısı</label><select class="field" id="quizCount" style="width:100%;margin:5px 0 13px"><option>5</option><option selected>10</option><option>15</option><option>20</option></select><label class="smalltext muted">Zorluk</label><select class="field" id="quizLevel" style="width:100%;margin:5px 0 15px"><option value="all">Tüm seviyeler</option><option>Kolay</option><option>Orta</option><option>Zor</option></select><button class="btn teal" onclick="startQuiz()">Sınavı başlat</button></section><section class="panel"><h3>Çözüm stratejisi</h3><div class="task"><span class="dot"></span><div><b>Önce soruyu anla</b><small>Verilenleri, isteneni ve birimleri işaretle.</small></div></div><div class="task"><span class="dot" style="background:var(--teal)"></span><div><b>Şıkları ele</b><small>Formül, tanım ve fiziksel anlamla karşılaştır.</small></div></div><div class="task"><span class="dot" style="background:var(--gold)"></span><div><b>Yanlışını incele</b><small>Her yanlış için açıklama ve tekrar kaydı oluşturulur.</small></div></div><p class="smalltext muted">104 başlangıç sorusu 26 dersin tamamına dağıtılmıştır. Bunlar temel kavram ve uygulama sorularıdır; ders notların ve öğretim elemanının sınav kapsamıyla karşılaştırarak genişlet.</p></section></div><div id="quizArea"></div>`}
function startCourseQuiz(id){nav('quiz');setTimeout(()=>{document.getElementById('quizCourse').value=id;startQuiz()},20)}
function startQuiz(){let c=document.getElementById('quizCourse').value,n=Number(document.getElementById('quizCount').value),l=document.getElementById('quizLevel').value;let pool=questions.filter(q=>(c==='all'||q.c===c)&&(l==='all'||q.level===l));if(!pool.length){toast('Bu filtrede henüz soru yok. Karma testi deneyebilirsin.');return}pool=shuffle(pool).slice(0,Math.min(n,pool.length));quiz={items:pool,index:0,answers:{},started:Date.now()};renderQuizQuestion()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function renderQuizQuestion(){const q=quiz.items[quiz.index],c=courseBy(q.c);const area=document.getElementById('quizArea');area.innerHTML=`<div class="panel" style="margin-top:18px"><div class="row between"><span class="tag">SORU ${quiz.index+1} / ${quiz.items.length}</span><span class="smalltext muted">${c?.name||''} · ${q.level}</span></div><div class="progress" style="margin:13px 0"><i style="width:${(quiz.index+1)/quiz.items.length*100}%"></i></div><h3 style="font-size:18px">${q.q}</h3>${q.o.map((o,i)=>`<button class="quizopt ${quiz.answers[q.id]===i?'selected':''}" onclick="answerQuiz(${i})"><b>${'ABCD'[i]}.</b> ${o}</button>`).join('')}<div class="row between" style="margin-top:15px"><button class="btn ghost small" onclick="quizPrev()" ${quiz.index===0?'disabled':''}>Önceki</button><button class="btn teal" onclick="quizNext()">${quiz.index===quiz.items.length-1?'Testi bitir':'Sonraki soru →'}</button></div></div>`}
function answerQuiz(i){quiz.answers[quiz.items[quiz.index].id]=i;renderQuizQuestion()}
function quizPrev(){quiz.index=Math.max(0,quiz.index-1);renderQuizQuestion()}
function quizNext(){if(quiz.index<quiz.items.length-1){quiz.index++;renderQuizQuestion()}else finishQuiz()}
function finishQuiz(){const score=quiz.items.filter(q=>quiz.answers[q.id]===q.a).length;quiz.items.forEach(q=>{if(quiz.answers[q.id]!==q.a)addWrong(q,quiz.answers[q.id])});state.sessions.push({date:todayKey(),minutes:Math.max(1,Math.round((Date.now()-quiz.started)/60000)),type:'Test çözümü'});state.tests=state.tests||[];state.tests.push({date:todayKey(),score,total:quiz.items.length,course:quiz.items[0]?.c||'all'});save();const area=document.getElementById('quizArea');area.innerHTML=`<div class="panel" style="margin-top:18px"><div class="eyebrow" style="color:var(--teal)">TEST TAMAMLANDI</div><h2 style="font-size:30px;margin:6px 0">${score} / ${quiz.items.length} doğru</h2><div class="progress"><i style="width:${score/quiz.items.length*100}%"></i></div><p>${Math.round(score/quiz.items.length*100)}% başarı. ${score===quiz.items.length?'Mükemmel!':'Yanlış cevaplar yanlış defterine eklendi; açıklamalarını incele.'}</p>${quiz.items.map(q=>`<div class="task"><span class="dot" style="background:${quiz.answers[q.id]===q.a?'var(--green)':'var(--red)'}"></span><div><b>${q.q}</b><small>${quiz.answers[q.id]===q.a?'Doğru':'Senin cevabın: '+(q.o[quiz.answers[q.id]]||'Boş')+' · Doğru cevap: '+q.o[q.a]}<br>${q.e}</small></div></div>`).join('')}<button class="btn teal" onclick="nav('wrong')">Yanlış defterini incele</button> <button class="btn ghost" onclick="nav('quiz')">Yeni test oluştur</button></div>`;quiz=null}
function addWrong(q,ans){if(state.wrong.some(w=>w.questionId===q.id&&!w.resolved)){const w=state.wrong.find(w=>w.questionId===q.id&&!w.resolved);w.count=(w.count||1)+1;w.next=new Date(Date.now()+86400000).toISOString();return}state.wrong.push({id:'w_'+q.id+'_'+Date.now(),questionId:q.id,course:q.c,topic:q.topic,question:q.q,answer:ans===undefined?null:ans,correct:q.a,explanation:q.e,next:new Date(Date.now()+86400000).toISOString(),resolved:false,count:1,isReview:false})}
function wrongView(){const active=state.wrong.filter(w=>!w.resolved&&!w.isReview),resolved=state.wrong.filter(w=>w.resolved);return `${head('Yanlış defterim','Yanlış cevapları yalnızca biriktirme; nedenini anla, doğru çözümü tekrar kur ve hatayı kapat.')}<div class="grid stats"><div class="stat"><small>Açık soru hatası</small><strong>${active.length}</strong></div><div class="stat"><small>Tekrar kaydı</small><strong>${state.wrong.filter(w=>w.isReview&&!w.resolved).length}</strong></div><div class="stat"><small>Kapatılan kayıt</small><strong>${resolved.length}</strong></div><div class="stat"><small>Tekrar oranı</small><strong>${state.wrong.length?Math.round(resolved.length/state.wrong.length*100):0}%</strong></div></div><div class="panel">${active.length?active.map(w=>`<div class="task"><span class="dot" style="background:var(--red)"></span><div style="flex:1"><b>${esc(w.question)}</b><small>${courseBy(w.course)?.name||'Ders'} · ${w.count||1} kez hata · ${w.next?new Date(w.next).toLocaleDateString('tr-TR'):'Tekrar bekliyor'}</small><details style="margin-top:7px"><summary class="smalltext">Doğru cevabı ve açıklamayı gör</summary><p class="smalltext"><b>Doğru cevap:</b> ${(questions.find(q=>q.id===w.questionId)?.o[w.correct])||'Ders notundaki doğru çözümü kontrol et.'}<br>${w.explanation||'Soruyu ders notunla yeniden çöz ve hata nedenini not et.'}</p></details></div><button class="btn small teal" onclick="wrongDone('${w.id}')">Öğrendim ✓</button></div>`).join(''):'<div class="empty">Henüz açık yanlış kaydın yok. Test çözdükçe yanlışların burada birikir.</div>'}</div><div class="sectionhead"><div><h2>Kapatılan kayıtlar</h2><p>Tekrar ederek öğrendiğin sorular.</p></div></div><div class="panel">${resolved.length?resolved.slice(-15).reverse().map(w=>`<div class="task"><span class="dot" style="background:var(--green)"></span><div><b>${esc(w.question)}</b><small>${courseBy(w.course)?.name||'Ders'}</small></div><span class="good smalltext">Öğrenildi</span></div>`).join(''):'<div class="empty">Henüz kapatılmış kayıt yok.</div>'}</div>`}
function wrongDone(id){const w=state.wrong.find(x=>x.id===id);if(w){w.resolved=true;w.resolvedAt=new Date().toISOString();if(w.course&&Number.isInteger(w.topic))addReview(w.course,w.topic);save();render();toast('Kayıt öğrenildi olarak işaretlendi; konu tekrar kuyruğuna eklendi.')}}
function reviewView(){const active=state.wrong.filter(w=>!w.resolved&&w.isReview).sort((a,b)=>new Date(a.next)-new Date(b.next));const grouped={};active.forEach(w=>{const day=w.next?.slice(0,10)||todayKey();grouped[day]=(grouped[day]||[]).concat(w)});return `${head('Aralıklı tekrar takvimim','Konu tamamlandığında 1, 3, 7, 14 ve 30 günlük tekrar hatırlatmaları oluşturulur.')}<div class="panel">${Object.keys(grouped).length?Object.keys(grouped).sort().map(d=>`<h3 style="margin-top:12px">${new Date(d+'T00:00:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})}</h3>${grouped[d].map(w=>`<div class="task"><span class="dot" style="background:${d<=todayKey()?'var(--red)':'var(--teal)'}"></span><div><b>${courseBy(w.course)?.name}</b><small>${w.question}</small></div><button class="btn small ghost" onclick="reviewComplete('${w.id}')">Tamamla</button></div>`).join('')}`).join(''):'<div class="empty">Henüz tekrar kaydı yok. Bir konuyu tamamladığında tekrar takvimi otomatik oluşur.</div>'}</div>`}
function reviewComplete(id){const w=state.wrong.find(x=>x.id===id);if(w){w.resolved=true;w.resolvedAt=new Date().toISOString();save();render();toast('Tekrar tamamlandı.')}}
function analyticsView(){const cs=allCourses();const tests=state.tests||[];const avg=tests.length?Math.round(tests.reduce((a,t)=>a+t.score/t.total*100,0)/tests.length):0;return `${head('Başarı analizim','Konu tamamlanması, test başarısı ve çalışma sürelerini birlikte değerlendir.')}<div class="grid stats"><div class="stat"><small>Genel konu tamamlama</small><strong>%${Math.round(doneCount()/totalTopics()*100)}</strong></div><div class="stat"><small>Ortalama test başarısı</small><strong>${avg}%</strong></div><div class="stat"><small>Toplam çalışma</small><strong>${state.sessions.reduce((a,s)=>a+s.minutes,0)} dk</strong></div><div class="stat"><small>Çözülen test</small><strong>${tests.length}</strong></div></div><div class="grid two"><section class="panel"><h3>Ders bazlı ilerleme</h3>${cs.map(c=>`<div style="margin:12px 0"><div class="row between"><b class="smalltext">${c.name}</b><span class="smalltext muted">%${pct(c)}</span></div><div class="progress" style="margin-top:5px"><i style="width:${pct(c)}%"></i></div></div>`).join('')}</section><section class="panel"><h3>Son 7 gün çalışma grafiği</h3>${weekChart()}<p class="smalltext muted">Yalnızca zaman tutucu veya test tamamlandığında kaydedilen süreler hesaplanır.</p><h3 style="margin-top:20px">Öğrenme önerisi</h3><div class="callout">İlerleme yüzdesi düşük olan ders, otomatik olarak önerilen çalışma dersleri arasında öne çıkar. Bir sonraki adım: bu dersin en eski tamamlanmamış konusunu aç ve testle pekiştir.</div></section></div>`}
function weekChart(){const days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let key=d.toISOString().slice(0,10);days.push({key,label:d.toLocaleDateString('tr-TR',{weekday:'short'}),m:state.sessions.filter(s=>s.date===key).reduce((a,s)=>a+s.minutes,0)})}const max=Math.max(30,...days.map(d=>d.m));return `<div class="meter">${days.map(d=>`<div class="barwrap"><b class="smalltext">${d.m||''}</b><div class="bar" style="height:${Math.max(2,d.m/max*75)}px"></div><small>${d.label}</small></div>`).join('')}</div>`}
function formulasView(){return `${head('Formül ve birim kartları','Ezberlemek yerine sembolü, birimi, varsayımı ve kullanım koşulunu öğren.')}<div class="grid coursegrid">${formulas.map(f=>`<article class="course"><span class="tag">${courseBy(f.course)?.name||'Genel'}</span><h3>${f.title}</h3><div class="formula">${f.expr}</div><p>${f.note}</p><button class="btn small ghost" onclick="copyText('${f.expr.replaceAll("'","\\'")}')">Formülü kopyala</button></article>`).join('')}</div><div class="callout">Birim kontrolü: kuvvet (N veya kN), uzunluk (m veya mm), alan (m² veya mm²), gerilme (Pa / kPa / MPa) arasında geçiş yaparken tüm terimleri aynı sistemde tut.</div>`}
function notesView(){const keys=Object.keys(state.notes);return `${head('Ders notlarım','Konu kartlarında yazdığın kişisel özetler ve hatırlatmalar burada listelenir.')}<div class="panel">${keys.length?keys.map(k=>{let [id,i]=[k.slice(0,k.lastIndexOf('_')),Number(k.slice(k.lastIndexOf('_')+1))];return `<div class="task"><span class="dot"></span><div><b>${courseBy(id)?.name||id} · ${courseBy(id)?.topics[i]||''}</b><small>${esc(state.notes[k]).replaceAll('\n',' ')}</small></div><button class="btn small ghost" onclick="selectedCourse='${id}';render();openLesson('${id}',${i})">Düzenle</button></div>`}).join(''):'<div class="empty">Henüz kişisel ders notu yazmadın. Ders kataloğundan bir konu açıp kendi özetini ekleyebilirsin.</div>'}</div>`}
function backupView(){return `${head('Yedekleme ve kişisel ayarlar','İlerleme, yanlışlar, notlar ve çalışma kayıtları bu tarayıcıda saklanır. Tarayıcı verilerini temizlemeden önce yedek al.')}<div class="grid two"><section class="panel"><h3>Verilerimi yedekle</h3><p class="muted smalltext">JSON yedeği; tamamlanan konuları, yanlış defterini, tekrarları, notları ve çalışma istatistiklerini içerir.</p><button class="btn teal" onclick="exportBackup()">↓ Yedeği indir</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Yedeğimi geri yükle</h3><input type="file" id="backupFile" accept="application/json" class="field" style="width:100%"><button class="btn ghost" style="margin-top:10px" onclick="importBackup()">Yedeği geri yükle</button></section><section class="panel"><h3>Çalışma tercihlerim</h3><label class="smalltext muted">Günlük hedef (dakika)</label><input class="field" type="number" min="10" max="300" id="goalInput" value="${state.goal}" style="width:100%;margin:6px 0 13px"><button class="btn" onclick="saveGoal()">Ayarı kaydet</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Veri güvenliği</h3><p class="smalltext muted">Bu sürümde veriler sadece kullandığın tarayıcının yerel depolamasında durur. Farklı cihazlarla otomatik eşitlenmez. Bu nedenle haftalık JSON yedeği almanı öneririm.</p><span class="tag">Yerel kayıt · çevrimdışı kullanım</span></section></div><div class="callout">Ders kataloğundaki 26 mevcut ders ve 225 konu başlığı önceki Çalışma Atölyem kaydından korunmuştur. Müfredat kodu/AKTS ve dönem bilgilerini resmî OBS ile karşılaştırarak doğrula. <a href="https://obs.ebyu.edu.tr/oibs/bologna/progAbout.aspx?curSunit=79998&amp;lang=tr" target="_blank" rel="noopener">EBYÜ İnşaat Mühendisliği bilgi paketi ↗</a></div>`}
function setGoal(){const v=prompt('Günlük hedefini dakika olarak yaz (10–300):',state.goal);if(v!==null){const n=Math.min(300,Math.max(10,Number(v)||40));state.goal=n;save();render();toast('Günlük hedef güncellendi.')}}function saveGoal(){const n=Math.min(300,Math.max(10,Number(document.getElementById('goalInput').value)||40));state.goal=n;save();render();toast('Ayar kaydedildi.')}
function addCourse(){const name=prompt('Dersin adını yaz:');if(!name)return;const id='custom_'+Date.now();const code=prompt('Ders kodu (isteğe bağlı):','KİŞİSEL');const raw=prompt('Konu başlıklarını virgülle ayırarak yaz:','1. konu, 2. konu, 3. konu');const topics=(raw||'İlk konu').split(',').map(s=>s.trim()).filter(Boolean);state.customCourses.push({id,code:code||'KİŞİSEL',name,season:'Güz',ects:0,group:'Kişisel ders',required:false,desc:'Kullanıcı tarafından eklenen kişisel ders.',topics});save();render();toast('Kişisel ders eklendi.')}
function exportBackup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),version:2},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='calisma-atolyem-yedek-'+todayKey()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(){const f=document.getElementById('backupFile').files[0];if(!f){toast('Önce yedek dosyası seç.');return}const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.done)||!Array.isArray(x.sessions))throw Error('invalid');if(!confirm('Mevcut kayıtların yedek dosyasındaki kayıtlarla değiştirilsin mi?'))return;state=Object.assign({done:[],wrong:[],sessions:[],notes:{},goal:40,customCourses:[]},x);save();render();toast('Yedek başarıyla geri yüklendi.')}catch(e){toast('Dosya geçerli bir Çalışma Atölyem yedeği değil.')}};r.readAsText(f)}
function saveLessonNote(id,i){state.notes[id+'_'+i]=document.getElementById('lessonNote').value;save();toast('Notun kaydedildi.')}
function bindDynamic(){const s=document.getElementById('courseSearch');if(s)s.oninput=filterCourses;['seasonFilter','typeFilter'].forEach(id=>{const el=document.getElementById(id);if(el)el.onchange=filterCourses});document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{selectedCourse=b.dataset.course;lessonTopic=null;render()})}
function filterCourses(){const q=(document.getElementById('courseSearch')?.value||'').toLocaleLowerCase('tr'),season=document.getElementById('seasonFilter')?.value||'all',type=document.getElementById('typeFilter')?.value||'all';const arr=allCourses().filter(c=>(season==='all'||c.season===season)&&(type==='all'||(type==='required'?c.required:!c.required))&&(c.name.toLocaleLowerCase('tr').includes(q)||c.code.toLowerCase().includes(q)||c.topics.some(t=>t.toLocaleLowerCase('tr').includes(q))));document.getElementById('courseResults').innerHTML=arr.map(courseCard).join('')||'<div class="empty">Aramana uygun ders bulunamadı.</div>';document.getElementById('courseCount').textContent=arr.length+' ders';document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{selectedCourse=b.dataset.course;render()})}
function copyText(s){navigator.clipboard?.writeText(s).then(()=>toast('Formül kopyalandı.')).catch(()=>toast('Kopyalama desteklenmiyor.'))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script></body></html>
