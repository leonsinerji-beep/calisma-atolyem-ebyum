formulas.push(...[{"course":"istatistik","title":"Koşullu olasılık ve Bayes","expr":"P(A|B)=P(A∩B)/P(B); P(A|B)=P(B|A)P(A)/P(B)","note":"P(B)>0 olmalıdır; Bayes paydasında tüm olası kaynaklar bulunur."},{"course":"istatistik","title":"Beklenen değer ve varyans","expr":"E[X]=ΣxP(X=x); Var(X)=E[X²]−E[X]²","note":"Kesikli rassal değişken için olasılıkların toplamı 1 olmalıdır."},{"course":"istatistik","title":"Normal dağılım z skoru","expr":"z=(x−μ)/σ","note":"Gözlemin ortalamadan kaç standart sapma uzakta olduğunu gösterir."},{"course":"istatistik","title":"Ortalamanın standart hatası","expr":"SE(x̄)=σ/√n","note":"Bağımsız örneklem ve bilinen anakütle standart sapması için."},{"course":"istatistik","title":"Ortalama için güven aralığı","expr":"x̄ ± z_(α/2)·σ/√n","note":"σ biliniyorsa ve uygun dağılım/örnekleme koşulları sağlanıyorsa."},{"course":"istatistik","title":"Hipotez testi kararı","expr":"p-değeri ≤ α ⇒ H₀ reddedilir","note":"H₀ reddedilemezse kanıtlanmış olmaz; p-değeri H₀ doğruluk olasılığı değildir."},{"course":"diferansiyel","title":"Ayrılabilir denklem","expr":"dy/h(y)=g(x)dx","note":"Sıfır yapan özel çözümler ayrıca kontrol edilir."},{"course":"diferansiyel","title":"İntegrasyon çarpanı","expr":"μ=e^(∫Pdx); (μy)′=μQ","note":"y′+P(x)y=Q(x) standart biçimindeki denklem için."},{"course":"diferansiyel","title":"Tam diferansiyel koşulu","expr":"M_y=N_x; Mdx+Ndy=0","note":"Uygun bölgede F(x,y)=C potansiyeli bulunabilir."},{"course":"diferansiyel","title":"Bernoulli dönüşümü","expr":"y′+Py=Qyⁿ; v=y^(1−n)","note":"n≠0,1 için uygun dönüşümle lineer denklem elde edilir."},{"course":"diferansiyel","title":"Karakteristik denklem","expr":"aₙrⁿ+…+a₁r+a₀=0","note":"Sabit katsayılı homojen lineer denklemlerde kullanılır."},{"course":"diferansiyel","title":"Homojen olmayan çözüm","expr":"y=y_h+y_p","note":"Genel çözüm homojen genel çözüm ile özel çözümün toplamıdır."},{"course":"diferansiyel","title":"Laplace türev dönüşümü","expr":"L{y′}=sY(s)−y(0)","note":"Başlangıç değeri dönüşümde açıkça yer alır."},{"course":"lineer","title":"Matris çarpım boyutu","expr":"A_(m×n)B_(n×p)=C_(m×p)","note":"İç boyutlar eşleşmelidir; sonuç dış boyutları taşır."},{"course":"lineer","title":"Gauss eliminasyonu","expr":"[A|b] → [U|c] → geriye yerine koyma","note":"Temel satır işlemleri çözüm kümesini korur."},{"course":"lineer","title":"Rank ve çözüm koşulu","expr":"rank(A)=rank([A|b])","note":"Sistem tutarlılığı koşuludur; tek çözüm için ortak rank bilinmeyen sayısına eşit olmalıdır."},{"course":"lineer","title":"Lineer bağımsızlık","expr":"Σcᵢvᵢ=0 ⇒ tüm cᵢ=0","note":"Yalnız trivial çözüm varsa vektörler bağımsızdır."},{"course":"lineer","title":"Özdeğer ve özvektör","expr":"det(A−λI)=0; Av=λv","note":"Önce özdeğer, sonra sıfır olmayan özvektör bulunur."},{"course":"lineer","title":"Lineer dönüşüm","expr":"T(x)=Ax; T(u+v)=T(u)+T(v)","note":"Dönüşüm toplama ve skaler çarpmayı korur."},{"course":"muhmat","title":"Karmaşık sayı modülü","expr":"|a+bi|=√(a²+b²)","note":"Argüman bölgeye göre belirlenir."},{"course":"muhmat","title":"Euler bağıntısı","expr":"e^(iθ)=cosθ+i sinθ","note":"Karmaşık sayının üstel ve trigonometrik gösterimlerini bağlar."},{"course":"muhmat","title":"Cauchy–Riemann","expr":"u_x=v_y; u_y=−v_x","note":"Uygun süreklilik ve bölge koşulları altında analitiklik için temel koşuldur."},{"course":"muhmat","title":"Toplam diferansiyel","expr":"df≈f_xdx+f_ydy","note":"Küçük değişimler için birinci mertebe yaklaşımıdır."},{"course":"muhmat","title":"Gradyan ve yönlü türev","expr":"∇f=(f_x,f_y); D_uf=∇f·u","note":"u birim vektör olmalıdır."},{"course":"muhmat","title":"Çift integral","expr":"∬_D f(x,y)dA","note":"D bölgesi üzerindeki toplamı verir; integrand 1 ise alan bulunur."},{"course":"muhmat","title":"Diverjans ve rotasyonel","expr":"∇·F=P_x+Q_y+R_z; ∇×F","note":"Diverjans skaler, rotasyonel vektördür."},{"course":"muhmat","title":"Fourier serisi","expr":"f(x)~a₀/2+Σ(aₙcos nω₀x+bₙsin nω₀x)","note":"Periyodik fonksiyon harmoniklerle temsil edilir; ω₀=2π/T."}]);

const specificLessons={
'muk1_1':{concept:'Normal gerilme, kesite dik doğrultuda etkiyen iç kuvvetin kesit alanına yayılmış etkisidir. Çekme gerilmesi elemanı uzatır; basınç gerilmesi kısaltır. Ortalama gerilme yaklaşımında kuvvetin kesite düzgün dağıldığı kabul edilir.',example:'Örnek: N = 60 kN çekme kuvveti ve A = 1.200 mm² kesit alanı için σ = 60.000 / 1.200 = 50 N/mm² = 50 MPa.',steps:['60 kN değerini 60.000 N olarak dönüştür.','Kesit alanını mm² olarak koru.','σ=N/A bağıntısına yerleştir.','N/mm² ile MPa eşitliğini kullanarak birimi yaz.'],trap:'kN ile mm² birlikte verilmişse kuvveti N’ye çevirmeden doğrudan 60/1200 yazma. Bu işlem sonucu 1000 kat hatalı yapar.'},
'muk1_2':{concept:'Birim şekil değiştirme, boy değişiminin ilk boya oranıdır. Boyutsuz bir büyüklüktür. Doğrusal elastik bölgede Hooke kanunu gerilme ile birim şekil değiştirmeyi elastisite modülü üzerinden ilişkilendirir.',example:'Örnek: İlk boy L₀=2.000 mm, uzama ΔL=1,2 mm ise ε=1,2/2.000=0,0006. E=200.000 MPa ise σ=Eε=120 MPa (malzeme doğrusal elastik bölgede kaldığı sürece).',steps:['İlk boy ile boy değişimini aynı birimde yaz.','ε=ΔL/L₀ ile boyutsuz şekil değiştirmeyi hesapla.','Hooke kanunu uygulanabiliyorsa σ=Eε yaz.','Gerilmenin elastik sınırı aşıp aşmadığını kontrol et.'],trap:'ε yüzde olarak yazılacaksa 0,0006 değeri %0,06’dır; %0,0006 değildir.'},
'din_4':{concept:'Newton’un ikinci kanunu, parçacığın net dış kuvvetinin kütle ile ivmenin çarpımına eşit olduğunu söyler. Önce cismi serbest cisim diyagramıyla izole edip eksenleri ve kuvvet yönlerini belirlemek gerekir.',example:'Örnek: Yatay düzlemde net kuvvet 2,4 kN ve kütle 1.200 kg ise a=F/m=2.400/1.200=2 m/s².',steps:['Cismi izole et ve üzerine etkiyen kuvvetleri çiz.','Eksenleri seç; işaret yönlerini belirle.','Her eksen için ΣF=m·a denklemini yaz.','Bilinmeyeni çöz ve birimini kontrol et.'],trap:'ΣF yerine tek bir kuvveti yazmak veya sürtünme/tepki kuvvetini serbest cisim diyagramında unutmak.'},
'akiskan_3':{concept:'Durgun bir akışkanda basınç derinlikle doğrusal artar. Aynı akışkan içinde aynı yatay düzlemdeki noktalarda basınç eşittir. Gösterge basıncı atmosfer basıncını sıfır referans alır.',example:'Örnek: Suyun yoğunluğu 1.000 kg/m³, derinlik 2,5 m ve g=9,81 m/s² ise p=ρgh=24.525 Pa=24,525 kPa gösterge basıncıdır.',steps:['Akışkanın yoğunluğunu belirle.','Serbest yüzeyden dikey derinliği ölç.','p=ρgh bağıntısını kullan.','İstenen gösterge mi mutlak basınç mı olduğunu kontrol et.'],trap:'Derinliği eğik mesafe olarak alma; hidrostatik basınç için düşey derinlik kullanılır.'},
'akiskan_7':{concept:'Bernoulli denklemi, ideal ve kararlı akımda akım çizgisi boyunca basınç, hız ve kot enerjilerinin toplamını ilişkilendirir. Gerçek sistemlerde enerji kayıpları ile pompa/türbin etkileri ayrıca eklenmelidir.',example:'Yatay, kayıpsız su akımında V₁=2 m/s ve V₂=4 m/s ise p₁−p₂=½ρ(V₂²−V₁²)=6.000 Pa=6 kPa. Hızın arttığı kesitte statik basınç azalır.',steps:['İki kesiti ve kotları gösteren şema çiz.','Basınç, hız ve kot terimlerini her kesit için yaz.','Yatay hat ise z₁=z₂ sadeleştirmesini yap.','Kayıp veya pompa varsa enerji denklemine ekle.'],trap:'Bernoulli’yi her akım için koşulsuz kullanma; akımın kararlı olması, uygun akım çizgisi ve ihmal edilen kayıplar gibi kabulleri belirt.'},
'malzeme_6':{concept:'Çekme deneyinde numuneye kontrollü eksenel yük uygulanır; yük ve uzama ölçülerek mühendislik gerilmesi–şekil değiştirmesi eğrisi elde edilir. Başlangıçtaki doğrusal elastik bölgenin eğimi elastisite modülüdür.',example:'Örnek: Başlangıç kesiti A₀=100 mm² ve ölçülen yük P=20 kN ise mühendislik gerilmesi σ=P/A₀=20.000/100=200 MPa.',steps:['Numunenin ilk ölçülerini kaydet.','Yükü ve uzamayı eş zamanlı ölç.','σ=P/A₀ ve ε=ΔL/L₀ hesapla.','Eğriden elastik bölge, akma, maksimum çekme gerilmesi ve kopmayı yorumla.'],trap:'Mühendislik gerilmesinde ilk kesit alanı kullanılır; gerçek gerilmede anlık kesit alanı esas alınır.'},
'istatistik_2':{concept:'Aritmetik ortalama tüm gözlemleri kullanır; medyan sıralanmış verinin ortasındaki değerdir. Aykırı değerler ortalamayı medyandan daha fazla etkileyebilir.',example:'Örnek: 4, 5, 5, 6, 20 verileri için ortalama 8; medyan 5’tir. 20 değeri ortalamayı yukarı çekmiştir.',steps:['Verileri eksiksiz listele.','Medyan için küçükten büyüğe sırala.','Ortalama için toplamı gözlem sayısına böl.','Aykırı değerleri fark ederek hangi ölçünün daha temsil edici olduğunu seç.'],trap:'Çift sayıda gözlem varsa medyan iki ortadaki değerin aritmetik ortalamasıdır.'},
'diferansiyel_2':{concept:'Birinci mertebe lineer diferansiyel denklem y′+P(x)y=Q(x) biçimindedir. İntegrasyon çarpanı μ=e^{∫P(x)dx} seçilerek sol taraf bir çarpımın türevine dönüştürülür.',example:'Örnek: y′+2y=0 için P=2, μ=e^{2x}. Böylece (e^{2x}y)′=0 ve y=C e^{−2x} elde edilir.',steps:['Denklemi standart y′+P(x)y=Q(x) biçimine getir.','μ=e^{∫P(x)dx} hesapla.','Denklemin tamamını μ ile çarp.','Sol tarafı (μy)′ biçiminde yazıp integre et.','Başlangıç koşulu varsa sabiti belirle.'],trap:'İntegrasyon çarpanını yalnız y′ terimine değil, denklemin her iki tarafına uygulamalısın.'},
'lineer_2':{concept:'Lineer denklem sistemleri, bilinmeyenlerin katsayı matrisinde toplandığı A·x=b biçiminde ifade edilir. Gauss eliminasyonu temel satır işlemleriyle sistemi basamaklı biçime getirir.',example:'Örnek: 2x+y=5 ve x−y=1. İkinci denklemden y=x−1; ilk denklemde 3x−1=5, x=2 ve y=1 bulunur.',steps:['Denklemleri aynı bilinmeyen sırasıyla yaz.','Artırılmış matrisi [A|b] kur.','Pivot elemanları kullanarak alt üçgeni sıfırla.','Geri yerine koyma ile bilinmeyenleri bul.','Çözümü ilk denklemlerde doğrula.'],trap:'Satır işlemi yaparken sağ taraftaki sabitler sütununa da aynı işlemi uygulamalısın.'},
'muhmat_0':{concept:'Karmaşık sayı z=a+bi biçimindedir. a reel kısım, b sanal kısmın katsayısıdır. Modül, karmaşık düzlemde orijine olan uzaklıktır.',example:'Örnek: z=3+4i için |z|=√(3²+4²)=5. Eşlenik sayı 3−4i’dir.',steps:['Reel ve sanal katsayıları belirle.','Modül için √(a²+b²) kullan.','Çarpma/bölmede eşlenik ve i²=−1 özelliğini uygula.','Sonucu a+bi biçiminde düzenle.'],trap:'i²=−1 olduğunu unutma; i² değerini +1 almak işlemin işaretini değiştirir.'},
'olcme_3':{concept:'Geometrik nivelmanda alet yatay görüş düzlemi oluşturur. Geri okuma bilinen kotla alet yüksekliğini, ileri okuma yeni noktanın kotunu verir.',example:'Örnek: Başlangıç kotu 1.245,320 m ve geri okuma 1,425 m ise alet yüksekliği 1.246,745 m. İleri okuma 0,985 m ise yeni nokta kotu 1.245,760 m olur.',steps:['Başlangıç noktasının bilinen kotunu yaz.','Alet yüksekliği = bilinen kot + geri okuma.','Yeni kot = alet yüksekliği − ileri okuma.','Sonucu arazi defterinde nokta ve mira bilgisiyle kaydet.'],trap:'Geri ve ileri okumayı karıştırma; aynı alet kurulumunda ileri okuma yeni kotu düşürür.'},
'yapimalz_7':{concept:'Beton basınç dayanımı, standart koşullarda hazırlanmış ve kür edilmiş numunenin kırılma yükünün yüklenen kesit alanına oranıyla bulunur.',example:'Örnek: 150×150 mm kesitli küp numune 270 kN yükte kırılırsa A=22.500 mm² ve f_c=270.000/22.500=12 N/mm²=12 MPa.',steps:['Numune boyutlarını ve deney yaşını doğrula.','Maksimum kırılma yükünü kaydet.','Yüklenen kesit alanını hesapla.','f_c=P/A ile dayanımı bul; standardın numune ve yükleme şartlarını belirt.'],trap:'Numune boyutu, şekli, yükleme hızı ve kür koşulları dayanım sonucunu etkiler; farklı numuneler doğrudan karşılaştırılmamalıdır.'},
'sayisal_2':{concept:'İkiye bölme yöntemi, sürekli bir fonksiyonun işaret değiştirdiği aralıkta kök bulunduğu varsayımıyla çalışır. Her adımda aralık ikiye bölünür ve kökü içeren yarı aralık seçilir.',example:'Örnek: f(x)=x²−2 için [1,2] aralığında f(1)<0 ve f(2)>0. İlk orta nokta m=1,5; f(1,5)=0,25 olduğundan kök [1,1,5] aralığındadır.',steps:['Başlangıç aralığının uçlarında işaret değişimini kontrol et.','Orta noktayı m=(a+b)/2 hesapla.','f(m) işaretine göre kökü içeren yarı aralığı seç.','Hata/tolerans sağlanana kadar yinele.'],trap:'Başlangıç aralığında işaret değişimi yoksa standart ikiye bölme yöntemi kök garantisi vermez.'}

function lessonIntro(c,t){
 const p=courseTeachingProfiles[c.id]||{};
 const name=esc(c.name||'Ders'),topic=esc(t||'Konu');
 const coursePurpose=p.intro||c.desc||'Bu dersin temel kavramlarını ve mühendislik uygulamalarını birlikte öğren.';
 const prerequisites=p.prereq?'<b>Ön koşullar:</b> '+esc(p.prereq):'';
 const method=p.method?'<b>Çalışma yaklaşımı:</b> '+esc(p.method):'';
 return '<b>'+name+' · '+topic+':</b> '+esc(coursePurpose)+' '+prerequisites+' '+method;
}
function application(c){
 const p=courseTeachingProfiles[c.id]||{};
 if(p.app)return esc(p.app);
 return esc(c.name+' dersi; proje verilerinin değerlendirilmesi, uygun yöntem ve kabullerin seçilmesi, hesapların kontrolü ve sonuçların mühendislik bağlamında yorumlanmasında kullanılır.');
}
function specificLessonBox(c,i){const s=specificLessons[c.id+'_'+i];if(!s)return '';return `<h3>Örnekli konu anlatımı</h3><p>${s.concept}</p><div class="callout"><b>Adım adım örnek</b><br>${s.example}</div><h3>Çözüm adımları</h3><ol>${s.steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="callout"><b>Sık yapılan özel hata:</b> ${s.trap}</div>`}

let state=load();let view='dashboard',selectedCourse=null,selectedQuestion=null,quiz=null,lessonTopic=null,timerInt=null,seconds=0;
function load(){try{return Object.assign({done:[],wrong:[],sessions:[],notes:{},goal:40,customCourses:[],lastVisit:null},JSON.parse(localStorage.getItem('calismaAtolyemV2')||'{}'))}catch(e){return {done:[],wrong:[],sessions:[],notes:{},goal:40,customCourses:[]}}}
function save(){localStorage.setItem('calismaAtolyemV2',JSON.stringify(state));}
// Önceki sınav sürümünde boş bırakılan cevaplar yanlış defterine eklenmiş olabilir.
// Gerçek tekrar kayıtları (isReview) korunur; yalnızca cevabı boş olan sınav kayıtları temizlenir.
const blankWrongBefore=(state.wrong||[]).length;
state.wrong=(state.wrong||[]).filter(w=>w&& (w.isReview|| (w.answer!==null&&w.answer!==undefined)));
if(state.wrong.length!==blankWrongBefore)save();
function allCourses(){return [...courses,...(state.customCourses||[])]}
function totalTopics(){return allCourses().reduce((n,c)=>n+c.topics.length,0)}
function doneCount(){return state.done.length}
function pct(c){return Math.round(c.topics.filter((_,i)=>state.done.includes(c.id+'_'+i)).length/c.topics.length*100)}
function courseBy(id){return allCourses().find(c=>c.id===id)}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),2300)}
function nav(v){view=v;selectedCourse=null;lessonTopic=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('sidebar').classList.remove('open');render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.view)));
document.getElementById('hamb').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
function head(title,sub=''){return `<div class="sectionhead"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div></div>`}
function courseCard(c){const d=c.topics.filter((_,i)=>state.done.includes(c.id+'_'+i)).length;const tag=c.repeat?'Tekrar · '+c.grade:c.season+' · '+(c.required?'Zorunlu':'Seçmeli');return `<article class="course"><div class="row between"><span class="tag ${c.season==='Bahar'?'bahar':''} ${!c.required?'elective':''} ${c.repeat?'repeat':''}">${tag}</span><span class="smalltext muted">${c.ects||'—'} AKTS</span></div><h3>${c.name}</h3><p>${c.desc}</p><div class="progress"><i style="width:${pct(c)}%"></i></div><div class="coursemeta"><span>${d}/${c.topics.length} konu</span><b>%${pct(c)}</b></div><div class="row between" style="margin-top:13px"><small class="muted">${c.group}</small><button class="btn small" data-course="${c.id}">Dersi aç →</button></div></article>`}
function render(){const titles={dashboard:'Genel bakış',courses:'Ders kataloğu',today:'Bugünkü çalışma',quiz:'Soru çöz / sınav modu',wrong:'Yanlış defterim',review:'Tekrar takvimim',analytics:'Başarı analizim',formulas:'Formül ve birim kartları',notes:'Ders notlarım',backup:'Yedekleme / ayarlar'};document.getElementById('crumb').textContent='Öğrenme alanım / '+(titles[view]||'Ders');const app=document.getElementById('app');if(selectedCourse){renderCourse(app,courseBy(selectedCourse));return}if(view==='dashboard')app.innerHTML=dashboard();if(view==='courses')app.innerHTML=coursesView();if(view==='today')app.innerHTML=todayView();if(view==='quiz')app.innerHTML=quizView();if(view==='wrong')app.innerHTML=wrongView();if(view==='review')app.innerHTML=reviewView();if(view==='analytics')app.innerHTML=analyticsView();if(view==='formulas')app.innerHTML=formulasView();if(view==='notes')app.innerHTML=notesView();if(view==='backup')app.innerHTML=backupView();bindDynamic()}
function dashboard(){const remaining=allCourses().filter(c=>c.season==='Güz'&&c.required).sort((a,b)=>pct(a)-pct(b));const first=remaining[0];const due=state.wrong.filter(w=>!w.resolved&&new Date(w.next||0)<=new Date()).length;const mins=state.sessions.filter(s=>s.date===todayKey()).reduce((a,s)=>a+s.minutes,0);const week=weeklyMinutes();return `<section class="welcome"><div><div class="eyebrow">Kişisel öğrenme kampüsü · 2. sınıf</div><h1>Sağlam yapılar,<br>sağlam temellerle başlar.</h1><p>Her çalışma oturumunda küçük bir hedef belirle. Konuyu öğren, örnek çöz, kendini sına ve öğrendiklerini aralıklı tekrarlarla kalıcı hâle getir.</p><div class="row" style="margin-top:20px"><button class="btn light" onclick="nav('today')">Bugünkü çalışmayı başlat</button><button class="btn" style="background:#ffffff22;border:1px solid #ffffff55" onclick="nav('courses')">Derslerime git</button></div></div><div class="right"><strong>${Math.round(doneCount()/Math.max(totalTopics(),1)*100)}%</strong><small>Genel konu ilerlemesi</small><div class="progress" style="margin-top:12px;background:#ffffff3d;width:190px"><i style="width:${doneCount()/Math.max(totalTopics(),1)*100}%;background:#e7c47b"></i></div></div></section>
<div class="grid stats"><div class="stat"><small>Tamamlanan konu</small><strong>${doneCount()} <span class="muted" style="font-size:14px">/ ${totalTopics()}</span></strong><div class="sub">Ders bazında takip edilir</div></div><div class="stat"><small>Bugünkü çalışma</small><strong>${mins} dk</strong><div class="sub">Günlük hedef: ${state.goal} dakika</div></div><div class="stat"><small>Tekrar bekleyen yanlış</small><strong>${due}</strong><div class="sub">Yanlış defterinden</div></div><div class="stat"><small>Son 7 gün</small><strong>${week} dk</strong><div class="sub">Kaydedilen çalışma süresi</div></div></div>
<div class="grid two"><section><div class="sectionhead"><div><h2>Bugün için önerilen rota</h2><p>Güz dönemi zorunlu derslerinden ve tekrar kuyruğundan oluşturulur.</p></div><button class="btn small ghost" onclick="nav('today')">Planı düzenle</button></div><div class="panel">${due?`<div class="task"><span class="dot" style="background:var(--red)"></span><div><b>${due} yanlış soruyu tekrar et</b><small>Önceki hatalarını yeniden çözerek pekiştir.</small></div></div>`:''}${first?`<div class="task"><span class="dot"></span><div><b>${first.name} · ${first.topics.find((_,i)=>!state.done.includes(first.id+'_'+i))||'Dersi tekrar et'}</b><small>İlerlemesi düşük zorunlu güz dersi</small></div></div>`:''}<div class="task"><span class="dot" style="background:var(--teal)"></span><div><b>10 soruluk karma mini test</b><small>Konuları karıştırarak bilgiyi geri çağır.</small></div></div><div class="task"><span class="dot" style="background:#8795a7"></span><div><b>5 dakika gün sonu notu</b><small>Bugün öğrendiğin bir şeyi kendi cümlenle yaz.</small></div></div></div></section>
<section><div class="sectionhead"><div><h2>Çalışma ritmim</h2><p>Son 7 günün kayıtlı çalışma süresi</p></div></div><div class="panel"><div class="row between"><b>Haftalık çalışma</b><span class="muted smalltext">${week} dakika</span></div>${weekChart()}<div class="row between" style="margin-top:13px"><span class="smalltext muted">Günlük hedef</span><b>${state.goal} dk</b></div><div class="row" style="margin-top:10px"><button class="btn small ghost" onclick="setGoal()">Hedefi değiştir</button><button class="btn small teal" onclick="startSession()">Süre tutucuyu aç</button></div></div></section></div>
${head('Derslerime hızlı erişim','En düşük ilerlemeden başlayarak önerilen güz dönemi dersleri.')}<div class="grid coursegrid">${remaining.slice(0,3).map(courseCard).join('')}</div><div class="footer">Verilerin bu tarayıcıda saklanır; farklı cihazlarla otomatik eşitlenmez. Haftalık JSON yedeği almayı unutma.</div>`}
function coursesView(){return `${head('Ders kataloğu','Mevcut dersler, tekrar dersleri ve kişisel ilerleme kayıtların aynı katalogda tutulur. Tekrar dersleri ayrı filtreyle görüntüleyebilirsin.')}<div class="panel"><div class="filters"><input id="courseSearch" class="field search" placeholder="Ders veya konu ara…"><select id="seasonFilter" class="field"><option value="all">Tüm dönemler</option><option>Güz</option><option>Bahar</option><option>Tekrar</option></select><select id="typeFilter" class="field"><option value="all">Zorunlu + seçmeli</option><option value="required">Zorunlu dersler</option><option value="elective">Seçmeli dersler</option></select><button class="btn small ghost" onclick="addCourse()">+ Kendi dersimi ekle</button></div></div><div class="row between" style="margin:15px 0"><span class="muted smalltext" id="courseCount">${allCourses().length} ders</span><button class="btn small ghost" onclick="nav('analytics')">İlerleme raporuna git</button></div><div id="courseResults" class="grid coursegrid">${allCourses().map(courseCard).join('')}</div>`}
function renderCourse(app,c){if(!c){selectedCourse=null;render();return}const completed=c.topics.filter((_,i)=>state.done.includes(c.id+'_'+i)).length;app.innerHTML=`<div class="row between"><div><button class="btn ghost small" onclick="selectedCourse=null;render()">← Ders kataloğuna dön</button><div class="eyebrow" style="color:var(--muted);margin-top:17px">${c.code} · ${c.season} dönemi · ${c.group}</div><h1 style="margin:5px 0 6px">${c.name}</h1><p class="muted" style="margin:0">${c.desc}</p></div><span class="tag ${c.repeat?'repeat':(c.required?'':'elective')}">${c.repeat?'Tekrar dersi · '+c.grade:(c.required?'Zorunlu ders':'Seçmeli ders')}</span></div>${c.repeat?`<section class="callout" style="margin-top:15px"><b>Transkript kaydı:</b> ${esc(c.gradeTerm)} · ${esc(c.grade)} notu · ${c.ects} AKTS.<br><span>${esc(c.contentNote||'')}</span>${c.provisional?'<p><b>İçerik durumu:</b> Geçici konu taslağı; resmî izlenceyle doğrulanmalıdır.</p>':''}</section>`:''}<div class="grid stats"><div class="stat"><small>Konu ilerlemesi</small><strong>%${pct(c)}</strong><div class="progress"><i style="width:${pct(c)}%"></i></div></div><div class="stat"><small>Tamamlanan</small><strong>${completed}/${c.topics.length}</strong></div><div class="stat"><small>Soru bankası</small><strong>${questions.filter(q=>q.c===c.id).length}</strong></div><div class="stat"><small>AKTS</small><strong>${c.ects||'—'}</strong></div></div><div class="row between" style="margin:18px 0 10px"><div><h2 style="margin:0">Konu yol haritası</h2><p class="muted smalltext" style="margin:3px 0">Her konu için ders anlatımı, görsel şema, vize-final soru türleri, video desteği, öz kontrol ve kişisel not alanı.</p></div><button class="btn small teal" onclick="startCourseQuiz('${c.id}')">Bu dersten test çöz</button></div><div class="topiclist">${c.topics.map((t,i)=>{const done=state.done.includes(c.id+'_'+i);return `<div class="topic ${done?'done':''}"><div class="num">${done?'✓':i+1}</div><div><h4>${t}</h4><small>${done?'Tamamlandı':`Konu ${i+1} · öğrenme kartı ve uygulama`}</small></div><button class="btn small ${done?'ghost':' ' }" onclick="openLesson('${c.id}',${i})">${done?'Tekrar aç':'Konuyu çalış'}</button></div>`}).join('')}</div>${lessonTopic!==null?lessonHTML(c,lessonTopic):''}`}
const deepLessonData = {"muk1_0":{"objective":"Bir taşıyıcı elemanı dış yükler altında çözümleyebilmek için mesnet tepkilerini ve kesitte oluşan iç tesirleri bulmak.","prerequisites":"Kuvvet vektörleri, moment, statik denge denklemleri ve temel mesnet türleri.","explanation":"Bir çubuk veya kirişe dışarıdan yük uygulandığında elemanın içinde bu yükleri dengeleyen iç tesirler oluşur. Kesit yönteminde elemanı hayalî bir düzlemden keser, parçanın bir tarafını serbest cisim diyagramı olarak inceleriz. Üç boyutlu genel iç tesirler normal kuvvet N, iki kesme kuvveti, iki eğilme momenti ve burulma momentidir; düzlem kiriş problemlerinde çoğunlukla N, V ve M yeterlidir. Mesnetler hareketi kısıtladıkları doğrultularda tepki üretir; pim iki bileşenli kuvvet, makaralı mesnet yüzeye dik tek tepki, ankastre ise kuvvet ve moment tepkisi taşır.","eq_title":"Denge ve kesit denklemleri","eq":"ΣFx=0,  ΣFy=0,  ΣM=0;  kesitte N, V ve M için ΣF=0 ve ΣM=0","eq_note":"İç kuvvetlerin büyüklükleri, seçilen kesit ve işaret kuralına bağlıdır. Her işlemde aynı işaret kuralını sürdür.","example_title":"Kesit yöntemiyle iç kuvvet bulma","example":"Basitçe mesnetlenmiş bir kirişin bir kesitinde, kesitin solunda 8 kN düşey tekil yük ve sol mesnetten kesite 2 m uzaklık bulunsun. Sol parçanın düşey dengesiyle kesitteki kesme kuvvetinin büyüklüğü, sol taraftaki düşey dış kuvvetlerin cebirsel toplamına eşit olur. Kesit noktasına göre moment alındığında eğilme momenti 8×2=16 kN·m büyüklüğünde elde edilir (işaret, benimsenen konvansiyona göre belirlenir).","steps":["Önce tüm elemanı çiz ve mesnet tepkilerini global denge ile bul.","Kesitin hangi tarafını inceleyeceğine karar ver; genellikle daha az yük içeren tarafı seç.","Kesitte bilinmeyen N, V ve M etkilerini pozitif varsayılan yönlerde göster.","Seçilen parça için yatay kuvvet, düşey kuvvet ve moment denklemlerini yaz.","Bulduğun işaretin başlangıçta varsaydığın yönle uyumunu yorumla."],"engineering":"Kiriş, kolon, makas çubuğu ve bağlantı detaylarında iç kuvvetlerin belirlenmesi; demiryolu ve köprü elemanlarında yük aktarımının izlenmesi.","pitfalls":["Serbest cisim diyagramında mesnet tepkisini unutmak.","Kesitteki iç kuvvetleri dış yüklerle aynı noktada/yanlış yönde çizmek.","Moment alırken dik uzaklık yerine eğik uzunluğu kullanmak.","İşaret kuralını problem ortasında değiştirmek."],"checkq":"Bir kiriş kesitinde N, V ve M neyi temsil eder?","checka":"N kesite dik eksenel kuvveti, V kesit düzlemindeki kesme kuvvetini, M ise kesit etrafındaki eğilme momentini temsil eder."},"muk1_1":{"objective":"Normal gerilmenin fiziksel anlamını kavramak, ortalama gerilmeyi hesaplamak ve birim dönüşümlerini hatasız yapmak.","prerequisites":"Kuvvet, kesit alanı, çekme ve basınç etkisi; N, kN, mm² ve MPa birimleri.","explanation":"Gerilme, dış yükün eleman içinde birim alana düşen iç kuvvet etkisini tanımlar. Eksenel kuvvet kesite dik olduğunda normal gerilme oluşur. Çekmede eleman uzamaya, basınçta kısalmaya zorlanır. σ=P/A bağıntısı ortalama gerilmeyi verir; kuvvetin kesite düzgün yayıldığı kabul edilir. Gerçekte delik, ani kesit değişimi, bağlantı ve mesnet yakınında gerilme dağılımı düzgün olmayabilir; bu bölgelerde gerilme yığılması oluşur.","eq_title":"Ortalama normal gerilme","eq":"σ = P/A","eq_note":"P: kesite dik eksenel kuvvet (N), A: kesit alanı (mm²), σ: N/mm² = MPa. 1 kN=1000 N ve 1 N/mm²=1 MPa.","example_title":"Çekme çubuğunda gerilme","example":"Çapı 20 mm olan dairesel çubuk 40 kN çekme kuvveti taşıyor. A=πd²/4=π×20²/4=314,16 mm². Kuvvet 40.000 N olduğundan σ=40.000/314,16=127,3 MPa.","steps":["Verilen kuvvetin eksenel mi, kesmeye mi çalıştığını belirle.","Kesit geometrisine göre alanı hesapla; daire için πd²/4, dikdörtgen için b×h.","Kuvveti N, alanı mm² olacak şekilde aynı sisteme dönüştür.","σ=P/A hesabını yap.","Çekme veya basınç olduğunu ve MPa birimini açıkça yaz."],"engineering":"Çelik çekme elemanları, askı çubukları, kolonlar, ankrajlar ve bağlantı plakalarında ilk dayanım kontrolü.","pitfalls":["Çapı yarıçap sanmak veya dairesel alanda πd²/4 yerine πd kullanmak.","kN değerini N’ye çevirmemek.","N/mm² ile MPa eşitliğini karıştırmak.","Ortalama gerilmeyi her noktadaki gerçek gerilme gibi yorumlamak."],"checkq":"40 kN kuvvet 500 mm² alana düzgün dağılıyorsa ortalama normal gerilme kaç MPa olur?","checka":"40.000/500=80 N/mm²=80 MPa."},"muk1_2":{"objective":"Birim şekil değiştirmeyi ve doğrusal elastik bölgede Hooke kanununu kullanarak uzama ile gerilme arasındaki ilişkiyi kurmak.","prerequisites":"İlk boy, boy değişimi, normal gerilme ve elastisite modülü.","explanation":"Birim şekil değiştirme ε, boydaki değişimin başlangıç boyuna oranıdır; boyutsuzdur. Uzama çekme, kısalma basınç yönündeki deformasyondur. Doğrusal elastik bölgede gerilme ile birim şekil değiştirme orantılıdır: σ=Eε. E elastisite modülüdür ve malzemenin rijitliğini gösterir; E büyükse aynı gerilme altında daha küçük elastik şekil değiştirme oluşur. Bu ilişki akma sınırının aşılmadığı doğrusal elastik aralıkta kullanılmalıdır.","eq_title":"Birim şekil değiştirme ve Hooke kanunu","eq":"ε=ΔL/L₀;  σ=Eε","eq_note":"ε boyutsuzdur. E ve σ aynı gerilme biriminde yazılmalıdır; örneğin E=200 GPa=200.000 MPa.","example_title":"Çelik çubukta elastik şekil değiştirme","example":"İlk boyu 1.500 mm olan çubuk 0,75 mm uzuyor. ε=0,75/1.500=0,0005. E=200.000 MPa ise σ=200.000×0,0005=100 MPa. Malzemenin elastik sınırı bu değerin üzerindeyse Hooke yaklaşımı uygundur.","steps":["ΔL ve L₀ değerlerini aynı uzunluk birimine getir.","ε=ΔL/L₀ ile birim şekil değiştirmeyi bul.","Doğrusal elastik davranış varsayımının geçerli olup olmadığını kontrol et.","σ=Eε bağıntısında E ile σ birimlerini eşleştir.","Sonucun büyüklüğünü malzemenin beklenen davranışıyla karşılaştır."],"engineering":"Çekme deneylerinin yorumlanması, servis yükleri altında çubuk uzaması, sehim ve deformasyon hesabının temelini oluşturur.","pitfalls":["0,0005 değerini yüzde olarak yanlış yazmak: %0,05’tir.","GPa ile MPa’yı dönüştürmeden çarpmak.","Plastik bölgede de σ=Eε bağıntısının doğrusal biçimde geçerli olduğunu varsaymak."],"checkq":"ε=0,001 ve E=210 GPa ise elastik gerilme kaç MPa olur?","checka":"210 GPa=210.000 MPa; σ=210.000×0,001=210 MPa."},"muk1_3":{"objective":"Gerilme–şekil değiştirme eğrisinden rijitlik, akma, dayanım ve süneklik kavramlarını okuyabilmek.","prerequisites":"Normal gerilme, birim şekil değiştirme ve çekme deneyi.","explanation":"Çekme deneyinde numuneye kontrollü eksenel kuvvet uygulanır; kuvvet ve uzama ölçülerek mühendislik gerilmesi–şekil değiştirmesi eğrisi çizilir. Eğrinin ilk doğrusal kısmının eğimi elastisite modülüdür. Bu bölgeden boşaltma yapılırsa şekil büyük ölçüde geri döner. Akma başladıktan sonra kalıcı deformasyon oluşur. Pekleşme ile gerilme tekrar artabilir; maksimum mühendislik gerilmesi çekme dayanımıdır. Boyun verme sonrası mühendislik gerilmesi düşebilir ve numune kopar. Sünek malzeme belirgin plastik uzama gösterir; gevrek malzeme çok az plastik deformasyonla kırılır.","eq_title":"Elastisite modülü ve mühendislik gerilmesi","eq":"σ=P/A₀;  ε=ΔL/L₀;  E=Δσ/Δε (doğrusal elastik bölgede)","eq_note":"Mühendislik gerilmesi ilk kesit alanı A₀ ile hesaplanır. Gerçek gerilme anlık kesit alanını kullanır.","example_title":"Çekme deneyinden elastisite modülü","example":"Doğrusal bölgede iki nokta arasında gerilme 50 MPa’dan 150 MPa’ya, birim şekil değiştirme 0,00025’ten 0,00075’e çıkıyor. Eğim E=(150−50)/(0,00075−0,00025)=100/0,0005=200.000 MPa=200 GPa.","steps":["Deney numunesinin ilk ölçü boyunu ve kesitini kaydet.","Her yük adımında σ=P/A₀ ve ε=ΔL/L₀ değerlerini hesapla.","σ–ε grafiğinde doğrusal elastik bölgeyi belirle.","Akma, maksimum çekme gerilmesi ve kopma noktalarını işaretle.","Süneklik ve gevreklik hakkında eğrinin şekline dayanarak yorum yap."],"engineering":"Çelik sınıfı seçimi, malzeme kabul deneyleri, süneklik gerektiren deprem tasarımı ve hasar değerlendirmesi.","pitfalls":["Grafik eksenlerinin birimlerini yazmamak.","Elastisite modülünü grafiğin herhangi bir bölgesinin eğimi sanmak.","Akma dayanımı ile çekme dayanımını aynı değer kabul etmek.","Mühendislik ve gerçek gerilmeyi ayırt etmemek."],"checkq":"Elastisite modülü grafikte hangi bölgeden elde edilir?","checka":"σ–ε eğrisinin başlangıçtaki doğrusal elastik bölgesinin eğiminden elde edilir."},"muk1_4":{"objective":"Eksenel kuvvet altındaki prizmatik çubuğun uzama veya kısalmasını hesaplamak; değişken kesit ve yük durumlarını tanımak.","prerequisites":"Normal gerilme, Hooke kanunu, elastisite modülü ve iç kuvvet diyagramı.","explanation":"Eksenel deformasyon, elemanın yük doğrultusundaki boy değişimidir. Sabit N, A ve E için uzama ΔL=NL/(AE) olur. Bağıntı σ=N/A ve ε=σ/E ile ε=ΔL/L’nin birleştirilmesinden elde edilir. Kuvvet, kesit veya malzeme boyunca değişiyorsa eleman parçalara ayrılır ve her parça için ΔLᵢ=NᵢLᵢ/(AᵢEᵢ) hesaplanıp cebirsel olarak toplanır. Çekme uzaması pozitif, kısalma seçilen işaret kuralına göre negatif alınır.","eq_title":"Eksenel uzama","eq":"ΔL = NL/(AE)","eq_note":"N: N, L: mm, A: mm², E: N/mm² kullanılırsa ΔL mm çıkar. Yalnız doğrusal elastik ve eksenel yük varsayımları için.","example_title":"Prizmatik çubuk uzaması","example":"N=50 kN, L=2.000 mm, A=500 mm², E=200.000 MPa. ΔL=(50.000×2.000)/(500×200.000)=1,00 mm.","steps":["Çubuk boyunca eksenel kuvvetin sabit olup olmadığını incele.","Her parça için L, A, E ve N değerlerini belirle.","Bütün birimleri N–mm–MPa sistemine getir.","Her parça için ΔLᵢ= NᵢLᵢ/(AᵢEᵢ) hesapla.","Toplam boy değişimini işaretleriyle topla; gerekiyorsa sınır koşullarını kontrol et."],"engineering":"Askı çubukları, ankrajlar, gergi elemanları, sıcaklık etkisi ve kompozit çubukların deformasyon analizi.","pitfalls":["Uzunluğu metre, alanı mm² bırakıp sonucu yanlış birimde bulmak.","Birden fazla parçalı çubukta kuvvet veya malzeme değişimini göz ardı etmek.","Basınç kısalmasını uzama gibi pozitif yorumlamak."],"checkq":"50 kN, 2.000 mm, 500 mm² ve 200.000 MPa için uzama kaç mm’dir?","checka":"1,00 mm."},"muk1_5":{"objective":"Statikçe belirsiz eksenel sistemlerde dengeye ek olarak deformasyon uyumluluğu denklemlerini kurmak.","prerequisites":"Denge denklemleri, eksenel deformasyon bağıntısı ve mesnet hareketi.","explanation":"Bir sistemde bilinmeyen tepki veya iç kuvvet sayısı bağımsız denge denklemlerinden fazlaysa sistem statikçe belirsizdir. Yalnız ΣF=0 yeterli olmaz. Malzemenin elastik deformasyon ilişkisi ve geometrik uyumluluk koşulu kullanılır. Örneğin iki ucu sabit bir çubukta toplam boy değişimi sıfırdır; sıcaklık artışı varsa serbest ısıl uzama ile mekanik kuvvetin oluşturduğu deformasyon birlikte ele alınır. Çözümün omurgası denge + uyumluluk + malzeme bağıntısıdır.","eq_title":"Denge ve uyumluluk","eq":"ΣF=0  +  Σ(ΔLᵢ)=ΔL_geometrik","eq_note":"Sabit mesnetler arası toplam boy değişimi sıfır olabilir; hareketli mesnet veya boşluk varsa geometrik koşul ona göre yazılır.","example_title":"İki parçalı sabit çubukta çözüm fikri","example":"Birbirine seri bağlı iki elastik parça, iki rijit duvar arasındadır. Dış kuvvet yok ve duvar aralığı değişmiyorsa iç kuvvet parçaların ikisinde de aynı eksenel kuvvettir. Uyum koşulu ΔL₁+ΔL₂=0 olur. Her parçanın ΔLᵢ=N Lᵢ/(AᵢEᵢ) ifadesi yazılır; sıcaklık etkisi varsa αΔT L terimi de eklenir. Bu koşul ve denge birlikte bilinmeyen kuvveti belirler.","steps":["Bilinmeyen tepki ve iç kuvvetleri say; denge denklemlerinin yeterli olup olmadığını kontrol et.","Sistemin deforme olmuş geometrisini çiz ve mesnetlerin izin verdiği hareketleri belirle.","Her parçanın mekanik deformasyonunu NL/(AE) ile yaz.","Isıl etki verilmişse serbest ısıl deformasyonu αΔT L olarak ekle.","Uyumluluk koşulunu denge denklemiyle birlikte çöz."],"engineering":"Birden fazla malzemeden oluşan çubuklar, ankastre elemanlar, montaj boşlukları ve sıcaklık etkisindeki taşıyıcı sistemler.","pitfalls":["Statik belirsiz sistemi yalnız dengeyle çözmeye çalışmak.","Uyumluluk koşulunu işaretleriyle yazmamak.","Serbest ısıl uzamayı kısıtlı sistemdeki gerçek uzama ile karıştırmak."],"checkq":"Statikçe belirsiz eksenel sistemin çözümünde dengeye ek olarak hangi iki bilgi gerekir?","checka":"Geometrik deformasyon uyumluluğu ve malzemenin kuvvet–deformasyon bağıntısı gerekir."},"muk1_6":{"objective":"Dairesel millerde torktan doğan kayma gerilmesini ve burulma açısını hesaplamak.","prerequisites":"Tork, moment kolu, dairesel kesit ve kayma gerilmesi kavramı.","explanation":"Burulma, elemanın boyuna ekseni etrafında döndürülmeye zorlanmasıdır. Dairesel milde iç tork kesitte kayma gerilmesi oluşturur. Elastik burulmada kayma gerilmesi merkezde sıfır, dış yüzeyde maksimumdur; yarıçapla doğrusal değişir. Polar atalet momenti J kesitin burulmaya geometrik direncini temsil eder. Dolu daire için J=πd⁴/32, içi boş daire için J=π(D⁴−d⁴)/32 kullanılır.","eq_title":"Dairesel milde burulma","eq":"τ = T r / J;  θ = TL/(JG)","eq_note":"T: N·mm, r: mm, J: mm⁴, G: MPa; θ radyan cinsindendir. G kayma modülüdür.","example_title":"Dolu milde maksimum kayma gerilmesi","example":"T=12 kN·m=12×10⁶ N·mm, d=80 mm. r=40 mm ve J=π×80⁴/32=4,021×10⁶ mm⁴. τmaks=T r/J≈119,4 MPa.","steps":["Milin dolu mu içi boş mu olduğunu belirle.","Torku N·mm, çap ve yarıçapı mm olarak yaz.","Uygun polar atalet momenti J bağıntısını seç.","Maksimum gerilme için dış yarıçapı kullan.","Gerekirse θ=TL/(JG) ile burulma açısını ayrıca bul."],"engineering":"Motor milleri, redüktörler, tahrik şaftları, vinç tambur milleri ve dönen makine elemanları.","pitfalls":["Burulma hesabında düzlemsel atalet momenti I kullanmak; J kullanılmalıdır.","Çap yerine yarıçapı J formülüne koymak.","kN·m değerini N·mm’ye dönüştürmemek.","Maksimum gerilmenin dış yüzeyde oluştuğunu unutmak."],"checkq":"Dolu dairesel milde maksimum burulma kayma gerilmesi hangi yarıçapta oluşur?","checka":"En dış lifte, r=d/2 konumunda oluşur."},"muk1_7":{"objective":"Kirişlerde kesme kuvveti V ve eğilme momenti M diyagramlarını denge ve yayılı yük ilişkisiyle oluşturmak.","prerequisites":"Mesnet tepkileri, kesit yöntemi ve moment hesabı.","explanation":"Kiriş yükleri kesitte kesme kuvveti ve eğilme momenti doğurur. Önce tüm kirişin mesnet tepkileri bulunur; sonra kiriş yükleme değişim noktalarına göre aralıklara ayrılır. Yayılı yük şiddeti w ile kesme kuvveti, kesme kuvveti ile moment arasında diferansiyel ilişki vardır. Yaygın işaret kuralında dV/dx=−w ve dM/dx=V kullanılır; dersin benimsediği konvansiyon değişirse işaretler de değişebilir. Tekil kuvvet V diyagramında sıçrama, tekil moment M diyagramında sıçrama oluşturur.","eq_title":"Kesme–moment ilişkisi","eq":"dV/dx = −w(x);  dM/dx = V(x)","eq_note":"İşaret kuralını baştan seç ve tüm diyagramlarda aynı kullan. V=0 olduğu yerde M yerel ekstremum yapabilir.","example_title":"Ortadan tekil yük taşıyan basit kiriş","example":"L=4 m açıklıklı basit kirişin ortasında P=20 kN tekil yük olsun. Simetri nedeniyle iki mesnet tepkisi 10’ar kN’dur. Sol yarıda kesme +10 kN, yükten sonra −10 kN olur. Orta kesitte moment Mmax=10×2=20 kN·m=PL/4.","steps":["Kirişin yüklerini, açıklığını ve mesnetlerini çiz.","ΣM=0 ile uygun mesnet tepkisini, ardından ΣFy=0 ile diğer tepkiyi bul.","Yük değişim noktalarını belirle ve her aralık için kesit al.","V(x) fonksiyonunu, ardından M(x) fonksiyonunu yaz.","Diyagramın uç değerlerini ve alan/işaret tutarlılığını kontrol et."],"engineering":"Döşeme ve kiriş yük aktarımı, köprü kirişleri, ray-kiriş benzeri sürekli taşıyıcılar ve kesit tasarımı.","pitfalls":["Yayılı yükün toplamını wL yerine yanlışlıkla w/L almak.","Yükün uygulama noktasını moment hesabında yanlış mesafeyle kullanmak.","Tekil kuvvetin V diyagramında, tekil momentin M diyagramında sıçrama oluşturduğunu unutmak."],"checkq":"Kesme kuvveti V=0 olan bir kesitte moment hakkında ne söylenebilir?","checka":"Momentin türevi sıfırdır; uygun koşullarda M yerel maksimum veya minimum değer alabilir."},"muk1_8":{"objective":"Eğilme momenti altındaki kirişte normal gerilmenin kesit boyunca dağılımını ve maksimum değerini hesaplamak.","prerequisites":"Kesme–moment diyagramı, nötr eksen, alan atalet momenti ve elastik malzeme davranışı.","explanation":"Elastik eğilmede kirişin bir tarafındaki lifler uzar, diğer tarafındakiler kısalır. Arada boyu değişmeyen nötr eksen bulunur. Basit eğilme varsayımları altında normal gerilme nötr eksenden uzaklıkla doğrusal değişir. Maksimum büyüklük en dış lifte meydana gelir. Kesit geometrisinin eğilme direnci alan atalet momenti I ile ifade edilir. Aynı moment altında I büyüdükçe eğilme gerilmesi azalır.","eq_title":"Elastik eğilme gerilmesi","eq":"σ = M y / I;  σmaks = M c / I","eq_note":"M: N·mm, y ve c: mm, I: mm⁴; sonuç MPa olur. Nötr eksen için y=0 olduğundan eğilme gerilmesi sıfırdır.","example_title":"Dikdörtgen kesitli kiriş","example":"b=100 mm, h=200 mm ve M=10 kN·m=10×10⁶ N·mm. I=bh³/12=100×200³/12=66,67×10⁶ mm⁴. c=100 mm. σmaks=10×10⁶×100/(66,67×10⁶)=15 MPa.","steps":["Moment diyagramından incelenen kesitte M değerini bul.","Kesitin nötr eksenini ve en uzak lif mesafesi c’yi belirle.","Kesit şekline uygun I değerini hesapla.","σ=My/I bağıntısında birimleri N–mm sistemine getir.","Üst ve alt lifte çekme/basınç işaretini eğilme yönüne göre yorumla."],"engineering":"Kiriş yüksekliği ve kesit biçiminin seçilmesi, döşeme/kiriş dayanım kontrolleri ve çelik profillerin değerlendirilmesi.","pitfalls":["I yerine kesit alanı A kullanmak.","M değerini kN·m bırakıp mm tabanlı I ile işlem yapmak.","Nötr eksen uzaklığı yerine toplam kesit yüksekliğini y olarak almak.","Çekme ve basınç tarafını moment yönüne göre kontrol etmemek."],"checkq":"Nötr eksende elastik eğilmeden kaynaklanan normal gerilme kaçtır?","checka":"y=0 olduğundan σ=0’dır."},"akiskan_0":{"objective":"Akışkanın katıdan farkını, akışkan modelinin kabullerini ve mühendislikte kullanılan temel özellikleri anlamak.","prerequisites":"Kuvvet, alan, kütle, hacim ve basit fiziksel büyüklükler.","explanation":"Akışkan, üzerine uygulanan kayma gerilmesi altında sürekli şekil değiştiren maddedir. Sıvıların belirli hacmi vardır ve bulundukları kabın şeklini alırlar; gazlar hem şekil hem hacim bakımından kabı doldurur. Makroskopik akış analizlerinde moleküller tek tek izlenmez; akışkan, özellikleri uzay ve zamanda sürekli değişen bir ortam gibi modellenir (süreklilik/continuum yaklaşımı). Durgun akışkanda kayma gerilmesi bulunmaz; basınç her yönde etkiyen normal gerilme niteliğindedir.","eq_title":"Akışkan modelinin temel tanımları","eq":"ρ=m/V;  p=F/A","eq_note":"Yoğunluk kg/m³, basınç Pa birimindedir. Süreklilik yaklaşımı, incelenen ölçeğin moleküler aralıklardan çok büyük olduğu mühendislik koşullarında kullanılır.","example_title":"Sıvı ve gaz ayrımı","example":"1 litre su yaklaşık 1 kg kütleye sahiptir ve neredeyse sabit hacimlidir. Aynı hacimde hava çok daha küçük kütle taşır ve basınç/sıcaklık değişimiyle yoğunluğu belirgin değişebilir. Bu nedenle su akımlarında çoğu kez sıkıştırılamaz yaklaşımı, gaz akımlarında ise sıkıştırılabilirlik kontrolü gerekir.","steps":["İncelenen maddenin sıvı mı gaz mı olduğunu belirle.","Akımın hızı, basınç farkı ve sıcaklık ölçeğine göre sıkıştırılabilirlik etkisini değerlendir.","Akışkanın durgun mu hareketli mi olduğunu belirle.","Uygun model kabullerini problem çözümünün başında açıkça yaz."],"engineering":"Su depoları, borular, pompa sistemleri, hidrolik makineler ve atmosferik akışların fiziksel modellemesi.","pitfalls":["Akışkanı katı cisim gibi sabit şekilli kabul etmek.","Gazları her durumda sıkıştırılamaz varsaymak.","Model kabullerini belirtmeden denklem kullanmak."],"checkq":"Akışkanı katıdan ayıran temel davranış nedir?","checka":"Akışkan, kayma gerilmesi etkisinde sürekli şekil değiştirir ve akmaya devam eder."},"akiskan_1":{"objective":"Yoğunluk, özgül ağırlık, özgül hacim, viskozite ve yüzey geriliminin fiziksel anlamını ve birimlerini ayırt etmek.","prerequisites":"Kütle, hacim, ağırlık, kuvvet ve temel SI birimleri.","explanation":"Yoğunluk ρ=m/V olup birim hacimdeki kütledir. Özgül ağırlık γ=ρg birim hacim ağırlığını, özgül hacim v=1/ρ ise birim kütle başına hacmi verir. Bağıl yoğunluk, akışkan yoğunluğunun referans yoğunluğa oranıdır ve boyutsuzdur. Viskozite akışkanın kaymaya/deformasyona karşı iç direncini gösterir: dinamik viskozite μ, kinematik viskozite ν=μ/ρ. Sıvılarda sıcaklık arttıkça çoğunlukla viskozite düşer; gazlarda eğilim genellikle ters yöndedir. Yüzey gerilimi serbest yüzeyde birim uzunluk başına kuvvet olarak tanımlanır.","eq_title":"Akışkan özellikleri","eq":"ρ=m/V;  γ=ρg;  v=1/ρ;  ν=μ/ρ","eq_note":"ρ: kg/m³, γ: N/m³, μ: Pa·s, ν: m²/s. Suyun yoğunluğu oda sıcaklığı çevresinde yaklaşık 1000 kg/m³ alınabilir; hassas hesapta sıcaklığa bağlı tablo kullanılır.","example_title":"Yoğunluk ve özgül ağırlık","example":"Kütlesi 2 kg, hacmi 0,002 m³ olan sıvının yoğunluğu ρ=2/0,002=1000 kg/m³. g=9,81 m/s² alınırsa özgül ağırlığı γ=1000×9,81=9810 N/m³=9,81 kN/m³.","steps":["Soruda verilen kütle ve hacimden yoğunluğu bul.","Özgül ağırlık isteniyorsa yoğunluğu g ile çarp.","Dinamik ve kinematik viskoziteyi karıştırma; ν için μ/ρ kullan.","Sıcaklık verildiyse özellik değerlerini o sıcaklığa uygun tablodan seç."],"engineering":"Boru sürtünme kayıpları, Reynolds sayısı, pompa gücü, yağlama ve küçük çaplı borularda kılcallık davranışı.","pitfalls":["Yoğunluk ile özgül ağırlığın birimlerini karıştırmak.","ν=μ/ρ yerine μρ kullanmak.","Viskozitenin sıcaklığa bağlı olduğunu göz ardı etmek."],"checkq":"Dinamik viskozitesi μ ve yoğunluğu ρ bilinen akışkanın kinematik viskozitesi nasıl bulunur?","checka":"ν=μ/ρ bağıntısıyla bulunur; birimi m²/s’dir."},"akiskan_2":{"objective":"Basınç, mutlak basınç, gösterge basıncı ve vakum basıncını birbirinden ayırmak; manometre okumalarını yorumlamak.","prerequisites":"Kuvvet/alan, atmosfer basıncı ve yoğunluk.","explanation":"Basınç, yüzeye dik etkiyen kuvvetin alana oranıdır. Durgun akışkanda belirli bir noktadaki basınç tüm yönlerde aynı büyüklükte etkir. Mutlak basınç sıfır referansını mutlak vakumdan alır; gösterge basıncı atmosfer basıncına göre ölçülür. Bu nedenle p_mutlak=p_atm+p_gösterge. Atmosferden düşük bir basınç için gösterge basıncı negatif çıkar ve vakum derecesi olarak ifade edilebilir. Basınç ölçümünde referansın ne olduğu her zaman belirtilmelidir.","eq_title":"Basınç ve referans","eq":"p=F/A;  p_abs=p_atm+p_gauge","eq_note":"1 Pa=1 N/m²; 1 kPa=1000 Pa. Deniz seviyesine yakın standart atmosfer basıncı yaklaşık 101,3 kPa’dır; yerel atmosfer basıncı değişebilir.","example_title":"Mutlak basınç dönüşümü","example":"Bir kapta gösterge basıncı 100 kPa ölçülsün. Atmosfer basıncı 101,3 kPa alınırsa mutlak basınç p_abs=100+101,3=201,3 kPa olur.","steps":["Basınç değerinin mutlak mı gösterge mi olduğunu sorudan belirle.","Gösterge basıncı atmosfer üstündeyse pozitif, altındaysa negatif olabilir.","Mutlak basınca geçerken yerel atmosfer basıncını ekle.","Manometrede her akışkan sütunu için ρgh basınç değişimini yönüne göre yaz."],"engineering":"Depo basıncı, pompa emişi, boru hatları, basınçlı kaplar, manometre ve piezometre ölçümleri.","pitfalls":["Gösterge basıncını mutlak basınç sanmak.","Atmosfer basıncını yanlış işaretle eklemek/çıkarmak.","Manometrede farklı sıvıların yoğunluklarını tek yoğunluk gibi almak."],"checkq":"Gösterge basıncı 0 kPa ise mutlak basınç yaklaşık kaçtır?","checka":"Atmosfer basıncına eşittir; standart yaklaşımla yaklaşık 101,3 kPa."},"akiskan_3":{"objective":"Durgun sıvıda basıncın derinlikle değişimini, basınç dağılımını ve piezometrik kavramı açıklamak.","prerequisites":"Yoğunluk, özgül ağırlık, yerçekimi ve basınç.","explanation":"Durgun ve homojen bir sıvıda basınç derinlikle doğrusal artar. Serbest yüzeyde gösterge basıncı sıfır kabul edilirse derinliği h olan noktada p=ρgh olur. Aynı sıvı içinde aynı yatay düzlemdeki noktaların basıncı eşittir; kabın şekli basıncın yalnızca derinliğe bağlı olmasını değiştirmez. Basınç diyagramı dikey düzlemde üçgensel dağılım gösterir. Piezometrik yükseklik basınç yüksekliği p/γ ile kot yüksekliğinin toplamıdır.","eq_title":"Hidrostatik basınç","eq":"p = ρ g h = γ h","eq_note":"h serbest yüzeyden düşey derinliktir. p göstergedir ve Pa/kPa; γ kN/m³, h m ise p kN/m²=kPa çıkar.","example_title":"Depo tabanındaki basınç","example":"Su derinliği 3 m, ρ=1000 kg/m³ ve g=9,81 m/s². Taban basıncı p=1000×9,81×3=29.430 Pa=29,43 kPa gösterge basıncıdır.","steps":["Serbest yüzeyi referans al ve düşey derinliği belirle.","Akışkanın yoğunluğu veya özgül ağırlığını seç.","p=ρgh bağıntısını uygula.","Mutlak basınç isteniyorsa atmosfer basıncını ayrıca ekle.","Farklı derinliklerde basınç diyagramını doğrusal olarak çiz."],"engineering":"Baraj gövdesi, depo duvarı, dalgıç ekipmanı, boru girişleri ve basınç ölçüm noktaları.","pitfalls":["Derinlik yerine eğik uzunluk kullanmak.","Kabın genişliği değiştikçe aynı derinlikte basıncın da değişeceğini sanmak.","Basınç (Pa) ile bileşke kuvveti (N) birbirine karıştırmak."],"checkq":"Aynı sıvı içinde aynı yatay düzlemdeki iki noktada basınç nasıldır?","checka":"Durgun ve bağlantılı aynı sıvıda eşittir."},"akiskan_4":{"objective":"Düzlemsel yüzeylerde hidrostatik bileşke kuvvetin büyüklüğünü ve etkime noktasını; kaldırma kuvvetini açıklamak.","prerequisites":"Hidrostatik basınç dağılımı, alan, ağırlık ve hacim.","explanation":"Batık düzlemsel bir yüzeyde basınç derinlikle değişir. Bileşke hidrostatik kuvvet F=ρg h̄ A olup h̄ yüzey ağırlık merkezinin serbest yüzeyden düşey derinliğidir. Kuvvet yüzeye dik etkir; etkime noktası basınç merkezidir ve genellikle alan ağırlık merkezinden daha derindedir. Bir cisme etkiyen kaldırma kuvveti, cismin yer değiştirdiği akışkanın ağırlığına eşittir. Tam batmış cisimde yer değiştiren hacim cismin hacmine, kısmen batmış cisimde su altında kalan hacme eşittir.","eq_title":"Hidrostatik kuvvet ve Arşimet ilkesi","eq":"F = ρ g h̄ A;  F_B = ρ g V_yer değiştiren","eq_note":"F N, ρ kg/m³, h̄ m, A m²; kaldırma kuvveti N. Basınç merkezinin hesabında alanın ikinci momenti de gerekir.","example_title":"Kaldırma kuvveti","example":"Suda 1,0 m³ hacim yer değiştiren cisim için F_B=1000×9,81×1=9810 N=9,81 kN. Cismin ağırlığı 8 kN ise ideal statik durumda net düşey kuvvet 1,81 kN yukarı yönlüdür.","steps":["Yüzeyin su altında kalan geometrisini ve ağırlık merkezinin derinliğini belirle.","Düzlemsel yüzey kuvveti için F=ρg h̄ A kullan.","Etkime noktasını ayrıca gerekiyorsa alanın ikinci momentiyle hesapla.","Kaldırma için yer değiştiren sıvı hacmini belirle.","Kaldırma kuvveti ile cismin ağırlığını karşılaştırarak yüzme/batma eğilimini yorumla."],"engineering":"Baraj kapakları, su depoları, dalgıç ve yüzer platformlar, boru içindeki dirsek/ek parçaların hidrolik kuvvetleri.","pitfalls":["Basınç merkezini alan ağırlık merkeziyle aynı kabul etmek.","Kaldırma kuvvetinde cismin toplam hacmini, kısmen batmışken kullanmak.","Kuvvet ile basıncı birim kontrolü yapmadan eşitlemek."],"checkq":"Kaldırma kuvveti hangi akışkan ağırlığına eşittir?","checka":"Cismin yer değiştirdiği akışkanın ağırlığına eşittir."},"akiskan_5":{"objective":"Akımın zaman, uzay, sıkıştırılabilirlik ve viskoz etkilere göre sınıflandırılmasını; akım çizgilerinin anlamını öğrenmek.","prerequisites":"Hız, basınç, yoğunluk ve zaman kavramları.","explanation":"Kararlı akımda bir noktadaki hız ve basınç gibi akım özellikleri zamanla değişmez; kararsız akımda değişir. Üniform akımda seçilen doğrultuda hız konuma göre değişmez; üniform olmayan akımda değişir. Laminer akımda akışkan tabakaları düzenli hareket eder; türbülanslı akımda hız dalgalanmaları ve karışım belirgindir. Sıkıştırılamaz akımda yoğunluk değişimi ihmal edilir. Akım çizgisi, her noktada hız vektörüne teğet eğridir; kararlı akımda akım çizgisi ve parçacık yolu çakışabilir.","eq_title":"Akım sınıflandırması","eq":"Kararlı: ∂()/∂t=0;  sıkıştırılamaz: ρ≈sabit","eq_note":"Akımın kararlı olması hızın sıfır olduğu anlamına gelmez; yalnızca belirli noktadaki özelliklerin zamanla değişmediği anlamına gelir.","example_title":"Kararlı ama üniform olmayan akım","example":"Sabit debiyle daralan bir borudan su akıyor olsun. Debi zaman boyunca değişmiyorsa akım kararlıdır. Boru daraldıkça kesit alanı azalır, ortalama hız artar; bu nedenle akım boru boyunca üniform değildir.","steps":["Sorunun zaman boyutunu değerlendir: özellikler zamanla değişiyor mu?","Akım doğrultusunda hızın konuma göre değişimini incele.","Yoğunluk değişimi önemliyse sıkıştırılabilir model gerekip gerekmediğine karar ver.","Reynolds sayısı yardımıyla laminer/türbülanslı davranışı değerlendir.","Akım çizgilerini hız alanına teğet olacak şekilde yorumla."],"engineering":"Boru ve kanal tasarımı, akım ölçümü, model deneyleri, hidrolik kayıplar ve sayısal akış analizleri.","pitfalls":["Kararlı akımı hareketsiz akımla karıştırmak.","Üniform akımı düzgün (laminer) akımla aynı sanmak.","Akım çizgisinin akışkanın gerçek yolunu her koşulda verdiğini düşünmek."],"checkq":"Sabit debili fakat çapı daralan boruda akım kararlı ve üniform mudur?","checka":"Zamanla değişmiyorsa kararlıdır; çap değiştiği için hız konuma göre değişir ve üniform değildir."},"akiskan_6":{"objective":"Debi, ortalama hız ve kesit alanı arasındaki süreklilik ilişkisini kurmak ve kesit değişiminde hızı bulmak.","prerequisites":"Kesit alanı, hız, hacim ve kütlenin korunumu.","explanation":"Süreklilik denklemi kütlenin korunumu ilkesidir. Kontrol hacmine giren ve çıkan kütle debileri arasındaki fark, kontrol hacmindeki kütle birikimine eşittir. Kararlı, sıkıştırılamaz ve tek giriş-tek çıkışlı akımda Q=A V sabittir; dolayısıyla A₁V₁=A₂V₂. Kesit daralınca hız yükselir, genişleyince azalır. Birden fazla giriş/çıkışta debiler cebirsel olarak toplanır.","eq_title":"Hacimsel debi ve süreklilik","eq":"Q = A V;  A₁V₁=A₂V₂ (kararlı, sıkıştırılamaz tek akım)","eq_note":"Q: m³/s, A: m², V: m/s. Dairesel boru A=πD²/4.","example_title":"Boru daralmasında hız","example":"İlk kesit alanı 0,020 m² ve ortalama hız 2 m/s ise Q=0,020×2=0,040 m³/s. İkinci kesit alanı 0,010 m² ise V₂=Q/A₂=0,040/0,010=4 m/s.","steps":["Akım kararlı ve yoğunluk yaklaşık sabit mi kontrol et.","Kesit alanını gerçek geometriye göre hesapla.","Önce Q=A V ile debiyi bul veya bilinen debiyi kullan.","A₁V₁=A₂V₂ denkleminden bilinmeyeni çöz.","Sonucu süreklilik açısından kontrol et: dar kesitte hız artmalı."],"engineering":"Su şebekeleri, nozul, venturi, pompa emiş hattı, menfez ve debimetre tasarımı.","pitfalls":["Çapı iki katına çıkarınca alanın iki değil dört kat olduğunu unutmak.","Debi ile hızın aynı büyüklük olduğunu sanmak.","Sıkıştırılabilir gaz akımında yoğunluk değişimini yok saymak."],"checkq":"Kesit alanı yarıya düşerse debi sabitken ortalama hız ne olur?","checka":"İki katına çıkar."},"akiskan_7":{"objective":"Bernoulli denkleminin fiziksel anlamını, enerji terimlerini, geçerlilik koşullarını ve gerçek sistemlere genişletilmesini kavramak.","prerequisites":"Basınç, hız, kot, debi ve enerji korunumu.","explanation":"Bernoulli denklemi, uygun kabuller altında akım çizgisi boyunca birim ağırlık başına mekanik enerjinin korunmasını ifade eder. p/γ basınç yüksekliği, V²/(2g) hız yüksekliği, z kot yüksekliğidir. Toplamları hidrolik yükü verir. Denklem kararlı akım, yaklaşık sıkıştırılamaz akışkan ve viskoz kayıpların ihmal edildiği akım için doğrudan uygulanır. Gerçek boruda sürtünme ve yerel kayıplar vardır; pompa enerji ekleyebilir, türbin enerji çekebilir. Bu durumda genişletilmiş enerji denklemi kullanılır.","eq_title":"Bernoulli ve genişletilmiş enerji denklemi","eq":"p₁/γ+V₁²/(2g)+z₁+h_p = p₂/γ+V₂²/(2g)+z₂+h_t+h_L","eq_note":"h_p pompa yükü, h_t türbin yükü, h_L toplam enerji kaybıdır. Aynı akımın iki kesiti arasında ve tutarlı referans düzleminde yazılır.","example_title":"Yatay kayıpsız daralma","example":"Yatay boruda su için V₁=2 m/s, V₂=4 m/s. Kayıp ve kot farkı yoksa p₁−p₂=½ρ(V₂²−V₁²)=0,5×1000×(16−4)=6000 Pa=6 kPa. Hız arttığı kesitte statik basınç 6 kPa azalır.","steps":["Enerji denklemini yazacağın 1 ve 2 kesitlerini seç.","Her kesitte p/γ, V²/(2g) ve z değerlerini belirle.","Debi ve süreklilik ile bilinmeyen hızları bul.","Kayıp, pompa veya türbin varsa bunları doğru tarafa ekle.","Sonucun enerji yönü ve basınç değişimi bakımından fiziksel tutarlılığını kontrol et."],"engineering":"Venturi, nozullar, depodan boruya akış, pompa basma yüksekliği, su alma yapıları ve enerji çizgisi analizi.","pitfalls":["Bernoulli’yi kayıplı gerçek boruda kayıpsızmış gibi uygulamak.","Basınç yüksekliği p/γ ile basınç p’yi aynı birimde sanmak.","Hız yüksekliğinde V²/2g yerine V/2g yazmak.","Kot referansını iki kesitte farklı kullanmak."],"checkq":"Yatay, kayıpsız bir boruda hız artarsa statik basınç nasıl değişir?","checka":"Bernoulli toplam mekanik enerjiyi koruduğu için hız yüksekliği artarken statik basınç yüksekliği azalır."},"akiskan_8":{"objective":"Kontrol hacmi için doğrusal momentum denklemini kullanarak akışkanın dirsek, nozul ve vana üzerindeki kuvvetini çözmek.","prerequisites":"Vektörel hız, kütlesel debi, Newton’un ikinci kanunu ve serbest cisim diyagramı.","explanation":"Momentum denklemi Newton’un ikinci kanununun akışkana uygulanmış hâlidir. Kontrol hacmindeki momentum birikimi ile giriş-çıkış momentum akısı, dış kuvvetlerin bileşkesine eşittir. Kararlı, tek giriş-tek çıkışlı akımda ΣF=ṁ(V₂−V₁) yazılır. Hızlar vektör olduğu için yönleri bileşenlerine ayrılmalıdır. Akışkan üzerindeki kuvvet ile akışkanın boru/dirsek üzerine uyguladığı tepki kuvveti Newton’un üçüncü kanununa göre eşit ve zıt yönlüdür.","eq_title":"Doğrusal momentum","eq":"ΣF = ṁ(V₂−V₁);  ṁ=ρQ","eq_note":"ṁ kg/s, V m/s ise kuvvet N olur. Basınç kuvvetleri, ağırlık ve mesnet reaksiyonları kontrol hacminin serbest cisim diyagramında yer alır.","example_title":"Akış yönünde hız değişimi","example":"Su debisi Q=0,020 m³/s, yoğunluk 1000 kg/m³; hız aynı doğrultuda 2 m/s’den 4 m/s’ye yükseliyor. ṁ=ρQ=20 kg/s. Akışkanı hızlandırmak için akış yönünde net kuvvet 20×(4−2)=40 N olmalıdır. Borunun akışkana uyguladığı kuvvet 40 N ileri; akışkanın boruya tepkisi 40 N geridir.","steps":["Dirsek/nozul ve kontrol hacmini açıkça çiz.","Giriş ve çıkış hızlarını x-y bileşenlerine ayır.","Kütlesel debiyi ṁ=ρQ ile hesapla.","Her eksende ΣF=ṁ(V₂−V₁) yaz; basınç ve ağırlık etkilerini ekle.","Bulunan akışkan kuvvetinin ters yönünü yapı üzerindeki tepki kuvveti olarak yorumla."],"engineering":"Boru dirseklerinin ankrajı, nozul reaksiyon kuvveti, yangın hortumu, savak ve jet etkisi hesapları.","pitfalls":["Hızın yalnız büyüklüğünü kullanıp yönünü ihmal etmek.","Akışkan üzerindeki kuvvet ile boru üzerindeki tepki kuvvetini aynı yönde yazmak.","Basınç kuvvetlerini kontrol hacmine eklememek."],"checkq":"Akışkanın boruya uyguladığı kuvvet, borunun akışkana uyguladığı kuvvetle nasıl ilişkilidir?","checka":"Büyüklükleri eşit, yönleri zıttır."},"akiskan_9":{"objective":"Reynolds sayısının fiziksel anlamını kavramak ve boru akımını laminer, geçiş veya türbülanslı olarak sınıflandırmak.","prerequisites":"Yoğunluk, hız, boru çapı, dinamik/kinematik viskozite.","explanation":"Reynolds sayısı atalet etkilerinin viskoz etkilere oranını temsil eden boyutsuz sayıdır. Dairesel boruda Re=ρVD/μ=VD/ν. Küçük Re değerlerinde viskoz etkiler baskın olup akım düzenli laminer davranır; büyük Re değerlerinde atalet etkileri baskınlaşır ve türbülans gelişebilir. Dairesel boru için yaygın mühendislik ölçütlerinde Re<2300 laminer, 2300–4000 geçiş, Re>4000 türbülanslı kabul edilir; giriş koşulları ve pürüzlülük gibi etkenler gerçek sınırları etkileyebilir.","eq_title":"Reynolds sayısı","eq":"Re = ρ V D / μ = V D / ν","eq_note":"Boyutsuzdur. V m/s, D m, ν m²/s. Akım sınıflandırması kullanılan geometri ve koşullara bağlıdır.","example_title":"Dairesel boruda akım sınıfı","example":"Su için ν=1,0×10⁻⁶ m²/s, ortalama hız V=0,5 m/s ve çap D=0,020 m. Re=VD/ν=(0,5×0,020)/(1,0×10⁻⁶)=10.000. Bu değer yaygın boru ölçütüne göre türbülanslı akımdır.","steps":["Akışkanın sıcaklığına uygun viskoziteyi belirle.","Karakteristik uzunluğu seç; dairesel boruda çap D kullan.","V, D ve ν birimlerini SI sistemine getir.","Re=VD/ν hesapla.","Sonucu laminer/geçiş/türbülanslı olarak yorumla ve kabul aralığını belirt."],"engineering":"Darcy sürtünme katsayısı, boru kayıpları, pompa gücü ve laboratuvar akım deneylerinin yorumlanması.","pitfalls":["Hidrolik çap gereken geometrilerde yanlış uzunluğu kullanmak.","mm çapı metreye çevirmemek.","Reynolds sayısının birimli bir büyüklük olduğunu sanmak.","Geçiş bölgesini kesin ve her koşulda sabit sınırlar gibi yorumlamak."],"checkq":"Reynolds sayısı hangi iki fiziksel etkiyi karşılaştırır?","checka":"Atalet kuvvetlerinin viskoz kuvvetlere oranını temsil eder."},"malzeme_0":{"objective":"Malzemelerin atomik bağları ve iç yapılarının mühendislik özelliklerini nasıl belirlediğini açıklamak.","prerequisites":"Atom, elektron, bağ enerjisi, kuvvet ve deformasyon kavramları.","explanation":"Malzeme bilimi, bileşim–işleme–mikroyapı–özellik–performans zincirini inceler. Atomlar arası bağların türü elastik rijitlik, ergime sıcaklığı, elektrik/ısı iletkenliği ve sünekliği etkiler. Metalik bağ, serbest elektronlar nedeniyle iyi elektrik/ısı iletimi ve şekillendirilebilirlik sağlar. İyonik ve kovalent bağlar genellikle yüksek bağ enerjisi ve yüksek sertlik sağlayabilir; fakat dislokasyon hareketinin kısıtlılığı nedeniyle kırılganlık artabilir. Gerçek mühendislik malzemeleri çoğu zaman birden fazla bağ ve faz içerir.","eq_title":"Malzeme performans zinciri","eq":"Bileşim → İşleme → Mikroyapı → Özellik → Servis performansı","eq_note":"Aynı kimyasal bileşim, farklı ısıl işlem ve üretim koşullarıyla farklı mikroyapı ve özellik gösterebilir.","example_title":"Aynı çeliğin farklı işlemleri","example":"Aynı karbon oranına sahip bir çelik yavaş soğutulduğunda daha yumuşak ferrit–perlit yapısı; hızlı su verme sonrasında ise sert martenzitik yapı oluşturabilir. Bileşim aynı kalsa da soğuma yolu mikroyapıyı, dolayısıyla sertlik ve sünekliği değiştirir.","steps":["Malzemenin metal, seramik, polimer veya kompozit sınıfını belirle.","Bağ türünün hangi atomik hareketlere izin verdiğini incele.","Üretim/ısıl işlemin mikroyapıyı nasıl değiştireceğini düşün.","Mikroyapıdan sertlik, dayanım, süneklik ve dayanıklılık sonuçlarına geç."],"engineering":"Betonarme çeliği, çimento esaslı malzemeler, asfalt, yalıtım ve kompozit yapı ürünlerinin seçimi.","pitfalls":["Malzeme özelliğini yalnız kimyasal bileşimle açıklamak.","Mikroyapının üretim ve ısıl işleme bağlı olduğunu unutmak.","Sertlik, dayanım ve tokluğu aynı kavram saymak."],"checkq":"Malzeme biliminin temel ilişki zinciri nedir?","checka":"Bileşim, işleme, mikroyapı, özellik ve performans arasındaki ilişkidir."},"malzeme_1":{"objective":"Kristal kafesleri, birim hücreleri ve kristal kusurlarının malzeme davranışı üzerindeki etkisini anlamak.","prerequisites":"Atomik bağlar ve katıların düzenli yapısı.","explanation":"Kristal katılarda atomlar uzayda periyodik bir düzen oluşturur. Birim hücre, kristal yapının tekrar eden en küçük geometrik birimidir. Metallerde yaygın yapılar BCC (hacim merkezli kübik), FCC (yüzey merkezli kübik) ve HCP (sıkı paket hekzagonal) yapılarıdır. Gerçek kristaller kusursuz değildir: boşluk, arayer atomu, dislokasyon ve tane sınırı gibi kusurlar bulunur. Plastik şekil değiştirme büyük ölçüde dislokasyon hareketiyle gerçekleşir; dislokasyon hareketini zorlaştıran tane inceltme, katı çözelti ve soğuk şekillendirme dayanımı artırabilir.","eq_title":"Kristal yapı–kusur ilişkisi","eq":"Kusurlar → Dislokasyon hareketi → Plastik deformasyon ve dayanım","eq_note":"BCC/FCC/HCP yapılarının süneklik ve şekillendirilebilirlik davranışları farklıdır; tek başına kafes adı tüm performansı belirlemez.","example_title":"Tane boyutunun etkisi","example":"Bir metalin taneleri küçültüldüğünde tane sınırı yoğunluğu artar. Tane sınırları dislokasyon hareketine engel olur; birçok metalde bu durum akma dayanımını artırır. Bu ilişki Hall–Petch bağıntısıyla ifade edilir: σ_y=σ₀+k_y/√d.","steps":["Kristal yapının birim hücre modelini çiz.","BCC, FCC ve HCP kafeslerin atom yerleşimini ayırt et.","Boşluk, arayer, dislokasyon ve tane sınırı kusurlarını tanımla.","Dislokasyon hareketinin plastik deformasyonla bağlantısını kur.","Tane boyutu ve deformasyon geçmişinin dayanımı nasıl etkilediğini açıkla."],"engineering":"Çelik haddeleme, kaynak bölgesi, ısıl işlem ve metal bağlantı elemanlarının mekanik performansı.","pitfalls":["Kristal kusurunu her zaman zararlı sanmak; bazı kusurlar kontrollü şekilde dayanımı artırır.","Sertleşmenin yalnız kimyasal bileşimle olduğunu düşünmek.","Birim hücrede atom sayısını kafes türüyle karıştırmak."],"checkq":"Metallerde plastik şekil değiştirmeyi taşıyan temel kristal kusuru hangisidir?","checka":"Dislokasyonlardır."},"malzeme_2":{"objective":"Difüzyonun atomik mekanizmasını, sıcaklık ve derişim gradyanı etkisini açıklamak.","prerequisites":"Atomik yapı, sıcaklık, derişim ve zaman.","explanation":"Difüzyon atomların termal hareket nedeniyle bir bölgeden diğerine net taşınmasıdır. Net taşınım çoğu zaman yüksek derişimden düşük derişime doğrudur. Yer değiştirme boşluk mekanizması veya arayer difüzyonu ile gerçekleşebilir. Fick’in birinci kanunu kararlı koşulda difüzyon akısını derişim gradyanına bağlar. Difüzyon katsayısı sıcaklıkla Arrhenius tipi ilişki gösterir; sıcaklık arttıkça atomların hareketliliği ve difüzyon hızı genellikle artar.","eq_title":"Fick’in birinci kanunu","eq":"J = −D (dC/dx)","eq_note":"J difüzyon akısı, D difüzyon katsayısı, dC/dx derişim gradyanıdır. Eksi işareti net akışın yüksek derişimden düşük derişime yöneldiğini gösterir.","example_title":"Karbonun çelikte difüzyonu","example":"Yüzeyde karbon derişimi çekirdekten daha yüksek tutulursa, uygun sıcaklıkta karbon atomları çeliğin içine doğru yayılır. Sementasyonla yüzey karbon oranı ve sertliği artırılabilir; çekirdeğin daha tok kalması hedeflenebilir.","steps":["Derişim profilini ve difüzyon yönünü belirle.","Sabit akı varsayımı varsa Fick 1; zamana bağlı profil varsa Fick 2 gerektiğini ayırt et.","Sıcaklığın difüzyon katsayısına etkisini değerlendir.","İşlem süresi ve karakteristik derinliğin birlikte değiştiğini yorumla."],"engineering":"Çelik sementasyonu, kaynakta element geçişi, sinterleme, beton içinde klorür difüzyonu ve korozyon süreçleri.","pitfalls":["Eksi işaretinin fiziksel anlamını atlamak.","Difüzyonun yalnız sıvılarda gerçekleştiğini sanmak.","Sıcaklık artışının difüzyonu çoğu sistemde hızlandırdığını göz ardı etmek."],"checkq":"Difüzyon akısı hangi yöndeki derişim gradyanına doğrudur?","checka":"Yüksek derişimden düşük derişime doğru net taşınım vardır."},"malzeme_3":{"objective":"Faz diyagramında sıcaklık, bileşim ve faz bölgelerini okuyarak soğuma sırasında oluşabilecek fazları yorumlamak.","prerequisites":"Alaşım bileşimi, sıcaklık, katı/sıvı faz ve denge kavramı.","explanation":"Faz diyagramı, belirli basınç altında alaşım bileşimi ve sıcaklığa bağlı denge fazlarını gösterir. İkili diyagramda yatay eksen bileşimi, düşey eksen sıcaklığı gösterir. Liquidus eğrisinin üstünde sıvı, solidus eğrisinin altında katı faz; iki eğri arasında sıvı+katı karışımı bulunur. İki fazlı bölgede fazların bileşimleri bağ çizgisiyle, faz miktarları ise kaldıraç kuralıyla bulunabilir. Diyagram denge koşullarını temsil eder; hızlı soğumada denge dışı yapılar oluşabilir.","eq_title":"Kaldıraç kuralı","eq":"W_α = (C_β−C₀)/(C_β−C_α);  W_β = (C₀−C_α)/(C_β−C_α)","eq_note":"C₀ toplam alaşım bileşimi; Cα ve Cβ bağ çizgisinin faz sınırlarından okunan bileşimleridir. İki faz ağırlık kesirleri toplamı 1 olur.","example_title":"İki fazlı bölgenin okunması","example":"Bir alaşım iki fazlı α+β bölgesindeyken aynı sıcaklıkta yatay bağ çizgisi çizilir. Sol ve sağ uçlardan faz bileşimleri okunur; toplam bileşimin bağ çizgisine göre konumu kaldıraç kuralıyla faz miktarlarını verir. Faz miktarı, faz bileşimiyle aynı şey değildir.","steps":["Diyagramın hangi alaşım sistemine ait olduğunu kontrol et.","Toplam bileşim C₀ ve sıcaklığı işaretle.","Noktadan geçen yatay bağ çizgisinin faz sınırlarını kestiği bileşimleri oku.","İki fazlı bölgedeysen kaldıraç kuralıyla miktarları hesapla.","Denge diyagramının gerçek soğuma hızını ve kinetiği tek başına vermediğini unutma."],"engineering":"Çelik ve dökme demir üretimi, ısıl işlem seçimi, döküm katılaşması ve alaşım tasarımı.","pitfalls":["Liquidus ve solidus eğrilerini ters okumak.","Faz bileşimi ile faz miktarını karıştırmak.","Denge diyagramını hızlı soğumada oluşan tüm yapıları kesin gösterir sanmak."],"checkq":"Kaldıraç kuralı neyi bulmak için kullanılır?","checka":"İki fazlı bölgede fazların denge ağırlık miktarlarını bulmak için kullanılır."},"malzeme_4":{"objective":"Demir–karbon denge diyagramındaki temel faz ve dönüşümleri tanımak; karbon oranı ve sıcaklığa göre çelik mikroyapısını yorumlamak.","prerequisites":"Faz diyagramı okuma ve karbon oranı kavramı.","explanation":"Fe–Fe₃C metastabil denge diyagramı çelik ve dökme demirlerin mikroyapısını anlamada temel araçtır. Ferrit (α) düşük karbon çözünürlüğüne sahip, görece yumuşak ve sünek BCC fazdır. Östenit (γ) FCC yapıdadır ve daha fazla karbon çözebilir. Sementit Fe₃C sert ve gevrek karbür fazıdır. Perlit, ötektoid dönüşümde ferrit ve sementitin lamelli karışımıdır. Ötektoid nokta yaklaşık %0,76 C ve 727°C civarındadır; değerler kullanılan diyagram ve standarda göre yaklaşık verilmelidir.","eq_title":"Ötektoid dönüşüm","eq":"γ (östenit) → α (ferrit) + Fe₃C (sementit)  |  yaklaşık 727°C, %0,76 C","eq_note":"Bu, Fe–Fe₃C metastabil diyagramının ötektoid reaksiyonudur. Soğuma hızı mikroyapı inceliğini ve denge dışı ürünleri etkiler.","example_title":"Ötektoid çeliğin yavaş soğuması","example":"Yaklaşık %0,76 karbonlu östenitik çelik ötektoid sıcaklığının altına yavaş soğutulursa büyük ölçüde perlit oluşur. Perlit ferrit ve sementitin lamelli karışımıdır. Daha düşük karbonlu çeliklerde ötektoid öncesi ferrit; daha yüksek karbonlu çeliklerde ötektoid öncesi sementit de görülebilir.","steps":["Alaşımın karbon yüzdesini yatay eksende işaretle.","İşlem sıcaklığını düşey eksende belirle.","Bulunduğun faz alanını belirle.","Soğuma sırasında kesilen dönüşüm çizgilerini sırayla izle.","Soğuma hızının denge yapısından sapmaya neden olabileceğini not et."],"engineering":"Yapı çeliği, ray çeliği, donatı ve makine parçalarının ısıl işlem/kalite değerlendirmesi.","pitfalls":["Ferrit ile östenitin kristal yapısını karıştırmak.","Perliti tek faz olarak adlandırmak; ferrit-sementit karışımıdır.","Fe–Fe₃C diyagramındaki yaklaşık ötektoid değerlerini kesin ve evrensel sabit gibi almak."],"checkq":"Perlit hangi iki fazın lamelli karışımıdır?","checka":"Ferrit (α) ve sementit (Fe₃C)."},"malzeme_5":{"objective":"Tavlama, normalizasyon, su verme ve temperleme işlemlerinin mikroyapı ve mekanik özelliklere etkisini ayırt etmek.","prerequisites":"Fe–C diyagramı, östenitleme ve soğuma hızı.","explanation":"Isıl işlem, malzemeyi kontrollü ısıtma ve soğutma yoluyla mikroyapı ve özelliklerini değiştirmektir. Tavlama genellikle yumuşatma, iç gerilmeleri azaltma ve işlenebilirliği artırma amacı taşır. Normalizasyon, östenitleme sonrası havada soğutmayla daha ince ve düzenli bir yapı elde etmeyi hedefler. Su verme hızlı soğutma ile sert martenzit oluşturabilir fakat gevreklik ve artık gerilmeleri artırabilir. Temperleme, su verilmiş çeliğin uygun sıcaklıkta yeniden ısıtılıp soğutulmasıyla gevrekliği azaltır ve dayanım-süneklik dengesini düzenler.","eq_title":"Isıl işlem mantığı","eq":"Östenitleme sıcaklığı + bekletme + soğutma hızı → mikroyapı ve özellik","eq_note":"İşlem sıcaklığı, süre, kesit kalınlığı ve soğutucu ortam malzemeye göre belirlenmelidir; tek bir reçete bütün çeliklere uygulanmaz.","example_title":"Su verme ve temperleme","example":"Su verilmiş çelik çok sert olabilir ancak çatlak hassasiyeti ve gevreklik artabilir. Temperleme ile bir miktar sertlik kaybı karşılığında tokluk ve kullanım güvenilirliği artırılır. Bu nedenle mühendislikte yalnız en yüksek sertliği elde etmek amaç değildir.","steps":["İstenen servis özelliğini belirle: sertlik, tokluk, süneklik veya iç gerilme azaltımı.","Çeliğin bileşimine uygun östenitleme koşulunu seç.","Soğutma ortamının soğutma şiddetini değerlendir.","Su verme sonrası temperleme gerekip gerekmediğini belirle.","Sertlik ve mekanik deneylerle elde edilen özelliği doğrula."],"engineering":"Dişli, mil, ray, bağlantı elemanı, makine parçaları ve aşınmaya maruz çelik elemanlar.","pitfalls":["Su verme ile temperlemeyi aynı işlem sanmak.","En yüksek sertliğin her zaman en iyi mühendislik performansı olduğunu düşünmek.","Isıl işlem sonrası boyutsal değişim ve artık gerilmeleri göz ardı etmek."],"checkq":"Su verilmiş çeliğe temperleme neden uygulanır?","checka":"Gevrekliği ve artık gerilmeleri azaltıp dayanım-tokluk dengesini iyileştirmek için."},"malzeme_6":{"objective":"Çekme, basma ve sertlik deneylerinin ölçtüğü özellikleri, deney düzenini ve temel hesapları öğrenmek.","prerequisites":"Kuvvet, kesit alanı, uzama ve gerilme.","explanation":"Mekanik deneyler malzemenin gerçek davranışını ölçmek için kontrollü koşullarda yapılır. Çekme deneyinde numuneye eksenel çekme uygulanır; gerilme ve birim şekil değiştirme eğrisi oluşturulur. Basma deneyinde malzemenin basınç altında taşıma ve şekil değiştirme davranışı incelenir. Sertlik deneyleri batıcı ucun malzeme yüzeyinde oluşturduğu izin boyutu veya derinliği üzerinden yerel plastik deformasyona direnci ölçer. Brinell, Rockwell ve Vickers yöntemleri farklı batıcı ve ölçüm esasları kullanır; sonuçlar doğrudan birbirinin yerine geçmez.","eq_title":"Mühendislik gerilmesi","eq":"σ = P/A₀","eq_note":"P N, A₀ mm² ise σ MPa olur. Deney standardı, numune geometrisi, yükleme hızı ve çevre koşulları belirtilmelidir.","example_title":"Çekme deneyinde gerilme","example":"Başlangıç kesiti 100 mm² olan numunede 20 kN çekme yükü ölçülürse σ=20.000/100=200 MPa mühendislik gerilmesidir.","steps":["Deney standardını ve numune boyutlarını kontrol et.","Başlangıç ölçülerini kaydet.","Yük ve deformasyon verilerini eş zamanlı topla.","Gerilme ve şekil değiştirme değerlerini hesapla.","Deney sonucunu aynı standart ve numune tipindeki referanslarla karşılaştır."],"engineering":"Çelik kabulü, beton basınç numunesi ile metal çekme deneylerinin kalite kontrolü, malzeme sertlik kontrolü.","pitfalls":["Sertlik değerini doğrudan çekme dayanımı kabul etmek.","Basma numunesinde sürtünmenin şekil değiştirmeyi etkileyebileceğini unutmak.","Numune boyutu ve deney standardını raporlamamak."],"checkq":"Çekme deneyinde mühendislik gerilmesi hangi alan kullanılarak hesaplanır?","checka":"Numunenin başlangıç kesit alanı A₀ kullanılır."},"malzeme_7":{"objective":"Elastik ve plastik deformasyonu, akma dayanımını, elastisite modülünü ve Poisson oranını yorumlamak.","prerequisites":"Gerilme–şekil değiştirme eğrisi ve çekme deneyi.","explanation":"Elastik deformasyon yük kaldırıldığında geri döner; plastik deformasyon kalıcıdır. Elastisite modülü gerilme–şekil değiştirme eğrisinin doğrusal elastik bölge eğimidir ve rijitliği ifade eder. Akma dayanımı plastik deformasyonun belirginleştiği gerilme seviyesini temsil eder. Eksenel çekme sırasında numune uzarken enine yönde daralır; Poisson oranı enine birim şekil değiştirmenin boyuna birim şekil değiştirmeye negatif oranıdır. İzotrop, doğrusal elastik malzemede E, G ve ν arasında bağıntı bulunur.","eq_title":"Hooke ve Poisson ilişkileri","eq":"σ=Eε;  ν=−ε_enine/ε_boyuna;  E=2G(1+ν)","eq_note":"Son eşitlik homojen, izotrop, doğrusal elastik malzeme için geçerlidir. ν boyutsuzdur.","example_title":"Enine daralma","example":"Çekme numunesinin boyuna birim şekil değiştirmesi 0,001 ve Poisson oranı 0,30 ise enine birim şekil değiştirme yaklaşık −0,0003 olur. Eksi işaret enine yönde kısalmayı gösterir.","steps":["Yükleme–boşaltma eğrisinde geri dönen ve kalıcı kısmı ayırt et.","Elastik bölgede σ=Eε kullan.","Akma dayanımını malzemenin kalıcı deformasyona geçiş ölçütü olarak yorumla.","Poisson oranında enine ve boyuna işaretleri doğru yaz.","E, G ve ν arasında ilişki kullanılıyorsa malzeme kabullerini belirt."],"engineering":"Taşıyıcı sistem deformasyonu, donatı çeliği özellikleri, kompozit tasarımı ve elastik analiz.","pitfalls":["Rijitliği dayanımla aynı şey sanmak.","Poisson oranındaki eksi işaretini unutmak.","Plastik bölgede doğrusal Hooke kanununu kullanmak."],"checkq":"Elastisite modülü büyük olan malzeme aynı gerilmede nasıl şekil değiştirir?","checka":"Doğrusal elastik bölgede daha küçük birim şekil değiştirme gösterir; daha rijittir."},"malzeme_8":{"objective":"Kırılma, yorulma ve sürünme hasar mekanizmalarını ve tasarım açısından etkilerini ayırt etmek.","prerequisites":"Gerilme, deformasyon, süneklik, zaman ve yük tekrarları.","explanation":"Kırılma, malzemenin taşıma kapasitesini kaybederek ayrılmasıdır; sünek kırılmada belirgin plastik deformasyon, gevrek kırılmada sınırlı plastik deformasyon görülür. Yorulma, tekrarlı/değişken gerilmeler altında çatlak başlatma ve ilerlemesiyle oluşur; nominal gerilme akma dayanımının altında olsa da gerçekleşebilir. Sürünme, sabit gerilme altında özellikle yüksek sıcaklıkta zamanla artan deformasyondur. Çentik, delik, kaynak ayağı ve kesit geçişleri gerilme yığılmasına yol açarak hasarı hızlandırabilir.","eq_title":"Yorulma ve sürünme","eq":"σ_max ve σ_min → gerilme aralığı;  ε(t) → sürünme deformasyonu","eq_note":"Yorulma çevrim sayısı ve gerilme genliğiyle; sürünme ise sıcaklık, gerilme ve süreyle değerlendirilir.","example_title":"Tekrarlı yük altında yorulma","example":"Bir bağlantı elemanındaki nominal gerilme 80 MPa ve malzeme akma dayanımı 250 MPa olsun. Bu, elemanın otomatik olarak yorulmaya karşı güvenli olduğunu göstermez. Gerilme binlerce veya milyonlarca kez değişiyorsa S–N eğrisi, çentik etkisi ve yüzey durumu incelenmelidir.","steps":["Yükün sabit mi, tekrarlı mı, uzun süreli mi olduğunu belirle.","Gerilme aralığı ve ortalama gerilmeyi hesapla.","Çentik, kaynak ve yüzey kusurlarını belirle.","Yorulma için çevrim sayısı ve uygun S–N verisini; sürünme için sıcaklık-zaman verisini kullan.","Hasarın ani mi zamana bağlı mı gelişeceğini yorumla."],"engineering":"Köprü ve raylarda tekrarlı trafik yükleri, vinç
