enel basınç kuvveti oluşur. İşaret kuralını baştan belirleyerek termal ve mekanik deformasyonları cebirsel topla."],["5. Kuvvet paylaşımı ve rijitlik","Paralel çubuklar rijit plakalar arasında aynı uç yer değiştirmesini yapıyorsa deformasyonları eşittir. Her çubukta Nᵢ= AᵢEᵢΔ/Lᵢ olduğundan kuvvet paylaşımı eksenel rijitlik AᵢEᵢ/Lᵢ ile orantılıdır. Rijitliği yüksek eleman daha fazla yük taşıyabilir; simetri yoksa eşit yük paylaşımı varsayma."],["6. Çözüm algoritması","Önce bilinmeyen tepki veya iç kuvvetleri tanımla. Global denge denklemlerini yaz. Ardından mesnetlerin dayattığı yer değiştirme koşulunu belirle. Her parça için ΔL=NL/(AE) ve gerekiyorsa αΔTL ekle. Denge ve uygunluk denklemlerini birlikte çöz; son olarak kuvvet toplamı ve yer değiştirme koşulunu yeniden kontrol et."]],"formula":"Denge: ΣF = 0     ;     Uygunluk: ΣΔL = 0 (rijit uçlar)\nΔL_i = N_i L_i/(A_i E_i) + α_i ΔT_i L_i","meaning":"Statikçe belirsiz sistemde denge denklemleri tek başına yeterli değildir. Uygunluk geometrik kısıtı, malzeme bağıntısı ise kuvvet-deformasyon ilişkisini verir. α ısıl genleşme katsayısıdır.","derivation":"Rijit uçlar arasındaki bir çubukta toplam uç yer değiştirmesi sıfırdır. Toplam boy değişimi serbest ısıl deformasyon ile mekanik deformasyonun cebirsel toplamıdır. Bu nedenle Σ[NᵢLᵢ/(AᵢEᵢ)+αᵢΔTᵢLᵢ]=0 yazılır. Denge denklemiyle birlikte çözülünce bilinmeyen iç kuvvet veya tepkiler elde edilir. Paralel çubuklarda ise ortak uç yer değiştirmesi uyumluluk şartıdır.","diagram":"axial","examples":[["Örnek 1 — İki ucu sabit çubukta sıcaklık artışı","A=400 mm², L=2000 mm, E=200.000 MPa, α=12×10⁻⁶/°C olan çelik çubuk iki rijit duvar arasında sıkışmadan başlangıç boyundadır. Sıcaklık 40°C artıyor. Oluşan eksenel kuvveti bulun.",["Uçlar sabit olduğundan toplam boy değişimi sıfırdır: ΔL_mekanik+ΔL_T=0.","Serbest ısıl uzama αΔTL'dir; mekanik deformasyon NL/(AE).","NL/(AE)+αΔTL=0; L sadeleşir: N=−AEαΔT.","N=−400×200.000×12×10⁻⁶×40=−38.400 N.","Negatif işaret, seçilen çekme pozitif kuralına göre basıncı gösterir. Gerilme σ=N/A=−96 MPa."],"Sonuç: N=−38,4 kN basınç; σ=−96 MPa."],["Örnek 2 — Seri iki malzemeli çubukta kısıtlı ısıl uzama","Çelik parça: L₁=1000 mm, A₁=400 mm², E₁=200.000 MPa, α₁=12×10⁻⁶/°C. Alüminyum parça: L₂=800 mm, A₂=600 mm², E₂=70.000 MPa, α₂=23×10⁻⁶/°C. Seri bağlı sistemin uçları sabit ve her iki parça 30°C ısıtılıyor. İç kuvveti bulun.",["Seri sistemde iki parçada eksenel iç kuvvet aynıdır; çekme pozitif kabul edilsin.","Toplam serbest ısıl uzama: 12×10⁻⁶×30×1000 + 23×10⁻⁶×30×800 = 0,360+0,552=0,912 mm.","Toplam mekanik uyumluluk katsayısı: L₁/(A₁E₁)+L₂/(A₂E₂)=1000/(400×200.000)+800/(600×70.000)=0,0000315476 mm/N.","Uyumluluk: N×0,0000315476+0,912=0; N≈−28.910 N.","Negatif işaret basıncı gösterir. Her parçanın mekanik kısalması serbest ısıl uzamayı tam dengeler."],"Sonuç: ortak eksenel kuvvet yaklaşık 28,9 kN basınçtır."],["Örnek 3 — Paralel iki çubukta yük paylaşımı","Rijit bir plaka iki çubuğa bağlıdır. Çubuk 1'in eksenel rijitliği k₁=A₁E₁/L₁=40 kN/mm, çubuk 2'nin k₂=60 kN/mm'dir. Plakaya 50 kN aşağı yük uygulanıyor. Çubuk kuvvetlerini bulun.",["Denge: N₁+N₂=50 kN.","Plaka rijit olduğundan iki çubuğun uç yer değiştirmesi aynıdır: δ₁=δ₂=δ.","N₁=k₁δ ve N₂=k₂δ; dolayısıyla N₁/N₂=k₁/k₂=40/60.","N₁=0,4×50=20 kN; N₂=0,6×50=30 kN.","Kontrol: N₁+N₂=50 kN ve daha rijit çubuk daha fazla yük taşır."],"Sonuç: N₁=20 kN, N₂=30 kN."]],"engineering":"Rijit plakaya bağlanan kolonlar, kompozit çelik-beton elemanlar, iki ucu kısıtlı ankrajlar, sıcaklık değişimine maruz kalan köprü mesnetleri ve farklı malzemeden seri/paralel elemanlarda kullanılır.","pitfalls":["Statikçe belirsiz soruyu yalnız ΣF=0 ile çözmeye çalışmak.","Uçların sabit olduğu problemde ΣΔL=0 uyumluluk koşulunu yazmamak.","Isıl genleşme terimini mekanik deformasyona yanlış işaretle eklemek.","Seri bağlantıda aynı kuvvet ve paralel rijit plakada aynı deplasman koşullarını karıştırmak.","E, A veya L birimlerini tutarsız kullanmak."],"checks":[["Statikçe belirsiz sistemde dengeye ek olarak hangi iki bilgi gerekir?","Geometrik deformasyon uyumluluğu ve malzemenin kuvvet–deformasyon bağıntısı."],["İki ucu sabit çubuk ısıtıldığında hangi iç kuvvet oluşur?","Çubuğun serbest uzaması engellendiği için basınç iç kuvveti oluşur."],["Seri bağlı elemanlarda arada dış yük yoksa eksenel kuvvet nasıl değişir?","Aynıdır; her parçada aynı iç kuvvet taşınır."],["Paralel çubuklarda yük paylaşımı hangi rijitlikle ilişkilidir?","A·E/L eksenel rijitliğiyle; daha rijit eleman daha fazla yük alır."],["Rijit uçlar arasında toplam deformasyon koşulu nedir?","Toplam mekanik ve ısıl boy değişimlerinin cebirsel toplamı sıfırdır."]]},"6":{"intro":"Burulmada, dairesel milin boyuna ekseni etrafında tork uygulanmasıyla kayma gerilmesi ve açısal dönme oluşur. Sınavda tork diyagramı, dolu/boş kesit polar atalet momenti, en büyük gerilme ve radyan–derece dönüşümü birlikte değerlendirilir.","sections":[["1. Tork ve yük aktarımı","Tork, bir eksen etrafında döndürme etkisidir ve birimi N·m veya N·mm'dir. Dairesel milde dış torklar iç kesit torku T oluşturur. Mil boyunca tork değişiyorsa her parça için iç torku ayrı bul; tork diyagramı oluşturmadan tüm milde aynı T olduğunu varsayma."],["2. Kayma gerilmesinin dağılımı","Dairesel kesitli elastik milde kayma gerilmesi merkezde sıfır, yarıçapla doğrusal artarak dış yüzeyde maksimum olur. τ=Tr/J bağıntısında T iç tork, r incelenen noktanın merkezden uzaklığı, J polar alan atalet momentidir. En büyük değer dış yarıçap c'de oluşur: τmax=Tc/J."],["3. Polar atalet momenti J","Dolu daire için J=πd⁴/32; içi boş daire için J=π(D⁴−d⁴)/32 kullanılır. J kesitin burulmaya geometrik direncidir. J ile eğilme için kullanılan alan atalet momenti I aynı değildir; dairesel kesitte J=Ix+Iy bağıntısı geçerlidir."],["4. Burulma açısı ve kayma modülü","Prizmatik, sabit torklu dairesel milde φ=TL/(GJ)'dir. G kayma modülüdür. Mil uzunluğu arttıkça dönme artar; G veya J arttıkça azalır. Tork veya kesit değişiyorsa parçalar için φᵢ=TᵢLᵢ/(GᵢJᵢ) hesaplanır ve işaretli olarak toplanır."],["5. Dolu ve içi boş mil karşılaştırması","Aynı malzeme ve dış çapta içi boş mil, malzemenin bir kısmını eksenden uzaklaştırarak belirli ağırlıkta yüksek polar atalet sağlayabilir. Ancak tasarımda yalnız gerilme değil, dönme açısı, yerel bağlantı, burkulma, yorulma ve üretilebilirlik de kontrol edilir."],["6. Güç, devir ve tork ilişkisi","Döner sistemde güç P=Tω bağıntısıyla ilişkilidir. ω açısal hızdır (rad/s); devir sayısı n dev/dak verilirse önce ω=2πn/60 dönüşümü yapılır. P kW, T N·m kullanırken birim dönüşümünü dikkatle yap."],["7. Varsayımlar ve sınırlar","Temel burulma bağıntıları doğrusal elastik, dairesel kesitli, düzgün/geometrisi sabit mil ve Saint-Venant burulması kabullerine dayanır. Açık ince cidarlı kesit, ani çap değişimi, kama kanalı ve gerilme yığılması için basit τ=Tr/J yaklaşımı tek başına yeterli olmayabilir."]],"formula":"τ = T r / J     ;     φ = T L / (G J)\nJ_dolu = πd⁴/32     ;     J_boru = π(D⁴−d⁴)/32","meaning":"T: iç tork (N·mm); r ve c: merkezden uzaklık (mm); J: polar atalet momenti (mm⁴); G: kayma modülü (MPa); L: mil boyu (mm); φ: radyan cinsinden burulma açısı.","derivation":"Elastik burulmada mil kesitleri birbirine göre φ açısı kadar döner. Geometri gereği kayma birim şekil değiştirmesi γ(r)=rφ/L'dir. Hooke tipi kayma bağıntısı τ=Gγ ile τ(r)=G r φ/L elde edilir. Kesitteki kayma gerilmelerinin oluşturduğu tork T=∫A τ(r) r dA olduğundan T=(Gφ/L)∫A r²dA=(GJφ/L). Buradan φ=TL/(GJ) ve τ=Tr/J bağıntıları çıkar.","diagram":"torsion","examples":[["Örnek 1 — Dolu dairesel milde en büyük kayma gerilmesi","Dış çapı 40 mm olan dolu mil T=0,8 kN·m tork taşıyor. En büyük kayma gerilmesini bulun.",["T=0,8 kN·m=800 N·m=800.000 N·mm.","c=d/2=20 mm.","J=πd⁴/32=π×40⁴/32=251.327 mm⁴.","τmax=Tc/J=800.000×20/251.327=63,66 N/mm²."],"Sonuç: τmax≈63,7 MPa; dış yüzeyde oluşur."],["Örnek 2 — Milin burulma açısı","Örnek 1'deki mil için L=1000 mm ve G=80.000 MPa verilmiştir. Uçlar arasındaki burulma açısını bulun.",["φ=TL/(GJ). T=800.000 N·mm, L=1000 mm, G=80.000 N/mm², J=251.327 mm⁴.","φ=800.000×1000/(80.000×251.327)=0,03979 rad.","Dereceye çevir: φ_deg=0,03979×180/π≈2,28°."],"Sonuç: φ≈0,0398 rad≈2,28°."],["Örnek 3 — İçi boş milde gerilme","Dış çapı 60 mm, iç çapı 40 mm olan boru mil T=1,5 kN·m tork taşıyor. Maksimum kayma gerilmesini bulun.",["T=1.500.000 N·mm; c=D/2=30 mm.","J=π(D⁴−d⁴)/32=π(60⁴−40⁴)/32≈1.021.018 mm⁴.","τmax=Tc/J=1.500.000×30/1.021.018≈44,07 MPa.","Gerilme dış yüzeyde maksimumdur; iç yarıçapta daha küçüktür."],"Sonuç: τmax≈44,1 MPa."]],"engineering":"Şaft, tahrik mili, pompa ve türbin milleri, vinç tamburu, redüktör çıkışı ve döner makine elemanlarında tork aktarımının dayanım ve rijitlik hesabında kullanılır. Demiryolu ve inşaat makinelerinde döner aktarma elemanlarının kontrolünde de önemlidir.","pitfalls":["kN·m değerini N·mm'ye çevirirken 10⁶ çarpanını unutmak.","Dairesel kesitte J yerine eğilme alan atalet momenti I kullanmak.","Maksimum gerilme için r=c dış yarıçapını kullanmamak.","Radyan ile dereceyi karıştırmak.","Dolu mil formülünü içi boş mile uygulamak.","Burulma bağıntısını dairesel olmayan kesite doğrudan uygulamak."],"checks":[["Dolu dairesel mil için J bağıntısı nedir?","J=πd⁴/32."],["Kayma gerilmesi kesitte nerede maksimumdur?","Dairesel milin dış yüzeyinde, r=c noktasında."],["Burulma açısı hangi büyüklüklerle artar?","Tork T ve uzunluk L ile artar; G ve J ile azalır."],["0,1 rad yaklaşık kaç derecedir?","0,1×180/π≈5,73°."],["Açık ince cidarlı kesitte τ=Tr/J kullanımı neden sınırlıdır?","Temel formül dairesel kesitli Saint-Venant burulması kabullerine dayanır; açık ince cidarlı kesitlerde burulma davranışı farklıdır."]]},"7":{"intro":"Kiriş boyunca kesme kuvveti V ve eğilme momenti M değişir. Diyagram sorularında önce mesnet tepkilerini, sonra yükleme aralıklarını ve işaret konvansiyonunu belirle. Noktasal yük V diyagramında sıçrama, düzgün yayılı yük V'de doğrusal değişim ve M'de parabolik değişim oluşturur.","sections":[["1. Kirişin parçalı analizi","Kiriş üzerindeki tekil yük, tekil moment, yayılı yük başlangıç/bitişi veya mesnet gibi yükleme değişim noktaları kirişin aralıklarını belirler. Her aralıkta V(x) ve M(x) fonksiyonları ayrı yazılır. Önce tüm kirişin tepkilerini bul; ardından kesit yöntemiyle her aralığın solundan veya sağından denge kur."],["2. Yayılı yük ile kesme kuvveti ilişkisi","Seçilen yaygın işaret konvansiyonunda dV/dx=−w(x) yazılır. w sabitse V doğrusal değişir; w doğrusal değişirse V parabolik olabilir. Tekil aşağı yük, kesme diyagramında yük büyüklüğü kadar ani düşüş oluşturur. İşaret konvansiyonu farklı kaynaklarda değişebilir; denklemi ve diyagramı birlikte tutarlı kullan."],["3. Kesme kuvveti ile moment ilişkisi","Seçilen konvansiyonda dM/dx=V(x)'tir. İki kesit arasındaki moment farkı, V diyagramının işaretli alanına eşittir. V sabitse moment doğrusal; V doğrusal değişiyorsa moment ikinci derece fonksiyondur. V=0 olan nokta, düzgün bir ekstremum koşulunda momentin yerel maksimum/minimum değerini verebilir."],["4. Tekil yük ve tekil momentin diyagram etkisi","Tekil düşey kuvvet V diyagramında sıçrama oluşturur; M diyagramı tekil moment yoksa kuvvet noktasında süreklidir. Uygulanan tekil moment M diyagramında sıçrama oluşturabilir. Bu kuralları ezberlemenin yanında küçük bir diferansiyel kiriş parçasına denge uygulayarak türet."],["5. Diyagram çizme algoritması","Kirişi ve yükleri ölçekli olmasa bile doğru konumlarda çiz. Tepkileri bul. Yükleme aralıklarını belirle. Her aralık için V(x) ve M(x) yaz. Başlangıç/son değerlerini ve sıçramaları hesapla. Diyagramı V ve M'nin şekline göre çiz; mesnet ve serbest uç sınır koşullarını kontrol et."],["6. Maksimum moment ve kritik kesit","İç bölgede V=0 olduğu nokta momentin ekstremum adayıdır. Tekil kuvvet, tekil moment, mesnet ve yük değişim noktaları da kontrol edilmelidir. En büyük mutlak momentin olduğu kesit, eğilme gerilmesi hesabında kritik olabilir. Maksimum kesme kuvveti de ayrı değerlendirilir."],["7. Birim ve fiziksel kontrol","Yayılı yük kN/m, kesme kuvveti kN, eğilme momenti kN·m birimindedir. V diyagramı altında kalan alanın birimi kN·m olup moment değişimini verir. Kirişin sonundaki iç tesirler sınır koşullarıyla uyumlu olmalıdır; basit mesnet momenti sıfır, serbest uçta dış moment yoksa uç momenti sıfırdır."]],"formula":"dV/dx = −w(x)     ;     dM/dx = V(x)\nΔM = ∫ V(x) dx     ;     ΔV = −∫ w(x) dx","meaning":"w: yayılı yük şiddeti (kN/m); V: kesme kuvveti (kN); M: eğilme momenti (kN·m); x: kiriş boyunca koordinat (m). Bu işaret ilişkileri seçilen konvansiyona bağlıdır; dersin kullandığı konvansiyonla tutarlı ol.","derivation":"Kirişten dx uzunluklu küçük bir parça ayır. Parçanın düşey kuvvet dengesi, V'nin değişiminin yayılı yükün dx boyunca bileşkesiyle ilişkili olduğunu verir: dV=−w dx. Moment dengesi, küçük parçanın sol ve sağ kesit moment farkını V dx ile ilişkilendirir: dM=V dx (dx² terimleri küçük mertebede ihmal edilir). Bu iki diferansiyel ilişki diyagramların geometrisini belirler.","diagram":"shear","examples":[["Örnek 1 — Tam açıklık boyunca düzgün yayılı yük","L=6 m basit kirişin tüm açıklığına w=4 kN/m düzgün yayılı yük uygulanıyor. Tepkileri, V(x), M(x) ve maksimum momenti bulun.",["Bileşke yük W=wL=4×6=24 kN, orta noktadan etkiler. Simetriden Ay=By=12 kN.","0≤x≤6 için sol parçayı incele: V(x)=12−4x (kN).","M(x)=12x−(4x)(x/2)=12x−2x² (kN·m).","V=0 için 12−4x=0 → x=3 m.","M(3)=36−18=18 kN·m; uçlarda M(0)=M(6)=0."],"Sonuç: Ay=By=12 kN; V doğrusal, M parabolik; Mmax=18 kN·m orta noktada."],["Örnek 2 — Orta nokta tekil yüklü kiriş","L=8 m basit kirişin ortasına P=20 kN aşağı yük uygulanıyor. V ve M diyagramlarının temel değerlerini bulun.",["Simetriden Ay=By=10 kN.","A'dan yük noktasına kadar V=+10 kN; yük noktasında 20 kN aşağı sıçrama ile V=−10 kN olur.","Yük noktasına kadar M(x)=10x; orta noktada M=10×4=40 kN·m.","Sağ yarıda V=−10 kN olduğundan M doğrusal azalır ve B'de sıfıra ulaşır."],"Sonuç: V diyagramı +10'dan −10'a sıçrar; Mmax=40 kN·m orta noktadadır."],["Örnek 3 — Tekil yük ve yayılı yük birlikte","5 m basit kirişte tüm açıklığa 2 kN/m yayılı yük ve A'dan 2 m uzaklıkta 6 kN aşağı tekil yük vardır. Tepkileri bulun.",["Yayılı yük bileşkesi 2×5=10 kN ve A'dan 2,5 m uzaklıktadır.","A noktasına göre moment: By×5−10×2,5−6×2=0 → By=37/5=7,4 kN.","Düşey denge: Ay+7,4−10−6=0 → Ay=8,6 kN.","V diyagramı yayılı yük boyunca eğimli değişir; x=2 m'deki tekil yükte 6 kN aşağı sıçrama yapar. M, V'nin alanından bulunur."],"Sonuç: Ay=8,6 kN; By=7,4 kN. Diyagramı iki yükleme aralığı ve tekil yük sıçramasıyla çiz."]],"engineering":"Kiriş, döşeme kirişi, köprü ana kirişi, ray ve travers sistemi, konsol ve çatı makas elemanlarının kritik kesitlerinde iç kuvvetleri bulmak için kullanılır. Eğilme dayanımı ve kesme dayanımı kontrollerinin başlangıç verisini sağlar.","pitfalls":["Yayılı yük bileşkesini yanlış noktaya yerleştirmek.","Diyagramdaki tekil kuvvet sıçramasını atlamak.","M diyagramını V alanıyla kontrol etmemek.","V=0 noktasını kontrol etmeden maksimum momenti yalnız şekle bakarak seçmek.","kN/m, kN ve kN·m birimlerini karıştırmak.","İşaret konvansiyonunu çözüm sırasında değiştirmek."],"checks":[["Düzgün yayılı yük altında kesme diyagramı nasıl değişir?","Sabit w için V doğrusal değişir."],["Kesme kuvveti diyagramının işaretli alanı neyi verir?","İki kesit arasındaki moment değişimini verir: ΔM=∫Vdx."],["Tekil düşey yük V diyagramını nasıl etkiler?","Yük büyüklüğü kadar ani sıçrama oluşturur; işaret yük yönü ve seçilen konvansiyona bağlıdır."],["Maksimum moment hangi iç noktada oluşabilir?","Düzgün ekstremum koşulunda V=0 olan noktada; ayrıca yük ve moment değişim noktaları kontrol edilir."],["Basit mesnetli kirişin mesnetinde eğilme momenti ideal olarak kaçtır?","Basit mafsal/makaralı mesnet moment taşımadığı için uç momenti sıfırdır."]]},"8":{"intro":"Eğilme gerilmesi, kirişteki eğilme momentinin kesit yüksekliği boyunca normal gerilme dağılımı oluşturmasını açıklar. Sınav sorularında nötr eksen, kesit ağırlık merkezi, alan atalet momenti I, kesit modülü S ve birim dönüşümü birlikte sorulur.","sections":[["1. Eğilme altında liflerin davranışı","Pozitif sehim oluşturan basit eğilmede bir taraftaki lifler uzar (çekme), diğer taraftakiler kısalır (basınç). Arada boyuna deformasyonu sıfır olan nötr eksen bulunur. Homojen ve simetrik kesitte nötr eksen kesit ağırlık merkezinden geçer; bileşik/asimetrik kesitlerde ağırlık merkezi ve eksen ayrıca belirlenir."],["2. Doğrusal gerilme dağılımı","Basit elastik eğilme varsayımlarında düzlem kesitler deformasyondan sonra düzlem kalır. Boyuna birim şekil değiştirme nötr eksenden uzaklık y ile doğrusal değişir; Hooke kanunuyla gerilme de doğrusal dağılır. Nötr eksende σ=0, en dış lifte mutlak gerilme maksimumdur."],["3. Eğilme bağıntısının anlamı","σ=My/I bağıntısında M eğilme momenti, y nötr eksenden incelenen noktaya uzaklık, I ilgili eksene göre alan atalet momentidir. Maksimum gerilme için y=c dış lif uzaklığı alınır. Kesit modülü S=I/c tanımlanırsa σmax=M/S biçimi elde edilir."],["4. Kesit atalet momenti ve eksen seçimi","Dikdörtgen kesitin yatay merkezî ekseni için I=bh³/12; burada h eksene dik toplam yüksekliktir. Yüksekliğin küpü alınır. Dairesel kesit ve diğer şekillerde kendi formülleri kullanılır. Yanlış eksene göre I seçmek gerilme hesabını büyük ölçüde değiştirir."],["5. Birim uyumu","M kN·m verildiyse N·mm sisteminde M×10⁶ ile çevrilir. I mm⁴, y mm ise σ N/mm² yani MPa çıkar. S mm³ ise M/S doğrudan N/mm² olmalıdır. Birimleri satırda açıkça yazmak sınavda işlem hatasını azaltır."],["6. Çekme ve basınç tarafını belirle","Moment işareti ve kesit geometrisi, hangi lifin çekme hangisinin basınç olduğunu belirler. σ=My/I ifadesinde y işaretli koordinat seçimine bağlıdır. Maksimum mutlak değer bulunurken her iki dış lifte gerilme hesaplanabilir. Eksenel normal kuvvet de varsa doğrusal elastik süperpozisyonla N/A terimi eklenebilir."],["7. Bağıntının geçerlilik sınırları","Basit eğilme formülü doğrusal elastik malzeme, küçük deformasyon, uygun kiriş geometrisi ve bilinen kesit tesirleri kabullerine dayanır. Kısa/derin kirişte kayma etkileri, ince cidarlı veya bileşik kesitte kesme merkezi, kompozit kesitte modül oranı, betonarmede çatlamış kesit ve nihai dayanım farklı analiz ister."]],"formula":"σ = M y / I = M / S     ;     S = I/c\nBirleşik eksenel + eğilme: σ = N/A ± M y/I (doğrusal elastik koşullarda)","meaning":"M: eğilme momenti (N·mm); y: nötr eksenden uzaklık (mm); I: alan atalet momenti (mm⁴); S: kesit modülü (mm³); c: en dış lif uzaklığı (mm). σ sonucu N/mm²=MPa olur.","derivation":"Euler–Bernoulli varsayımında düzlem kesitler deformasyon sonrası düzlem kalır; bu nedenle boyuna birim şekil değiştirme εx=−y/ρ ile y'ye doğrusal bağlıdır. Hooke kanunu σx=Eεx ile gerilme de doğrusal dağılım gösterir. İç momentin kesit gerilmelerinin moment toplamına eşit olması gerekir: M=∫A yσdA. Doğrusal dağılım yerine konduğunda M=(E/ρ)∫A y²dA=(E/ρ)I elde edilir. Buradan σ=My/I bağıntısı çıkar.","diagram":"bending","examples":[["Örnek 1 — Dikdörtgen kesitte maksimum eğilme gerilmesi","b=100 mm, h=200 mm dikdörtgen kesitli kirişte M=10 kN·m eğilme momenti vardır. Maksimum elastik normal gerilmeyi bulun.",["M=10 kN·m=10×10⁶ N·mm.","I=bh³/12=100×200³/12=66,667×10⁶ mm⁴.","c=h/2=100 mm.","σmax=Mc/I=10×10⁶×100/(66,667×10⁶)=15 N/mm²."],"Sonuç: σmax=15 MPa; bir dış lifte çekme, karşı dış lifte aynı büyüklükte basınç oluşur (simetrik homojen dikdörtgen kesit ve saf eğilme)."],["Örnek 2 — Kesit modülü ile gerilme","b=120 mm, h=240 mm dikdörtgen kirişte M=18 kN·m'dir. Kesit modülünü ve maksimum gerilmeyi bulun.",["I=bh³/12=120×240³/12=138,24×10⁶ mm⁴.","c=120 mm; S=I/c=1,152×10⁶ mm³.","M=18×10⁶ N·mm.","σmax=M/S=18×10⁶/1,152×10⁶=15,625 N/mm²."],"Sonuç: S=1,152×10⁶ mm³ ve σmax=15,625 MPa."],["Örnek 3 — Eksenel kuvvet ve eğilmenin birlikte etkisi","A=4000 mm², I=80×10⁶ mm⁴ ve c=100 mm olan kesitte N=200 kN çekme, M=12 kN·m pozitif eğilme momenti vardır. En dış iki lifte normal gerilmeleri bulun.",["N/A=200.000/4000=50 MPa (çekme).","M c/I=12×10⁶×100/(80×10⁶)=15 MPa.","Bir dış lifte σ=50+15=65 MPa; karşı lifte σ=50−15=35 MPa.","Bu lineer elastik süperpozisyon, yüklerin aynı doğrultuda ve kesit davranışının elastik olduğu kabulüne dayanır."],"Sonuç: dış lif gerilmeleri 65 MPa ve 35 MPa çekmedir; işaret yönleri seçilen moment konvansiyonuna göre kontrol edilir."]],"engineering":"Çelik ve betonarme kirişlerin ilk elastik gerilme değerlendirmesi, köprü ana kirişleri, konsollar, makas elemanları ve eğilme momenti taşıyan kolon/kiriş kesitlerinde kullanılır. Betonarme nihai tasarımında çatlamış kesit, donatı, doğrusal olmayan malzeme davranışı ve ilgili yönetmelik ayrıca ele alınmalıdır.","pitfalls":["Dikdörtgen kesitte I=bh³/12 yerine yanlış eksene göre hesap yapmak.","h yerine h/2'yi küp içine koymak; I'de h toplam kesit yüksekliğidir.","kN·m değerini N·mm'ye çevirmemek.","M/S ve My/I ifadelerinde S, I ve y birimlerini karıştırmak.","Kesit nötr ekseninin yerini ve çekme/basınç tarafını belirtmemek.","Elastik eğilme bağıntısını betonarme nihai dayanım hesabının tamamı sanmak."],"checks":[["Dikdörtgen kesitin yatay merkezî ekseni için I nedir?","I=bh³/12; h eksene dik toplam kesit yüksekliğidir."],["Kesit yüksekliği iki katına çıkarsa b sabitken I kaç kat olur?","Sekiz kat; I h³ ile orantılıdır."],["Nötr eksende basit elastik eğilme normal gerilmesi kaçtır?","y=0 olduğundan σ=0."],["Kesit modülü S nasıl tanımlanır?","S=I/c; c nötr eksenden en dış life olan uzaklıktır."],["Eksenel kuvvet ve eğilme momenti birlikteyse hangi bağıntı kullanılabilir?","Doğrusal elastik koşullarda σ=N/A±My/I süperpozisyonu kullanılabilir."]]},"9":{"intro":"Bir eleman aynı anda eksenel kuvvet, eğilme momenti ve burulma taşıyabilir. Bu durumda tek tek hesaplanan gerilme bileşenleri aynı kesit noktasında birleştirilir. Amaç, kesitin en kritik noktasındaki normal ve kayma gerilmesini doğru işaretlerle bulmak ve seçilen dayanım ölçütüne göre değerlendirmektir.","sections":[["1. Bileşik yükleme neden oluşur?","Gerçek taşıyıcı elemanlarda yükün eksenden kaçık uygulanması, kirişte eksenel kuvvet oluşması, bağlantı geometrisi veya yatay/düşey yüklerin birlikte etkimesi nedeniyle N, V, M ve T aynı anda bulunabilir. Serbest cisim diyagramı ve kesit yöntemiyle her iç tesir ayrı ayrı belirlenmelidir."],["2. Eksenel kuvvet ve eğilmenin birlikte etkisi","Doğrusal elastik davranışta kesitteki normal gerilme, eksenel normal gerilme ile eğilmeden doğan normal gerilmenin cebirsel toplamıdır: σ=N/A±My/I. İşaret, seçilen eksen ve moment yönüne bağlıdır. İki dış lifte ayrı ayrı hesap yapılmalıdır; bir kenar çekmede, diğer kenar basınçta olabilir."],["3. Eksantrik eksenel yükleme","Ekseninden e kadar kaçık uygulanan P kuvveti, kesitte N=P ve M=P·e etkilerini doğurur. Bu nedenle σ=P/A±P e c/I yazılabilir. Yükün eksantrisitesi arttıkça eğilme bileşeni artar. Basınç kuvvetlerinde gerilme dağılımı kesitin bir bölümünde çekmeye dönebilir; temas ve stabilite koşulları ayrıca incelenmelidir."],["4. Eğilme ve burulmanın birlikte etkisi","Dairesel milde eğilme momenti dış lifte σ_b=Mc/I, tork ise τ=Tc/J üretir. Aynı noktada bu iki gerilme bileşeni birlikte değerlendirilir. Dairesel kesitte I=πd⁴/64, J=πd⁴/32, c=d/2'dir. Dış lifte eğilme normal gerilmesi ve burulma kayma gerilmesi birlikte maksimum olabilir."],["5. Düzlem gerilme durumu ve asal gerilmeler","Aynı noktada σ_x, σ_y ve τ_xy varsa gerilme durumu düzlem gerilme olarak ele alınabilir. Asal gerilmeler, kayma gerilmesinin sıfır olduğu döndürülmüş düzlemlerdeki normal gerilmelerdir. Genel bağıntı ve yön hesabı Mohr dairesi konusunda adım adım incelenir."],["6. Dayanım ölçütünü seçmek","Birleşik gerilme durumunda yalnız σ veya τ değerlerinden birini tek başına kontrol etmek yeterli olmayabilir. Sünek izotropik malzemelerde von Mises veya Tresca gibi akma ölçütleri kullanılabilir; gevrek malzemeler için farklı ölçütler gerekir. Hangi ölçütün kullanılacağı problemde, ders notunda veya ilgili tasarım standardında belirtilmelidir. Düzlem gerilmede von Mises eşdeğer gerilmesi σ_vm=√(σ_x²−σ_xσ_y+σ_y²+3τ_xy²) olarak yazılır. Tresca yaklaşımı, asal gerilmeler arasındaki en büyük farkı esas alır: σ_T=max(|σ₁−σ₂|,|σ₂−σ₃|,|σ₃−σ₁|). Düzlem gerilmede üçüncü asal gerilme σ₃=0 alınır; hangi ölçütün kullanılacağı problemde belirtilmelidir."],["7. Sınav çözüm algoritması","Önce kesitte N, V, M ve T'yi bul. Kritik kesit ve kritik noktayı belirle. Normal ve kayma gerilmesi bileşenlerini ayrı hesapla. Aynı noktadaki gerilme durumunu kur; gerekiyorsa asal gerilme veya dayanım ölçütüne geç. Sonucu birim, işaret ve malzeme kabulüyle yorumla."]],"formula":"σ_x = N/A ± M_y c/I_y ± M_z c/I_z\nDairesel mil: σ_b = M c/I  ;  τ_t = T c/J\nDüzlem gerilme: σ₁,₂ = (σ_x+σ_y)/2 ± √[((σ_x−σ_y)/2)²+τ_xy²]\nDüzlem gerilmede von Mises: σ_vm = √(σ_x² − σ_xσ_y + σ_y² + 3τ_xy²)\nTresca: σ_T = max(|σ₁−σ₂|, |σ₂−σ₃|, |σ₃−σ₁|)","meaning":"N eksenel kuvvet (N), A kesit alanı (mm²), M eğilme momenti (N·mm), I alan atalet momenti (mm⁴), c nötr eksenden dış life uzaklık (mm), T tork (N·mm), J polar atalet momenti (mm⁴). Gerilme N/mm² = MPa çıkar. Bileşenlerin işaretleri aynı nokta ve aynı eksen takımında cebirsel olarak birleştirilmelidir. Düzlem gerilmede von Mises eşdeğer gerilmesi σ_vm=√(σ_x²−σ_xσ_y+σ_y²+3τ_xy²) ile hesaplanabilir. Tresca eşdeğer gerilmesi asal gerilme çiftleri arasındaki en büyük mutlak farktır; karşılaştırma malzemenin akma dayanımı ve kullanılan tasarım yaklaşımıyla yapılır.","derivation":"Lineer elastik küçük şekil değiştirme koşullarında süperpozisyon ilkesi uygulanabilir. Eksenel kuvvetin kesit üzerindeki düzgün normal gerilmesi N/A'dır. Eğilmenin doğrusal normal gerilmesi My/I'dir. Bu iki bileşen aynı kesitte cebirsel toplanır. Dairesel milde tork kayma gerilmesi Tc/J doğurur. Böylece aynı noktadaki gerilme durumu normal ve kayma bileşenleriyle tanımlanır; asal gerilmeler gerilme dönüşümüyle bulunur.","diagram":"combined","examples":[["Örnek 1 — Eksantrik basınç kuvveti","b=80 mm, h=120 mm dikdörtgen kesitli kısa elemana eksenden e=25 mm kaçık P=80 kN basınç kuvveti uygulanıyor. Kesit merkezinden geçen eksene göre en büyük ve en küçük normal gerilmeleri bulun.",["A=bh=80×120=9600 mm².","I=bh³/12=80×120³/12=11,52×10⁶ mm⁴; c=h/2=60 mm.","Eksenel gerilme büyüklüğü P/A=80.000/9600=8,33 MPa (basınç).","M=P·e=80.000×25=2,00×10⁶ N·mm.","Eğilme gerilmesi Mc/I=2,00×10⁶×60/11,52×10⁶=10,42 MPa.","İki kenarda σ=−8,33±10,42 MPa; bir kenar 2,08 MPa çekme, diğer kenar 18,75 MPa basınç olur."],"Sonuç: Kesitin bir kenarında yaklaşık 2,08 MPa çekme, karşı kenarında 18,75 MPa basınç oluşur."],["Örnek 2 — Eksenel kuvvet ve eğilmenin birlikte etkisi","A=4000 mm², I=100×10⁶ mm⁴, c=100 mm olan kesitte N=120 kN çekme ve M=8 kN·m eğilme momenti vardır. İki dış lifteki gerilmeleri bulun.",["N/A=120.000/4000=30 MPa çekme.","M=8×10⁶ N·mm.","Mc/I=8×10⁶×100/(100×10⁶)=8 MPa.","Aynı işaret konvansiyonunda dış lifler için σ=30+8=38 MPa ve σ=30−8=22 MPa.","İki değer de pozitif olduğundan bu örnekte her iki dış lifte çekme vardır."],"Sonuç: Dış liflerde 38 MPa ve 22 MPa çekme gerilmesi oluşur."],["Örnek 3 — Dairesel milde eğilme ve burulma","d=50 mm dolu dairesel milde N=40 kN çekme, M=1,5 kN·m eğilme ve T=1,0 kN·m burulma etkisi vardır. Kritik dış lifte normal gerilme, kayma gerilmesi ve asal gerilmeleri bulun.",["A=πd²/4=1963,50 mm²; I=πd⁴/64≈306.796 mm⁴; J=πd⁴/32≈613.592 mm⁴; c=25 mm.","σ_N=N/A=40.000/1963,50=20,37 MPa.","σ_b=Mc/I=1,5×10⁶×25/306.796≈122,23 MPa. Aynı noktada en büyük normal gerilme σ_x≈142,60 MPa alınır.","τ=T c/J=1,0×10⁶×25/613.592≈40,74 MPa; σ_y=0 kabulüyle σ_1,2=σ_x/2±√[(σ_x/2)²+τ²].","σ_1≈153,4 MPa ve σ_2≈−10,8 MPa bulunur. İşaretler seçilen kritik lif ve moment yönü için geçerlidir."],"Sonuç: Kritik dış lifte yaklaşık σ_x=142,6 MPa normal ve τ=40,7 MPa kayma gerilmesi; asal gerilmeler yaklaşık 153,4 MPa ve −10,8 MPa'dır."]],"engineering":"Kiriş-kolon birleşimleri, eksantrik yük taşıyan kolonlar, tahrik milleri, vinç kolları, bağlantı elemanları ve taşıyıcı parçalarında birden fazla iç tesir aynı anda oluşabilir. Tasarımda kesit, malzeme ve ilgili standarttaki dayanım ölçütü birlikte değerlendirilir.","pitfalls":["N/A ile My/I bileşenlerini farklı işaret kurallarıyla toplayıp yanlış sonuç bulmak.","M=Pe momentini eksantrik yükte unutmak.","Eğilme gerilmesinin iki dış lifte aynı işaretli olacağını varsaymak.","Dairesel milde I ile J'yi karıştırmak.","Birleşik gerilme durumunda yalnız normal gerilme veya yalnız kayma gerilmesine bakmak.","Von Mises veya Tresca ölçütünü malzeme türü ve problem koşulunu belirtmeden evrensel kabul etmek."],"checks":[["Eksantrik eksenel kuvvet hangi iki iç etkiyi oluşturur?","N=P eksenel kuvveti ve M=P·e eğilme momenti oluşturur."],["Eksenel kuvvet ve eğilme momenti birlikteyse normal gerilme nasıl hesaplanır?","Doğrusal elastik kesitte σ=N/A±My/I biçiminde cebirsel toplanır."],["Dairesel milde burulma kayma gerilmesi hangi bağıntıyla bulunur?","τ=Tr/J; dış lifte r=c alınır."],["Süperpozisyon hangi temel kabul altında uygulanır?","Malzeme davranışı doğrusal elastik ve deformasyonlar küçük olduğunda gerilme etkileri cebirsel toplanabilir."],["Birleşik yüklemede neden asal gerilme veya akma ölçütü gerekebilir?","Aynı noktada normal ve kayma bileşenleri birlikte bulunduğundan malzemenin kritik gerilme durumu tek bileşenle temsil edilemeyebilir."]]},"10":{"intro":"Bir noktadaki gerilme bileşenleri, elemanın içinden seçilen düzlemin yönüne göre değişir. Mohr dairesi, düzlem gerilme durumunda bu dönüşümü grafiksel ve sayısal olarak görmeyi; asal normal gerilmeleri, maksimum kayma gerilmesini ve bunların düzlem yönlerini bulmayı sağlar.","sections":[["1. Gerilme bileşenleri ve düzlem","x-y düzleminde σ_x ve σ_y normal gerilmeleri, τ_xy kayma gerilmesi olarak gösterilir. Yüzey normali döndürüldüğünde normal ve kayma bileşenleri değişir; aynı fiziksel noktanın gerilme durumu değişmez."],["2. Gerilme dönüşüm denklemleri","Döndürülmüş düzlemin normal gerilmesi σ_θ=(σ_x+σ_y)/2+((σ_x−σ_y)/2)cos2θ+τ_xy sin2θ; kayma gerilmesi ise kullanılan işaret konvansiyonuna bağlı olarak −((σ_x−σ_y)/2)sin2θ+τ_xy cos2θ biçimindedir. Açı iki kat görünür."],["3. Mohr dairesinin merkezi ve yarıçapı","Yatay eksen normal gerilme σ, düşey eksen kayma gerilmesi τ olacak şekilde çizilir. Merkez C=(σ_x+σ_y)/2,0; yarıçap R=√[((σ_x−σ_y)/2)²+τ_xy²] olur. Başlangıçtaki iki dik yüzey gerilme noktası dairenin çap uçlarını oluşturur."],["4. Asal gerilmeler","Dairenin yatay ekseni kestiği noktalar kayma gerilmesinin sıfır olduğu asal düzlemlerdir. Asal gerilmeler σ_1,2=σ_avg±R bağıntısıyla bulunur. σ_1 en büyük, σ_2 en küçük asal normal gerilmedir."],["5. Maksimum kayma gerilmesi","Dairenin üst ve alt noktalarında kayma gerilmesi mutlak maksimumdur: τ_max=R. Bu düzlemlerdeki normal gerilme σ_avg değerindedir. Düzlem içi maksimum kayma ile üç boyutlu mutlak maksimum kayma kavramları karıştırılmamalıdır."],["6. Düzlem yönü ve iki kat açı","Fiziksel elemanın θ kadar dönmesi Mohr dairesinde 2θ kadar dönmeye karşılık gelir. Asal düzlem yönü için tan(2θ_p)=2τ_xy/(σ_x−σ_y) kullanılabilir; doğru bölgeyi belirlemek için atan2 yaklaşımı veya daire üzerindeki noktalar kullanılmalıdır. İşaret konvansiyonu açı yönünü etkiler."],["7. Sınavda çözüm sırası","Önce σ_x, σ_y ve τ_xy işaretleriyle yazılır. Ortalama gerilme ve R hesaplanır. Asal gerilmeler ve τ_max bulunur. İsteniyorsa asal düzlem açısı belirlenir. Son olarak Mohr dairesi merkez, yarıçap, başlangıç noktaları ve asal noktalarla çizilir."]],"formula":"σ_avg = (σ_x + σ_y)/2\nR = √[((σ_x−σ_y)/2)² + τ_xy²]\nσ₁,₂ = σ_avg ± R     ;     τ_max = R\ntan(2θ_p) = 2τ_xy/(σ_x−σ_y)","meaning":"Tüm gerilmeler aynı birimde olmalıdır (genellikle MPa). σ_avg daire merkezi, R yarıçaptır. θ_p fiziksel elemanın asal düzlem açısıdır; Mohr dairesindeki açı 2θ_p'dir. Kayma gerilmesi işareti ve dairede dönüş yönü, dersin kullandığı konvansiyona göre belirlenmelidir.","derivation":"Döndürülmüş küçük bir elemanın x' ve y' yüzeylerinde kuvvet dengesi yazıldığında σ_θ ve τ_θ dönüşüm denklemleri elde edilir. Bu iki denklem, σ_θ−σ_avg ve τ_θ koordinatlarının yarıçapı sabit bir çember üzerinde bulunduğunu gösterir: (σ_θ−σ_avg)²+τ_θ²=R². Böylece gerilme dönüşümü merkez ve yarıçapı belirli bir daireyle temsil edilir. σ ekseniyle kesişimlerde τ=0 olduğundan asal gerilmeler; dairenin en üst-alt noktalarında ise maksimum kayma gerilmesi elde edilir.","diagram":"mohr","examples":[["Örnek 1 — Genel düzlem gerilme durumunda Mohr dairesi","Bir noktada σ_x=80 MPa çekme, σ_y=20 MPa çekme ve τ_xy=30 MPa'dır. Asal gerilmeleri ve maksimum düzlem içi kayma gerilmesini bulun.",["σ_avg=(80+20)/2=50 MPa.","R=√[((80−20)/2)²+30²]=√(30²+30²)=42,43 MPa.","σ_1=50+42,43=92,43 MPa.","σ_2=50−42,43=7,57 MPa.","τ_max=R=42,43 MPa; bu düzlemlerde normal gerilme 50 MPa'dır."],"Sonuç: σ_1≈92,4 MPa; σ_2≈7,6 MPa; τ_max≈42,4 MPa."],["Örnek 2 — Saf kayma durumu","Bir noktada σ_x=σ_y=0 ve τ_xy=50 MPa saf kayma gerilmesi vardır. Asal gerilmeleri ve asal düzlem yönünü bulun.",["σ_avg=0.","R=√[0²+50²]=50 MPa.","σ_1=+50 MPa ve σ_2=−50 MPa.","Asal düzlemlerde kayma gerilmesi sıfırdır. Saf kaymada asal düzlemler başlangıç yüzeylerine 45° açı yapar.","τ_max=50 MPa; Mohr dairesinde fiziksel 45° dönüş, dairede 90° dönüşe karşılık gelir."],"Sonuç: asal gerilmeler +50 MPa ve −50 MPa; asal düzlemler 45° yönelimlidir."],["Örnek 3 — Tek eksenli çekmede maksimum kayma","σ_x=100 MPa, σ_y=0 ve τ_xy=0 tek eksenli çekme durumu veriliyor. Mohr dairesi özelliklerini bulun.",["σ_avg=(100+0)/2=50 MPa.","R=√[(50)²+0]=50 MPa.","Asal gerilmeler σ_1=100 MPa, σ_2=0 MPa'dır.","Maksimum düzlem içi kayma τ_max=50 MPa; bu noktalarda normal gerilme 50 MPa olur.","Maksimum kayma düzlemleri asal düzlemlere 45° yönelir."],"Sonuç: Mohr dairesi merkezi 50 MPa, yarıçapı 50 MPa; asal gerilmeler 100 ve 0 MPa, maksimum düzlem içi kayma 50 MPa'dır."]],"engineering":"Kiriş ve kolon birleşimleri, eksantrik yüklenen kesitler, miller ve bağlantılarda farklı düzlemlerdeki kritik gerilmelerin belirlenmesinde kullanılır. Tasarım değerlendirmesinde Mohr dairesi, seçilen malzeme dayanım ölçütüne girdi sağlayabilir.","pitfalls":["Mohr dairesinde fiziksel açı θ yerine 2θ ilişkisini unutmak.","Kayma gerilmesinin işaretini çizimde rastgele değiştirmek.","Asal gerilme ile maksimum kayma gerilmesini aynı büyüklük sanmak.","Daire merkezini σ_avg yerine sıfıra koymak.","Düzlem içi maksimum kaymayı üç boyutlu mutlak maksimum kayma ile karıştırmak.","Açı hesabında tan oranının doğru bölgesini seçmemek."],"checks":[["Mohr dairesinin merkezi hangi büyüklüktür?","σ_avg=(σ_x+σ_y)/2."],["Mohr dairesinin yarıçapı hangi gerilme bileşenlerine bağlıdır?","R=√[((σ_x−σ_y)/2)²+τ_xy²]."],["Asal gerilmeler nasıl bulunur?","σ_1,2=σ_avg±R."],["Düzlem içi maksimum kayma gerilmesi kaçtır?","τ_max=R."],["Fiziksel eleman 30° dönerse Mohr dairesinde açı ne olur?","Mohr dairesindeki açı 2×30°=60° olur; dönüş yönü işaret konvansiyonuna bağlıdır."]]},"11":{"intro":"Kirişte V kesme kuvveti, kesit boyunca dağıtılmış kayma gerilmesi üretir. Önceki konuda V diyagramı bulunmuştu; şimdi bu iç kesme kuvvetinin kiriş kesitinde nasıl taşındığı, kayma gerilmesinin nerede büyüdüğü ve kesitin genişliğine nasıl bağlı olduğu incelenir.","sections":[["1. Kesme kuvveti ile kayma gerilmesi farkı","V, kesitteki iç kesme kuvvetinin bileşkesidir ve birimi N veya kN'dir. τ ise bu etkinin kesit alanına dağılımını tanımlar; birimi Pa veya MPa'dır. V diyagramı tek başına kesit içindeki τ dağılımını vermez."],["2. Kirişlerde kayma gerilmesi bağıntısı","Elastik kiriş teorisinde τ=VQ/(I t) kullanılır. V kesitteki kesme kuvveti, Q incelenen seviyenin üstünde veya altında kalan alanın nötr eksene göre birinci alan momenti, I tüm kesitin nötr eksene göre ikinci alan momenti, t ise kayma gerilmesinin hesaplandığı yerdeki kesit genişliğidir."],["3. Birinci alan momenti Q","Q=A′·ȳ şeklinde hesaplanır. A′, kesitin seçilen yatay seviyesinin bir tarafında kalan alan; ȳ ise bu alanın ağırlık merkezinin nötr eksene dik uzaklığıdır. Q, ikinci alan momenti I ile aynı şey değildir; birimleri mm³ ve mm⁴ farklıdır."],["4. Dikdörtgen kesitte kayma dağılımı","Dikdörtgen kesitte kayma gerilmesi parabolik dağılır; dış üst ve alt yüzeylerde sıfır, nötr eksende maksimumdur. Maksimum değer τ_max=3V/(2A) olur. Bu özel sonuç yalnız dikdörtgen kesit ve klasik elastik kiriş kabulleri altında kullanılır."],["5. I kesitlerde web ve flanş davranışı","I kesitlerde kesme kuvvetinin büyük bölümü gövdeden (web) taşınır. Kayma gerilmesi web içinde yüksek, geniş flanşlarda genellikle daha düşüktür. Flanş-web birleşiminde kayma akısı q=VQ/I (N/mm) ile ifade edilebilir; web kalınlığı t'ye bölünerek ortalama kayma gerilmesine geçilir."],["6. İşaret, dağılım ve tasarım kontrolü","τ=VQ/(It) bir kesitte seçilen seviyedeki gerilme büyüklüğünü verir. Gerilme dağılımı kesit geometrisine bağlıdır. Kesme gerilmesi, eğilme normal gerilmesiyle birlikte değerlendirilebilir; kesme dayanımı ve bağlantı/mesnet çevresindeki yerel etkiler ayrıca kontrol edilmelidir."],["7. Çözüm algoritması","V diyagramından kritik kesitte V'yi bul. Nötr ekseni ve kesit I değerini belirle. İncelenen seviyenin bir tarafındaki A′ alanını ve ȳ uzaklığını kullanarak Q hesapla. O seviyedeki t kalınlığını belirle. τ=VQ/(It) uygula; dikdörtgen kesitte özel maksimum formülle kontrol et."]],"formula":"τ = V Q / (I t)     ;     Q = A′ ȳ\nq = V Q / I     ;     Dikdörtgen: τ_max = 3V/(2A)","meaning":"V: kesme kuvveti (N), Q: birinci alan momenti (mm³), I: kesitin ikinci alan momenti (mm⁴), t: seçilen seviyedeki kesit genişliği/kalınlığı (mm), q: kayma akısı (N/mm). N, mm ve mm²/⁴ sisteminde τ N/mm²=MPa çıkar.","derivation":"Kirişte x doğrultusunda ilerlerken eğilme momenti değişir ve boyuna normal gerilme dağılımının bileşkesi de değişir. Komşu kesitler arasındaki bu farkı küçük bir kiriş elemanının boyuna denge denklemiyle karşılamak için kesit içinde kayma gerilmesi gerekir. Denge ve eğilme bağıntısı birlikte kullanıldığında τ=VQ/(It) elde edilir. Dikdörtgen kesitte Q'nun yükseklikle değişimi yerine konduğunda parabolik dağılım ve τ_max=3V/(2A) çıkar.","diagram":"shearstress","examples":[["Örnek 1 — Dikdörtgen kirişte maksimum kayma gerilmesi","b=100 mm, h=200 mm dikdörtgen kirişte kritik kesitte V=60 kN'dur. Maksimum kayma gerilmesini bulun.",["A=bh=100×200=20.000 mm².","Dikdörtgen kesit için τ_max=3V/(2A).","V=60.000 N olduğundan τ_max=3×60.000/(2×20.000)=4,50 N/mm².","Dikdörtgen kesitte maksimum değer nötr eksende, üst ve alt yüzeylerde ise sıfırdır."],"Sonuç: τ_max=4,50 MPa ve nötr eksende oluşur."],["Örnek 2 — I kesit gövdesinde nötr eksen kayması","Simetrik I kesitte flanşlar 160×20 mm, gövde 20×160 mm ve toplam yükseklik 200 mm'dir. V=100 kN iken nötr eksendeki kayma gerilmesini bulun.",["Nötr eksenden geçen yatay eksene göre I=2[160×20³/12+3200×90²]+20×160³/12=58,88×10⁶ mm⁴.","Üst flanş alanı 3200 mm² ve ağırlık merkezinin nötr eksene uzaklığı 90 mm'dir.","Üst gövde yarım alanı 20×80=1600 mm² ve ağırlık merkezinin uzaklığı 40 mm'dir.","Q=3200×90+1600×40=352.000 mm³; nötr eksende t=20 mm.","τ=VQ/(It)=100.000×352.000/(58,88×10⁶×20)=29,89 MPa."],"Sonuç: I kesitin gövdesinde nötr eksende yaklaşık 29,9 MPa kayma gerilmesi oluşur."],["Örnek 3 — Dikdörtgen kesitte nötr eksen dışındaki kayma","b=100 mm, h=200 mm dikdörtgen kirişte V=60 kN'dur. Nötr eksenden y=50 mm uzaklıktaki kayma gerilmesini bulun.",["A=20.000 mm²; kesitin nötr eksenine göre maksimum kayma 3V/(2A)=4,50 MPa'dır.","Dikdörtgen kesitte dağılım τ(y)=τ_max[1−4y²/h²] şeklindedir.","y=50 mm ve h=200 mm için 1−4×50²/200²=1−0,25=0,75.","τ(50)=4,50×0,75=3,375 MPa.","Sonuç nötr eksendeki maksimum değerden küçüktür; yüzeye yaklaştıkça sıfıra iner."],"Sonuç: Nötr eksenden 50 mm uzaklıkta τ≈3,38 MPa'dır."]],"engineering":"Köprü kirişleri, döşeme kirişleri, çelik I profiller, mesnet bölgeleri, bağlantılar ve taşıyıcı elemanların gövdelerinde kesme kuvvetinin kesit boyunca nasıl taşındığını anlamak için kullanılır.","pitfalls":["V (kN) ile τ (MPa) büyüklüklerini karıştırmak.","Q birinci alan momentini I ikinci alan momentiyle karıştırmak.","t kalınlığını seçilen kesit seviyesindeki gerçek web/flanş kalınlığı yerine toplam kesit genişliği almak.","Dikdörtgen için τ=V/A kullanıp 1,5 çarpanını unutmak.","I kesitte kesmenin tamamının flanştan geçtiğini varsaymak.","Dış yüzeyde dikdörtgen kesme gerilmesinin sıfır olduğunu göz ardı etmek."],"checks":[["Kesme kuvveti V ile kayma gerilmesi τ arasındaki fark nedir?","V kesitteki iç kuvvet bileşkesidir; τ birim alana dağılan kayma gerilmesidir."],["τ=VQ/(It) bağıntısında Q neyi ifade eder?","Seçilen seviyenin bir tarafındaki alanın nötr eksene göre birinci alan momentidir."],["Dikdörtgen kesitte maksimum kayma nerede oluşur?","Nötr eksende; büyüklüğü 3V/(2A)'dır."],["I kesitte kesme kuvvetinin büyük bölümü hangi bölgede taşınır?","Genellikle ince gövdede (web) taşınır."],["Kayma akısı q=VQ/I hangi birime sahiptir?","Kuvvet/uzunluk, örneğin N/mm."]]},"12":{"intro":"Basınç kuvveti taşıyan ince ve uzun elemanlar, malzeme ezilme dayanımına ulaşmadan yanal yönde ani şekil değiştirerek stabilitesini kaybedebilir. Bu olaya burkulma denir. Burkulma dayanım hesabı, yalnız gerilme hesabı değil; eleman boyu, uç koşulları ve atalet momentiyle ilişkili bir stabilite problemidir.","sections":[["1. Basınç gerilmesi ile burkulma farkı","Kısa basınç elemanlarında malzeme dayanımı ve kesit alanı belirleyici olabilir. Uzun-ince kolonlarda ise küçük bir yanal sapma eğilme momenti doğurur ve eleman kararsız hale gelebilir. Bu nedenle P/A hesabı tek başına yeterli değildir."],["2. Euler kritik yükü","İdeal, doğrusal elastik, düzgün ve eksenel yüklü uzun kolon için kritik yük P_cr=π²EI/(K L)² bağıntısıyla bulunur. E elastisite modülü, I burkulmanın gerçekleştiği eksene ait en küçük alan atalet momenti, L gerçek boy ve K etkin boy katsayısıdır."],["3. Uç koşulları ve etkin boy","Uç dönme/öteleme kısıtları kolonun burkulma şeklini değiştirir. İdeal mafsal-mafsal için K=1, ankastre-serbest için K=2, ankastre-ankastre için K=0,5; ankastre-mafsallı için yaklaşık K=0,7 alınabilir. Gerçek bağlantının rijitliği ve çerçeve ötelenmesi tasarımda ayrıca değerlendirilir."],["4. Narinlik oranı ve kritik gerilme","Atalet yarıçapı r=√(I/A), narinlik oranı λ=K L/r'dir. Euler kritik gerilmesi σ_cr=P_cr/A=π²E/λ² olur. Burkulma hesabında en küçük atalet momentine sahip eksen genellikle kritik yöndür."],["5. Euler teorisinin geçerlilik koşulları","Euler bağıntısı uzun ve narin kolonlarda elastik burkulma için kullanılır. Malzeme doğrusal elastik kalmalı; yük eksenel ve merkezî olmalı; eleman başlangıçta doğrusal/prizmatik kabul edilmeli ve uç koşulları idealize edilmelidir. Orta/kısa kolonlarda akma ve inelastik davranış için farklı yaklaşımlar veya yönetmelik bağıntıları gerekir."],["6. Emniyet ve tasarım","İdeal Euler kritik yükü, tasarımda doğrudan izin verilebilir yük değildir. Emniyet katsayısı, başlangıç kusurları, artık gerilmeler, ikinci mertebe etkileri, malzeme akması ve ilgili tasarım standardı dikkate alınır. Tasarım dayanımı yürürlükteki standarda göre belirlenmelidir."],["7. Çözüm algoritması","Kesit özelliklerini hesapla ve burkulma eksenini belirle. Uç koşullarından K'yı seç. Etkin boy KL ve narinlik oranını bul. Euler koşullarının geçerli olup olmadığını tartış. P_cr ve gerekiyorsa σ_cr hesapla; tasarım yüküyle ilgili standarda göre karşılaştır."]],"formula":"P_cr = π² E I_min / (K L)²\nr = √(I_min/A)     ;     λ = K L/r\nσ_cr = P_cr/A = π² E/λ²","meaning":"P_cr kritik yük (N), E elastisite modülü (N/mm²), I_min kritik eksene göre en küçük ikinci alan momenti (mm⁴), K etkin boy katsayısı, L gerçek kolon boyu (mm), r atalet yarıçapı (mm), λ narinlik oranıdır. K katsayısı uç koşullarına bağlıdır; gerçek taşıyıcı sistemin mesnet ve ötelenme şartları doğru modellenmelidir.","derivation":"Küçük yanal şekil değiştirmiş kolon için eğilme denklemi EI v''=M ve eksenel basınçtan gelen ikinci mertebe moment M≈−P v yazılır. Böylece EI v''+P v=0 diferansiyel denklemi oluşur. Sınır koşullarını sağlayan sıfırdan farklı şekil değiştirme çözümünün ortaya çıktığı en küçük yük, Euler kritik yüküdür. Uç şartları etkin boy KL ile temsil edilir.","diagram":"buckling","examples":[["Örnek 1 — Mafsallı iki uçlu çelik kolonun Euler yükü","L=3000 mm, E=200.000 MPa ve kritik eksene göre I_min=8,0×10⁶ mm⁴ olan mafsal-mafsal kolonda Euler kritik yükünü bulun.",["Mafsallı-mafsallı ideal kolon için K=1.","P_cr=π²EI/(KL)².","P_cr=π²×200.000×8,0×10⁶/(1×3000)².","P_cr≈1,7546×10⁶ N=1754,6 kN."],"Sonuç: İdeal Euler kritik yükü yaklaşık 1,755 MN'dur; tasarım yükü olarak doğrudan kullanılmaz."],["Örnek 2 — Ankastre-serbest kolonda uç koşulu etkisi","L=2000 mm, E=70.000 MPa, I_min=2,4×10⁶ mm⁴ olan ankastre-serbest kolonda Euler kritik yükünü hesaplayın.",["Ankastre-serbest ideal kolon için K=2; etkin boy KL=4000 mm'dir.","P_cr=π²×70.000×2,4×10⁶/(4000)².","P_cr≈103.630 N=103,6 kN.","Aynı gerçek uzunluk ve kesitte K=1 olsaydı kritik yük dört kat olurdu; çünkü yük 1/K² ile değişir."],"Sonuç: Ankastre-serbest kolon için P_cr≈103,6 kN."],["Örnek 3 — Kolon boyunun kritik yüke etkisi","Aynı E, I ve mafsallı-mafsallı uç koşullarına sahip kolonun boyu 3 m'den 4 m'ye çıkarılıyor. Kritik yükün yeni/eski oranını bulun.",["P_cr∝1/L² olduğundan oran P_4/P_3=(3/4)².","P_4/P_3=9/16=0,5625.","Yeni kritik yük eski değerin %56,25'idir; yaklaşık %43,75 azalır.","İlk örnekteki P_3=1754,6 kN ise P_4≈987,0 kN."],"Sonuç: Kolon boyunun 3 m'den 4 m'ye çıkması Euler kritik yükünü yaklaşık %43,75 azaltır."]],"engineering":"Kolonlar, vinç ve makine ayakları, basınç çubukları, çelik çerçeveler, köprü kafes elemanları ve uzun ince taşıyıcı elemanlarda stabilite kontrolü yapılır. Saha uygulamasında eksantrisite, başlangıç eğriliği, bağlantı rijitliği ve ikinci mertebe etkileri önemlidir.","pitfalls":["Euler bağıntısında gerçek boy L yerine etkin boy KL'yi kullanmayı unutmak.","Burkulmanın en zayıf eksen etrafında olabileceğini göz ardı etmek.","I yerine polar atalet momenti J kullanmak.","Ankastre-serbest kolonda K=1 almak; ideal modelde K=2'dir.","Euler yükünü her narinlikteki kolona uygulamak.","İdeal kritik yükü yönetmelik tasarım dayanımı veya emniyetli çalışma yükü sanmak."],"checks":[["Burkulma neden basınç gerilmesi hesabından farklıdır?","Burkulma, elemanın yanal kararlılığını kaybetmesidir; malzeme ezilmeden de oluşabilir."],["Mafsallı-mafsallı kolon için ideal K değeri kaçtır?","K=1."],["Ankastre-serbest kolonun ideal K değeri kaçtır?","K=2."],["Euler kritik yükü kolon boyuyla nasıl değişir?","Diğer koşullar sabitken 1/L² ile ters orantılıdır."],["Euler bağıntısının başlıca geçerlilik sınırı nedir?","Uzun-narin, doğrusal elastik, idealize edilmiş eksenel basınç kolonları içindir; kısa/orta kolonlar ve gerçek tasarım için uygun inelastik/yönetmelik kontrolleri gerekir."]]},"13":{"intro":"Enerji metotları, elemanın içinde depolanan şekil değiştirme enerjisinden yararlanarak yer değiştirme ve dönme hesaplamayı sağlar. Özellikle kiriş, çerçeve, kafes ve statikçe belirsiz sistemlerde doğrudan denklemlerle çözümü zor olan deplasman problemlerini sistematik biçimde çözer.","sections":[["1. Şekil değiştirme enerjisi","Elastik bir eleman yük altında şekil değiştirdiğinde içinde enerji depolanır. Yük yavaş ve kademeli uygulanıyorsa doğrusal elastik elemanda enerji, yük-deplasman eğrisinin altında kalan alandır. U, joule veya N·mm gibi enerji birimiyle ifade edilir."],["2. Eksenel yükte enerji","Prizmatik eksenel çubukta sabit N, A ve E için U=N²L/(2AE)'dir. Değişken iç kuvvet veya kesit için U=∫N(x)²/[2A(x)E(x)] dx kullanılır. Bu bağıntı doğrusal elastik ve küçük şekil değiştirme kabullerine dayanır."],["3. Eğilme enerjisi","Kirişte eğilmeden depolanan enerji U_b=∫M(x)²/[2EI(x)] dx olur. E ve I sabitse integral yalnız M(x)'in karesine göre alınır. Kesme deformasyonunun önemli olduğu kısa/derin kirişlerde kesme enerjisi terimi de gerekebilir."],["4. Burulma ve kesme enerjisi","Burulmada enerji U_T=∫T²/(2GJ)dx ile; kiriş kesmesinde ise kesme deformasyonu dikkate alınan Timoshenko türü yaklaşımda U_V=∫V²/(2κ_sGA)dx ile yazılabilir. Burada G kayma modülü, J polar atalet momenti, A kesit alanı ve κ_s kesme düzeltme katsayısıdır. Kullanılan kiriş teorisi kesme deformasyonunu ihmal ediyorsa U_V terimi modele eklenmez; bu varsayım açıkça belirtilmelidir."],["5. Castigliano teoremi","Lineer elastik sistemde toplam şekil değiştirme enerjisinin bir kuvvete göre türevi, kuvvetin uygulama doğrultusundaki yer değiştirmeyi verir: δ_i=∂U/∂P_i. Bir momente göre türev ise dönmeyi verir: θ_i=∂U/∂M_i. Aranan yerde yük yoksa sanal birim yük ekleyip türev alınabilir."],["6. Birim yük / sanal iş yöntemi","İstenen doğrultuya birim kuvvet veya birim moment uygula. Gerçek yükten doğan N, M ve T iç kuvvetleriyle birim yükten doğan n, m ve t iç kuvvetlerini çarpıp eleman boyunca integre et: δ=∫Nn/(AE)dx+∫Mm/(EI)dx+∫Tt/(GJ)dx. Yöntem, doğrusal elastik sistem ve uyumlu işaret kabulleriyle kullanılır."],["7. Sınırlar ve sınav çözüm sırası","Enerji yöntemi küçük deplasmanlı doğrusal elastik davranışta etkilidir. Yüklerin uygulama noktası ve yönü açıkça tanımlanmalı; integral aralıkları iç kuvvet fonksiyonlarının geçerli olduğu bölgelere ayrılmalıdır. Önce enerji ifadesini kur, sonra aranan yük/deplasman değişkenine göre türev al ve sınır koşullarıyla kontrol et."]],"formula":"U_N = ∫ N²/(2AE) dx     ;     U_M = ∫ M²/(2EI) dx\nU_T = ∫ T²/(2GJ) dx     ;     U_V = ∫ V²/(2κ_s G A) dx\nCastigliano: δ = ∂U/∂P     ;     θ = ∂U/∂M","meaning":"N eksenel kuvvet, M eğilme momenti, T tork; A alan, E elastisite modülü, I alan atalet momenti, G kayma modülü, J polar atalet momenti. δ doğrusal yer değiştirme (mm), θ dönme (radyan), U enerji (N·mm veya J). İntegral, elemanın uzunluğu ve parça parça değişen özellikleri boyunca alınır. Kesme deformasyonunun önemli olduğu kiriş modelinde kesme enerjisi U_V=∫V²/(2κ_sGA)dx ile eklenebilir; κ_s kesme düzeltme katsayısıdır. İnce/uzun kirişlerde kesme katkısı çoğu kez küçük olsa da kullanılan kiriş teorisinin kabulleri kontrol edilmelidir.","derivation":"Doğrusal elastik sistemde küçük bir ilave yük artışı dP için yapılan sanal iş dU=δ dP olur. Bu nedenle toplam şekil değiştirme enerjisi U, ilgili yükün integrali olarak düşünülebilir. U yükün fonksiyonuysa türev alınarak δ=∂U/∂P elde edilir. Eksenel, eğilme ve burulma iç kuvvetlerinden doğan enerji katkıları ayrı yazılıp toplanır. Bu yöntem Castigliano teoreminin ve birim yük yönteminin temelini oluşturur.","diagram":"energy","examples":[["Örnek 1 — Eksenel çubukta enerji ve uzama","N=30 kN, L=2000 mm, A=500 mm², E=200.000 MPa olan prizmatik çubukta şekil değiştirme enerjisini ve uzamayı bulun.",["Uzama δ=NL/(AE)=30.000×2000/(500×200.000)=0,60 mm.","Doğrusal elastik ve kademeli yüklemede U=½Nδ.","U=0,5×30.000×0,60=9000 N·mm.","1 J=1000 N·mm olduğundan U=9 J."],"Sonuç: δ=0,60 mm ve U=9 J."],["Örnek 2 — Castigliano ile ankastre kiriş ucunda sehim","L=2000 mm konsol kirişin serbest ucuna P=2 kN düşey yük uygulanıyor. E=200.000 MPa ve I=8×10⁶ mm⁴. Uç sehmini enerji yöntemiyle bulun.",["Ankastre uçtan x ölçülürse M(x)=P(L−x).","U=∫₀ᴸ M²/(2EI)dx=P²/(2EI)∫₀ᴸ(L−x)²dx.","İntegral L³/3 olduğundan U=P²L³/(6EI).","Castigliano: δ=∂U/∂P=PL³/(3EI).","δ=2000×2000³/[3×200.000×8×10⁶]=3,33 mm."],"Sonuç: Serbest uç sehmi yaklaşık 3,33 mm'dir."],["Örnek 3 — Burulma enerjisi ve uç dönmesi","d=40 mm dolu mil, L=1500 mm, T=0,5 kN·m ve G=80.000 MPa'dır. Burulma enerjisini ve dönme açısını bulun.",["J=πd⁴/32=π×40⁴/32≈251.327 mm⁴.","T=0,5 kN·m=500.000 N·mm.","φ=TL/(GJ)=500.000×1500/(80.000×251.327)≈0,0373 rad.","U=½Tφ=0,5×500.000×0,0373≈9325 N·mm=9,33 J."],"Sonuç: φ≈0,0373 rad ve U≈9,33 J."]],"engineering":"Kiriş sehmi, çerçeve yer değiştirmesi, kafes sistem deplasmanı, statikçe belirsiz çubuk kuvvetleri, dönen miller ve makine parçalarının elastik davranışını hesaplamada kullanılır. Tasarımda servis verilebilirlik ve rijitlik kontrollerine temel oluşturur.","pitfalls":["U yerine yalnız kuvvet veya momenti yazıp enerji birimini kaybetmek.","Eksenel enerji, eğilme enerjisi ve burulma enerjisini yanlış iç kuvvetle ilişkilendirmek.","Castigliano türevinde aranan doğrultudaki yükü ve işaretini tanımlamamak.","Parçalı iç kuvvet fonksiyonlarında integral sınırlarını ayırmamak.","Kesme deformasyonunun önemli olduğu elemanda yalnız eğilme enerjisini kullanmak.","Enerji yöntemini doğrusal olmayan veya büyük deplasmanlı sistemlerde koşulsuz uygulamak."],"checks":[["Sabit eksenel kuvvetli prizmatik çubukta U nedir?","U=N²L/(2AE)."],["Castigliano teoreminde ∂U/∂P neyi verir?","P kuvvetinin uygulama doğrultusundaki yer değiştirmeyi verir."],["Bir momente göre enerji türevi neyi verir?","İlgili noktadaki dönmeyi verir."],["Kirişte eğilme enerjisi hangi iç tesire bağlıdır?","U_b=∫M²/(2EI)dx; eğilme momentine bağlıdır."],["Birim yük yöntemi hangi koşullarda kullanılır?","Doğrusal elastik, küçük şekil değiştirmeli sistemlerde uygun birim yük ve gerçek yük iç kuvvetleriyle sanal iş integrali alınır."]]},"14":{"intro":"Kirişin yalnız taşıma kapasitesi değil, yük altındaki şekil değiştirmesi de önemlidir. Eğim θ, elastik eğrinin teğet açısını; sehim v(x), kiriş ekseninin düşey yer değiştirmesini ifade eder. Elastik eğri yöntemi, moment fonksiyonundan kirişin eğimini ve sehmini bulur.","sections":[["1. Eğim ve sehim kavramı","Eğilme altında kiriş ekseni eğri bir şekil alır. v(x) düşey yer değiştirme, θ(x)=dv/dx ise küçük dönme kabulünde eğimdir. Birimi v için mm, θ için radyandır. Eğim ve sehim farklı sonuç büyüklükleridir."],["2. Elastik eğri diferansiyel denklemi","Euler–Bernoulli kiriş teorisinde, işaret konvansiyonuna bağlı olarak EI v''(x)=M(x) yazılır. E elastisite modülü, I kesitin eğilme eksenine göre ikinci alan momentidir. E ve I sabitse eğrilik momentle orantılıdır."],["3. Çift integrasyon yöntemi","Önce M(x) fonksiyonunu her yükleme aralığı için yaz. EI v''=M denklemini bir kez integre ederek eğimi θ=v' + sabit; ikinci kez integre ederek sehmi v elde et. Her integrasyonda bir sabit oluşur ve bu sabitler sınır/uygunluk koşullarıyla belirlenir."],["4. Sınır ve süreklilik koşulları","Basit mesnette düşey yer değiştirme v=0; ankastre uçta hem v=0 hem θ=0 koşulları vardır. Sürekli kirişte yük veya kesit değişiminin olduğu iç noktada, fiziksel bağlantı kopuk değilse eğim ve sehim süreklidir. Parça parça fonksiyonlarda sabitler bu koşullarla çözülür."],["5. Standart yükleme durumları","Konsol kirişin serbest ucunda tekil P yükü için δ_tip=PL³/(3EI), θ_tip=PL²/(2EI). Basit mesnetli kirişin orta noktasına P yükü için δ_max=PL³/(48EI). Konsol kirişte tüm açıklığa düzgün yayılı w yükü için δ_tip=wL⁴/(8EI) olur. Bu sonuçlar sabit EI, küçük sehim ve ideal mesnet kabulleriyle geçerlidir."],["6. Süperpozisyon ve elastik eğri","Doğrusal elastik davranışta ayrı yüklerden doğan eğim ve sehim değerleri cebirsel toplanabilir. Birden fazla tekil/yayılı yük varsa her yükün katkısını uygun standart bağıntı veya çift integrasyonla bulup toplamı oluştur. İşaret ve referans yönü korunmalıdır."],["7. Geçerlilik ve tasarım yorumu","Klasik elastik eğri yöntemi küçük dönme/sehim, doğrusal elastik malzeme ve Euler–Bernoulli kiriş varsayımlarına dayanır; kesme deformasyonunun önemli olduğu kısa/derin kirişlerde Timoshenko etkisi gerekebilir. Bulunan sehmi yalnız gerilme dayanımıyla karşılaştırma; servis verilebilirlik sınırları ilgili tasarım standardına göre ayrıca kontrol edilir."]],"formula":"θ(x) = dv/dx     ;     E I v''(x) = M(x)\nKonsol uç P:  θ_tip = P L²/(2EI)  ;  δ_tip = P L³/(3EI)\nBasit kiriş orta P:  δ_max = P L³/(48EI)\nKonsol tüm açıklık w:  δ_tip = w L⁴/(8EI)","meaning":"v veya δ sehim/yer değiştirme (mm), θ eğim (radyan), M eğilme momenti (N·mm), E elastisite modülü (N/mm²), I ikinci alan momenti (mm⁴), L kiriş boyudur (mm). Yük ve moment işaretleri seçilen koordinat yönüyle tutarlı olmalıdır.","derivation":"Küçük eğim kabulünde elastik eğrinin eğriliği yaklaşık v''(x) olur. Euler–Bernoulli kiriş teorisinde M/EI=1/ρ≈v'' eşitliğinden EI v''=M elde edilir. Moment fonksiyonu iki kez integre edilince önce eğim, sonra sehim bulunur. Entegrasyon sabitleri mesnet sınır koşulları ve parça süreklilik koşullarıyla hesaplanır.","diagram":"deflection","examples":[["Örnek 1 — Konsol kirişte uç yüküyle eğim ve sehim","L=2000 mm konsol kirişin serbest ucuna P=2 kN düşey yük uygulanıyor. E=200.000 MPa ve I=8×10⁶ mm⁴. Serbest uç eğimini ve sehmini bulun.",["θ_tip=PL²/(2EI)=2000×2000²/(2×200.000×8×10⁶).","θ_tip=0,0025 rad.","δ_tip=PL³/(3EI)=2000×2000³/(3×200.000×8×10⁶).","δ_tip≈3,33 mm.","Konsolun ankastre ucunda v=0 ve θ=0 koşulları sağlanır."],"Sonuç: Serbest uç eğimi yaklaşık 0,0025 rad, sehmi 3,33 mm'dir."],["Örnek 2 — Basit mesnetli kirişte orta nokta yükü","L=4000 mm basit mesnetli kirişin orta noktasına P=20 kN yük uygulanıyor. E=200.000 MPa, I=50×10⁶ mm⁴. Maksimum sehmi bulun.",["Simetriden maksimum sehim orta noktadadır.","δ_max=PL³/(48EI).","δ_max=20.000×4000³/(48×200.000×50×10⁶).","δ_max≈2,67 mm.","İki mesnette düşey yer değiştirme sıfırdır; simetri nedeniyle orta noktada eğim sıfırdır."],"Sonuç: Orta noktadaki maksimum sehim yaklaşık 2,67 mm'dir."],["Örnek 3 — Konsol kirişte düzgün yayılı yük","L=2000 mm konsol kirişin tamamına w=3 N/mm düzgün yayılı yük etki ediyor. E=200.000 MPa ve I=8×10⁶ mm⁴. Serbest uç sehmini ve eğimini bulun.",["Konsolun serbest ucundaki standart sonuçlar: δ_tip=wL⁴/(8EI), θ_tip=wL³/(6EI).","δ_tip=3×2000⁴/(8×200.000×8×10⁶).","δ_tip=3,75 mm.","θ_tip=3×2000³/(6×200.000×8×10⁶)=0,0025 rad.","Yayılı yükün birimi N/mm, boy mm seçildiği için birimler tutarlıdır."],"Sonuç: Serbest uç sehmi 3,75 mm, eğimi 0,0025 rad'dır."]],"engineering":"Köprü ana kirişleri, döşeme kirişleri, çatı kirişleri, konsol çıkmalar ve makine taşıyıcılarında sehim ve dönme kontrolü yapılır. Mukavemet açısından gerilme güvenliği sağlansa bile fazla sehim kaplama, bölme, ray geometrisi veya kullanım konforu açısından sorun oluşturabilir.","pitfalls":["Eğim θ ile sehim v değerlerini aynı büyüklük sanmak.","Çift integrasyonda iki integrasyon sabitini unutmak.","Sınır koşullarını yanlış mesnede uygulamak.","L, E, I ve yük birimlerini karıştırmak.","Standart sehim bağıntısını farklı mesnet veya yükleme şekline uygulamak.","Büyük sehim veya kesme deformasyonu önemliyken klasik Euler–Bernoulli modelini koşulsuz kullanmak."],"checks":[["Eğim ile sehim arasındaki temel ilişki nedir?","Küçük eğim kabulünde θ=dv/dx; sehim v(x) düşey yer değiştirmedir."],["Elastik eğri diferansiyel denklemi hangi biçimdedir?","İşaret konvansiyonuna bağlı olarak EI v''(x)=M(x)."],["Ankastre uçta hangi sınır koşulları uygulanır?","Ankastre noktada düşey yer değiştirme ve eğim sıfırdır: v=0, θ=0."],["Basit mesnetli kirişte orta noktaya tekil P yükü uygulanırsa maksimum sehim nedir?","δ_max=PL³/(48EI)."],["Çift integrasyon yönteminde sabitler nasıl bulunur?","Mesnetlerdeki sınır koşulları ve gerekli iç noktalardaki süreklilik/uygunluk koşullarıyla bulunur."]]}}

  math:{lead:'Matematik derslerinde puan getiren şey yalnız doğru sonuca ulaşmak değil, yöntemin neden seçildiğini ve ara adımların nasıl elde edildiğini göstermektir. Önce problem sınıfını belirle; sonra yöntemin koşullarını kontrol et.',cards:[['1 · Sınıflandır','Denklem/işlemin türünü, mertebesini, lineerlik durumunu, bilinmeyenleri ve verilen koşulları yaz. Matris boyutları, değişken sayısı veya integral bölgesi gibi yapısal kontrolleri başta yap.'],['2 · Yöntem seçimi','Kullanacağın algoritmanın veya çözüm tekniğinin koşullarını kontrol et. İntegrasyon sabiti, başlangıç koşulu, pivot, determinant, yakınsama veya tolerans gibi ayrıntıları atlama.'],['3 · Ara adımları göster','İşlemi satır satır kur. Bir dönüşüm/yer değiştirme yaptıysan yeni değişkenin tanımını ve ters dönüşümü yaz. Sayısal yöntemlerde iterasyon tablosunu, hata hesabını ve durdurma koşulunu göster.'],['4 · Geri doğrulama','Bulduğun çözümü denkleme geri koy; başlangıç koşullarını kontrol et; sayısal sonuçta artık/hata veya tolerans testi yap. Yalnız yuvarlanmış sonuca bakarak karar verme.'] ],steps:['Problemin türünü ve arananı yaz.','Yöntemin uygulanma koşullarını doğrula.','İşlem adımlarını ve ara sonuçları açık göster.','Başlangıç/sınır koşullarını veya iterasyonları uygula.','Çözümü yerine koyma, artık veya hata kontrolüyle doğrula.']},
  materials:{lead:'Malzeme sorularında yapı–işlem–özellik bağlantısı kur. Atomik/kristal yapı veya bileşim, üretim ve ısıl işlem geçmişiyle birlikte mekanik davranışı etkiler; deney sonucu numune ve deney koşullarından bağımsız yorumlanamaz.',cards:[['1 · Yapıdan özelliğe','Atomik bağ, kristal yapı, kusur, faz ve mikroyapının malzemenin elastikiyet, dayanım, süneklik, kırılma veya dayanıklılığına etkisini açıkla.'],['2 · İşlem ve çevre','Döküm, haddeleme, ısıl işlem, kür, nem, sıcaklık ve korozif çevre gibi etkenlerin malzeme performansına nasıl etki ettiğini değerlendir.'],['3 · Deney ve diyagram','Numune geometrisini, deney cihazını, ölçülen büyüklüğü ve hesaplanan özelliği birbirinden ayır. Gerilme-şekil değiştirme veya faz diyagramında eksenleri, bölgeyi ve kritik noktaları okuyarak yorum yap.'],['4 · Tasarım kararı','Tek bir dayanım değerine göre malzeme seçme. Dayanıklılık, işlenebilirlik, uygulama koşulu, bakım ve standart/test koşullarını birlikte değerlendir.'] ],steps:['Malzeme bileşimini, mikroyapı/işlem geçmişini tanımla.','İstenen özelliği ve ölçüm yöntemini belirle.','Diyagram veya deney verisini doğru eksen/birimle oku.','Özellik–mekanizma ilişkisini açıkla.','Uygulama koşuluna göre teknik sonucu yorumla.']},
  survey:{lead:'Ölçme sorularında saha krokisi, ölçü sırası, işaret ve kapanma kontrolü hesap kadar önemlidir. Bir okumanın hangi noktaya ve hangi kurulum konumuna ait olduğu kaydedilmeden hesap güvenilir olmaz.',cards:[['1 · Saha düzeni','Alet, mira/prizma, istasyon, geri ve ileri noktaları krokide göster. Ölçü doğrultusu, kot referansı, koordinat sistemi ve birimleri baştan tanımla.'],['2 · Ham veri','Ham okumaları değiştirmeden kaydet. Geri/ileri okuma, mesafe, yatay/düşey açı ve gözlem koşullarını ayrı sütunlarda tut.'],['3 · Hesap ve düzeltme','Kot farkı, koordinat veya poligon hesabını kullanılan yönteme göre sırayla yap. Kapalı ölçülerde kapanma hatasını hesapla; düzeltmeyi uygun kurala göre dağıt.'],['4 · Kalite kontrol','Kapanma, tekrar ölçüsü, tolerans ve hassasiyet sonuçlarını raporla. Alet kalibrasyonu ve saha koşullarının ölçüye etkisini tartış.'] ],steps:['Saha krokisini ve referans sistemini çiz.','Ham ölçüleri ve birimlerini tabloya yaz.','Hesap adımlarını ve düzeltmeleri göster.','Kapanma/hata kontrolünü yap.','Sonucu tolerans ve saha koşullarıyla yorumla.']},
  water:{lead:'Hidroloji sorularında yağış yüksekliği, akış hacmi ve debi aynı büyüklük değildir. Havza sınırı, zaman adımı, kayıplar, depolama ve akım gecikmesi birlikte ele alınmalıdır.',cards:[['1 · Havza ve veri','Havza alanını, yağış istasyonlarını, akım gözlem noktasını ve analiz zaman aralığını tanımla. Yağışın alan/zaman dağılımını göz ardı etme.'],['2 · Kayıplar ve depolama','Sızma, buharlaşma/evapotranspirasyon, yüzey depolaması ve yeraltı katkısının yağıştan akışa dönüşümü etkilediğini belirt.'],['3 · Akım tepkisi','Hidroğrafın yükselme kolu, tepe debisi, gecikme ve çekilme kolunu yorumla. Birim hidroğraf veya frekans yöntemi kullanılıyorsa temel kabulleri yaz.'],['4 · Tasarım ve belirsizlik','Taşkın veya su bütçesi kararında veri uzunluğu, ölçüm belirsizliği, tekerrür ve iklim/havza değişimini belirt.'] ],steps:['Havza sınırı ve zaman ölçeğini tanımla.','Yağış/akım verilerini birim ve zaman adımıyla eşleştir.','Kayıp, depolama ve gecikme etkilerini modele ekle.','Hidroğraf veya su bütçesi hesabını kur.','Sonucu belirsizlik ve tasarım amacıyla yorumla.']},
  transport:{lead:'Ulaştırma sorularında talep, akım, hız, yoğunluk, kapasite ve hizmet düzeyi farklı ölçütlerdir. Her verinin hangi yol kesimi, saat aralığı ve ulaşım türüne ait olduğunu belirtmeden karşılaştırma yapma.',cards:[['1 · Sistem ve ölçek','İncelenen koridoru, kavşağı veya ulaşım ağını tanımla. Yol sınıfı, saat aralığı, yön ve kullanıcı türünü netleştir.'],['2 · Veri ve gösterge','Trafik sayımı, hız, yoğunluk, akım ve talep verilerini birimleriyle ayır. Ortalama ve pik değerlerin neyi temsil ettiğini açıkla.'],['3 · Kapasite ve model','Kapasite/hizmet düzeyi hesabında kullanılan koşulları belirt. Talep tahmininde model aşamalarını ve arazi kullanımı ilişkisini sırayla kur.'],['4 · Alternatif değerlendirme','Alternatifleri güvenlik, erişilebilirlik, süre, kapasite, çevre, maliyet ve eşitlik ölçütleriyle birlikte kıyasla.'] ],steps:['İncelenen ağ/kesimi ve zaman aralığını tanımla.','Veri kaynaklarını ve birimleri yaz.','Akım-talep-kapasite ilişkisini kur.','Alternatiflerin performansını aynı ölçütlerle karşılaştır.','Kararı güvenlik ve sürdürülebilirlik bakımından gerekçelendir.']},
  earthworks:{lead:'Toprak işlerinde doğal, kabarmış ve sıkışmış zemin hacimleri birbirinin yerine kullanılamaz. Geometrik kazı/dolgu hacmi, nakliye hacmi ve ödeme metrajı farklı olabilir.',cards:[['1 · Geometri','Yol/kanal platformunu, enkesiti, şev eğimini ve kazı-dolgu sınırlarını çiz. Her iki enkesitte alanların nerede ölçüldüğünü işaretle.'],['2 · Hacim hesabı','Ardışık kesitlerin alanları ve aralarındaki mesafeden uygun hacim yaklaşımını seç. Kesit aralığı büyüdükçe arazi değişimini temsil hatası artabilir.'],['3 · Zemin hacim durumu','Kabarma ve sıkışma katsayılarının hangi referans hacme göre tanımlandığını kontrol et. Doğal zemin hacmi, gevşek nakliye hacmi ve sıkışmış dolgu hacmini ayır.'],['4 · Saha ve güvenlik','Şev stabilitesi, yeraltı suyu, kazı derinliği, iş makinesi erişimi, taşıma mesafesi ve sıkıştırma kontrolünü planla.'] ],steps:['Enkesiti, platformu ve şevleri çiz.','Kesit alanlarını ve aralık mesafelerini belirle.','Hacim yöntemini ve varsayımını yaz.','Kabarma/sıkışma katsayısını doğru referansla uygula.','Kazı güvenliği ve saha lojistiğini yorumla.']},
  buildingphysics:{lead:'Yapı fiziğinde bir katman tek başına binanın performansını belirlemez. Isı, hava, su buharı ve ses geçişi katmanların özellikleri, sürekliliği, birleşim detayları ve iç/dış ortam koşullarıyla birlikte değerlendirilir.',cards:[['1 · Kesit ve katman','Duvar/çatı/döşeme kesitini dıştan içe çiz; her tabakanın kalınlığını ve malzeme özelliğini yaz. Isı ve buhar akış yönlerini işaretle.'],['2 · Fiziksel direnç','Isıl direnç, ısı geçirgenliği, buhar difüzyonu veya akustik performans için kullanılan bağıntının hangi yüzey ve katman koşullarında geçerli olduğunu belirt.'],['3 · Yoğuşma ve detay','Yoğuşma riskini yalnız toplam U değeriyle karıştırma; sıcaklık profili, buhar basıncı profili, hava kaçakları ve ısı köprüleri önemlidir.'],['4 · Uygulama kontrolü','Malzeme sürekliliği, birleşimler, drenaj, su yalıtım dönüşleri ve uygulama kalitesini çizim üzerinde kontrol et. Güncel standardı ayrıca doğrula.'] ],steps:['Yapı elemanının katman kesitini çiz.','Katman kalınlığı ve fiziksel özelliklerini tabloya yaz.','Uygun ısı/nem/ses yöntemini seç.','Birleşim, yoğuşma ve ısı köprüsü riskini incele.','Sonucu kullanım koşulu ve güncel standartla yorumla.']},
  sustainability:{lead:'Sürdürülebilir yapı kararında tek bir malzemenin “yeşil” olması yeterli değildir. İşlev, servis ömrü, üretim, taşıma, bakım, enerji-su kullanımı ve ömür sonu etkileri aynı sistem sınırında değerlendirilmelidir.',cards:[['1 · Sistem sınırı','Yapının işlevini, referans kullanım ömrünü, işlevsel birimini ve karşılaştırılan alternatifleri aynı koşullarda tanımla.'],['2 · Yaşam döngüsü','Hammadde, üretim, taşıma, yapım, kullanım/bakım ve ömür sonu aşamalarını ayrı ayrı incele.'],['3 · Etki ve ödünleşim','Karbon, enerji, su, atık, dayanıklılık ve maliyet göstergeleri arasında ödünleşim olabileceğini göster.'],['4 · Doğrulanabilir karar','Veri kaynağını, varsayımları ve sınırları açıkla; puanlama sisteminin kapsamını ve sürümünü kontrol et.'] ],steps:['İşlevsel birimi ve karşılaştırma sınırını tanımla.','Alternatiflerin yaşam döngüsü aşamalarını belirle.','Etki ve kaynak verilerini aynı birimle karşılaştır.','Ödünleşim ve belirsizliği açıkla.','Kararı işlev, servis ömrü ve bakım ile gerekçelendir.']},
  policy:{lead:'Su politikası ve mevzuat sorularında teknik veri, hukuki yükümlülük ve yönetişim tercihi birbirinden ayrılmalıdır. Aynı havzada farklı kullanıcılar ve ekosistem ihtiyaçları bulunduğundan kararın amacı ve ölçütleri açık olmalıdır.',cards:[['1 · Sorun ve paydaş','Havza, kaynak, kullanıcılar, çevresel ihtiyaçlar ve karar veren kurumları tanımla.'],['2 · Kanıt ve mevzuat','Teknik ölçüm ile hukuki yetki/izin şartını ayır. Mevzuatın yürürlükteki resmî sürümünü ve kurum görevini kontrol et.'],['3 · Seçenek ve etki','Tahsis veya proje seçeneklerini arz-talep dengesi, çevresel akış, maliyet, hakkaniyet ve uygulanabilirlik bakımından karşılaştır.'],['4 · İzleme','Karar sonrası debi, kalite, kullanım, uyum ve çevresel etki göstergelerini tanımla.'] ],steps:['Olayı ve sistem sınırını tanımla.','Paydaşları ve yetkili kurumları belirle.','Teknik veriyi resmî kaynak ve yükümlülüklerle eşleştir.','Alternatiflerin etkilerini karşılaştır.','Karar ve izleme ölçütlerini gerekçeli yaz.']},
  history:{lead:'Tarihî su yapısı sorusunda bugünkü görünümden tek başına tarih, kapasite veya işlev çıkarma. Tarihsel iddia bir kaynakla; mühendislik yorumu ise yapının geometrisi, malzemesi, hidrolik işlevi ve yerleşimle ilişkisiyle desteklenmelidir.',cards:[['1 · Kaynak inceleme','Yapının konumu, adı, tarihi ve işlevi için envanter, akademik yayın, arşiv ve koruma raporlarını karşılaştır.'],['2 · Mühendislik okuması','Kaynak, iletim, depolama, dağıtım ve tahliye bileşenlerini şemalaştır. Eğim, kesit, malzeme, bakım ve işletme izlerini incele.'],['3 · Kanıt düzeyi','Kesin tarih, yaklaşık tarih ve araştırmacı yorumu ayrımını yap. Kaynaklar çelişiyorsa bunu belirt.'],['4 · Koruma ve güncel ders','Tarihî yapının bugünkü korunma, su yönetimi ve sürdürülebilirlik açısından ne öğrettiğini açıkla.'] ],steps:['Yapı ve coğrafi bağlamı tanımla.','İki veya daha fazla güvenilir kaynağı karşılaştır.','Yapının su mühendisliği işlevini şemalaştır.','Tarihsel kanıt ile yorumunu ayır.','Koruma ve mühendislik çıkarımını yaz.']},
  law:{lead:'Teknik bir olayın hukuki değerlendirmesinde faaliyet kapsamı, yer, tarih, yetkili idare ve yürürlükteki mevzuat belirleyicidir. Eski bir özet veya genel bilgi üzerinden kesin madde numarası/izin sonucu çıkarma.',cards:[['1 · Olayı somutlaştır','Faaliyet, yer, tarih, taraflar ve muhtemel etkileri tanımla. Teknik ölçüm ile hukuki nitelendirmeyi ayrı tut.'],['2 · Resmî kaynağı bul','Mevzuatın güncel metnini, değişiklik tarihini ve yetkili kurumun görevini doğrula.'],['3 · Koşulları eşleştir','İzin, yükümlülük, sınır değer ve istisnaları somut olayla eşleştir; eksik bilgiyi açıkça belirt.'],['4 · Sonuç ve kayıt','Teknik bulgu, mevzuat dayanağı, belirsizlik ve gerekli kurum görüşünü ayrı başlıklarda raporla.'] ],steps:['Olayın tarihini, yerini ve faaliyet türünü belirt.','Güncel resmî mevzuat ve yetkili idareyi doğrula.','Teknik verileri hukuki koşullarla tek tek eşleştir.','Eksik bilgi ve belirsizliği açıkça yaz.','Sonucu kaynak ve tarih göstererek raporla.']},
  language:{lead:'Mesleki İngilizce sorularında terimi tek başına ezberlemek yerine teknik bağlamda kullan. Sayı, birim, tolerans, olumsuzluk ve yükümlülük bildiren sözcükler çeviri sırasında korunmalıdır.',cards:[['1 · Terim','İngilizce terimi Türkçe karşılığı, tanımı ve yapı/şantiye bağlamıyla birlikte öğren.'],['2 · Cümle çözümleme','Özne, teknik fiil, eleman, ölçü ve şart bildiren ifadeyi bul. Edilgen yapı ve modal fiillerin işlevini ayır.'],['3 · Teknik metin','Çizim notu, şartname veya deney raporunda kısaltma, tolerans ve birimleri değiştirmeden yorumla.'],['4 · Üretim','Terimi yeni teknik cümlede kullan; kısa rapor veya işlem tarifini kendi cümlelerinle yaz.'] ],steps:['Metnin türünü ve bağlamını belirle.','Teknik terim ve fiilleri işaretle.','Cümlenin dilbilgisel yapısını çöz.','Ölçü, birim ve zorunluluk anlamını koruyarak çevir.','Kendi teknik cümleni yaz ve kontrol et.']},
  career:{lead:'Kariyer planı soyut hedefleri kanıtlanabilir yetkinliklere dönüştürmelidir. Bir beceriyi CV’de yazmak yerine ders projesi, çizim, hesap raporu, staj görevi veya saha çıktısıyla göstermek daha güvenilirdir.',cards:[['1 · Hedef rol','Saha, teknik ofis, ulaştırma, hidrolik, proje yönetimi veya kamu gibi hedef rolü tanımla.'],['2 · Yetkinlik haritası','İlan ve rol görevlerinden teknik, dijital, iletişim, iş güvenliği ve etik yetkinlikleri çıkar.'],['3 · Kanıt','Her yetkinliğe ders projesi, çizim, rapor, staj veya ölçülebilir iş çıktısı bağla.'],['4 · Eylem planı','Eksik beceri için faaliyet, tarih, ölçüt ve portföy çıktısı belirle; belirli aralıklarla gözden geçir.'] ],steps:['Hedef rolü ve görevlerini tanımla.','Gerekli yetkinlikleri belirle.','Mevcut kanıtlarını ve boşluklarını yaz.','Tarihli gelişim faaliyeti ve ölçüt oluştur.','CV/portföyde sonucu kanıtla.']}
 };

function makePlan(m){let parts=m===25?[['Kısa konu tekrarı',8],['Örnek çözümü',9],['Mini test',8]]:m===45?[['Yeni konu anlatımı',20],['Rehberli örnek',10],['Yanlışları tekrar',5],['Mini test',10]]:m===60?[['Yeni konu anlatımı',25],['Rehberli örnek',15],['Aralıklı tekrar',8],['Test ve analiz',12]]:[['Yeni konu anlatımı',30],['İki örnek çözümü',20],['Yanlış defteri',15],['Süreli test',15],['Gün sonu özeti',10]];document.getElementById('planResult').innerHTML=parts.map((p,i)=>`<div class="task"><span class="dot" style="background:${['var(--blue)','var(--teal)','var(--red)','var(--gold)'][i%4]}"></span><div><b>${p[0]}</b><small>${p[1]} dakika</small></div></div>`).join('')+`<button class="btn small teal" onclick="nav('quiz')">Test bölümüne geç</button>`}
function timerStart(){if(timerInt)return;timerInt=setInterval(()=>{seconds++;const e=document.getElementById('timer');if(e)e.textContent=fmt(seconds)},1000);document.getElementById('timerStart').textContent='Çalışıyor…'}function timerPause(){clearInterval(timerInt);timerInt=null;const b=document.getElementById('timerStart');if(b)b.textContent='Devam et'}function timerFinish(){timerPause();const m=Math.max(1,Math.round(seconds/60));addSession(m,'Zaman tutuculu çalışma');seconds=0;const e=document.getElementById('timer');if(e)e.textContent='00:00';const b=document.getElementById('timerStart');if(b)b.textContent='Başlat';toast(`${m} dakika kaydedildi.`);render()}
function startSession(){nav('today');setTimeout(timerStart,30)}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
