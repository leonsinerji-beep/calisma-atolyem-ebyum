ans eksenini ve işaret yönünü tanımla."],"engineering":"Araç hareketi, vinç, kaldırma sistemleri, raylı sistemler, makine elemanları ve titreşim başlangıç analizleri.","pitfalls":["Kinematik denklemine kuvvet eklemek.","Parçacık modeli kullanırken dönme etkisini ihmal ettiğini belirtmemek.","Referans eksenini problem boyunca değiştirmek."],"checkq":"Kinematik ile kinetik arasındaki temel fark nedir?","checka":"Kinematik hareketi tanımlar; kinetik hareketi kuvvet ve momentlerle ilişkilendirir."},"din_1":{"objective":"Doğrusal hareket için konum, hız ve ivme bağıntılarını kurmak ve sabit ivmeli hareket problemlerini çözmek.","prerequisites":"Türev-integral, konum, zaman ve birim dönüşümü.","explanation":"Doğrusal harekette cisim tek bir eksen boyunca hareket eder. Konum x(t), hız v=dx/dt, ivme a=dv/dt’dir. Sabit ivmede hız zamana göre doğrusal, konum zamana göre ikinci dereceden değişir. Hızın işareti hareket yönünü; ivmenin işareti seçilen eksene göre hız değişim yönünü gösterir. İvme ile hız aynı işaretliyse sürat artar, zıt işaretliyse sürat azalır.","eq_title":"Sabit ivmeli hareket","eq":"v=v₀+at;  x−x₀=v₀t+½at²;  v²=v₀²+2a(x−x₀)","eq_note":"x m, v m/s, a m/s², t s. Bu bağıntılar sabit ivme için kullanılır.","example_title":"Sabit ivmeli araç","example":"Başlangıç hızı 2 m/s, ivme 1,5 m/s² ve süre 4 s. Son hız v=2+1,5×4=8 m/s. Yer değiştirme Δx=2×4+0,5×1,5×4²=8+12=20 m.","steps":["Pozitif hareket yönünü belirle.","Verilenleri v₀, a, t, x₀ biçiminde listele.","İstenen bilinmeyeni içeren en kısa bağıntıyı seç.","İşaretleri koruyarak hesapla.","Son hız ve yer değiştirme değerlerini fiziksel olarak yorumla."],"engineering":"Tren hızlanma-frenleme, iş makinesi hareketleri, vinç kaldırma ve araç takip mesafesi analizleri.","pitfalls":["Hızın yönü ile süratin büyüklüğünü aynı kavram sanmak.","Sabit ivme olmayan durumda sabit ivme denklemlerini kullanmak.","km/h değerini m/s’ye çevirmemek."],"checkq":"Hız ile ivme zıt işaretliyse cisim hangi koşulda yavaşlar?","checka":"Hareket yönündeki hızın büyüklüğü azalır; yani sürat azalır."},"din_2":{"objective":"Eğrisel harekette hız ve ivmeyi teğetsel-normal bileşenlerine ayırarak eğri yörüngeyi çözümlemek.","prerequisites":"Vektör türevi, hız, ivme ve dairesel hareket.","explanation":"Eğrisel harekette hız vektörü yörüngeye teğettir. İvme, süratin değişmesinden kaynaklanan teğetsel bileşen a_t=dv/dt ve hız yönünün değişmesinden kaynaklanan normal bileşen a_n=v²/ρ içerir. Normal ivme eğrilik merkezine doğru yönelir. Dairesel harekette eğrilik yarıçapı sabitse ρ=r olur. Sürat sabit olsa bile yön değiştiği için normal ivme sıfır değildir.","eq_title":"Teğetsel ve normal ivme","eq":"a = a_t e_t + a_n e_n;  a_t=dv/dt;  a_n=v²/ρ","eq_note":"a_t ve a_n m/s²; v m/s, ρ m. Normal birim vektör eğrilik merkezini gösterir.","example_title":"Viraj alan araç","example":"Araç 10 m/s süratle 20 m yarıçaplı virajı sabit süratle alıyor. a_t=0; a_n=10²/20=5 m/s² ve viraj merkezine doğrudur.","steps":["Yörüngenin teğet yönünü çiz.","Hızın büyüklüğü değişiyor mu değerlendir; a_t hesapla.","Yörünge eğrilik yarıçapını bul; a_n=v²/ρ kullan.","Bileşenleri vektörel birleştir ve ivme yönünü çiz."],"engineering":"Karayolu viraj tasarımı, araç dinamiği, raylı sistemlerde kurp hareketi, merkezkaç etkisi ve makine parçaları.","pitfalls":["Sabit süratte ivme sıfırdır sanmak.","Normal ivmeyi yörünge dışına yöneltmek.","Eğrilik yarıçapı ile çapı karıştırmak."],"checkq":"Sabit süratle dairesel hareket yapan cismin ivmesi var mıdır?","checka":"Evet. Yön değiştiği için merkeze doğru v²/r normal ivmesi vardır."},"din_3":{"objective":"Bağıl konum, hız ve ivme bağıntılarını kullanarak iki cismin hareketini aynı referans sisteminde ifade etmek.","prerequisites":"Vektör çıkarma, koordinat ekseni ve hareket tanımı.","explanation":"Bağıl hareket, bir cismin konum veya hızını başka bir cisme göre tanımlamaktır. Aynı referans çerçevesinde r_A/B=r_A−r_B ve v_A/B=v_A−v_B yazılır. Bir doğrultudaki hareketlerde işaret seçimi önemlidir; ters yönler negatif alınır. Hareketli bir taşıyıcı, tren veya bant üzerindeki cismin hızı, taşıyıcının yere göre hızı ile cismin taşıyıcıya göre hızının vektörel toplamıdır.","eq_title":"Bağıl hareket","eq":"v_A/B = v_A − v_B;  v_A = v_B + v_A/B","eq_note":"Bütün hız vektörleri aynı referans sisteminde ve aynı eksenlerle ifade edilmelidir.","example_title":"İki trenin bağıl hızı","example":"A treni doğuya 20 m/s, B treni doğuya 12 m/s gidiyorsa A’nın B’ye göre hızı 20−12=8 m/s doğudur. B batıya 12 m/s gidiyor olsaydı A’ya göre yaklaşma hızı 20−(−12)=32 m/s olurdu.","steps":["Ortak referans ekseni ve pozitif yönü seç.","Her cismin yere göre hızını işaretiyle yaz.","Bağıl hız için v_A/B=v_A−v_B uygula.","Sonucun işareti ve büyüklüğünü hareket yönleriyle kontrol et."],"engineering":"Karşılıklı tren hareketi, konveyör bant, hareketli merdiven, gemi-akıntı ve rüzgâr-uçak problemleri.","pitfalls":["Hız büyüklüklerini her koşulda doğrudan toplamak.","Referans sistemini belirtmemek.","Zıt yönlü hareketlerde işaretleri yanlış almak."],"checkq":"Aynı yönde 20 m/s ve 12 m/s hızla giden iki cismin bağıl hız büyüklüğü kaçtır?","checka":"20−12=8 m/s."},"din_4":{"objective":"Newton’un ikinci kanununu serbest cisim diyagramı ile uygulayarak ivme, gerilme ve tepki kuvvetlerini bulmak.","prerequisites":"Kuvvet bileşenleri, ağırlık, normal tepki ve sürtünme.","explanation":"Kinetik çözümde önce cisim sistemden ayrılır ve yalnız cisme etkiyen dış kuvvetler gösterilir. Bu serbest cisim diyagramında ağırlık mg, temas yüzeyinin normali, sürtünme, ip gerilmesi ve uygulanan kuvvetler bulunur. Sonra ΣF_x=ma_x ve ΣF_y=ma_y yazılır. Normal tepki her zaman ağırlığa eşit değildir; düşey ivme veya eğik düzlem varsa değişir. Sürtünme yönü, olası/gerçek bağıl kayma eğilimine zıt seçilir.","eq_title":"Newton’un ikinci kanunu","eq":"ΣF = m a","eq_note":"N=kg·m/s². Her eksen için ayrı denge/kinetik denklemi yaz; kuvvetlerin yönlerini vektörel dikkate al.","example_title":"Yatay düzlemde araba","example":"Kütlesi 1200 kg olan aracın yatay doğrultudaki net kuvveti 2400 N ise a=ΣF/m=2400/1200=2 m/s² olur. Net kuvvet, çekiş kuvveti eksi direnç kuvvetlerinin toplamıdır.","steps":["Cismi izole et ve tüm dış kuvvetleri çiz.","Koordinat eksenlerini en uygun doğrultuda seç.","Kuvvetleri eksenlere ayır.","Her eksen için ΣF=ma yaz.","Bulduğun ivmenin yönünü ve kuvvet büyüklüklerini fiziksel olarak kontrol et."],"engineering":"Araç hızlanması, vinç yükleri, eğik düzlemde malzeme hareketi, frenleme ve makine mekanizmaları.","pitfalls":["Normal kuvveti her zaman mg almak.","Sürtünmeyi hareket yönünde çizmek.","Net kuvvet yerine tek bir uygulanan kuvveti m·a’ya eşitlemek.","Kütle yerine ağırlığı kullanmak."],"checkq":"Yatay düzlemde ivme sıfırsa yatay kuvvetlerin cebirsel toplamı nedir?","checka":"Sıfırdır; kuvvetler birbirini dengeler."},"din_5":{"objective":"İş–enerji ilkesini kullanarak kuvvet, yer değiştirme, hız ve potansiyel enerji arasındaki ilişkiyi çözmek.","prerequisites":"Kuvvet, yer değiştirme, hız, kütle ve enerji birimleri.","explanation":"Bir kuvvetin yaptığı iş, kuvvetin yer değiştirme doğrultusundaki bileşeninin yol boyunca integralidir. Net iş kinetik enerjideki değişime eşittir. Ağırlık ve yay kuvveti konservatif kuvvetlerdir; bunların potansiyel enerji tanımı yapılabilir. Sürtünme gibi konservatif olmayan kuvvetlerin işi mekanik enerjiyi azaltabilir. İş–enerji yöntemi ivmeyi zamanın fonksiyonu olarak bulmayı gerektirmeden başlangıç-son durum hızlarını ilişkilendirebilir.","eq_title":"İş–enerji","eq":"W_net = T₂−T₁;  T=½mv²;  U_g=mgh;  U_yay=½kx²","eq_note":"İş ve enerji joule (J), kütle kg, hız m/s, yükseklik m, yay katsayısı N/m.","example_title":"Net işten son hız","example":"10 kg kütleli cisim durgun hâlden başlayıp üzerine 200 J net iş yapılıyor. T₂−0=200; ½×10×v²=200. v²=40 ve v≈6,32 m/s.","steps":["Başlangıç ve son durumları tanımla.","Kinetik ve potansiyel enerjileri yaz.","Uygulanan kuvvetlerin yaptığı işleri belirle; sürtünme varsa negatif işi ekle.","W_net=T₂−T₁ veya enerji denkleminden son hızı bul.","Enerji kayıp/kazanımlarının işaretini kontrol et."],"engineering":"Araç frenleme, vinç kaldırma, düşen cisim, yaylı tampon ve makine enerji aktarımı.","pitfalls":["İş ile kuvveti karıştırmak.","Kuvvet hareket yönüne dikse işin sıfır olduğunu unutmak.","Sürtünme işini pozitif yazmak.","Potansiyel enerji referans seviyesini belirtmemek."],"checkq":"Net iş pozitifse cismin kinetik enerjisi nasıl değişir?","checka":"Artar."},"din_6":{"objective":"İmpuls–momentum ilkesini kullanarak çarpışma, darbe ve kısa süreli kuvvet problemlerini çözmek.","prerequisites":"Kütle, hız, kuvvet-zaman grafiği ve vektör.","explanation":"Doğrusal momentum p=mv’dir. Bir kuvvetin belirli zaman aralığında oluşturduğu impuls, kuvvetin zamana göre integralidir ve momentum değişimine eşittir. Ortalama kuvvet sabit kabul edilirse J=F_ort Δt olur. Çarpışmalarda sistem dış kuvvetlerinin impulsu ihmal edilebiliyorsa toplam momentum korunur. Momentum vektörel olduğu için çarpışma öncesi ve sonrası yönler işaretleriyle alınır.","eq_title":"İmpuls–momentum","eq":"∫F dt = m v₂ − m v₁","eq_note":"İmpuls N·s, momentum kg·m/s birimindedir ve bu iki birim eşdeğerdir.","example_title":"Kısa süreli hız değişimi","example":"2 kg cisim 3 m/s hızdan aynı doğrultuda 5 m/s hıza çıkıyor. İmpuls J=m(v₂−v₁)=2×(5−3)=4 N·s. Kuvvet 0,2 s boyunca ortalama sabitse F_ort=4/0,2=20 N.","steps":["Hareket doğrultusunu pozitif seç.","Başlangıç ve son hız vektörlerini işaretli yaz.","Kuvvet-zaman alanından impulsu bul.","J=m(v₂−v₁) ile bilinmeyeni çöz.","Çarpışma sisteminde dış impulsun ihmal edilip edilemeyeceğini değerlendir."],"engineering":"Araç çarpışmaları, tampon tasarımı, çekiç-darbe, raylı sistem kuplörleri ve düşen yüklerin durdurulması.","pitfalls":["Kuvvet-zaman grafiğinde alan yerine tepe kuvvetini kullanmak.","Momentumun vektörel olduğunu unutmak.","Çarpışmada momentum korunumu ile kinetik enerji korunumu koşullarını aynı sanmak."],"checkq":"İmpuls hangi büyüklüğün değişimine eşittir?","checka":"Doğrusal momentum değişimine eşittir."},"din_7":{"objective":"Parçacık sistemlerinde kütle merkezi ve toplam momentum kavramlarını kullanmak; dış kuvvet yokluğunda momentum korunmasını uygulamak.","prerequisites":"Parçacık momentumu, kütle ve konum.","explanation":"Parçacık sistemi birden fazla cismin birlikte incelendiği modeldir. Sistemin kütle merkezi, kütlelerin konumlarla ağırlıklandırılmış ortalamasıdır. Toplam doğrusal momentum, parçacık momentumlarının vektörel toplamıdır ve kütle merkezi hızına bağlıdır. Sistem üzerindeki net dış kuvvet toplam momentumun değişim hızını belirler. İç kuvvetler Newton’un üçüncü kanunuyla çiftler hâlinde birbirini götürdüğünden, dış impuls yoksa toplam momentum korunur.","eq_title":"Kütle merkezi ve momentum","eq":"r_G = (Σmᵢrᵢ)/(Σmᵢ);  P = Σmᵢvᵢ","eq_note":"Kütle merkezi konum ve hız vektörlerinin ağırlıklı ortalamasıdır.","example_title":"İki cismin kütle merkezi","example":"2 kg ve 3 kg kütleli iki cisim x=0 m ve x=4 m konumlarında olsun. x_G=(2×0+3×4)/(2+3)=12/5=2,4 m. Kütle merkezi daha ağır cisme daha yakındır.","steps":["Sistem sınırını ve sistemdeki parçacıkları belirle.","Her parçanın kütle ve konum/hız vektörünü yaz.","Kütle merkezini ağırlıklı ortalamayla bul.","Net dış kuvvet/impuls olup olmadığını incele.","Uygunsa toplam momentum korunumu denklemini uygula."],"engineering":"Araç çarpışmaları, iki parçalı sistemler, patlama/ayrılma, makine hareketli parçaları ve yük taşıma düzenekleri.","pitfalls":["Kütle merkezini geometrik orta nokta sanmak.","İç kuvvetleri toplam dış kuvvet olarak almak.","Momentum korunumu için dış impuls koşulunu kontrol etmemek."],"checkq":"Net dış impuls sıfırsa toplam momentum nasıl değişir?","checka":"Korunur; başlangıçtaki toplam momentum son toplam momentuma eşittir."},"din_8":{"objective":"Rijit cisim öteleme, dönme ve düzlemsel genel hareketini; açısal konum, hız ve ivme ile tanımlamak.","prerequisites":"Vektörler, açısal ölçü, doğrusal hız ve dairesel hareket.","explanation":"Rijit cisimde herhangi iki nokta arasındaki uzaklık sabit kabul edilir. Ötelemede bütün noktalar aynı anda aynı hız ve ivmeye sahiptir. Sabit eksen etrafında dönmede her noktanın açısal hızı aynıdır; doğrusal hız eksene uzaklıkla artar. Düzlemsel genel harekette hareket, bir referans noktasının ötelemesi ile o nokta etrafındaki dönmenin toplamı olarak ele alınabilir. Kaymadan yuvarlanmada temas noktasının yere göre anlık hızı sıfırdır.","eq_title":"Açısal ve doğrusal kinematik","eq":"v = ωr;  a_t=αr;  a_n=ω²r","eq_note":"ω rad/s, α rad/s², r m; doğrusal hız m/s ve ivme m/s².","example_title":"Tekerlek çevresindeki hız","example":"Yarıçapı 0,30 m olan tekerlek 10 rad/s açısal hızla dönüyor. Dış çeperin teğetsel hızı v=ωr=10×0,30=3 m/s olur.","steps":["Hareketin öteleme, sabit eksenli dönme veya genel hareket olduğunu belirle.","Açısal konum, hız ve ivmeyi tanımla.","İlgili noktanın eksene uzaklığını belirle.","v=ωr ve a bileşenlerini uygula.","Kaymadan yuvarlanma varsa v_G=ωR koşulunu işaretleriyle kullan."],"engineering":"Tekerlek-ray teması, vinç tamburları, makara sistemleri, döner makineler ve yapı ekipmanları.","pitfalls":["Açısal hız birimini derece/s olarak bırakmak.","Merkez hızı ile çeper hızını aynı sanmak.","Kaymadan yuvarlanma koşulunu her temas durumunda geçerli saymak."],"checkq":"Sabit eksen etrafında dönen rijit cisimde bütün noktaların açısal hızı nasıldır?","checka":"Aynıdır; doğrusal teğetsel hız ise eksene uzaklığa bağlıdır."},"din_9":{"objective":"Rijit cismin dönme dinamiğinde atalet momenti, tork, açısal ivme ve dönme enerjisini ilişkilendirmek.","prerequisites":"Açısal hız, tork, kütle dağılımı ve enerji.","explanation":"Dönme hareketinde kütlenin dönme eksenine göre dağılımını kütlesel atalet momenti I temsil eder. Aynı tork altında I büyükse açısal ivme daha küçük olur. Sabit eksen etrafında dönme için ΣM=Iα yazılır. Dönme kinetik enerjisi ½Iω²’dir. Bir kuvvetin torku, kuvvetin dönme eksenine dik moment koluyla çarpımına eşittir; kuvvet doğrultusu eksenden geçerse tork sıfır olabilir.","eq_title":"Dönme dinamiği","eq":"ΣM = Iα;  T_rot=½Iω²","eq_note":"M N·m, I kg·m², α rad/s², ω rad/s. Atalet momenti yalnız kütleye değil, kütlenin eksene uzaklığına da bağlıdır.","example_title":"Dönme enerjisi","example":"I=2 kg·m² ve ω=5 rad/s olan rijit cismin dönme kinetik enerjisi T=½×2×5²=25 J’dür.","steps":["Dönme eksenini açıkça tanımla.","Kuvvetlerin bu eksene göre momentlerini bul.","Kütle dağılımından veya verilen tablodan I değerini seç.","ΣM=Iα ile açısal ivmeyi çöz.","Enerji isteniyorsa ½Iω² bağıntısını uygula."],"engineering":"Motor, şaft, tambur, volan, döner ekipman, vinç ve dönen tekerleklerin hızlanma/frenleme hesabı.","pitfalls":["Kütlesel atalet momenti I ile alan atalet momenti I’yi karıştırmak.","Tork kolunu kuvvet doğrultusuna dik uzaklık yerine toplam mesafe almak.","Derece/s ile rad/s karıştırmak."],"checkq":"Aynı tork altında kütlesel atalet momenti artarsa açısal ivme nasıl değişir?","checka":"Azalır; α=ΣM/I."}};

/* Çalışma Atölyem – all-course teaching layer (2026-11) */
const courseTeachingProfiles = {
  muk2: {kind:'mechanics', intro:'Mukavemet 2, kesit geometrisi ile gerilme dağılımı ve eleman deformasyonu arasındaki ilişkiyi kurar. Amaç yalnızca formül uygulamak değil; iç kuvveti, kesit özelliğini, sınır koşulunu ve emniyet ölçütünü birlikte değerlendirmektir.', prereq:'Mukavemet 1: normal gerilme, Hooke kanunu, eksenel deformasyon, denge, kesme kuvveti ve eğilme momenti; temel integral ve türev bilgisi.', method:'Önce taşıyıcı elemanı ve yükleme biçimini tanımla. Kesit tesirlerini bul; kesit ağırlık merkezi ve atalet momentini belirle. Ardından gerilme veya deformasyon bağıntısının varsayımlarını kontrol et. Sonucu hem dayanım hem kullanılabilirlik açısından yorumla.', app:'Kiriş, döşeme, kolon, çelik birleşim, makas, köprü ve makine elemanlarının dayanım/deformasyon kontrolleri.', pitfalls:['Kesit atalet momentini kütlesel atalet momentiyle karıştırmak.','kN·m değerini N·mm sistemine çevirmeden gerilme hesabı yapmak.','Elastik eğilme bağıntılarını büyük şekil değiştirme veya plastik bölgede koşulsuz kullanmak.','Sehim ve dayanım kontrollerini birbirinin yerine koymak.']},
  istatistik: {kind:'math', intro:'İstatistik, mühendislikte ölçüm ve deneylerden gelen değişkenliği anlamak için kullanılır. Tek bir ölçüm karar vermeye yetmeyebilir; veri dağılımı, örnekleme biçimi, belirsizlik ve model varsayımları birlikte değerlendirilir.', prereq:'Temel cebir, kesir ve yüzde hesabı; tablo ve grafik okuma. Olasılıkta küme ve olay kavramları.', method:'Önce veri türünü ve örnekleme yöntemini tanımla. Veriyi tablo/grafikle incele. Merkezi eğilim ve yayılımı hesapla. Olasılık veya dağılım modelini seçerken varsayımları belirt. Sonucu güven aralığı ve mühendislik anlamıyla raporla.', eq:'x̄=Σxᵢ/n;  s²=Σ(xᵢ−x̄)²/(n−1)', eqnote:'x̄ örnek ortalaması; s² örnek varyansı; n gözlem sayısıdır. Örnek varyansında n−1 kullanılması serbestlik derecesi düzeltmesidir.', app:'Beton basınç dayanımı sonuçlarının değişkenliği, zemin deneyleri, ölçme hataları, kalite kontrol ve güvenilirlik değerlendirmesi.', pitfalls:['Ortalama değeri dağılımın tamamı gibi yorumlamak.','Örneklem ve anakütle formüllerini karıştırmak.','Küçük örneklemde normal dağılım varsayımını sorgulamamak.','Korelasyonu nedensellik olarak yorumlamak.']},
  diferansiyel: {kind:'math', intro:'Diferansiyel denklemler, bir sistemin değişim hızını tanımlayan matematiksel modellerdir. Birçok mühendislik problemi doğrudan sonuçtan ziyade hız, ivme, ısı akısı, sönüm veya debi değişimini tarif eder; diferansiyel denklem bu ilişkiyi kurar.', prereq:'Türev, integral, cebirsel denklem çözümü, üstel ve trigonometrik fonksiyonlar.', method:'Denklemin mertebesini ve lineer olup olmadığını belirle. Uygun çözüm yöntemini seç. Genel çözümdeki sabitleri başlangıç/sınır koşullarıyla bul. Çözümü başlangıç koşuluna ve fiziksel davranışa geri koyarak doğrula.', eq:'y′+P(x)y=Q(x);  μ(x)=e^{∫P(x)dx}', eqnote:'Birinci mertebe lineer denklemde μ(x) integrasyon çarpanıdır. Yöntem, denklemin bu forma getirilebilmesine bağlıdır.', app:'Yapı titreşimleri, sönüm, ısı iletimi, akışın zamana bağlı değişimi, konsolidasyon ve sistem dinamiği modelleri.', pitfalls:['Başlangıç koşulunu çözümün sonuna uygulamamak.','Homojen ve homojen olmayan denklemleri karıştırmak.','İntegrasyon sabitini unutmak.','Matematiksel çözümü fiziksel başlangıç koşullarıyla kontrol etmemek.']},
  lineer: {kind:'math', intro:'Lineer cebir, birden çok bilinmeyenin birlikte bulunduğu mühendislik sistemlerini matris ve vektörlerle ifade eder. Denklem sistemleri, koordinat dönüşümleri, ağ analizleri, sayısal yöntemler ve yapısal çözüm algoritmalarının ortak dilidir.', prereq:'Temel cebir, denklem çözümü, vektör ve koordinat kavramı.', method:'Önce bilinmeyenleri ve denklemleri sırala. Matris boyutlarını kontrol et. Çözüm yöntemi seçmeden önce determinant/rank ve tekillik durumunu incele. İşlem sonrası A·x=b eşitliğine geri koyarak artık vektörünü kontrol et.', eq:'A x=b;  det(A)≠0 ise kare A matrisi terslenebilir', eqnote:'A katsayı matrisi, x bilinmeyenler vektörü, b sağ taraf vektörüdür. Tekil veya kötü koşullu matrislerde çözümün kararlılığı ayrıca incelenir.', app:'Çok bilinmeyenli denge denklemleri, çerçeve çözümü, koordinat dönüşümü, ölçme ağlarının dengelemesi ve sayısal analiz.', pitfalls:['Satır ve sütun boyutlarını kontrol etmemek.','Sıfır pivotu uygun işlem yapmadan bölmeye çalışmak.','Determinantın sıfır olmamasını her zaman iyi koşulluluk olarak yorumlamak.','Özvektörün sıfır vektör olamayacağını unutmak.']},
  muhmat: {kind:'math', intro:'Mühendislik matematiği, tek değişkenli analizden çok değişkenli fonksiyonlara, vektör alanlarına ve frekans temelli gösterimlere geçiş sağlar. Fiziksel büyüklüklerin uzayda ve zamanda nasıl değiştiğini matematiksel olarak ifade etmeyi amaçlar.', prereq:'Türev-integral, trigonometri, vektörler, karmaşık sayılar ve temel cebir.', method:'Problemin tek mi çok değişkenli mi olduğunu belirle. Değişkenleri ve birimleri yaz. Uygun türev, integral veya vektör operatörünü seç. Sınırları ve koordinat sistemini doğru tanımla. Sonucu boyut ve fiziksel anlam bakımından denetle.', eq:'∇f=(∂f/∂x, ∂f/∂y, ∂f/∂z);  df=∇f·dr', eqnote:'Gradyan skaler alanın en hızlı artış yönünü ve büyüklüğünü verir. Koordinat sistemine göre ifade değişebilir.', app:'Potansiyel alanlar, ısı ve akış alanları, deformasyon/yer değiştirme yüzeyleri, harmonik yükler ve mühendislik modellemesi.', pitfalls:['Kısmi türevde diğer değişkenleri sabit tutmayı unutmak.','Gradyan, diverjans ve rotasyoneli aynı işlem sanmak.','Çok katlı integrallerde bölge sınırlarını yanlış kurmak.','Fourier açılımında periyot ve açısal frekansı karıştırmak.']},
  kariyer: {kind:'career', intro:'Kariyer planlama, mesleki hedefi somut yetkinliklere ve kanıtlanabilir deneyimlere dönüştürür. İnşaat mühendisliği öğrencisi için teknik bilgi kadar saha farkındalığı, iletişim, iş güvenliği, etik ve sürekli öğrenme de önemlidir.', prereq:'Kendi eğitim/iş deneyimini, güçlü yönlerini ve geliştirilmesi gereken alanları dürüstçe değerlendirmeye hazır olmak.', method:'Hedef rolü tanımla; rolün gerektirdiği yetkinlikleri ilan ve meslek standartlarından çıkar; mevcut kanıtlarını eşleştir; eksik yetkinlik için ölçülebilir eylem belirle; takvim ve çıktı tanımla; üç ayda bir gözden geçir.', eq:'Kariyer hedefi = hedef rol + gerekli yetkinlik + kanıt + eylem planı + zaman', eqnote:'Bu bir matematiksel eşitlik değil, hedefi uygulanabilir parçalara ayıran planlama çerçevesidir. Başarı ölçütü gözlenebilir olmalıdır.', app:'Staj başvurusu, şantiye/şirket pozisyonları, kamu sınavları, teknik ofis, proje yönetimi, saha mühendisliği ve lisansüstü eğitim.', pitfalls:['CV’ye kanıtlanamayan yetkinlik yazmak.','Her ilana aynı CV ve ön yazıyı göndermek.','Teknik gelişim hedefini belirsiz bırakmak.','İş sağlığı, etik ve ekip çalışmasını tali görmek.']},
  hidrolik: {kind:'fluid', intro:'Hidrolik, gerçek akış koşullarında enerjinin, debinin ve basıncın nasıl değiştiğini inceler. Akışkanlar mekaniğinin temel ilkeleri boru kayıpları, pompa sistemleri ve açık kanal uygulamalarına taşınır.', prereq:'Akışkanlar Mekaniği: basınç, debi, süreklilik, Bernoulli, Reynolds sayısı ve enerji çizgisi.', method:'Sistemi şemalaştır; kesitleri ve kotları işaretle; debi ve hızları belirle; enerji denklemine sürtünme ve yerel kayıpları ekle; pompa/türbin işini dikkate al; sonuç basınç ve hızlarının fiziksel olarak mümkün olduğunu kontrol et.', eq:'h_f=f(L/D)(V²/2g);  h_m=K(V²/2g)', eqnote:'Darcy–Weisbach sürtünme kaybı ve yerel kayıp bağıntılarıdır. f ve K, akış rejimi/geometriye bağlıdır; birimlerin tutarlı olması gerekir.', app:'İçme suyu şebekeleri, sulama, drenaj, pompa istasyonları, baraj dip savakları ve açık kanal tasarımı.', pitfalls:['Darcy sürtünme katsayısı ile Fanning katsayısını karıştırmak.','Seri/paralel boruda debi ve enerji kaybı koşullarını karıştırmak.','Pompa basma yüksekliğini sistem kaybından bağımsız yorumlamak.','Açık kanal formüllerini basınçlı boruya uygulamak.']},
  myd1: {kind:'language', intro:'Mesleki İngilizce, genel İngilizce bilgisini inşaat mühendisliği bağlamında kullanmayı öğretir. Amaç kelime ezberlemekten çok terimi çizim, ekipman, malzeme ve teknik talimat içinde doğru tanımaktır.', prereq:'Temel İngilizce fiiller, isimler, sıfatlar, simple present ve temel cümle yapısı.', method:'Terimi Türkçe karşılığıyla öğren; teknik bağlamda bir cümlede kullan; eş anlamlı/karıştırılan terimi ayır; cümleyi özne-fiil-nesne olarak çözümle; ardından Türkçeye anlamı koruyarak çevir.', eq:'Technical term → definition → context sentence → Turkish meaning', eqnote:'Dil öğreniminde tek bir formül yoktur. Terimin bağlam içindeki anlamı, dilbilgisel görevi ve teknik kullanım alanı birlikte öğrenilmelidir.', app:'Şantiye talimatları, yapı malzemesi katalogları, çizimler, metraj tabloları, iş güvenliği uyarıları ve teknik şartnameler.', pitfalls:['False friends/yanıltıcı benzer kelimeleri doğrudan çevirmek.','Concrete kelimesini bağlamına göre beton yerine somut anlamında kullanmayı ayırt etmemek.','Quantity, quality ve qualification gibi kelimeleri karıştırmak.','Ölçü birimi ve teknik kısaltmaları çevirmeden bırakmak.']},
  myd2: {kind:'language', intro:'Mesleki Yabancı Dil 2, teknik metin okuma, deney anlatma, süreç tarif etme ve sonuç raporlama becerilerini geliştirir. Özellikle edilgen yapı, teknik fiiller, ölçüm sonuçları ve şartname dili üzerinde durulur.', prereq:'Temel inşaat mühendisliği kelime dağarcığı; zamanlar, edilgen yapı ve karşılaştırma kalıpları.', method:'Metin türünü belirle; teknik terimleri ayıkla; cümlenin özne/eylem/nesne ilişkisini çöz; sayısal değerleri ve birimleri koru; çeviriyi teknik anlam ve dilbilgisi açısından kontrol et.', eq:'The specimen was tested → Numune deneye tabi tutuldu', eqnote:'Teknik raporlarda edilgen yapı, işlemi yapan kişiden çok uygulanan yöntemi/numuneyi öne çıkarmak için kullanılır.', app:'Laboratuvar deney raporları, teknik şartname okuma, malzeme testleri, proje notları, üretici katalogları ve uluslararası iş güvenliği dokümanları.', pitfalls:['Edilgen cümleyi etken çevirmek zorunda olduğunu sanmak.','Shall, should ve may ifadelerinin yükümlülük derecelerini karıştırmak.','Ondalık ayıracı ve birim gösterimini yanlış aktarmak.','Teknik terimi sözlük anlamıyla bağlam dışı çevirmek.']},
  olcme: {kind:'survey', intro:'Ölçme bilgisi, arazi üzerindeki noktaların konum ve yüksekliklerini belirleyerek projeyi zemine aktarmanın temelidir. Ölçü kalitesi; alet, gözlem, operatör, çevre, yöntem ve dengeleme süreçlerinin birlikte yönetilmesine bağlıdır.', prereq:'Açı, uzunluk, koordinat, ölçek, temel geometri, trigonometrik oranlar ve birim dönüşümü.', method:'Ölçü amacını ve referans sistemini belirle; aleti kontrol et; ölçüleri kayıt defterine aktar; kapanma/uyuşum kontrollerini yap; hataları sınıflandır; gerekiyorsa dengeleme uygula; sonuçları koordinat ve kot olarak raporla.', eq:'Nivelmanda ΔH=Geri okuma−İleri okuma;  H_yeni=H_eski+ΔH', eqnote:'Aynı alet kurulumunda kullanılan temel kot farkı bağıntısıdır. Geri/ileri okuma ve mira düzeni karıştırılırsa kot işareti hatalı çıkar.', app:'Demiryolu güzergâhı, yol ve bina aplikasyonu, plankote, nivelman, poligon, enkesit-boykesit ve hakediş metrajı.', pitfalls:['Alet yüksekliği ve mira okumasını karıştırmak.','Açı birimini derece/dakika/saniye ile radyan arasında kontrol etmemek.','Koordinat eksenlerini ve kuzey doğrultusunu karıştırmak.','Kapanma hatasını kontrol etmeden ölçüyü kabul etmek.']},
  yapimalz: {kind:'materials', intro:'Yapı Malzemesi 1, betonun bileşenlerini ve taze/sertleşmiş beton performansını deney sonuçlarıyla ilişkilendirir. Malzeme seçimi yalnız dayanım değil; işlenebilirlik, dayanıklılık, üretim ve kür koşullarıyla birlikte düşünülür.', prereq:'Temel kimya, kütle-hacim-yoğunluk, gerilme ve basit oran/yüzde hesabı.', method:'Malzeme kaynağını ve standardını tanımla; numune alma ve hazırlama koşulunu belirle; deney prosedürünü uygula; ham veriyi kaydet; hesapları birimleriyle yap; sonucu kabul kriteri ve deney belirsizliğiyle yorumla.', eq:'f_c=P/A;  w/c = su kütlesi / çimento kütlesi', eqnote:'Basınç dayanımı deney yükü ve yüklenen alana bağlıdır. Su/çimento oranı kütlesel orandır; tek başına bütün beton performansını açıklamaz.', app:'Beton üretimi, agrega kabulü, taze beton kontrolü, küp/silindir basınç deneyi, kür ve saha kalite kontrolü.', pitfalls:['Agrega nemini karışım suyuna katmamak.','Numune boyutunu ve yükleme yüzeyini dikkate almamak.','Slump değerini doğrudan dayanım ölçüsü saymak.','Kür ve numune yaşını belirtmeden dayanım karşılaştırmak.']},
  hidroloji: {kind:'water', intro:'Hidroloji, suyun atmosfer, yüzey, zemin ve akarsu sistemi içindeki dolaşımını inceler. Mühendislikte yağıştan akışa dönüşümün, havza tepkisinin ve taşkın büyüklüğünün tahmin edilmesi için kullanılır.', prereq:'Birim dönüşümü, alan-hacim-zaman ilişkisi, temel olasılık ve grafik okuma.', method:'Havzayı sınırla; veri kaynağı ve zaman adımını tanımla; yağış/akım serilerini kontrol et; kayıp süreçlerini değerlendir; uygun model veya istatistiksel yöntemi seç; sonuçları tasarım amacı ve belirsizlikle birlikte raporla.', eq:'Su bütçesi: P = Q + ET + ΔS (havza sınırına göre diğer terimler eklenebilir)', eqnote:'P yağış, Q dışarı çıkan akış, ET evapotranspirasyon, ΔS depolama değişimidir. İşaretler ve alan/zaman ölçeği baştan tanımlanmalıdır.', app:'Taşkın tahmini, baraj işletmesi, drenaj tasarımı, sulama, su kaynakları planlaması ve kuraklık değerlendirmesi.', pitfalls:['Yağış derinliğini debiyle birim dönüşümü yapmadan karşılaştırmak.','Havza alanı ve zaman adımını belirtmemek.','Birim hidroğrafı her havza ve koşul için değişmez saymak.','Gözlem verisinin eksikliği ve ölçüm belirsizliğini göz ardı etmek.']},
  sayisal: {kind:'math', intro:'Sayısal çözümleme, analitik çözümü bulunmayan veya hesap yükü yüksek mühendislik problemlerine yaklaşık çözüm üretir. Yaklaşımın kalitesi hata, tolerans, yakınsama ve algoritmanın kararlılığıyla değerlendirilir.', prereq:'Türev, integral, lineer cebir, temel programlama mantığı ve hata hesabı.', method:'Problemi matematiksel forma getir; yöntemin varsayım ve yakınsama koşullarını incele; başlangıç değeri ve toleransı tanımla; iterasyonları hesapla; durdurma ölçütünü kontrol et; sonucu bağımsız bir kestirimle doğrula.', eq:'e_a=|x_k−x_{k−1}|;  e_r=e_a/max(|x_k|,ε)', eqnote:'Yaklaşık hata ardışık iterasyon farkından izlenebilir. Gerçek bağıl hata için gerçek çözüm gerekir; sıfıra yakın köklerde ölçek seçimi önemlidir.', app:'Lineer sistemler, zemin/akış modelleri, yapı analiz yazılımları, optimizasyon ve deney verisi uydurma.', pitfalls:['Toleransın neye göre tanımlandığını yazmamak.','Yakınsama görüldü diye çözümün doğru olduğunu varsaymak.','Newton yönteminde türevin sıfıra yakın olmasını kontrol etmemek.','Yuvarlama hatasını ve başlangıç tahmininin etkisini yok saymak.']},
  ekolojik: {kind:'sustainability', intro:'Ekolojik yapılar, bir yapının yalnız kullanım anındaki enerji tüketimini değil, malzeme üretimi, yapım, işletme, bakım ve kullanım ömrü sonundaki etkilerini birlikte değerlendirir.', prereq:'Yapı malzemeleri, temel enerji-su kavramları, çevresel etki ve yaşam döngüsü düşüncesi.', method:'Sistem sınırını tanımla; işlevsel birimi belirle; malzeme/enerji/su girdilerini ve atıkları envanterle; yaşam döngüsü aşamalarını karşılaştır; alternatiflerin performansını aynı varsayımla değerlendir.', eq:'Yaşam döngüsü etkisi = üretim + taşıma + yapım + kullanım + bakım + ömür sonu', eqnote:'Bu bir toplamsal muhasebe çerçevesidir; aşamaların kapsamı ve veri kalitesi karşılaştırma sonucunu belirler.', app:'Düşük karbonlu beton, geri dönüştürülmüş malzeme, enerji etkin bina, su verimli tasarım ve yeşil bina değerlendirmesi.', pitfalls:['Yalnız işletme enerjisine odaklanmak.','İşlevsel birim veya sistem sınırını tanımlamamak.','Geri dönüştürülebilirliği otomatik olarak sıfır çevresel etki saymak.','Malzeme dayanıklılığı ve bakım ihtiyacını hesaba katmamak.']},
  yalıtım: {kind:'buildingphysics', intro:'Yapıların yalıtımı ve korunması, ısı, su, su buharı, ses ve kimyasal etkilerin yapı elemanlarında oluşturduğu performans kayıplarını önlemeyi amaçlar. Katmanlar birlikte çalışır; yanlış detay, doğru malzemeyi bile etkisiz kılabilir.', prereq:'Isı ve nem temel kavramları, malzeme özellikleri, yapı elemanı katmanları ve temel geometri.', method:'İç/dış ortam koşullarını belirle; yapı katmanlarını sırala; ısı ve nem geçiş yolunu çiz; süreklilik ve birleşim detaylarını kontrol et; suyun drenaj yolunu göster; malzeme ve uygulama şartlarını teknik dokümanla doğrula.', eq:'Isıl direnç: R=d/λ;  ısı geçiş katsayısı U=1/R_toplam (basitleştirilmiş tek boyutlu durum)', eqnote:'d katman kalınlığı, λ ısıl iletkenliktir. Yüzey dirençleri ve katmanlar arası etkiler toplam dirence eklenmelidir.', app:'Dış cephe, temel/perde su yalıtımı, çatı, bodrum, ıslak hacim, yoğuşma kontrolü ve yapı elemanı dayanıklılığı.', pitfalls:['Isı yalıtımını su yalıtımıyla aynı işlev saymak.','Buhar dengeleyici katmanın konumunu iklim ve katmanlara göre incelememek.','Isı köprülerini ve birleşim detaylarını göz ardı etmek.','Ürün kalınlığı kadar uygulama sürekliliğini de kontrol etmemek.']},
  toprak: {kind:'earthworks', intro:'Toprak işleri, doğal zeminin kazı, taşıma, serme ve sıkıştırma süreçleriyle proje kotlarına getirilmesidir. Hacim hesabı kadar zemin davranışı, su koşulu, şev güvenliği, ekipman ve iş sırası da önemlidir.', prereq:'Ölçme bilgisi, kesit/alan hesabı, zemin sınıflaması, yoğunluk ve yüzde hesabı.', method:'Mevcut ve proje yüzeyini tanımla; kazı/dolgu sınırını kesitlerle belirle; doğal-kazılmış-serilmiş hacim farklarını ayır; şev ve drenaj koşullarını kontrol et; ekipman kapasitesi ve çevrimini planla; sıkışma kontrol sonuçlarını kaydet.', eq:'Ortalama uç alan: V≈(A₁+A₂)L/2', eqnote:'A₁ ve A₂ ardışık enkesit alanları, L kesitler arası mesafedir. Kesit aralığı ve yüzey değişiminin düzgünlüğü doğruluğu etkiler.', app:'Yol/demiryolu yarma-dolgu, bina temel kazısı, platform, şev düzenleme, depo sahası ve altyapı hendekleri.', pitfalls:['Kabarmış hacim ile doğal zemin hacmini aynı kabul etmek.','Kazı taban kotunu ölçü kontrolü yapmadan ekskavatör göz kararıyla tutturmak.','Şev stabilitesi, yeraltı suyu ve iksa gereksinimini atlamak.','Serme kalınlığı ve sıkışma enerjisini kontrol etmemek.']},
  ulasimplan: {kind:'transport', intro:'Ulaşım planlaması, insanların ve yüklerin nereden nereye, hangi amaçla ve hangi ulaşım türüyle hareket ettiğini inceler. Plan kararları yalnız yol kapasitesi değil; arazi kullanımı, erişilebilirlik, güvenlik, çevre ve maliyet ile birlikte ele alınır.', prereq:'Temel istatistik, harita okuma, nüfus/alan kavramları ve grafik yorumlama.', method:'Planlama alanını ve hedef yılı tanımla; mevcut durumu ve ulaşım talebini veriyle analiz et; alternatifleri geliştir; erişilebilirlik, güvenlik, çevre ve maliyet etkilerini karşılaştır; uygulama ve izleme göstergeleri belirle.', eq:'Dört aşamalı model: yolculuk üretimi → dağıtımı → tür seçimi → ağ ataması', eqnote:'Modelin aşamaları ardışık ancak geri beslemeli ilişkilere sahip olabilir. Kalibrasyon ve veri kalitesi tahmin sonuçlarını belirler.', app:'Kent ulaşım ana planı, kampüs erişimi, demiryolu/karayolu bağlantıları, toplu taşıma, yaya ve bisiklet ağları.', pitfalls:['Ulaşım talebini yalnız araç sayısıyla ölçmek.','Arazi kullanımı ve erişilebilirlik ilişkisini atlamak.','Model parametrelerini yerel veriyle kalibre etmemek.','Alternatifleri güvenlik ve çevresel etki olmadan yalnız hızla karşılaştırmak.']},
  kentulasim: {kind:'transport', intro:'Kent içi ulaşım sistemleri, yol kullanıcılarının, araçların ve toplu taşımanın aynı kentsel ağ üzerinde nasıl etkileştiğini inceler. Akım, kapasite ve hizmet düzeyi kavramları tasarım kadar işletme ve güvenlik kararlarını da etkiler.', prereq:'Temel trafik kavramları, hız-zaman-mesafe ilişkisi, basit istatistik ve grafik okuma.', method:'Yol kesimini veya kavşağı tanımla; ölçüm dönemini seç; hacim, hız ve yoğunluğu tutarlı birimlerle hesapla; kapasite ve hizmet koşullarını değerlendir; yaya/toplu taşıma etkisini de kapsayan alternatif üret.', eq:'Trafik akımı: q=k·v', eqnote:'q akım (araç/saat), k yoğunluk (araç/km), v ortalama hız (km/saat) ise birimler tutarlı olmalıdır. Bu ilişki aynı kesit ve zaman aralığına ait ortalama değerlerle kullanılır.', app:'Kent içi yol, sinyalize kavşak, toplu taşıma hattı, yaya geçidi, bisiklet altyapısı ve trafik güvenliği uygulamaları.', pitfalls:['Akım, hız ve yoğunluk kavramlarını karıştırmak.','Pik saat ve günlük ortalamayı aynı tasarım girdisi gibi kullanmak.','Yaya ve bisiklet kullanıcılarını kapasite analizinden dışlamak.','Kapasiteyi sabit, koşullardan bağımsız bir sayı kabul etmek.']},
  suiklim: {kind:'water', intro:'Su ve iklim bilinci, iklim değişkenliğinin su kaynakları ve altyapı üzerindeki etkisini, su talebi ve risk yönetimiyle birlikte inceler. Tasarımda geçmiş veri kadar gelecek senaryoları ve belirsizlikler de önemlidir.', prereq:'Su döngüsü, yağış-akış ilişkisi, temel istatistik ve iklim değişkenleri.', method:'Havza ve zaman ölçeğini belirle; gözlem ve senaryo verilerini ayır; değişim eğilimlerini incele; kuraklık/taşkın tehlikesini maruziyet ve kırılganlıkla birlikte değerlendir; uyum seçeneklerini maliyet ve uygulanabilirlikle karşılaştır.', eq:'Risk ≈ tehlike × maruziyet × kırılganlık (kavramsal çerçeve)', eqnote:'Bu ifade riskin bileşenlerini anlatan kavramsal bir çerçevedir; sayısal risk hesabında seçilen yöntemin tanımı esas alınır.', app:'İçme suyu arz güvenliği, taşkın koruma, kuraklık planı, yağmur suyu yönetimi ve iklim dirençli altyapı.', pitfalls:['İklim senaryosunu kesin tahmin gibi sunmak.','Tehlike ile riski aynı kavram saymak.','Talep artışı, nüfus ve arazi kullanımını hesaba katmamak.','Belirsizlik ve uyum esnekliğini yok saymak.']},
  sumuh: {kind:'history', intro:'Su mühendisliği tarihi, farklı dönemlerde su temini, iletimi, depolanması, sulama ve atıksu sorunlarına verilen teknik ve kurumsal yanıtları inceler. Tarihsel örnekler, yapının işlevini, malzemesini, bakımını ve yerel koşullarını birlikte okumayı gerektirir.', prereq:'Temel su mühendisliği kavramları, tarihsel dönem ve kaynak okuma becerisi.', method:'Yapının tarihini ve coğrafi bağlamını güvenilir kaynaktan doğrula; amacı ve hizmet alanını belirle; suyun alınma-iletim-depolama-dağıtım yolunu şemalaştır; kullanılan malzeme ve yapım tekniğini incele; güncel koruma/işletme sorununu değerlendir.', eq:'Tarihsel yapı analizi: ihtiyaç → kaynak → iletim → depolama → dağıtım → bakım', eqnote:'Bu, su yapılarının işlevsel bileşenlerini okumaya yarayan bir inceleme sırasıdır; tarih ve ölçüler kaynakla doğrulanmalıdır.', app:'Tarihi su kemerleri, sarnıçlar, kanallar, bentler, barajlar, sulama ağları ve kent altyapısı mirasının korunması.', pitfalls:['Tarihsel yapının tarihini kaynak doğrulamadan belirtmek.','Yapıyı yalnız mimari eser olarak görüp hidrolik işlevini ihmal etmek.','Dönemin malzeme ve yapım teknolojisini günümüz koşullarıyla karıştırmak.','Koruma kararında özgün malzeme ve yapısal davranışı dikkate almamak.']},
  supolitika: {kind:'policy', intro:'Su politikaları, sınırlı su kaynaklarının farklı kullanıcılar ve ekosistemler arasında nasıl paylaştırılacağını; kurum, mevzuat, ekonomi ve katılım araçlarıyla inceler. Teknik arz hesabı, tek başına adil ve sürdürülebilir tahsis kararı üretmez.', prereq:'Hidroloji, su kullanımları, temel ekonomi, kamu yönetimi ve paydaş kavramı.', method:'Havza sınırını ve su bütçesini belirle; kullanıcı ve ekosistem ihtiyaçlarını haritala; hak, izin ve öncelik çerçevesini doğrula; alternatif tahsisleri kuraklık ve büyüme senaryolarında test et; paydaş katılımı ve izleme göstergeleri tanımla.', eq:'Tahsis dengesi: kullanılabilir arz ≥ insan + tarım + sanayi + ekosistem gereksinimleri', eqnote:'Bu bir kaynak dengeleme çerçevesidir; her kullanımın önceliği ve çevresel akış gereksinimi ilgili mevzuat ve havza planıyla doğrulanmalıdır.', app:'Havza yönetimi, sulama birlikleri, içme suyu planlaması, kuraklık yönetimi, sınır aşan havzalar ve su verimliliği programları.', pitfalls:['Yalnız yıllık toplam su miktarına bakıp mevsimselliği ihmal etmek.','Ekosistem ihtiyaçlarını sıfır kabul etmek.','Paydaşları ve karar yetkilerini netleştirmemek.','Politika hedeflerini ölçülebilir göstergeye dönüştürmemek.']},
  suhukuk: {kind:'law', intro:'Su hukuku, su kaynaklarının kullanımı, korunması, tahsisi, altyapı işletmesi ve çevresel yükümlülüklerin hukuki çerçevesini mühendislik uygulamalarıyla ilişkilendirir. Mevzuat değişebileceğinden madde numarası ve güncel metin her zaman resmî kaynaktan doğrulanmalıdır.', prereq:'Temel hukuk kavramları, idari işlem, izin/lisans, çevre yükümlülüğü ve su yönetimi terminolojisi.', method:'Olayı ve faaliyeti tanımla; yetkili kurum ve uygulanabilir mevzuat düzeyini belirle; güncel resmî metni bul; yükümlülük, izin, izleme ve yaptırım maddelerini ayır; mühendislik raporunda teknik bulguyu hukuki sonuçtan ayrı yaz.', eq:'Olay inceleme sırası: faaliyet → yetki → izin/yükümlülük → teknik ölçüm → uygunluk → sorumluluk', eqnote:'Bu bir hukuki analiz iş akışıdır; somut olayda güncel mevzuat, yargı içtihadı ve yetkili kurum görüşü ayrıca kontrol edilmelidir.', app:'Su alma yapıları, içme suyu/atıksu tesisleri, deşarj izinleri, havza koruma, taşkın alanı ve su tahsis kararları.', pitfalls:['Yürürlükten kalkmış mevzuat metnini kullanmak.','Teknik raporun tek başına hukuki izin yerine geçtiğini sanmak.','Yetkili idareyi ve izin sürecini kontrol etmemek.','Varsayımı, ölçülen teknik bulguyu ve hukuki yorumu aynı cümlede karıştırmak.']}

function topicRule(c,t,i){
 const id=c.id, n=t.toLocaleLowerCase('tr');
 const arr=topicFormulaRules[id]||[];
 if(id==='muk2') return arr[i]||arr[0];
 if(arr.length){
   if(/ortalama|merkezi|mean/.test(n)) return arr[0];
   if(/standart sapma|varyans/.test(n)) return arr[1]||arr[0];
   if(/olasılık|bayes|koşullu/.test(n)) return arr[2]||arr[0];
   if(/normal dağılım|sürekli dağılım/.test(n)) return arr[4]||arr[0];
   if(/güven aralığı|hipotez/.test(n)) return arr[5]||arr[arr.length-1];
   if(/lineer|ayrılabilir|bernoulli|laplace|başlangıç/.test(n)) return /laplace/.test(n)?arr[3]||arr[0]:arr[0];
   if(/matris|determinant|gauss|lineer denklem/.test(n)) return /determinant/.test(n)?arr[1]||arr[0]:/gauss/.test(n)?arr[2]||arr[0]:arr[0];
   if(/özdeğer|özvektör/.test(n)) return arr[3]||arr[arr.length-1];
   if(/karmaşık/.test(n)) return arr[0];
   if(/kısmi türev|gradyan|diverjans|rotasyonel/.test(n)) return arr[1]||arr[0];
   if(/integral/.test(n)) return arr[2]||arr[0];
   if(/fourier/.test(n)) return arr[3]||arr[0];
   if(/darcy|moody|sürtünme kaybı|boru/.test(n)) return arr[0];
   if(/yerel kayıp|eşdeğer boru/.test(n)) return arr[1]||arr[0];
   if(/manning|açık kanal|kritik akım/.test(n)) return arr[2]||arr[0];
   if(/pompa/.test(n)) return arr[3]||arr[0];
   if(/nivelman|yükseklik/.test(n)) return arr[0];
   if(/ölçek/.test(n)) return arr[1]||arr[0];
   if(/koordinat|poligon|açı/.test(n)) return arr[2]||arr[0];
   if(/kesit|hacim/.test(n)) return arr[3]||arr[0];
   if(/elek|granülometri/.test(n)) return arr[0];
   if(/su\/çimento|çimento|katkı|karışım/.test(n)) return arr[1]||arr[0];
   if(/slump|işlenebilir/.test(n)) return arr[2]||arr[0];
   if(/basınç dayanımı|beton deneyi/.test(n)) return arr[3]||arr[0];
   if(/yağış|rasyonel/.test(n)) return arr[1]||arr[0];
   if(/birim hidroğraf/.test(n)) return arr[3]||arr[0];
   if(/buharlaşma|sızma|akım|su bütçesi/.test(n)) return arr[0];
   if(/hata|yaklaşık|tolerans/.test(n)) return arr[0];
   if(/ikiye bölme|kök bulma/.test(n)) return arr[1]||arr[0];
   if(/newton/.test(n)) return arr[2]||arr[0];
   if(/integrasyon|trapez/.test(n)) return arr[3]||arr[0];
   return null;
 }
 return null;
}

   [/mülakat/,'Mülakat yanıtında durumu, üstlenilen görevi, yapılan eylemi ve sonucu sırayla anlat. Teknik soruda bilmediğini saklamak yerine varsayımını ve çözüm yaklaşımını açıkla.'],
   [/iletişim|takım/,'Takım çalışmasında görev paylaşımı, bilgi aktarımı, kayıt tutma ve geri bildirim önemlidir. Şantiyede yanlış anlaşılma iş güvenliği ve kalite sorununa dönüşebilir.'],
   [/zaman|proje yönetimi/,'Zaman yönetiminde işi küçük teslimatlara böl; öncelik, süre, bağımlılık ve riskleri yaz. Proje yönetiminde kapsam-zaman-maliyet-kalite dengesi birlikte izlenir.'],
   [/dijital|sürekli öğrenme/,'Dijital yetkinlik yalnız yazılım adını bilmek değildir; veri düzenleme, sürüm takibi, dosya standardı, doğrulama ve sonuç paylaşımını kapsar. Öğrenme çıktısı portföyde gösterilmelidir.'],
   [/etik/,'Meslek etiği; kamu güvenliği, dürüst raporlama, çıkar çatışması, yetkinlik sınırı ve çevresel sorumlulukları kapsar. Teknik baskı, ölçüm veya deney sonucunu değiştirme gerekçesi olamaz.'],
   [/yol haritası/,'Kariyer yol haritası 3-6-12 aylık hedefler, faaliyetler, sorumlu kişi, kaynak ve ölçülebilir çıktı içermelidir. Plan belirli aralıklarla gerçek ilerlemeye göre güncellenir.']
  ],
  hidrolik:[
   [/giriş|enerji/,'Hidrolik sistemlerde enerji; kot, basınç ve hız başlıkları arasında dönüşür. Gerçek sistemlerde sürtünme ve yerel kayıplar toplam enerjiyi azaltır; pompa sisteme enerji ekleyebilir.'],
   [/sürtünme kayıpları|darcy|moody/,'Boru sürtünme kaybı uzunluk/çap oranı, hız yükü ve Darcy sürtünme katsayısına bağlıdır. Sürtünme katsayısı Reynolds sayısı ve bağıl pürüzlülükle belirlenir.'],
   [/yerel kayıp|eşdeğer boru/,'Dirsek, vana, daralma-genişleme ve giriş/çıkış gibi elemanlar akımda yerel enerji kaybı oluşturur. Seri-paralel boru sistemlerinde süreklilik ve düğüm enerji denklemleri birlikte çözülür.'],
   [/seri ve paralel/,'Seri borularda aynı kararlı debi bütün elemanlardan geçer ve kayıplar toplanır. Paralel kollarda kollar arasındaki yük kaybı aynıdır; toplam debi kol debilerinin toplamıdır.'],
   [/pompa/,'Pompa eğrisi debiye karşı basma yüksekliğini, sistem eğrisi ise aynı debide gereken yüksekliği gösterir. İşletme noktası iki eğrinin kesişimidir; verim ve kavitasyon riski ayrıca kontrol edilir.'],
   [/açık kanal/,'Açık kanal akımında serbest su yüzeyi atmosfer basıncına açıktır. Geometri, eğim, pürüzlülük ve debi hız/derinlik ilişkisini belirler; basınçlı boru yaklaşımı doğrudan uygulanamaz.'],
   [/manning|düzgün akım/,'Düzgün üniform akımda derinlik ve hız kanal boyunca değişmez kabul edilir. Manning bağıntısı pürüzlülük, hidrolik yarıçap ve enerji eğimini ilişkilendirir.'],
   [/kritik akım|özgül enerji/,'Özgül enerji, kanal tabanına göre derinlik ve hız yükünün toplamıdır. Kritik durumda belirli debi için özgül enerji minimuma iner; Froude sayısı rejim sınıflamasında kullanılır.'],
   [/savak|ölçüm yapıları/,'Savaklar debi ölçme ve seviye kontrolünde kullanılır. Debi bağıntısı savak geometrisi, yaklaşım hızı, nappe koşulu ve kalibrasyon katsayısına bağlıdır.']
  ],
  olcme:[
   [/hata kaynakları|giriş/,'Ölçme hataları kaba hata, sistematik hata ve rastgele hata olarak ayrılabilir. Alet kalibrasyonu, sıcaklık, görüş/kolimasyon, operatör ve kayıt hataları ayrı ayrı düşünülmelidir.'],
   [/ölçek|uzunluk|alan/,'Ölçek, harita uzunluğu ile arazi uzunluğu arasındaki oranı tanımlar. Alan dönüşümünde ölçek katsayısı karesiyle etkiler; uzunluk oranını doğrudan alana uygulamak yanlıştır.'],
   [/koordinat|açı|harita/,'Koordinat sisteminde doğu (E), kuzey (N), kot (H) ve referans datum açıkça belirtilmelidir. Açı/azimut tanımı, başlangıç doğrultusu ve saat yönü konvansiyonuyla birlikte yazılmalıdır.'],
   [/nivelman|yükseklik/,'Geometrik nivelmanda mira okumalarının farkı yükseklik farkını verir. Aletin dengelenmesi, geri-ileri görüş mesafelerinin dengelenmesi ve kapanma kontrolü sistematik hataları azaltır.'],
   [/poligon|güzergâh/,'Poligon ölçmesinde kenar uzunlukları ve doğrultularıyla nokta koordinatları ilerletilir. Açısal ve doğrusal kapanma hatası kontrol edilmeden koordinatlar kesin kabul edilmemelidir.'],
   [/açık ve kapalı poligon/,'Kapalı poligon bilinen başlangıç ve kapanış geometrisi üzerinden kapanma kontrolü sağlar. Açık poligonda bağımsız kapanış olmadığından ara kontrol ve ek referans noktaları önemlidir.'],
   [/boyuna|enine kesit/,'Boyuna kesit güzergâh boyunca kot değişimini, enine kesit ise belirli istasyonlardaki arazi profilini gösterir. İki çizim birlikte yarma-dolgu ve drenaj tasarımını destekler.'],
   [/hacim/,'Hacim hesabında proje yüzeyi ile mevcut arazi yüzeyi arasındaki fark kesit veya sayısal yüzey yöntemiyle hesaplanır. Kesit aralığı ve yüzey değişim keskinliği uygun seçilmelidir.']
  ],
  yapimalz:[
   [/standartlar|giriş/,'Yapı malzemesi standardı numune alma, deney hazırlığı, cihaz, işlem sırası, hesap ve raporlamayı tanımlar. Farklı standart/prosedürlerle elde edilen sonuçlar doğrudan karşılaştırılmamalıdır.'],
   [/agrega.*özellik|sınıflandırma/,'Agrega tane boyutu, şekli, yüzey dokusu, yoğunluk, su emme ve dayanım özellikleri betonun işlenebilirlik ve dayanıklılığını etkiler. Kaynak ve tane dağılımı birlikte değerlendirilir.'],
   [/granülometri|elek/,'Granülometri, agrega tanelerinin boyut dağılımını gösterir. Elek analiziyle her elekte kalan/geçen kütle hesaplanır; kümülatif yüzde eğrisi karışımın sürekliliğini değerlendirmeye yardım eder.'],
   [/çimento türleri/,'Çimento türü seçilirken dayanım gelişimi, hidratasyon ısısı, sülfat/kimyasal etki, çevre koşulu ve yapım programı birlikte düşünülmelidir. Ürünün teknik beyanı ve ilgili standart kontrol edilir.'],
   [/su ve katkı/,'Karışım suyu betonun işlenebilirliği ve hidratasyon için gereklidir; su kalitesi ve miktarı kontrol edilmelidir. Kimyasal/mineral katkılar belirli hedeflere hizmet eder; dozaj üretici ve deney karışımıyla doğrulanır.'],
   [/taze beton|işlenebilirlik/,'Taze betonun kıvamı, kohezyonu, ayrışma/terleme eğilimi, sıcaklığı ve taşınabilirliği yerleştirme kalitesini etkiler. Slump tek başına bütün taze beton özelliklerini ölçmez.'],
   [/karışım hesabı/,'Karışım hesabı hedef dayanım, işlenebilirlik, çevresel etki, agrega tane dağılımı ve malzeme nem düzeltmeleriyle yapılır. Deneme karışımı ve saha üretim kontrolü gereklidir.'],
   [/sertleşmiş beton|basınç dayanımı/,'Sertleşmiş beton performansı numune yaşı, kür, sıkıştırma, numune geometrisi ve yükleme koşuluna bağlıdır. Basınç dayanımı tek performans göstergesi değildir; geçirimsizlik ve dayanıklılık da önemlidir.'],
   [/deney|numune/,'Numune alma, etiketleme, kalıplama, sıkıştırma, kür ve deney öncesi yüzey hazırlığı sonuçların tekrarlanabilirliği için kritiktir. Her adım standartla uyumlu olmalıdır.'],
   [/dayanıklılık|kür/,'Kür, hidratasyonun uygun nem ve sıcaklık koşullarında devam etmesini sağlar. Donma-çözülme, klorür, sülfat, karbonatlaşma ve aşınma gibi etkenler çevresel maruziyete göre değerlendirilir.']
  ],
  hidroloji:[
   [/su döngüsü|giriş/,'Su döngüsünde yağış, buharlaşma, terleme, sızma, yüzey akışı ve yeraltı akımı birbiriyle bağlantılıdır. Havza sınırı ve zaman ölçeği seçilmeden su bütçesi kurulamaz.'],
   [/yağış ölçümü|yağış analizi/,'Yağış verisi istasyon, süre, zaman adımı ve ölçüm yöntemiyle birlikte değerlendirilir. Eksik veri, alan ortalaması ve şiddet-süre-frekans ilişkisi sonuç üzerinde etkilidir.'],
   [/buharlaşma|evapotranspirasyon/,'Buharlaşma açık su/toprak yüzeyinden, terleme bitkiden su kaybıdır. Evapotranspirasyon bu iki süreci birlikte ele alır; enerji, nem, rüzgâr ve bitki örtüsüne bağlıdır.'],
   [/sızma|yüzeysel akış/,'Sızma, yağışın zemin içine girmesidir. Zeminin başlangıç nemi, geçirgenliği, yüzey örtüsü ve yağış şiddeti yüzeysel akışa geçen payı belirler.'],
   [/havza|akım oluşumu/,'Havza topoğrafyası, alanı, eğimi, drenaj ağı, toprak ve arazi kullanımı yağışa verilen tepkinin süresini ve büyüklüğünü etkiler. Havza parametreleri modelin ölçeğiyle uyumlu olmalıdır.'],
   [/akım ölçümü|gözlem/,'Akım ölçümü seviye-akım bağıntısı, hız-alan yöntemi veya uygun debimetreyle yapılabilir. Ölçüm kesiti, taşkın anındaki güvenlik ve ölçüm belirsizliği raporlanmalıdır.'],
   [/süreklilik eğrisi|frekans/,'Akım süreklilik eğrisi debinin belirli bir zaman yüzdesinde aşılma oranını gösterir. Frekans analizi ise seçilen dağılım ve örneklem varsayımlarıyla büyüklüklerin tekrarlanma olasılığını inceler.'],
   [/taşkın|hidroğraf/,'Taşkın hidroğrafı debinin zaman içindeki yükseliş, tepe ve çekilme davranışını gösterir. Pik debi, tepeye ulaşma süresi ve hacim farklı tasarım sorularına yanıt verir.'],
   [/birim hidroğraf/,'Birim hidroğraf etkin yağışın birim derinliğine karşılık gelen doğrudan akış tepkisidir. Süperpozisyon ve zaman değişmezliği kabulleri sınırlıdır; havza koşullarının değişimi kontrol edilmelidir.'],
   [/su bütçesi|uygulama/,'Su bütçesi yağış, akış, evapotranspirasyon, depolama değişimi ve varsa sınır giriş/çıkışlarını aynı alan-zaman aralığında dengeler. Terimlerin işaret konvansiyonu başta belirlenmelidir.']
  ],
  sayisal:[
   [/hata türleri|giriş/,'Sayısal yöntemde yuvarlama, kesme, ölçüm ve modelleme hataları farklı kaynaklardan gelir. Mutlak, bağıl ve yüzde hata ölçeğe göre yorumlanmalı; gerçek değer bilinmiyorsa yaklaşık hata ölçütü kullanılmalıdır.'],
   [/mutlak|bağıl|yüzde hata/,'Mutlak hata değer farkının büyüklüğüdür; bağıl hata bu farkı referans değere böler. Gerçek değer sıfıra yakınsa bağıl hata yanıltıcı olabileceğinden alternatif ölçek gerekir.'],
   [/ikiye bölme/,'İkiye bölme yöntemi işaret değiştiren aralığı koruyarak kök aralığını her adımda yarıya indirir. Başlangıç aralığında sürekli fonksiyon ve işaret değişimi şartı sağlanmalıdır.'],
   [/newton/,'Newton–Raphson yöntemi teğet doğrusu ile kök yaklaşımı üretir. Türevin küçük olması, kötü başlangıç ve çoklu kökler yakınsamayı bozabilir.'],
   [/sekant/,'Sekant yöntemi türev yerine iki önceki yaklaşım noktasından geçen kesen doğrusunu kullanır. İki başlangıç değeri gerekir; yakınsama her problemde garanti değildir.'],
   [/lineer denklem|gauss/,'Lineer sistem çözümünde pivotlama, koşul sayısı ve yuvarlama hatası önemlidir. Büyük sistemlerde doğrudan yöntemle iteratif yöntem seçimi matris yapısına göre yapılır.'],
   [/lu ayrıştırma/,'LU ayrıştırma matrisi alt ve üst üçgensel çarpanlara ayırır. Aynı katsayı matrisiyle birden fazla sağ taraf çözülecekse tekrar kullanılabilir; pivotlama gerekebilir.'],
   [/interpolasyon|lagrange/,'Interpolasyon verilen düğüm noktalarından geçen fonksiyon yaklaşımını kurar. Düğümler arası ve dışı tahmin ayrılmalı; yüksek dereceli polinomda salınım riski değerlendirilmelidir.'],
   [/en küçük kareler/,'En küçük kareler yöntemi gözlem ve model tahminleri arasındaki artık kareleri toplamını en aza indirir. Model seçimi, artıkların örüntüsü ve veri kalitesi kontrol edilmelidir.'],
   [/sayısal türev/,'Sayısal türev sonlu farklarla yaklaşık hesaplanır. Adım büyüklüğü küçüldükçe kesme hatası azalabilir ancak yuvarlama/gürültü etkisi artabilir.'],
   [/sayısal integrasyon|trapez/,'Sayısal integrasyon alanı örnek değerlerden yaklaşık hesaplar. Trapez ve Simpson kuralları farklı polinom yaklaşımlarına dayanır; düğüm aralığı ve fonksiyon düzgünlüğü önemlidir.'],
   [/diferansiyel denklemlerin sayısal/,'Başlangıç değer problemlerinde Euler, geliştirilmiş Euler veya Runge–Kutta gibi yöntemler zaman adımlarında çözüm üretir. Adım boyu küçültme ve hata kestirimi yakınsamayı kontrol eder.']
  ],
  transport:[
   [/amaç ve ölçek|planlamasının amacı/,'Planlama ölçeği mahalle, kent, bölge veya ulusal düzeyde olabilir. Amaç, hareket talebini güvenli, erişilebilir, ekonomik ve çevresel açıdan sürdürülebilir bir ağla karşılamaktır.'],
   [/talebi|veri toplama/,'Ulaşım talebi anket, sayım, OD matrisi, GPS/telefon verisi ve toplu taşıma binişlerinden tahmin edilebilir. Veri temsil gücü, gizlilik ve örnekleme yanlılığı kontrol edilmelidir.'],
   [/arazi kullanımı/,'Arazi kullanımı yolculuk üretimi ve çekimini belirler. Yoğunluk, karma kullanım, iş/konut ayrımı ve toplu taşımaya erişim günlük hareket desenlerini değiştirir.'],
   [/dört aşamalı/,'Dört aşamalı model yolculuk üretimi, yolculuk dağıtımı, tür seçimi ve ağ atamasından oluşur. Her aşama farklı davranış ve ağ verisi ister; kalibrasyon yerel gözlemle yapılmalıdır.'],
   [/erişilebilirlik|hareketlilik/,'Hareketlilik gidilen mesafe/hızla, erişilebilirlik ise fırsatlara ulaşma kolaylığıyla ilgilidir. Yüksek araç hızı her zaman iyi erişilebilirlik anlamına gelmez.'],
   [/politika|sürdürülebilirlik/,'Ulaşım politikası yol kapasitesi kadar toplu taşıma, yürüme, bisiklet, güvenlik, emisyon ve arazi kullanımını kapsar. Etki göstergeleri karar öncesinde tanımlanmalıdır.'],
   [/trafik sayımı|göstergeler/,'Trafik sayımında yön, sınıf, zaman aralığı, hava/olay koşulu ve sayım noktası kaydedilmelidir. Hacim, pik saat ve ağır taşıt payı farklı planlama kararlarını etkiler.']
  ],
  kentulasim:[
   [/türleri/,'Kent içi ulaşım türleri özel otomobil, toplu taşıma, yaya, bisiklet ve mikromobiliteyi içerir. Ağ tasarımı modlar arası erişim, aktarma ve güvenliği birlikte düşünmelidir.'],
   [/trafik akımı|hız|yoğunluk/,'Trafik akımı birim zamanda kesitten geçen araç sayısı, yoğunluk birim uzunluktaki araç sayısı, hız ise mesafe/zaman ilişkisidir. Aynı kesit ve zaman aralığı kullanılmalıdır.'],
   [/kapasite|hizmet düzeyi/,'Kapasite belirli yol ve trafik koşullarında sürdürülebilir akımın üst sınırıdır. Hizmet düzeyi hız, yoğunluk, gecikme ve manevra özgürlüğü gibi ölçütlerle değerlendirilir.'],
   [/kavşak/,'Kavşak performansı çatışma noktaları, çevrim süresi, doygun akım, kuyruk ve gecikmeye bağlıdır. Sinyal zamanlaması yaya fazı ve güvenli geçiş süresini de içermelidir.'],
   [/toplu taşıma/,'Toplu taşıma performansı hat sıklığı, kapasite, erişim mesafesi, aktarma, düzenlilik ve yolcu konforuyla ölçülür. Hat tasarımı talep ve arazi kullanımıyla uyumlu olmalıdır.'],
   [/yaya|bisiklet|mikromobilite/,'Yaya ve bisiklet altyapısında süreklilik, kesişim güvenliği, aydınlatma, genişlik, eğim ve erişilebilirlik önemlidir. Yalnız çizgi/işaretleme değil, fiziksel ağ sürekliliği sağlanmalıdır.']
  ],
  ekolojik:[
   [/sürdürülebilirlik|kavramı/,'Ekolojik yapı yaklaşımı çevresel performans, kullanıcı sağlığı, ekonomik uygulanabilirlik ve uzun ömürlülüğü birlikte değerlendirir. Sürdürülebilirlik ölçütü proje işlevi ve yaşam döngüsü sınırına göre seçilmelidir.'],
   [/yaşam döngüsü/,'Yaşam döngüsü değerlendirmesinde işlevsel birim ve sistem sınırı belirlenir; hammadde, üretim, taşıma, yapım, işletme, bakım ve ömür sonu aşamaları karşılaştırılır.'],
   [/düşük karbon/,'Düşük karbonlu malzemede bağlayıcı türü, geri dönüştürülmüş içerik, üretim enerjisi, taşıma mesafesi ve gerekli dayanıklılık birlikte incelenmelidir. Daha düşük emisyon, performans ve servis ömrüyle birlikte değerlendirilir.'],
   [/enerji etkin/,'Enerji etkin tasarımda yönlenme, gölgeleme, yalıtım, doğal aydınlatma/havalandırma ve mekanik sistem verimi birlikte ele alınır. Önce pasif tasarım seçenekleri değerlendirilir.'],
   [/su verimliliği|gri su/,'Su verimliliği armatür, kaçak kontrolü, yağmur suyu hasadı ve uygun yerde gri su kullanımını içerebilir. Gri su sisteminde sağlık, çapraz bağlantı ve bakım güvenliği esastır.'],
   [/yeşil bina/,'Yeşil bina sistemleri enerji, su, malzeme, iç ortam kalitesi, ulaşım ve işletme süreçlerini puan/şartlar üzerinden inceler. Sertifika kriterlerinin güncel versiyonu kontrol edilmelidir.']
  ],
  yalıtım:[
   [/ısı geçişi|yapı fiziği/,'Isı iletim, taşınım ve ışınım yoluyla geçer. Yapı bileşenlerinde katmanların ısıl direnci ve yüzey koşulları toplam ısı geçişini belirler.'],
   [/ısı yalıtım malzeme/,'Isı yalıtım malzemeleri ısıl iletkenlik, kalınlık, buhar davranışı, yangın, basınç dayanımı, su emme ve uygulama uygunluğu birlikte değerlendirilerek seçilir.'],
   [/su yalıtımı|drenaj/,'Su yalıtımı suyun yapı elemanına girişini engelleyen katman ve detaylardan oluşur. Drenaj ise suyu kontrollü biçimde uzaklaştırır; birleşim, derz ve penetrasyon detayları kritiktir.'],
   [/nem|yoğuşma|buhar/,'Yoğuşma riski iç/dış sıcaklık, bağıl nem, katman dizilimi ve buhar difüzyon direncine bağlıdır. Buhar kontrol katmanı iklim ve yapı katmanı analiz edilerek konumlandırılmalıdır.'],
   [/ses yalıtımı|akustik/,'Ses yalıtımı hava doğuşumlu ve darbe kaynaklı sesleri ayırır. Kütle, sızdırmazlık, ayrık katman ve yan iletim yolları performansı belirler.'],
   [/korozyon|korunma/,'Korozyon riskinde nem, oksijen, klorür, pH, kaplama bütünlüğü ve farklı metallerin teması değerlendirilir. Koruma sistemi maruziyet sınıfına ve bakım erişimine uygun seçilmelidir.']
  ],
  toprak:[

 let example=rule?rule[3]:profile.kind==='language'?`Teknik okuma örneği: “${t}” başlıklı bir çizim notunda veya şartname paragrafında önce teknik isimleri, ölçü birimlerini ve eylem fiillerini işaretle. Örneğin “The beam shall be supported at both ends” cümlesinde beam=kiriş, supported=mesnetlenmiş/desteklenmiş, both ends=her iki uç anlamını verir. Teknik çeviri “Kiriş her iki ucundan mesnetlenecektir” biçiminde yapılır. “Shall” burada şartname yükümlülüğünü bildirir; sıradan gelecek zaman gibi gevşek çevrilmemelidir.`

// Her konu için kısa/orta düzey aktif hatırlama sorularını ana sınav bankasına da ekle.
function addTopicPracticeQuestions(){
 const existing=new Set(questions.map(q=>q.id));
 const commonWrong=[
  'Başlığı ezberlemek yeterlidir; kavram, veri ve koşulları ayırmaya gerek yoktur.',
  'Modelin bütün koşullarda geçerli olduğunu varsay; birim ve sınır koşullarını kontrol etme.',
  'Sonucu önce tahmin et; verileri ve kabulleri bu sonuca uyacak biçimde yorumla.'
 ];
 const technicalWrong=[
  'Değişkenlerin birimlerini ve kullanılan modelin varsayımlarını kontrol etmeden doğrudan işlem yapmak.',
  'Sistem sınırını ve bilinmeyenleri tanımlamadan en sık kullanılan bağıntıyı uygulamak.',
  'Sonucu fiziksel büyüklük, işaret ve bağımsız kontrol bakımından incelememek.'
 ];
 const languageWrong=[
  'Terimi cümle bağlamından bağımsız olarak ilk sözlük anlamıyla çevirmek.',
  'Teknik cümledeki sayı, birim ve zorunluluk bildiren ifadeleri çeviride çıkarmak.',
  'Terimi teknik bir cümlede kullanmadan yalnızca kelime listesi olarak ezberlemek.'
 ];
 const careerWrong=[
  'Yetkinliği kanıtlanabilir çıktı yerine yalnızca sıfatlarla anlatmak.',
  'Tarih, ölçüt ve teslim edilecek çıktı tanımlamadan genel bir hedef yazmak.',
  'Başvurulan pozisyonun görevlerini incelemeden her ilana aynı profili göndermek.'
 ];
 const legalWrong=[
  'Yürürlük tarihi kontrol edilmemiş eski bir özetin madde numarasını kesin kabul etmek.',
  'Teknik ölçüm raporunu kendiliğinden izin veya hukuki uygunluk belgesi saymak.',
  'Yetkili kurum, faaliyet kapsamı ve güncel resmî metni belirlemeden sonuç yazmak.'
 ];
 for(const c of courses){for(let i=0;i<c.topics.length;i++){
  const d=deepLessonData[c.id+'_'+i];if(!d)continue;
  const practice=(d.practice&&d.practice.length)?d.practice:[{q:d.checkq,a:d.checka}];
  const wrong=c.id==='myd1'||c.id==='myd2'?languageWrong:c.id==='kariyer'?careerWrong:c.id==='suhukuk'||c.id==='supolitika'?legalWrong:technicalWrong;
  for(let j=0;j<Math.min(2,practice.length);j++){
   const item=practice[j],id='topic_'+c.id+'_'+i+'_'+j;if(existing.has(id))continue;
   const correct=item.a;
   const wrongs=(j===0?wrong:commonWrong).filter(x=>x!==correct);
   const correctAt=(i+j)%4;const opts=[];let wi=0;
   for(let k=0;k<4;k++)opts.push(k===correctAt?correct:wrongs[wi++%wrongs.length]);
   questions.push({id,c:c.id,topic:i,level:j===0?'Kolay':'Orta',q:item.q,o:opts,a:correctAt,e:correct+' Bu kazanımda kavramı, varsayımları ve uygulama koşullarını birlikte kontrol et.'});
   existing.add(id);
  }
 }}
}
addTopicPracticeQuestions();
