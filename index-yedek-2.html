// Mukavemet 1 için genişletilmiş öğretim modülleri: kavram, türetim, iki çözümlü örnek ve kontrol soruları.
const mukavemetMastery = {"0":{"intro":"Bu konu, Mukavemet 1'in başlangıç noktasıdır: bir taşıyıcıya etkiyen dış yükleri tanır, mesnetlerin hangi hareketleri engellediğini belirler ve elemanın herhangi bir kesitinde yük aktarımını temsil eden iç tesirleri bulursun. Çözümün temeli, doğru serbest cisim diyagramı ve denge denklemleridir.","sections":[["1. Dış kuvvet, mesnet tepkisi ve iç tesir aynı şey değildir","Dış kuvvet, sistemin dışından uygulanan yük veya mesnet etkisidir. Mesnet tepkisi, mesnedin engellediği harekete karşı geliştirdiği kuvvettir. İç tesir ise elemanın içinden hayalî bir kesit alındığında, kesitin iki parçasının birbirine uyguladığı etkilerin bileşkesidir. Bu üç kavramı ayırmadan kesit hesabına geçme."],["2. Düzlemde mesnetleri tanı","Makaralı/kayıcı mesnet ideal olarak yalnız temas yüzeyine dik tek tepki verir; yüzey boyunca hareket serbesttir. Mafsallı mesnet yatay ve düşey ötelemeyi engeller, dönmeye izin verir; iki tepki bileşeni vardır. Ankastre mesnet yatay ve düşey hareketi ve dönmeyi engeller; iki kuvvet bileşeni ile bir moment tepkisi taşır. Gerçek bağlantı, sürtünme ve rijitlik etkileri bu ideal modellerden farklı olabilir; ders probleminde verilen idealizasyonu esas al."],["3. Serbest cisim diyagramı (SCD) nasıl çizilir?","Önce incelenecek kirişi çevresinden ayır. Kirişin üzerinde artık yalnızca ona etkiyen dış yükler, kendi ağırlığı (problemde hesaba katılıyorsa) ve mesnet tepkileri kalmalıdır. Mesnetleri sembol olarak bırakmak yerine bilinmeyen tepki bileşenleriyle değiştir. Kuvvetlerin uygulama noktalarını, yönlerini, yayılı yüklerin başlangıç-bitişlerini ve bütün mesafeleri göster. Diyagramda eksik bir kuvvet, sonraki bütün denklemleri bozar."],["4. Denge denklemlerinin fiziksel anlamı","Cisim statik dengedeyse ivmesi sıfırdır. Düzlem problemlerinde birbirinden bağımsız üç denge koşulu kullanılır: yatay kuvvetlerin toplamı sıfır, düşey kuvvetlerin toplamı sıfır ve herhangi bir noktaya göre momentlerin toplamı sıfırdır. Moment merkezi seçerken bilinmeyen tepki doğrultularının kesiştiği noktayı seçmek hesabı sadeleştirebilir. Moment kolu, kuvvetin etki çizgisine olan dik uzaklıktır; kuvvetin uygulama noktasına olan eğik mesafe değildir."],["5. Kesit yöntemi ve N–V–M","Mesnet tepkileri bulunduktan sonra elemanı ilgilendiğin x konumundan hayalî olarak kes. Kesitin bir tarafını tek başına serbest cisim olarak incele. Düzlem kirişte kesit üzerinde normal kuvvet N, kesme kuvveti V ve eğilme momenti M gösterilir. N eksenel çekme/basınma etkisini; V kesitin bir tarafını diğer tarafa göre kaydırmaya çalışan kesme etkisini; M ise kesiti döndürmeye çalışan eğilme etkisini temsil eder. Bu iç tesirler kesitin hangi tarafını seçtiğine ve kullandığın işaret kuralına bağlı olarak işaret alır."],["6. Statikçe belirli mi?","Düzlemde yalnız üç bağımsız denge denklemi vardır. Bilinmeyen mesnet tepki bileşenlerinin sayısı ve bağımsızlığı denge denklemleriyle çözülebiliyorsa sistem statikçe belirli olabilir. Denge denklemlerinden daha fazla bilinmeyen tepki varsa sistem statikçe belirsizdir; şekil değiştirme uygunluğu ve malzeme ilişkileri de gerekir. Sadece bilinmeyen saymak her zaman yeterli değildir; mesnet geometrisi ve tepkilerin bağımsızlığı da kontrol edilir."]],"diagram":"beam","formula":"ΣFₓ = 0   ·   ΣFᵧ = 0   ·   ΣM₀ = 0","meaning":"Σ: cebirsel toplam; Fₓ ve Fᵧ: kuvvetin yatay/düşey bileşenleri (N veya kN); M₀: seçilen O noktasına göre moment (N·m veya kN·m). Kuvvet ve moment birimlerini aynı sistem içinde tut.","derivation":"Bir rijit cismin statik dengesi, doğrusal momentum ve açısal momentum değişiminin sıfır olması demektir. Newton–Euler denklemlerinin statik özel hâlinde ΣF=0 ve ΣM=0 elde edilir. Düzlemde iki öteleme doğrultusu ve bir dönme doğrultusu bulunduğundan üç skaler denklem yazılır. Kesit aldığında aynı denge ilkeleri seçilen parçaya uygulanır; bu kez kesit tesirleri de bilinmeyenler arasına girer.","examples":[["Örnek 1 — Orta noktasında tekil yük bulunan basit kiriş","6 m açıklıklı, A'da mafsallı ve B'de makaralı bir kirişin tam ortasına 12 kN aşağı yönlü tekil yük uygulanıyor. Kiriş ve mesnetler ideal; kirişin kendi ağırlığı ihmal ediliyor.",["Tüm kirişi ayır. A mesnedinde Aₓ ve Aᵧ; B mesnedinde Bᵧ tepkilerini göster.","Yatay denge: ΣFₓ=0 olduğundan Aₓ=0.","A noktasına göre moment al: Bᵧ·6 − 12·3 = 0. Buradan Bᵧ=6 kN.","Düşey denge: Aᵧ + 6 − 12 = 0; dolayısıyla Aᵧ=6 kN.","Kontrol: iki tepkinin toplamı 12 kN olup aşağı yönlü yükü dengeler. Simetrik yükleme ve geometri nedeniyle tepkilerin eşit çıkması fiziksel olarak beklenir."],"Sonuç: Aᵧ=6 kN, Bᵧ=6 kN, Aₓ=0."],["Örnek 2 — Asimetrik yük altında kesitte iç tesir","A–B arası 7 m olan basit kirişte A'dan 2 m uzaklıkta 4 kN, A'dan 5 m uzaklıkta 8 kN aşağı yönlü iki tekil yük var. A mafsal, B makara. A'dan 3 m uzaklıktaki kesitteki N, V ve M'yi bul.",["Önce bütün kiriş için ΣM_A=0: Bᵧ·7 − 4·2 − 8·5=0. Bᵧ=48/7=6,857 kN.","ΣFᵧ=0: Aᵧ+Bᵧ−4−8=0; Aᵧ=5,143 kN. Yatay yük olmadığından Aₓ=0.","x=3 m kesitinden sol parçayı ayır. Sol parçada Aᵧ=5,143 kN yukarı, 4 kN yük aşağı ve kesitte N,V,M vardır.","Yatay denge: N=0. Düşey denge: 5,143−4−V=0 (seçilen pozitif kesme yönüne göre); V=1,143 kN büyüklüğündedir.","Kesit noktasına göre moment: M=5,143·3−4·(3−2)=11,429 kN·m. Pozitif moment tanımına göre işaret yazılır."],"Sonuç: x=3 m kesitinde |N|=0, |V|=1,143 kN ve |M|=11,429 kN·m."]],"engineering":"Kiriş, döşeme kirişi, köprü ana kirişi, makas çubuğu, kolon ve bağlantı elemanlarında yük yolunu izlemek için kullanılır. Demiryolu traversinden ray mesnetlerine, köprü tabliyesinden mesnetlere yük aktarımının ilk idealizasyonu da bu mantıktadır. Tasarımda bulunan iç tesirler sonraki dayanım ve deformasyon kontrollerinin girdisidir.","pitfalls":["Makaralı mesnette iki tepki çizmek; ideal makaralı mesnet tek doğrultuda tepki verir.","Ankastre mesnedin moment tepkisini unutmak.","Moment kolu yerine kuvvetin uygulama noktasına uzaklığı kullanmak.","Kesitte N, V ve M yönlerini belirlemeden denkleme geçmek.","Kirişin kendi ağırlığını problemde verilmediği hâlde gelişigüzel eklemek veya özellikle belirtilmişken ihmal etmek.","Bilinmeyenin negatif çıkmasını matematik hatası sanmak; negatif işaret, başlangıçta varsayılan yönün tersini gösterir."],"checks":[["Makaralı mesnet ideal düzlem modelinde kaç tepki bileşeni taşır?","Bir. Temas yüzeyine dik tek tepki bileşeni taşır."],["Düzlemde statik denge için kaç bağımsız skaler denklem vardır?","Üç: ΣFₓ=0, ΣFᵧ=0 ve ΣM=0."],["N, V ve M'nin anlamı nedir?","N eksenel normal kuvvet, V kesme kuvveti, M eğilme momentidir."],["Bir kuvvetin O noktasına göre moment kolu nasıl belirlenir?","O noktasından kuvvetin etki çizgisine çizilen dik uzaklıktır."]]},"1":{"intro":"Normal gerilme, eksenel kuvvet taşıyan bir elemanın kesitinde kuvvetin alana nasıl yayıldığını açıklar. Bu konu, çubuk ve kolonların dayanım hesabına giriş sağlar. Önce ortalama gerilme modelini öğrenecek, sonra bu modelin hangi bölgelerde yetersiz kalabileceğini göreceksin.","sections":[["1. Gerilme neden kuvvetten farklıdır?","Kuvvet bir cismin bütününe etkiyen dış etkiyi temsil eder; gerilme ise elemanın içindeki yük aktarımının birim alana düşen yoğunluğudur. Aynı kuvvet daha küçük alana aktarılırsa ortalama gerilme artar. Bu yüzden yalnızca yük büyüklüğünü bilmek bir elemanın güvenli olup olmadığını söylemez; kesit alanı ve malzeme davranışı da gerekir."],["2. Normal kuvvet ve normal gerilme","Kesite dik doğrultuda etkiyen iç kuvvet normal kuvvettir. Kesitin bir tarafını çekmeye çalışıyorsa çekme, birbirine doğru bastırıyorsa basınç etkisi vardır. Üniform dağılım kabulü altında ortalama normal gerilme σ=N/A ile hesaplanır. Gerilmenin işareti için derste kullanılan çekme-pozitif veya basınç-pozitif konvansiyonunu baştan belirle."],["3. Ortalama gerilme ile gerçek dağılım","σ=N/A, kesit üzerinde gerilmenin eşit dağıldığı ortalama değeri verir. Yükün eksantrik uygulanması, delik, keskin köşe, ani kesit değişimi, bağlantı veya mesnet yakınındaki üç boyutlu gerilme durumu yerel gerilme yığılmaları doğurabilir. Bu nedenle ortalama gerilme, her noktadaki en büyük gerilme ile aynı değildir."],["4. Kesit alanını doğru bul","Daire için A=πd²/4; dikdörtgen için A=b·h kullanılır. Boru gibi içi boş dairesel kesitte A=π(D²−d²)/4'tür. d çap, r yarıçap ise A=πr²=πd²/4. Çapı yarıçap gibi kullanmak alanı dört kat hatalı yapar."],["5. Birim dönüşümünün güvenli yolu","1 kN=1000 N; 1 MPa=1 N/mm²; 1 GPa=1000 MPa. P değerini N, A değerini mm² yazarsan σ doğrudan MPa çıkar. Alternatif olarak kN ve m² ile çalışabilirsin; o zaman Pa/kPa dönüşümünü tutarlı yap. Aynı hesap içinde N ile kN veya mm² ile m² karıştırma."]],"diagram":"stress","formula":"σₒᵣₜ = N / A","meaning":"σ: ortalama normal gerilme (Pa veya MPa); N: kesite dik normal kuvvet (N); A: kesit alanı (m² veya mm²). N/mm² ile MPa sayısal olarak eşittir.","derivation":"Kesit üzerindeki normal gerilme dağılımının bileşkesi, kesitte taşınan normal kuvvete eşit olmalıdır: N=∫A σ dA. σ kesit boyunca sabit kabul edilirse integral σA olur ve σ=N/A elde edilir. Dolayısıyla formülün temel varsayımı düzgün gerilme dağılımıdır; eksantrik yük, delik veya yerel etkiler varsa bu varsayım ayrıca sorgulanmalıdır.","examples":[["Örnek 1 — Dairesel çelik çubuk","Çapı 20 mm olan çubuk 40 kN eksenel çekme taşıyor. Ortalama normal gerilmeyi bul.",["d=20 mm; yarıçapı ayrıca bulmak istersen r=10 mm.","A=πd²/4=π·20²/4=314,16 mm².","P=40 kN=40.000 N.","σ=P/A=40.000/314,16=127,3 N/mm².","1 N/mm²=1 MPa olduğundan σ=127,3 MPa. Sonucun çekme gerilmesi olduğunu belirt."],"Sonuç: 127,3 MPa çekme."],["Örnek 2 — Dikdörtgen kesit ve izin verilen gerilme","40 mm × 10 mm kesitli bir lama 80 kN eksenel kuvvet taşıyor. Ortalama gerilme ve 180 MPa izin verilen değerle basit karşılaştırma yap.",["Kesit alanı A=40·10=400 mm².","P=80.000 N olarak dönüştür.","σ=80.000/400=200 MPa.","200 MPa, verilen 180 MPa izin verilen değerden büyüktür.","Bu ideal ortalama gerilme kontrolünde eleman uygun görünmez; gerçek tasarımda yük birleşimi, malzeme dayanımı, emniyet yaklaşımı ve yönetmelik hükümleri ayrıca incelenir."],"Sonuç: 200 MPa; 180 MPa sınırını aşıyor."]],"engineering":"Askı çubukları, gergi elemanları, ankraj tijleri, bağlantı bulonları, çekme çubukları ve kolonlarda eksenel gerilme kontrolünün ilk adımıdır. Basınç elemanlarında ise yalnız σ=N/A yeterli olmayabilir; narinlik ve burkulma da kontrol edilmelidir.","pitfalls":["Çapı yarıçap yerine koymak.","kN değerini N'ye çevirmemek.","N/mm² ile MPa'yı farklı birimler sanmak.","Ortalama gerilmeyi yerel maksimum gerilme kabul etmek.","Eksenel kuvvet yerine kuvvetin tüm bileşenlerini kesite dikmiş gibi kullanmak."],"checks":[["40 kN kuvvet 500 mm² alana düzgün dağılırsa σ kaç MPa olur?","40.000/500=80 MPa."],["Dairesel kesitte çap 2 katına çıkarsa alan kaç katına çıkar?","Dört katına çıkar; alan çapın karesiyle orantılıdır."],["σ=N/A hangi temel dağılım varsayımına dayanır?","Kesit üzerindeki gerilmenin üniform, yani eşit dağıldığı kabulüne."],["1 N/mm² kaç MPa eder?","1 MPa."]]},"2":{"intro":"Birim şekil değiştirme, elemanın boyundaki değişimi ilk boyuna oranlar; Hooke kanunu da doğrusal elastik bölgede gerilme ile şekil değiştirme arasındaki bağı kurar.","sections":[["1. Deformasyon ile birim şekil değiştirme","Deformasyon ΔL mutlak boy değişimidir ve mm veya m ile ölçülür. Birim şekil değiştirme ε=ΔL/L₀ oranıdır; boyutsuzdur. 1.000 mm uzunluğundaki çubuk 1 mm uzarsa ε=0,001 olur. Aynı 1 mm uzama, 100 mm kısa bir numunede çok daha büyük birim şekil değiştirme anlamına gelir."],["2. Çekme ve basınç işareti","Çekme yükü çubuğu uzatır ve seçilen geleneksel işaret kuralında ε pozitif alınır. Basınç kısalmaya yol açar ve ε negatif olabilir. Birim şekil değiştirme bir oran olduğu için mm/mm, m/m gibi yazılabilir ancak sadeleşir."],["3. Hooke kanunu","Doğrusal elastik bölgede σ=Eε bağıntısı kullanılır. E, elastisite modülüdür ve malzemenin rijitliğini ifade eder. Aynı gerilmede E değeri yüksek malzemenin elastik şekil değiştirmesi daha azdır. E dayanım değildir; akma dayanımı veya çekme dayanımıyla karıştırılmamalıdır."],["4. Doğrusal elastik sınır","Hooke kanunu tüm yük aralığında geçerli değildir. Malzeme doğrusal olmayan veya plastik bölgeye girdiyse σ ile ε doğrusal orantılı olmayabilir. Yük kaldırıldığında kalıcı uzama kalıyorsa plastik deformasyon oluşmuştur. Hesaptan önce problemde elastik davranış varsayımının geçerli olduğunu kontrol et."],["5. Birim tutarlılığı","E=200 GPa verildiyse E=200.000 MPa olarak yazılabilir. ε boyutsuzdur. σ=Eε hesaplanırken E ve σ aynı gerilme biriminde olmalıdır."]],"diagram":"stressstrain","formula":"ε = ΔL / L₀     ve     σ = E ε","meaning":"ε: boyutsuz birim şekil değiştirme; ΔL: boy değişimi; L₀: ilk boy; E: elastisite modülü (MPa veya GPa); σ: normal gerilme.","derivation":"σ=N/A ve doğrusal elastik bölgede σ=Eε olduğundan ε=σ/E. Geometrik tanım ε=ΔL/L₀ olduğuna göre ΔL/L₀=σ/E. Sabit kesitli doğrusal elastik çubukta σ=N/A yazarsak uzama bağıntısına geçiş için temel ilişki elde edilir.","examples":[["Örnek 1 — Ölçülen uzamadan gerilme","İlk boyu 1.500 mm olan çubuk 1,2 mm uzuyor. E=200 GPa ise doğrusal elastik varsayımıyla gerilmeyi bul.",["ε=ΔL/L₀=1,2/1.500=0,0008.","E=200 GPa=200.000 MPa.","σ=Eε=200.000·0,0008=160 MPa.","Bu gerilmenin kullanılan çelik için elastik aralık içinde olup olmadığını malzeme verisiyle kontrol et."],"Sonuç: 160 MPa (elastik varsayım geçerliyse)."],["Örnek 2 — Elastisite modülü karşılaştırması","Aynı 100 MPa gerilme altında E=200 GPa ve E=70 GPa iki malzemenin birim şekil değiştirmelerini bul.",["Birinci malzeme: ε₁=100/200.000=0,0005.","İkinci malzeme: ε₂=100/70.000=0,001429.","İkinci malzemenin birim şekil değiştirmesi daha büyüktür.","Aynı gerilmede daha fazla şekil değiştiren malzeme bu ölçüte göre daha düşük elastik rijitliktedir."],"Sonuç: ε₁=0,0005; ε₂≈0,00143."]],"engineering":"Servis yükleri altındaki çubuk uzaması, çelik çekme deneyi, beton/çelik deformasyon ölçümü ve yapı elemanlarının rijitlik karşılaştırmasında kullanılır.","pitfalls":["ΔL ile ε'yi aynı büyüklük sanmak.","GPa'yı MPa'ya çevirmeden çarpmak.","Doğrusal elastik sınır aşıldıktan sonra Hooke kanununu kullanmak.","E'yi dayanım veya kopma gerilmesi sanmak."],"checks":[["1.000 mm çubuk 0,5 mm uzarsa ε nedir?","0,5/1.000=0,0005."],["E büyürse aynı σ altında ε nasıl değişir?","Azalır; ε=σ/E."],["Hooke kanunu hangi bölgede kullanılır?","Malzemenin doğrusal elastik davranış gösterdiği bölgede."]]},
"3":{"intro":"Malzeme davranışını anlamak, yalnızca bir malzemenin ne kadar yük taşıdığını bilmek değildir. Yük altında ne kadar şekil değiştirdiğini, yük kaldırılınca eski hâline dönüp dönmediğini, kopmadan önce ne kadar enerji soğurabildiğini ve zamanla nasıl hasar görebildiğini okumaktır. Bu konu, çekme deneyi verilerini mühendislik kararına dönüştürmeyi öğretir.","diagram":"stressstrain","sections":[["1. Mekanik özellikler neyi anlatır?","Dayanım, malzemenin belirli bir gerilme düzeyine kadar yük taşıma kapasitesini; rijitlik, elastik şekil değiştirmeye karşı direncini; süneklik, kopmadan önce plastik şekil değiştirebilme kabiliyetini; tokluk ise kırılmaya kadar enerji yutabilme kapasitesini anlatır. Sertlik yüzeyin batma veya çizilmeye direncidir. Bu özellikler birbiri yerine kullanılamaz: yüksek dayanımlı bir malzeme mutlaka yüksek sünekliğe veya tokluğa sahip değildir."],["2. Çekme deneyi nasıl okunur?","Standartlaştırılmış numuneye eksenel çekme kuvveti uygulanır; kuvvet ve ölçü boyundaki uzama kaydedilir. Mühendislik gerilmesi σ=P/A₀, mühendislik birim şekil değiştirmesi ε=ΔL/L₀ ile bulunur. Böylece σ–ε eğrisi elde edilir. Numune geometrisi, ölçü boyu, deney hızı ve sıcaklık karşılaştırmayı etkilediğinden sonuçlar deney koşullarıyla birlikte değerlendirilir."],["3. Elastik bölge, akma ve plastik şekil değiştirme","Elastik bölgede yük kaldırıldığında numune yaklaşık ilk boyuna döner. Doğrusal elastik kısımda eğim E elastisite modülüdür. Akma ile kalıcı şekil değiştirme belirginleşir. Bazı çeliklerde üst ve alt akma noktası ile akma platosu görülebilir; bazı malzemelerde belirgin akma noktası olmadığından %0,2 kalıcı şekil değiştirme ofset yöntemiyle akma dayanımı tanımlanır. Bu yöntem her malzeme için otomatik olarak aynı kabul edilmemelidir."],["4. Çekme dayanımı, boyun verme ve kopma","Mühendislik gerilmesi eğrisinin ulaştığı en yüksek değer çekme dayanımıdır. Bu noktadan sonra numunede yerel kesit daralması, yani boyun verme gelişebilir. Kuvvet azalırken ilk alan A₀ ile hesaplanan mühendislik gerilmesi de düşebilir. Gerçek gerilme ise anlık kesit alanını esas aldığından boyun verme öncesi ve sonrasında farklı bir eğilim gösterebilir. Kopma uzaması ve kesit daralması sünekliğin deneysel göstergelerindendir."],["5. Enerji, yorulma ve zamana bağlı davranış","Elastik bölgede birim hacim başına depolanan enerjiye dayanıklılık (resilience) ile, kopmaya kadar eğri altında kalan enerjiye toklukla ilişki kurulur. Tekrarlı yük altında gerilme akma dayanımının altında kalsa bile çatlak başlatıp ilerletebilen yorulma hasarı oluşabilir. Yüksek sıcaklık ve uzun süreli gerilme altında sünme görülebilir. Bu nedenle tek seferlik çekme deneyi, bütün servis koşullarını tek başına temsil etmez."]],"formula":"σ = P/A₀     ε = ΔL/L₀     E = Δσ/Δε (doğrusal elastik aralık)","meaning":"σ: mühendislik gerilmesi (MPa); P: eksenel kuvvet (N); A₀: ilk kesit alanı (mm²); ε: boyutsuz mühendislik birim şekil değiştirmesi; E: elastisite modülü (MPa). E dayanım değil, elastik rijitlik ölçüsüdür.","derivation":"Mühendislik gerilmesi, deney kuvvetinin başlangıç kesit alanına bölünmesiyle tanımlanır: σ=P/A₀. Mühendislik birim şekil değiştirmesi ölçülen boy değişiminin ilk ölçü boyuna oranıdır: ε=ΔL/L₀. Doğrusal elastik aralıkta σ ve ε doğru orantılı kabul edilir; bu doğrunun eğimi E=Δσ/Δε olur. Eğrinin tamamı doğrusal olmadığı için bu eğim yalnızca doğrusal elastik bölümden alınır.","examples":[["Örnek 1 — Çekme numunesinde mühendislik gerilmesi","İlk çapı 12,5 mm olan dairesel numuneye 38 kN çekme kuvveti uygulanıyor. Mühendislik normal gerilmesini hesapla.",["Kesit alanı A₀=πd²/4=π×12,5²/4=122,72 mm².","Kuvveti dönüştür: P=38 kN=38.000 N.","σ=P/A₀=38.000/122,72=309,6 N/mm².","1 N/mm²=1 MPa olduğundan gerilme 309,6 MPa'dır.","Bu değer yalnızca verilen yükteki mühendislik gerilmesidir; akma veya çekme dayanımıyla karşılaştırmak için malzemenin deney/sertifika verisi gerekir."],"Sonuç: σ≈309,6 MPa."],["Örnek 2 — Gerilme–şekil değiştirme eğrisinden E bulma","Doğrusal elastik bölgede bir deney noktasında σ₁=40 MPa, ε₁=0,00020; ikinci noktada σ₂=120 MPa, ε₂=0,00060 ölçülüyor. Eğimden elastisite modülünü hesapla.",["Gerilme farkı Δσ=120−40=80 MPa.","Birim şekil değiştirme farkı Δε=0,00060−0,00020=0,00040.","E=Δσ/Δε=80/0,00040=200.000 MPa.","200.000 MPa=200 GPa.","Bu hesap, seçilen iki noktanın doğrusal elastik aralıkta bulunması koşuluyla geçerlidir."],"Sonuç: E=200 GPa."]],"engineering":"Çelik donatı ve yapı çeliği kabul deneylerinin yorumlanması, deprem tasarımında süneklik beklentisi, yorulmaya maruz köprü ve makine elemanları ile uzun süreli yük/sıcaklık etkilerinin değerlendirilmesinde kullanılır. Malzeme seçiminde dayanım kadar rijitlik, süneklik, tokluk, kaynaklanabilirlik ve çevresel dayanıklılık da dikkate alınır.","pitfalls":["Elastisite modülünü akma dayanımı veya çekme dayanımı sanmak.","Mühendislik gerilmesinde ilk alan A₀ yerine anlık alanı kullandığını fark etmemek.","Eğrinin doğrusal olmayan bölümünden E hesaplamak.","Çekme dayanımını kopma gerilmesiyle aynı kabul etmek.","Tek bir çekme deneyiyle yorulma, sünme ve korozyon davranışının da kanıtlandığını düşünmek."],"checks":[["Elastisite modülü hangi aralığın eğimidir?","Gerilme–birim şekil değiştirme eğrisinin doğrusal elastik aralığının eğimidir."],["Süneklik neyi ifade eder?","Malzemenin kopmadan önce önemli miktarda plastik şekil değiştirebilme kabiliyetini ifade eder."],["Çekme dayanımı nasıl tanımlanır?","Mühendislik gerilmesi–şekil değiştirme eğrisindeki en yüksek mühendislik gerilmesidir."],["Yorulma için gerilmenin mutlaka akma dayanımını aşması gerekir mi?","Hayır. Yeterli sayıda tekrarlı çevrim altında daha düşük gerilmelerde de yorulma hasarı gelişebilir."]]},
"4":{"intro":"Eksenel yükleme altında çubuk yalnızca gerilme taşımaz; boyu da değişir. Mukavemet hesabında dayanım kadar deformasyonun sınırlandırılması da önemlidir. Bu konu, normal kuvvetten uzama/kısalmaya nasıl geçildiğini, parçalı çubukların nasıl çözüldüğünü ve sonucun hangi kabullere dayandığını açıklar.","diagram":"axial","sections":[["1. Eksenel deformasyonun fiziksel anlamı","Çubuğun ekseni boyunca etkiyen kuvvet çubukta çekme veya basınç oluşturur. Çekme çoğunlukla uzama, basınç kısalma meydana getirir. ΔL mutlak boy değişimidir; birimi mm veya m'dir. Aynı uzama kısa çubukta daha büyük birim şekil değiştirme oluşturacağından deformasyon ilk boya oranlanarak değerlendirilir."],["2. ΔL=NL/(AE) bağıntısının kurulması","Sabit kesitli ve doğrusal elastik çubuk için σ=N/A, Hooke kanunundan ε=σ/E ve geometrik tanımdan ε=ΔL/L yazılır. Bu ifadeler birleştirilince ΔL=NL/(AE) elde edilir. Çubuk uzunsa daha çok; eksenel kuvvet büyükse daha çok uzar. Kesit alanı ve elastisite modülü arttıkça uzama azalır."],["3. Parçalı ve kademeli çubuklar","Çubuk boyunca kesit alanı, elastisite modülü veya normal kuvvet değişiyorsa çubuğu bu büyüklüklerin sabit kaldığı parçalara ayır. Her parça için ΔLᵢ=NᵢLᵢ/(AᵢEᵢ) hesapla. Toplam boy değişimi, aynı eksen üzerindeki uzama ve kısalmaların işaretli toplamıdır: ΔL_toplam=ΣΔLᵢ. İç kuvveti belirlemek için her parçada ayrıca denge kurulmalıdır."],["4. İşaret, sıcaklık ve montaj etkileri","Çekmeyi pozitif seçersen çekme uzaması pozitif, basınç kısalması negatif alınır. Sıcaklık değişimi serbestçe gerçekleşebiliyorsa ΔL_T=αLΔT kadar boy değişimi oluşur. Çubuk tamamen veya kısmen kısıtlanmışsa sıcaklık deformasyonu engellenir ve ilave eksenel kuvvet/gerilme doğabilir; bu durumda yalnız mekanik yük uzamasını hesaplamak yeterli değildir."],["5. Modelin geçerlilik koşulları","Bağıntı küçük deformasyon, doğrusal elastik malzeme davranışı, eksenel yükleme ve uygun kesit varsayımlarıyla kullanılır. Büyük deformasyon, plastik davranış, eksantrik yük, yerel gerilme yığılması veya burkulma etkisi varsa daha gelişmiş analiz gerekir. Basınç çubuklarında yalnız ΔL hesabı kararlılık kontrolünün yerini tutmaz."]],"formula":"ΔL = NL/(AE)     ve     ΔL_toplam = Σ[NᵢLᵢ/(AᵢEᵢ)]","meaning":"ΔL: eksenel boy değişimi (mm); N: iç normal kuvvet (N); L: parça boyu (mm); A: kesit alanı (mm²); E: elastisite modülü (N/mm² = MPa). N, L, A ve E birimlerini tutarlı kullan.","derivation":"Geometrik tanım ε=ΔL/L'dir. Doğrusal elastik davranış için σ=Eε ve eksenel gerilme için σ=N/A yazılır. ΔL/L=(N/A)/E olduğundan ΔL=NL/(AE) elde edilir. Çubuk boyunca N, A veya E değişiyorsa bu ifade küçük parçalara uygulanır; sürekli değişim durumunda integral biçimi kullanılır: ΔL=∫[N(x)/(A(x)E(x))]dx.","examples":[["Örnek 1 — Sabit kesitli çelik çubuğun uzaması","Uzunluğu 2.000 mm, kesit alanı 500 mm², elastisite modülü 200.000 MPa olan çubuk 50 kN çekme kuvveti taşıyor. Uzamayı hesapla.",["Verilenleri yaz: N=50.000 N, L=2.000 mm, A=500 mm², E=200.000 N/mm².","ΔL=NL/(AE) bağıntısını kullan.","ΔL=(50.000×2.000)/(500×200.000)=100.000.000/100.000.000=1,00 mm.","Çekme etkisi olduğundan seçilen işaret kuralında uzama pozitiftir.","Sonucun küçük olması küçük deformasyon varsayımını destekler; yine de tasarım kabulü ayrıca kontrol edilmelidir."],"Sonuç: ΔL=1,00 mm uzama."],["Örnek 2 — İki farklı malzemeli/kesitli parçanın toplam uzaması","Seri bağlı iki çubuk parçası aynı 40 kN çekme kuvvetini taşıyor. 1. parça: L₁=1.000 mm, A₁=400 mm², E₁=200.000 MPa. 2. parça: L₂=800 mm, A₂=200 mm², E₂=100.000 MPa. Toplam uzamayı bul.",["Seri bağlı, arada başka eksenel yük yok ve kendi ağırlıkları ihmal ediliyorsa iki parçadaki normal kuvvet 40.000 N'dur.","1. parça: ΔL₁=(40.000×1.000)/(400×200.000)=0,50 mm.","2. parça: ΔL₂=(40.000×800)/(200×100.000)=1,60 mm.","Toplam uzama: ΔL=0,50+1,60=2,10 mm.","Parçalardan biri basınçta olsaydı işaretli toplamda kısalma eksi alınacaktı."],"Sonuç: ΔL_toplam=2,10 mm uzama."]],"engineering":"Askı çubukları, gergi elemanları, ankraj tijleri, kafes sistem çubukları ve çekme elemanlarında uzama kontrolü; kolonlarda kısalma ve oturma uyumluluğu değerlendirmeleri; montaj toleransı ve sıcaklık etkilerinin ilk hesabında kullanılır.","pitfalls":["N'yi dış yüklerin toplamı sanıp her parça için iç kuvveti kontrol etmemek.","E'yi MPa, alanı m² ve boyu mm kullanarak birimleri karıştırmak.","Seri bağlı parçalarda toplam uzamayı tek bir parça gibi hesaplamak.","Basınç kısalmasını da pozitif uzama gibi eklemek.","Basınç elemanında burkulmayı yalnız eksenel uzama hesabıyla kontrol ettiğini varsaymak."],"checks":[["Aynı N, A ve E için çubuk boyu iki katına çıkarsa uzama ne olur?","ΔL=NL/(AE) olduğundan iki katına çıkar."],["Aynı yükte kesit alanı iki katına çıkarsa uzama nasıl değişir?","Yarıya iner; uzama alanla ters orantılıdır."],["Seri bağlı iki parçanın toplam uzaması nasıl bulunur?","Her parçanın işaretli deformasyonu ayrı hesaplanır ve cebirsel olarak toplanır."],["ΔL=NL/(AE) bütün basınç çubuklarında yeterli midir?","Hayır. Basınç elemanlarında burkulma/kararlılık ayrıca kontrol edilmelidir."]]},
"5":{"intro":"Bazı eksenel sistemlerde denge denklemleri bilinmeyen mesnet tepkilerini bulmaya yetmez. Bu tür sistemlere statikçe belirsiz sistem denir. Çözüm için dengeye ek olarak deformasyon uyumluluğu ve malzeme bağıntıları gerekir. Bu konu, yükün birden fazla eleman arasında nasıl paylaşıldığını öğretir.","diagram":"axial","sections":[["1. Statikçe belirsizlik ne demektir?","Düzlem eksenel sistemde bilinmeyen tepki kuvvetlerinin sayısı kullanılabilir bağımsız denge denklemlerinden fazlaysa sistem statikçe belirsizdir. Denge denklemleri yüklerin toplamını verir ancak her elemanın ne kadar yük taşıdığını tek başına belirlemez. Eksik bilgi, elemanların deformasyonlarının ve bağlantıların geometrik koşullarının oluşturduğu uyumluluk denkleminden gelir."],["2. Denge + uyumluluk + malzeme bağıntısı","Çözüm üç parçadan oluşur: (i) bütün sistem veya uygun parçalar için ΣF=0 denge denklemi, (ii) bağlantı/mesnet nedeniyle oluşan deformasyon ilişkisi, (iii) ΔL=NL/(AE) gibi kuvvet-deformasyon bağıntısı. Önce bilinmeyenleri ve pozitif yönleri belirle; sonra aynı yer değiştirmeye bağlı eleman kuvvetlerini uyumlulukla ilişkilendir."],["3. Paralel bağlı iki çubukta yük paylaşımı","İki çubuk rijit bir plakaya bağlanmış ve aynı iki plaka arasında uzuyorsa, uç deplasmanları eşittir: ΔL₁=ΔL₂. Her çubuk için ΔLᵢ=NᵢLᵢ/(AᵢEᵢ) yazılır. Toplam dış yük P=N₁+N₂ dengeyi verir. Eşit boyda paralel çubuklarda yük paylaşımı yalnız alanla değil, A·E rijitlikleriyle belirlenir."],["4. Rijit bağlantı ve sıcaklık etkisi","Rijit plaka dönmeden öteleniyorsa plakanın bağlandığı noktaların deplasman ilişkisi aynıdır. Bağlantı esnekse bu varsayım geçerli olmayabilir. Sıcaklık değişiminde her çubuğun serbest termal uzaması αLΔT'dir; ortak bağlantı ve mesnetler bu uzamayı kısıtlayarak ilave kuvvet doğurabilir. Uyumluluk denklemine mekanik ve termal deformasyon birlikte eklenmelidir."],["5. Sonuçların fiziksel kontrolü","Yük paylaşımı hesabında çubuk kuvvetlerinin toplamı dış yükü karşılamalıdır. Daha rijit elemanın genellikle daha fazla yük taşıması beklenir. Reaksiyonların yönü varsayımın tersine çıkarsa işaret yorumlanır. Bağlantıların kaymadığı, plakaların rijit olduğu, malzemenin elastik kaldığı gibi kabuller çözümde açıkça belirtilmelidir."]],"formula":"ΣFₓ = 0     P = N₁ + N₂     ΔL₁ = ΔL₂;     ΔLᵢ = NᵢLᵢ/(AᵢEᵢ)","meaning":"P: dış eksenel yük (N); Nᵢ: i'nci çubuktaki normal kuvvet (N); ΔLᵢ: çubuk uzaması (mm). Eşit deplasman bağıntısı yalnız bağlantı geometrisi gerçekten eşit yer değiştirmeyi zorluyorsa kullanılır.","derivation":"İki paralel çubuğu taşıyan rijit plaka için yatay/düşey eksen boyunca uygun denge denklemi P=N₁+N₂ verir. Plaka dönmüyor ve çubuk uçları aynı iki rijit bağlantıya bağlıysa iki çubuğun uzaması aynıdır: ΔL₁=ΔL₂. Her birine ΔLᵢ=NᵢLᵢ/(AᵢEᵢ) yazıldığında kuvvetlerin oranı N₁/N₂=(A₁E₁/L₁)/(A₂E₂/L₂) elde edilir. Bu ikinci bağıntı denge denkleminde bulunmayan yük dağılımını verir.","examples":[["Örnek 1 — Çelik ve alüminyum paralel çubuklarda yük paylaşımı","Uzunlukları 1.000 mm olan iki paralel çubuk rijit plakaya bağlıdır. Çelik: A₁=400 mm², E₁=200.000 MPa. Alüminyum: A₂=600 mm², E₂=70.000 MPa. Plaka 100 kN aşağı yük taşıyor. Her çubuğun kuvvetini ve ortak uzamayı bul.",["Denge: N₁+N₂=100.000 N.","Uyumluluk: ΔL₁=ΔL₂. Eşit uzunlukta olduğundan N₁/(A₁E₁)=N₂/(A₂E₂).","Rijitlik katsayıları: A₁E₁=400×200.000=80.000.000 N; A₂E₂=600×70.000=42.000.000 N.","Kuvvet oranı N₁/N₂=80/42. Dolayısıyla N₁=100.000×80/122=65.574 N; N₂=34.426 N.","Ortak uzama: ΔL=N₁L/(A₁E₁)=65.574×1.000/80.000.000=0,820 mm (yaklaşık).","Kontrol: 65,574+34,426=100,000 kN; denge sağlanır."],"Sonuç: Çelik çubuk ≈65,57 kN; alüminyum çubuk ≈34,43 kN; ortak uzama ≈0,820 mm."],["Örnek 2 — İki çubuğun rijitliğini karşılaştırma","Aynı boylu iki çekme elemanından birincinin A₁E₁ değeri 60×10⁶ N, ikincinin A₂E₂ değeri 30×10⁶ N. Rijit plakanın taşıdığı 90 kN yük paylaşımını bul.",["Eşit boy ve eşit uzama nedeniyle N₁/N₂=(A₁E₁)/(A₂E₂)=60/30=2.","Denge N₁+N₂=90 kN.","N₁=2N₂ yaz: 3N₂=90; N₂=30 kN.","N₁=60 kN bulunur.","Daha büyük eksenel rijitliğe sahip birinci eleman toplam yükün daha büyük bölümünü taşır."],"Sonuç: N₁=60 kN, N₂=30 kN."]],"engineering":"Kompozit askı sistemleri, çelik-beton birlikte çalışan elemanlar, ankraj grupları, bağlantı plakaları, öngerme/germe sistemleri ve rijit başlıkla bağlanan çubuk gruplarında yük dağılımı ve uyumluluk hesabı için kullanılır.","pitfalls":["Statikçe belirsiz sistemi yalnız denge denklemleriyle çözmeye çalışmak.","Eşit deplasman koşulunu bağlantı geometrisini incelemeden yazmak.","Paralel çubuklarda yükün alan oranında paylaşıldığını varsaymak; E ve L de etkilidir.","N₁+N₂=P denge kontrolünü yapmamak.","Sıcaklık, boşluk, ön yük veya bağlantı esnekliğini problemde verilmişken ihmal etmek."],"checks":[["Statikçe belirsiz eksenel sistemde dengeye ek hangi denklem gerekir?","Geometrik deformasyon uyumluluğu denklemi ve kuvvet-deformasyon bağıntıları gerekir."],["Eşit boylu paralel çubukların yük paylaşımında hangi özellikler etkilidir?","Kesit alanı A ve elastisite modülü E; farklı boylarda ayrıca L de etkilidir."],["Paralel çubukların kuvvetleri hangi denklemle kontrol edilir?","Dış yük P=N₁+N₂ (ve varsa diğer çubuk kuvvetleri) olmalıdır."],["Sistemin statikçe belirsiz olması, çözümün imkânsız olduğu anlamına gelir mi?","Hayır. Dengeye uyumluluk ve malzeme bağıntıları eklenerek çözülür."]]},
"6":{"intro":"Burulma, mil veya benzeri elemanların eksenleri çevresinde döndürülmeye zorlanmasıdır. Güç aktaran millerde, bağlantı elemanlarında ve bazı yapı sistemlerinde burulma kayma gerilmesi ve dönme açısı oluşturur. Dairesel miller için temel bağıntıları ve bunların geometrik dayanağını öğreneceksin.","diagram":"torsion","sections":[["1. Burulma momenti ve kayma deformasyonu","Burulma momenti T, elemanın boyuna ekseni etrafında dönmeye zorlayan momenttir. Dairesel milin kesitleri birbirine göre döner; mil yüzeyindeki noktalar çevresel yönde yer değiştirir ve kayma şekil değiştirmesi oluşur. İdeal dairesel milde kesit düzlemleri düz kalır ve mil ekseni boyunca düzlem kalır varsayımıyla klasik burulma teorisi kurulur."],["2. Kayma gerilmesinin kesitte dağılımı","Dairesel milde elastik burulma altında kayma gerilmesi merkezde sıfır, dış yüzeyde maksimumdur ve yarıçapla doğrusal artar: τ(r)=Tr/J. Burada J kutupsal alan atalet momentidir. Dış yarıçap c için τmax=Tc/J olur. Bu dağılım dairesel olmayan kesitlere doğrudan uygulanamaz; dairesel olmayan kesitlerde çarpılma ve farklı gerilme dağılımları ortaya çıkar."],["3. Kutupsal atalet momenti J","Dolu dairesel kesitte J=πd⁴/32=πc⁴/2; içi boş dairesel kesitte J=π(D⁴−d⁴)/32'dir. J kesitin burulmaya karşı geometrik direncini ifade eder. Çapın dördüncü kuvvetiyle değiştiği için dış çapta küçük artış bile burulma dayanımını ve rijitliğini belirgin artırabilir. Dolu ve boş milleri karşılaştırırken aynı malzeme ve dış boyut için malzeme dağılımının etkisini düşün."],["4. Burulma açısı","Doğrusal elastik, sabit kesitli ve sabit T taşıyan dairesel milde φ=TL/(GJ) olur. G kayma modülü, L mil boyudur. Mil uzadıkça dönme artar; G veya J büyüdükçe dönme azalır. T veya J mil boyunca değişiyorsa toplam dönme, φ=∫T(x)/(GJ(x)) dx ile bulunur."],["5. Güç ve devir sayısı bağlantısı","Dönen milde güç, açısal hız ile burulma momentinin çarpımıdır: P=Tω. Devir sayısı n dev/dak ise ω=2πn/60 rad/s. Bu ilişki güç aktarımında torku bulmaya yardım eder. Hesaplanan τ ve φ, izin verilen gerilme ve dönme sınırlarıyla karşılaştırılmalıdır; bağlantı kama kanalı, omuz ve çap değişimleri gibi yerel etkiler ayrıca incelenir."]],"formula":"τ = Tc/J     φ = TL/(GJ)     J_dolu = πd⁴/32     J_boru = π(D⁴−d⁴)/32","meaning":"τ: kayma gerilmesi (MPa); T: burulma momenti (N·mm); c: dış yarıçap (mm); J: kutupsal alan atalet momenti (mm⁴); φ: dönme açısı (rad); G: kayma modülü (MPa); L: mil boyu (mm).","derivation":"Elastik burulmada yarıçapı r olan noktadaki kayma şekil değiştirmesi γ=rφ/L'dir. Hooke'un kayma biçimi τ=Gγ olduğundan τ=G r φ/L elde edilir. Kesit moment dengesi T=∫A τ r dA ile yazılır. τ ifadesi yerine konduğunda T=(Gφ/L)∫A r²dA=(Gφ/L)J olur. Buradan φ=TL/(GJ); dış yüzeyde r=c alınarak τmax=Tc/J bulunur.","examples":[["Örnek 1 — Dolu dairesel milde maksimum kayma gerilmesi","Çapı 40 mm olan dolu çelik mil 1,0 kN·m burulma momenti taşıyor. Maksimum kayma gerilmesini hesapla.",["T=1,0 kN·m=1.000 N·m=1.000.000 N·mm.","d=40 mm, c=d/2=20 mm.","J=πd⁴/32=π×40⁴/32=251.327 mm⁴ (yaklaşık).","τmax=Tc/J=(1.000.000×20)/251.327=79,58 N/mm².","N/mm²=MPa olduğundan τmax≈79,6 MPa. Bu değerin uygunluğu, malzemenin kayma dayanımı ve tasarım emniyetine göre ayrıca değerlendirilir."],"Sonuç: τmax≈79,6 MPa."],["Örnek 2 — Milin dönme açısı","Örnek 1'deki 40 mm dolu milin boyu 1.500 mm, kayma modülü G=80.000 MPa. Uçlar arasındaki burulma açısını bul.",["T=1.000.000 N·mm; L=1.500 mm; G=80.000 N/mm²; J=251.327 mm⁴.","φ=TL/(GJ).","φ=(1.000.000×1.500)/(80.000×251.327)=0,0746 rad (yaklaşık).","Dereceye çevir: 0,0746×180/π≈4,27°.","Bu sonuç küçük açı yaklaşımıyla hesaplanmıştır; servis şartlarında izin verilen dönme ayrıca kontrol edilir."],"Sonuç: φ≈0,0746 rad ≈4,27°."]],"engineering":"Motor ve pompa milleri, vinç tambur milleri, tahrik milleri, makine bağlantıları ve dönme etkisi taşıyan elemanlarda dayanım/rijitlik kontrolü için kullanılır. İnşaat mühendisliğinde doğrudan mil tasarımının yanında, eksantrik yük alan kiriş ve kolonlarda burulma etkisini fark etmeye temel oluşturur.","pitfalls":["T'yi N·m bırakıp c ve J'yi mm ile kullanmak.","Çapı dış yarıçap c yerine koymak.","Dolu milde πd⁴/16 veya yanlış kuvvet kullanmak; doğru J=πd⁴/32'dir.","Dairesel mil bağıntısını kare veya ince cidarlı açık kesitlere aynen uygulamak.","Kayma gerilmesi ile normal gerilmeyi karıştırmak.","Gerilme kontrolü yapıp dönme/rijitlik kontrolünü unutmak."],"checks":[["Dolu dairesel milde maksimum τ hangi noktadadır?","Dış yüzeyde, r=c konumunda; merkezde sıfırdır."],["Dolu dairesel kesitte J formülü nedir?","J=πd⁴/32."],["G artarsa aynı T, L ve J için dönme açısı nasıl değişir?","Azalır; φ=TL/(GJ)."],["Burulma gücü ile tork ilişkisi nedir?","P=Tω; açısal hız rad/s cinsinden kullanılmalıdır."]]},
"7":{"intro":"Kirişlerde kesme kuvveti V ve eğilme momenti M, dış yüklerin kesit içindeki etkisini temsil eder. Bu büyüklükler kiriş boyunca değişir; değişimlerini kesme kuvveti ve eğilme momenti diyagramlarıyla izleriz. Diyagramlar maksimum iç tesirlerin ve kritik kesitlerin bulunmasını sağlar.","diagram":"shear","sections":[["1. Kesme kuvveti ve eğilme momenti","Bir kiriş hayalî bir kesitten ayrıldığında kesitte düşey iç kuvvet V ve iç moment M oluşur. V, kesitin bir tarafındaki düşey kuvvetlerin cebirsel dengesini sağlar. M, dış kuvvetlerin kesit etrafında oluşturduğu momenti dengeler. Düzlem ve düşey yükleme problemlerinde normal kuvvet N de bulunabilir; ancak yalnız düşey yük varsa çoğu örnekte N=0 çıkar."],["2. Yayılı yük, V ve M arasındaki ilişki","Seçilen yayılı yük ve işaret konvansiyonunda diferansiyel ilişkiler dV/dx=−w(x) ve dM/dx=V(x) biçiminde yazılabilir. Kaynaklarda w ve V işaret tanımları farklı seçilebildiğinden diyagramın başında konvansiyonu belirle. Bu ilişkilerin büyüklük bakımından önemli sonucu şudur: yayılı yük V diyagramının eğimini; V ise M diyagramının eğimini belirler."],["3. Tekil yük ve moment diyagramda ne yapar?","Aşağı yönlü tekil kuvvet, kesme diyagramında kuvvet büyüklüğü kadar ani sıçrama oluşturur. Tekil moment, eğilme momenti diyagramında ani sıçrama oluşturur. Sonlu yayılı yük altında V sürekli ve doğrusal/değişen eğimli olabilir; M ise V'nin integrali niteliğinde eğri oluşturur. Yük olmayan bölgede V sabit, M doğrusal değişir."],["4. Diyagram çizme sırası","Önce tüm kirişin mesnet tepkilerini bul. Sonra yükün veya mesnetin bulunduğu aralıkları ayır. Her aralıkta x koordinatı tanımla; kesit alıp sol veya sağ parçanın dengesinden V(x) ve M(x) ifadelerini çıkar. Tekil yüklerde sıçramayı, yayılı yüklerde eğimi ve uç koşullarını kontrol et. Son olarak V=0 olan noktalar ile M'nin uç değerlerini incele."],["5. Maksimum moment ve tasarım bağlantısı","M'nin yerel ekstremumları genellikle V=0 olduğu noktalarda aranır; ancak noktasal moment sıçramaları ve sınır noktaları ayrıca değerlendirilmelidir. Basit kirişte maksimum moment çoğu zaman açıklıkta, ankastre kirişte maksimum moment çoğu zaman ankastre uçta oluşur. Bulunan M diyagramı daha sonra eğilme gerilmesi hesabına girdi olur."]],"formula":"dV/dx = −w(x)     dM/dx = V(x)     (işaret konvansiyonuna bağlı)","meaning":"V: kesme kuvveti (kN); M: eğilme momenti (kN·m); w: yayılı yük (kN/m); x: kiriş boyunca koordinat (m). Kullanılan işaret konvansiyonunu çözüm boyunca değiştirme.","derivation":"Uzunluğu dx olan küçük bir kiriş parçasının düşey kuvvet dengesinde sol ve sağ kesme kuvvetleri ile w·dx yayılı yükü bulunur. Birinci mertebe terimler tutulduğunda kesme kuvvetinin konuma göre değişimi yayılı yükle ilişkilendirilir: dV/dx=−w (seçilen yaygın konvansiyonda). Aynı küçük parçanın moment dengesi, dM/dx=V bağıntısını verir. Bu iki bağıntı, yük diyagramı ile V ve M diyagramları arasındaki geometrik ilişkiyi açıklar.","examples":[["Örnek 1 — Basit kirişte düzgün yayılı yük","6 m açıklıklı, iki ucu basit mesnetli kirişin tamamına 4 kN/m düzgün yayılı yük uygulanıyor. Mesnet tepkilerini, V(x) ve M(x) ifadelerini ve maksimum momenti bul.",["Toplam yayılı yük W=wL=4×6=24 kN ve orta noktadan etkiler.","Simetriden Aᵧ=Bᵧ=24/2=12 kN; yatay yük olmadığından Aₓ=0.","A'dan x uzaklığındaki kesit için sol parçayı al: V(x)=12−4x (kN), 0≤x≤6.","Moment: M(x)=12x−(4x)(x/2)=12x−2x² (kN·m). Uçlarda M(0)=M(6)=0.","V=0 için 12−4x=0; x=3 m.","M(3)=12×3−2×3²=36−18=18 kN·m."],"Sonuç: Aᵧ=Bᵧ=12 kN; V(x)=12−4x kN; Mmax=18 kN·m, orta noktada."],["Örnek 2 — Konsol kirişte uç yük","2 m uzunluğunda ankastre kirişin serbest ucuna 5 kN aşağı yönlü tekil yük uygulanıyor. Ankastre tepkisini ve en büyük momenti bul.",["Düşey dengeyle ankastre düşey tepkisinin büyüklüğü 5 kN yukarıdır.","Ankastre noktasına göre moment dengesi: M_A=5×2=10 kN·m; yönü yükün oluşturduğu dönmeye karşıdır.","Kiriş boyunca kesme kuvvetinin büyüklüğü sabit 5 kN'dur; işareti seçilen konvansiyona bağlıdır.","Eğilme momenti serbest uçta sıfırdan ankastre uçta 10 kN·m büyüklüğüne doğrusal değişir.","Konsol kirişte en büyük moment ankastre uçta oluşur."],"Sonuç: |V|=5 kN; |M|max=10 kN·m (ankastre uç)."]],"engineering":"Döşeme ve çatı kirişleri, köprü kirişleri, travers ve ray taşıma sistemi idealizasyonları, konsollar ve makine kirişlerinde en büyük kesme kuvveti ile momentin yerini belirlemek için kullanılır. Donatı hesabı, kesme tasarımı, kesit boyutlandırması ve sehim analizinin temel girdilerindendir.","pitfalls":["Mesnet tepkilerini bulmadan V–M diyagramı çizmeye başlamak.","Yayılı yükün toplamını wL yerine yalnız w almak.","Tekil kuvvetin V diyagramında sıçrama yaptığını unutmak.","Tekil momentin M diyagramına etkisini atlamak.","V=0 noktasını aramadan maksimum momenti tahmin etmek.","İşaret konvansiyonunu çizim sırasında değiştirmek; farklı kaynakların işaretlerini karıştırmak."],"checks":[["Düzgün yayılı yük yoksa V nasıl değişir?","Tekil kuvvet olmayan bir aralıkta sabit kalır."],["Yayılı yük V diyagramının hangi özelliğini belirler?","V diyagramının eğimini belirler; seçilen yaygın konvansiyonda dV/dx=−w."],["M diyagramının eğimi neye eşittir?","Kesme kuvvetine: dM/dx=V (seçilen işaret konvansiyonunda)."],["Basit mesnetli kirişte V=0 noktası neden önemlidir?","Sürekli M(x) için bu nokta çoğunlukla yerel maksimum/minimum momentin bulunduğu yerdir."]]},
"8":{"intro":"Eğilme gerilmesi, kirişin kesitinde bir tarafın çekmeye, diğer tarafın basınca zorlanmasıyla oluşur. Normal kuvvet de varsa eksenel gerilme ve eğilme gerilmesi birlikte değerlendirilir. Bu konu, iç moment diyagramından kesit gerilmesine ve birleşik yükleme kontrolüne geçişi öğretir.","diagram":"bending","sections":[["1. Eğilme altında kesitte ne olur?","Kiriş eğildiğinde kesitin bir bölgesindeki boyuna lifler uzar, karşı tarafındaki lifler kısalır. Arada boyuna deformasyonun sıfır olduğu nötr eksen bulunur. Basit elastik eğilme teorisinde düzlem kesitlerin deformasyondan sonra da düz kaldığı, malzemenin doğrusal elastik olduğu ve eğriliğin uygun sınırlar içinde bulunduğu kabul edilir. Bu kabuller altında normal gerilme nötr eksenden uzaklıkla doğrusal değişir."],["2. Eğilme gerilmesi bağıntısı","σ=My/I bağıntısında M iç eğilme momenti, y nötr eksenden incelenen noktaya uzaklık, I kesitin ilgili nötr eksene göre ikinci alan momentidir. Kesitin en dış lifinde |y|=c olduğundan maksimum elastik eğilme gerilmesi σmax=Mc/I olur. Moment birimi ile I ve y birimleri tutarlı olmalıdır."],["3. Kesit atalet momenti ve kesit modülü","I, alanın eksene göre dağılımını ifade eder; alanın kendisi değildir. Dikdörtgen kesitte yatay merkezî eksene göre I=bh³/12'dir; h eğilme doğrultusundaki toplam yüksekliktir. Kesit modülü S=I/c olarak tanımlanır ve σmax=M/S biçiminde hesaplamayı kolaylaştırır. Yüksekliğin küp etkisi nedeniyle kesit yönü önemlidir."],["4. Eksenel kuvvet ile eğilmenin birleşmesi","Aynı kesitte merkezî eksenel kuvvet N ve eğilme momenti M varsa, doğrusal elastik ve küçük deformasyon kabullerinde normal gerilme dağılımı süperpozisyonla σ=N/A±My/I olarak yazılır. Bir kesit kenarında eksenel gerilme ile eğilme gerilmesi toplanırken karşı kenarda birbirinden çıkabilir. İşaret, çekme/basınç ve moment yönüne göre belirlenir."],["5. Formülün sınırları ve dikkat edilecek durumlar","σ=My/I, klasik basit eğilme teorisinin varsayımları altında kullanılır. Kesme gerilmesi bu bağıntıyla bulunmaz; ince cidarlı/kısa derin kirişlerde kayma deformasyonu, yerel yükleme, kesit değişimi, plastik davranış veya bileşik iki eksenli eğilme ek değerlendirme gerektirebilir. Basınçta narin elemanlarda burkulma, malzeme dayanımından önce belirleyici olabilir."]],"formula":"σ = My/I = M/S     ve     σ_birleşik = N/A ± My/I","meaning":"σ: eğilme/normal gerilmesi (MPa); M: iç eğilme momenti (N·mm); y: nötr eksene uzaklık (mm); I: ikinci alan momenti (mm⁴); S=I/c: kesit modülü (mm³); N: eksenel kuvvet (N); A: kesit alanı (mm²).","derivation":"Basit elastik eğilmede şekil değiştirme nötr eksenden uzaklıkla doğrusal değişir: ε=−y/ρ. Hooke kanunuyla σ=Eε=−Ey/ρ olur. İç moment, kesit gerilmelerinin moment bileşkesidir: M=∫A σy dA. İfade yerine yazılıp nötr eksen için ∫A y dA=0 kullanıldığında M=EI/ρ elde edilir. Buradan 1/ρ=M/(EI) ve gerilme büyüklüğü σ=My/I bulunur. Eksenel kuvvet varsa N/A gerilmesi doğrusal elastik süperpozisyonla eklenir.","examples":[["Örnek 1 — Dikdörtgen kirişte maksimum eğilme gerilmesi","b=100 mm, h=200 mm dikdörtgen kesitli kirişte iç eğilme momenti 10 kN·m. Elastik eğilme varsayımıyla en dış lifteki maksimum gerilme büyüklüğünü hesapla.",["Moment birimi: M=10 kN·m=10×10⁶ N·mm.","Merkezî yatay eksene göre I=bh³/12=100×200³/12=66.666.667 mm⁴.","En dış lif uzaklığı c=h/2=100 mm.","σmax=Mc/I=(10×10⁶×100)/66.666.667=15 N/mm².","1 N/mm²=1 MPa olduğundan σmax=15 MPa. Kesitin üst ve alt liflerinde işaretler zıt olur."],"Sonuç: Maksimum elastik eğilme gerilmesi büyüklüğü 15 MPa."],["Örnek 2 — Eksenel kuvvet ve eğilmenin birlikte etkisi","Aynı b=100 mm, h=200 mm dikdörtgen kesite N=50 kN basınç ve M=10 kN·m eğilme momenti etkiyor. Bir kenardaki gerilmeler aynı işaretli, karşı kenarda zıt işaretli olacak biçimde en büyük çekme ve basınç gerilmelerini bul.",["Alan A=bh=100×200=20.000 mm². Eksenel basınç gerilmesi N/A=50.000/20.000=2,5 MPa basınçtır.","Örnek 1'den eğilme gerilmesi en dış lifte 15 MPa'dır.","Eğilmenin çekme oluşturduğu kenarda eksenel basınç bununla zıt işaretlidir: net çekme gerilmesi 15−2,5=12,5 MPa.","Diğer kenarda iki etki basınç yönünde toplanır: 15+2,5=17,5 MPa basınç.","Gerçek kesitte hangi kenarın çekme/basınç olduğu moment yönü ve kesit işaret kuralıyla belirlenir."],"Sonuç: En büyük çekme 12,5 MPa; en büyük basınç 17,5 MPa (belirtilen yön varsayımıyla)."]],"engineering":"Çelik ve betonarme kirişlerin ilk boyutlandırılması, kolonlarda eksenel kuvvet-moment etkileşiminin anlaşılması, köprü ana kirişleri, konsollar ve birleşik yük alan taşıyıcı elemanlarda kritik lif gerilmelerinin bulunmasında kullanılır. Betonarme nihai tasarımı için ilgili yönetmelik ve kesit davranış modeli ayrıca uygulanmalıdır.","pitfalls":["Dikdörtgen kesitte I=bh³/12 yerine yanlış eksene göre hesap yapmak.","Moment birimini kN·m bırakıp mm⁴ ve mm ile hesaplamak.","Kesit yüksekliği h yerine yarı yüksekliği formüle sokmak.","I alanı veya kutupsal J ile aynı şey sanmak.","Eksenel gerilme N/A ile eğilme gerilmesinin işaretlerini kontrol etmeden toplamak.","Elastik eğilme bağıntısını nihai betonarme dayanım hesabının tamamı sanmak."],"checks":[["Dikdörtgen kesitin yatay merkezî eksenine göre I değeri nedir?","I=bh³/12; burada h eksene dik toplam yüksekliktir."],["Kesit yüksekliği iki katına çıkar ve b sabit kalırsa I kaç kat olur?","Sekiz kat olur; I h'nin küpüyle orantılıdır."],["Eğilme gerilmesi nötr eksende kaçtır?","Basit elastik eğilme modelinde y=0 olduğundan sıfırdır."],["Eksenel kuvvet ve eğilme momenti birlikteyse hangi yaklaşım kullanılabilir?","Doğrusal elastik koşullarda σ=N/A±My/I süperpozisyonu kullanılabilir."]]}};

 ${(c.id==='muk1'&&mukavemetMastery[i])?masteryHTML(c,i):(deep?deepLessonHTML(c,i):`<section class="learn-section"><div class="learning-kicker">Konuya giriş</div><h3>Bu konunun amacı</h3><p>${lessonIntro(c,t)}</p>${specificLessonBox(c,i)}<h3>Öğrenme adımları</h3><ol><li>Temel tanım ve fiziksel anlamı kendi cümlenle açıkla.</li><li>Bir şekil, diyagram veya şema çizerek büyüklükleri göster.</li><li>Uygun denklem/ilkeyi seç; her sembolün anlamını ve birimini yaz.</li><li>İşlemi adım adım yap; sonucu birim ve fiziksel anlam bakımından kontrol et.</li></ol></section>`) }

 <section class="learn-section"><div class="learning-kicker">Aktif öğrenme</div><h3>Kendi anlatımın ve notların</h3><p>Notlarını yalnız kopyalama. “Bu formül neden kullanılır, hangi durumda kullanılamaz, birim nasıl kontrol edilir?” sorularını kendi cümlelerinle yanıtla.</p><textarea class="field" id="lessonNote" rows="5" style="width:100%" placeholder="Bu konuyu kendi cümlelerinle anlat. Çözemediğin adımı ve hocanın vurguladığı noktayı yaz…">${esc(state.notes[c.id+'_'+i]||'')}</textarea></section>
 <div class="row between" style="margin-top:14px"><button class="btn ghost small" onclick="saveLessonNote('${c.id}',${i})">Notumu kaydet</button><div class="row"><button class="btn small teal" onclick="startCourseQuiz('${c.id}')">Bu dersten test çöz</button><button class="btn small ${isdone?'ghost':'gold'}" onclick="toggleDone('${c.id}',${i})">${isdone?'Tamamlandı ✓':'Konuyu tamamladım'}</button></div></div>

}
function openLesson(id,i){lessonTopic=i;const app=document.getElementById('app');renderCourse(app,courseBy(id));setTimeout(()=>document.getElementById('lesson')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function saveLessonNote(id,i){state.notes[id+'_'+i]=document.getElementById('lessonNote').value;save();toast('Ders notun kaydedildi.')}
function todayView(){const due=state.wrong.filter(w=>!w.resolved&&new Date(w.next)<=new Date());return `${head('Bugünkü çalışma planım','Süreyi çalışma gününe göre ayarla. Plan, kısa oturumlarla sürdürülebilir ilerleme sağlar.')}<div class="grid two"><section class="panel"><h3>Günlük çalışma hedefi</h3><div class="row"><button class="btn ghost small" onclick="setGoal()">Hedef: ${state.goal} dk · değiştir</button><span class="muted smalltext">Bugün kaydedilen: ${state.sessions.filter(s=>s.date===todayKey()).reduce((a,s)=>a+s.minutes,0)} dk</span></div><div class="progress" style="margin:15px 0"><i style="width:${Math.min(100,state.sessions.filter(s=>s.date===todayKey()).reduce((a,s)=>a+s.minutes,0)/state.goal*100)}%"></i></div><h3>Oturum süresi</h3><div class="timer" id="timer">00:00</div><div class="row"><button class="btn teal" id="timerStart" onclick="timerStart()">Başlat</button><button class="btn ghost" onclick="timerPause()">Duraklat</button><button class="btn gold" onclick="timerFinish()">Kaydet ve bitir</button></div><p class="smalltext muted">Sayaç bu sayfada açıkken çalışır. Bitirince çalışma süren kaydedilir.</p></section><section class="panel"><h3>Hızlı plan oluştur</h3><p class="muted smalltext">Süreye göre konu öğrenme, tekrar ve soru çözme blokları oluştur.</p><div class="row"><button class="btn small ghost" onclick="makePlan(25)">25 dakika</button><button class="btn small ghost" onclick="makePlan(45)">45 dakika</button><button class="btn small ghost" onclick="makePlan(60)">60 dakika</button><button class="btn small ghost" onclick="makePlan(90)">90 dakika</button></div><div id="planResult" style="margin-top:13px">${todayPlanHTML()}</div></section></div>${head('Tekrar kuyruğum',`${due.length} zamanında tekrar bekliyor.`)}<div class="panel">${due.length?due.slice(0,8).map(w=>`<div class="task"><span class="dot" style="background:var(--red)"></span><div><b>${w.question}</b><small>${courseBy(w.course)?.name||'Ders'} · ${new Date(w.next).toLocaleDateString('tr-TR')}</small></div><button class="btn small ghost" onclick="reviewComplete('${w.id}')">Tekrar ettim</button></div>`).join(''):'<div class="empty">Bugün için gecikmiş tekrar yok. Harika!</div>'}</div>`}
function todayPlanHTML(){return `<div class="task"><span class="dot"></span><div><b>1. Yeni konu · 20 dakika</b><small>En az ilerleme kaydettiğin güz dönemi zorunlu dersinden.</small></div></div><div class="task"><span class="dot" style="background:var(--red)"></span><div><b>2. Yanlış/tekrar · 10 dakika</b><small>Önceki hataları yeniden çöz.</small></div></div><div class="task"><span class="dot" style="background:var(--teal)"></span><div><b>3. Uygulama · 15 dakika</b><small>5–10 soru ve kısa öz değerlendirme.</small></div></div>`}
function makePlan(m){let parts=m===25?[['Kısa konu tekrarı',8],['Örnek çözümü',9],['Mini test',8]]:m===45?[['Yeni konu anlatımı',20],['Rehberli örnek',10],['Yanlışları tekrar',5],['Mini test',10]]:m===60?[['Yeni konu anlatımı',25],['Rehberli örnek',15],['Aralıklı tekrar',8],['Test ve analiz',12]]:[['Yeni konu anlatımı',30],['İki örnek çözümü',20],['Yanlış defteri',15],['Süreli test',15],['Gün sonu özeti',10]];document.getElementById('planResult').innerHTML=parts.map((p,i)=>`<div class="task"><span class="dot" style="background:${['var(--blue)','var(--teal)','var(--red)','var(--gold)'][i%4]}"></span><div><b>${p[0]}</b><small>${p[1]} dakika</small></div></div>`).join('')+`<button class="btn small teal" onclick="nav('quiz')">Test bölümüne geç</button>`}
function timerStart(){if(timerInt)return;timerInt=setInterval(()=>{seconds++;const e=document.getElementById('timer');if(e)e.textContent=fmt(seconds)},1000);document.getElementById('timerStart').textContent='Çalışıyor…'}function timerPause(){clearInterval(timerInt);timerInt=null;const b=document.getElementById('timerStart');if(b)b.textContent='Devam et'}function timerFinish(){timerPause();const m=Math.max(1,Math.round(seconds/60));addSession(m,'Zaman tutuculu çalışma');seconds=0;const e=document.getElementById('timer');if(e)e.textContent='00:00';const b=document.getElementById('timerStart');if(b)b.textContent='Başlat';toast(`${m} dakika kaydedildi.`);render()}
function startSession(){nav('today');setTimeout(timerStart,30)}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function addSession(m,type){state.sessions.push({date:todayKey(),minutes:m,type});save()}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function weeklyMinutes(){const now=new Date();return state.sessions.filter(s=>(now-new Date(s.date+'T00:00:00'))/86400000<7).reduce((a,s)=>a+s.minutes,0)}
function quizView(){return `${head('Soru çözme merkezi','Ders bazlı mini test veya karma sınav oluştur. Her yanlış cevap açıklamasıyla birlikte yanlış defterine eklenir.')}<div class="grid two"><section class="panel"><h3>Testini oluştur</h3><label class="smalltext muted">Ders seç</label><select class="field" id="quizCourse" style="width:100%;margin:5px 0 13px"><option value="all">Tüm dersler · karma</option>${allCourses().map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select><label class="smalltext muted">Soru sayısı</label><select class="field" id="quizCount" style="width:100%;margin:5px 0 13px"><option>5</option><option selected>10</option><option>15</option><option>20</option></select><label class="smalltext muted">Zorluk</label><select class="field" id="quizLevel" style="width:100%;margin:5px 0 15px"><option value="all">Tüm seviyeler</option><option>Kolay</option><option>Orta</option><option>Zor</option></select><button class="btn teal" onclick="startQuiz()">Sınavı başlat</button></section><section class="panel"><h3>Çözüm stratejisi</h3><div class="task"><span class="dot"></span><div><b>Önce soruyu anla</b><small>Verilenleri, isteneni ve birimleri işaretle.</small></div></div><div class="task"><span class="dot" style="background:var(--teal)"></span><div><b>Şıkları ele</b><small>Formül, tanım ve fiziksel anlamla karşılaştır.</small></div></div><div class="task"><span class="dot" style="background:var(--gold)"></span><div><b>Yanlışını incele</b><small>Her yanlış için açıklama ve tekrar kaydı oluşturulur.</small></div></div><p class="smalltext muted">${questions.length} soru bulunur. Konu sonu aktif hatırlama soruları da sınav bankasına eklenir. Soruları ders notların ve öğretim elemanının sınav kapsamıyla karşılaştırarak çalış.</p></section></div><div id="quizArea"></div>`}
function startCourseQuiz(id){nav('quiz');setTimeout(()=>{document.getElementById('quizCourse').value=id;startQuiz()},20)}
function startQuiz(){let c=document.getElementById('quizCourse').value,n=Number(document.getElementById('quizCount').value),l=document.getElementById('quizLevel').value;let pool=questions.filter(q=>(c==='all'||q.c===c)&&(l==='all'||q.level===l));if(!pool.length){toast('Bu filtrede henüz soru yok. Karma testi deneyebilirsin.');return}pool=shuffle(pool).slice(0,Math.min(n,pool.length));quiz={items:pool,index:0,answers:{},started:Date.now()};renderQuizQuestion()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function renderQuizQuestion(){const q=quiz.items[quiz.index],c=courseBy(q.c);const area=document.getElementById('quizArea');area.innerHTML=`<div class="panel" style="margin-top:18px"><div class="row between"><span class="tag">SORU ${quiz.index+1} / ${quiz.items.length}</span><span class="smalltext muted">${c?.name||''} · ${q.level}</span></div><div class="progress" style="margin:13px 0"><i style="width:${(quiz.index+1)/quiz.items.length*100}%"></i></div><h3 style="font-size:18px">${q.q}</h3>${q.o.map((o,i)=>`<button class="quizopt ${quiz.answers[q.id]===i?'selected':''}" onclick="answerQuiz(${i})"><b>${'ABCD'[i]}.</b> ${o}</button>`).join('')}<div class="row between" style="margin-top:15px"><button class="btn ghost small" onclick="quizPrev()" ${quiz.index===0?'disabled':''}>Önceki</button><button class="btn teal" onclick="quizNext()">${quiz.index===quiz.items.length-1?'Testi bitir':'Sonraki soru →'}</button></div></div>`}
function answerQuiz(i){quiz.answers[quiz.items[quiz.index].id]=i;renderQuizQuestion()}
function quizPrev(){quiz.index=Math.max(0,quiz.index-1);renderQuizQuestion()}
function quizNext(){if(quiz.index<quiz.items.length-1){quiz.index++;renderQuizQuestion()}else finishQuiz()}
function finishQuiz(){const score=quiz.items.filter(q=>quiz.answers[q.id]===q.a).length;quiz.items.forEach(q=>{if(quiz.answers[q.id]!==q.a)addWrong(q,quiz.answers[q.id])});state.sessions.push({date:todayKey(),minutes:Math.max(1,Math.round((Date.now()-quiz.started)/60000)),type:'Test çözümü'});state.tests=state.tests||[];state.tests.push({date:todayKey(),score,total:quiz.items.length,course:quiz.items[0]?.c||'all'});save();const area=document.getElementById('quizArea');area.innerHTML=`<div class="panel" style="margin-top:18px"><div class="eyebrow" style="color:var(--teal)">TEST TAMAMLANDI</div><h2 style="font-size:30px;margin:6px 0">${score} / ${quiz.items.length} doğru</h2><div class="progress"><i style="width:${score/quiz.items.length*100}%"></i></div><p>${Math.round(score/quiz.items.length*100)}% başarı. ${score===quiz.items.length?'Mükemmel!':'Yanlış cevaplar yanlış defterine eklendi; açıklamalarını incele.'}</p>${quiz.items.map(q=>`<div class="task"><span class="dot" style="background:${quiz.answers[q.id]===q.a?'var(--green)':'var(--red)'}"></span><div><b>${q.q}</b><small>${quiz.answers[q.id]===q.a?'Doğru':'Senin cevabın: '+(q.o[quiz.answers[q.id]]||'Boş')+' · Doğru cevap: '+q.o[q.a]}<br>${q.e}</small></div></div>`).join('')}<button class="btn teal" onclick="nav('wrong')">Yanlış defterini incele</button> <button class="btn ghost" onclick="nav('quiz')">Yeni test oluştur</button></div>`;quiz=null}
function addWrong(q,ans){if(state.wrong.some(w=>w.questionId===q.id&&!w.resolved)){const w=state.wrong.find(w=>w.questionId===q.id&&!w.resolved);w.count=(w.count||1)+1;w.next=new Date(Date.now()+86400000).toISOString();return}state.wrong.push({id:'w_'+q.id+'_'+Date.now(),questionId:q.id,course:q.c,topic:q.topic,question:q.q,answer:ans===undefined?null:ans,correct:q.a,explanation:q.e,next:new Date(Date.now()+86400000).toISOString(),resolved:false,count:1,isReview:false})}
function wrongView(){const active=state.wrong.filter(w=>!w.resolved&&!w.isReview),resolved=state.wrong.filter(w=>w.resolved);return `${head('Yanlış defterim','Yanlış cevapları yalnızca biriktirme; nedenini anla, doğru çözümü tekrar kur ve hatayı kapat.')}<div class="grid stats"><div class="stat"><small>Açık soru hatası</small><strong>${active.length}</strong></div><div class="stat"><small>Tekrar kaydı</small><strong>${state.wrong.filter(w=>w.isReview&&!w.resolved).length}</strong></div><div class="stat"><small>Kapatılan kayıt</small><strong>${resolved.length}</strong></div><div class="stat"><small>Tekrar oranı</small><strong>${state.wrong.length?Math.round(resolved.length/state.wrong.length*100):0}%</strong></div></div><div class="panel">${active.length?active.map(w=>`<div class="task"><span class="dot" style="background:var(--red)"></span><div style="flex:1"><b>${esc(w.question)}</b><small>${courseBy(w.course)?.name||'Ders'} · ${w.count||1} kez hata · ${w.next?new Date(w.next).toLocaleDateString('tr-TR'):'Tekrar bekliyor'}</small><details style="margin-top:7px"><summary class="smalltext">Doğru cevabı ve açıklamayı gör</summary><p class="smalltext"><b>Doğru cevap:</b> ${(questions.find(q=>q.id===w.questionId)?.o[w.correct])||'Ders notundaki doğru çözümü kontrol et.'}<br>${w.explanation||'Soruyu ders notunla yeniden çöz ve hata nedenini not et.'}</p></details></div><button class="btn small teal" onclick="wrongDone('${w.id}')">Öğrendim ✓</button></div>`).join(''):'<div class="empty">Henüz açık yanlış kaydın yok. Test çözdükçe yanlışların burada birikir.</div>'}</div><div class="sectionhead"><div><h2>Kapatılan kayıtlar</h2><p>Tekrar ederek öğrendiğin sorular.</p></div></div><div class="panel">${resolved.length?resolved.slice(-15).reverse().map(w=>`<div class="task"><span class="dot" style="background:var(--green)"></span><div><b>${esc(w.question)}</b><small>${courseBy(w.course)?.name||'Ders'}</small></div><span class="good smalltext">Öğrenildi</span></div>`).join(''):'<div class="empty">Henüz kapatılmış kayıt yok.</div>'}</div>`}
function wrongDone(id){const w=state.wrong.find(x=>x.id===id);if(w){w.resolved=true;w.resolvedAt=new Date().toISOString();if(w.course&&Number.isInteger(w.topic))addReview(w.course,w.topic);save();render();toast('Kayıt öğrenildi olarak işaretlendi; konu tekrar kuyruğuna eklendi.')}}
function reviewView(){const active=state.wrong.filter(w=>!w.resolved&&w.isReview).sort((a,b)=>new Date(a.next)-new Date(b.next));const grouped={};active.forEach(w=>{const day=w.next?.slice(0,10)||todayKey();grouped[day]=(grouped[day]||[]).concat(w)});return `${head('Aralıklı tekrar takvimim','Konu tamamlandığında 1, 3, 7, 14 ve 30 günlük tekrar hatırlatmaları oluşturulur.')}<div class="panel">${Object.keys(grouped).length?Object.keys(grouped).sort().map(d=>`<h3 style="margin-top:12px">${new Date(d+'T00:00:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})}</h3>${grouped[d].map(w=>`<div class="task"><span class="dot" style="background:${d<=todayKey()?'var(--red)':'var(--teal)'}"></span><div><b>${courseBy(w.course)?.name}</b><small>${w.question}</small></div><button class="btn small ghost" onclick="reviewComplete('${w.id}')">Tamamla</button></div>`).join('')}`).join(''):'<div class="empty">Henüz tekrar kaydı yok. Bir konuyu tamamladığında tekrar takvimi otomatik oluşur.</div>'}</div>`}
function reviewComplete(id){const w=state.wrong.find(x=>x.id===id);if(w){w.resolved=true;w.resolvedAt=new Date().toISOString();save();render();toast('Tekrar tamamlandı.')}}
function analyticsView(){const cs=allCourses();const tests=state.tests||[];const avg=tests.length?Math.round(tests.reduce((a,t)=>a+t.score/t.total*100,0)/tests.length):0;return `${head('Başarı analizim','Konu tamamlanması, test başarısı ve çalışma sürelerini birlikte değerlendir.')}<div class="grid stats"><div class="stat"><small>Genel konu tamamlama</small><strong>%${Math.round(doneCount()/totalTopics()*100)}</strong></div><div class="stat"><small>Ortalama test başarısı</small><strong>${avg}%</strong></div><div class="stat"><small>Toplam çalışma</small><strong>${state.sessions.reduce((a,s)=>a+s.minutes,0)} dk</strong></div><div class="stat"><small>Çözülen test</small><strong>${tests.length}</strong></div></div><div class="grid two"><section class="panel"><h3>Ders bazlı ilerleme</h3>${cs.map(c=>`<div style="margin:12px 0"><div class="row between"><b class="smalltext">${c.name}</b><span class="smalltext muted">%${pct(c)}</span></div><div class="progress" style="margin-top:5px"><i style="width:${pct(c)}%"></i></div></div>`).join('')}</section><section class="panel"><h3>Son 7 gün çalışma grafiği</h3>${weekChart()}<p class="smalltext muted">Yalnızca zaman tutucu veya test tamamlandığında kaydedilen süreler hesaplanır.</p><h3 style="margin-top:20px">Öğrenme önerisi</h3><div class="callout">İlerleme yüzdesi düşük olan ders, otomatik olarak önerilen çalışma dersleri arasında öne çıkar. Bir sonraki adım: bu dersin en eski tamamlanmamış konusunu aç ve testle pekiştir.</div></section></div>`}
function weekChart(){const days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let key=d.toISOString().slice(0,10);days.push({key,label:d.toLocaleDateString('tr-TR',{weekday:'short'}),m:state.sessions.filter(s=>s.date===key).reduce((a,s)=>a+s.minutes,0)})}const max=Math.max(30,...days.map(d=>d.m));return `<div class="meter">${days.map(d=>`<div class="barwrap"><b class="smalltext">${d.m||''}</b><div class="bar" style="height:${Math.max(2,d.m/max*75)}px"></div><small>${d.label}</small></div>`).join('')}</div>`}
function formulasView(){return `${head('Formül ve birim kartları','Ezberlemek yerine sembolü, birimi, varsayımı ve kullanım koşulunu öğren.')}<div class="grid coursegrid">${formulas.map(f=>`<article class="course"><span class="tag">${courseBy(f.course)?.name||'Genel'}</span><h3>${f.title}</h3><div class="formula">${f.expr}</div><p>${f.note}</p><button class="btn small ghost" onclick="copyText('${f.expr.replaceAll("'","\\'")}')">Formülü kopyala</button></article>`).join('')}</div><div class="callout">Birim kontrolü: kuvvet (N veya kN), uzunluk (m veya mm), alan (m² veya mm²), gerilme (Pa / kPa / MPa) arasında geçiş yaparken tüm terimleri aynı sistemde tut.</div>`}
function notesView(){const keys=Object.keys(state.notes);return `${head('Ders notlarım','Konu kartlarında yazdığın kişisel özetler ve hatırlatmalar burada listelenir.')}<div class="panel">${keys.length?keys.map(k=>{let [id,i]=[k.slice(0,k.lastIndexOf('_')),Number(k.slice(k.lastIndexOf('_')+1))];return `<div class="task"><span class="dot"></span><div><b>${courseBy(id)?.name||id} · ${courseBy(id)?.topics[i]||''}</b><small>${esc(state.notes[k]).replaceAll('\n',' ')}</small></div><button class="btn small ghost" onclick="selectedCourse='${id}';render();openLesson('${id}',${i})">Düzenle</button></div>`}).join(''):'<div class="empty">Henüz kişisel ders notu yazmadın. Ders kataloğundan bir konu açıp kendi özetini ekleyebilirsin.</div>'}</div>`}
function backupView(){return `${head('Yedekleme ve kişisel ayarlar','İlerleme, yanlışlar, notlar ve çalışma kayıtları bu tarayıcıda saklanır. Tarayıcı verilerini temizlemeden önce yedek al.')}<div class="grid two"><section class="panel"><h3>Verilerimi yedekle</h3><p class="muted smalltext">JSON yedeği; tamamlanan konuları, yanlış defterini, tekrarları, notları ve çalışma istatistiklerini içerir.</p><button class="btn teal" onclick="exportBackup()">↓ Yedeği indir</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Yedeğimi geri yükle</h3><input type="file" id="backupFile" accept="application/json" class="field" style="width:100%"><button class="btn ghost" style="margin-top:10px" onclick="importBackup()">Yedeği geri yükle</button></section><section class="panel"><h3>Çalışma tercihlerim</h3><label class="smalltext muted">Günlük hedef (dakika)</label><input class="field" type="number" min="10" max="300" id="goalInput" value="${state.goal}" style="width:100%;margin:6px 0 13px"><button class="btn" onclick="saveGoal()">Ayarı kaydet</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Veri güvenliği</h3><p class="smalltext muted">Bu sürümde veriler sadece kullandığın tarayıcının yerel depolamasında durur. Farklı cihazlarla otomatik eşitlenmez. Bu nedenle haftalık JSON yedeği almanı öneririm.</p><span class="tag">Yerel kayıt · çevrimdışı kullanım</span></section></div><div class="callout">Ders kataloğundaki 26 mevcut ders ve 225 konu başlığı önceki Çalışma Atölyem kaydından korunmuştur. Müfredat kodu/AKTS ve dönem bilgilerini resmî OBS ile karşılaştırarak doğrula. <a href="https://obs.ebyu.edu.tr/oibs/bologna/progAbout.aspx?curSunit=79998&amp;lang=tr" target="_blank" rel="noopener">EBYÜ İnşaat Mühendisliği bilgi paketi ↗</a></div>`}
function setGoal(){const v=prompt('Günlük hedefini dakika olarak yaz (10–300):',state.goal);if(v!==null){const n=Math.min(300,Math.max(10,Number(v)||40));state.goal=n;save();render();toast('Günlük hedef güncellendi.')}}function saveGoal(){const n=Math.min(300,Math.max(10,Number(document.getElementById('goalInput').value)||40));state.goal=n;save();render();toast('Ayar kaydedildi.')}
function addCourse(){const name=prompt('Dersin adını yaz:');if(!name)return;const id='custom_'+Date.now();const code=prompt('Ders kodu (isteğe bağlı):','KİŞİSEL');const raw=prompt('Konu başlıklarını virgülle ayırarak yaz:','1. konu, 2. konu, 3. konu');const topics=(raw||'İlk konu').split(',').map(s=>s.trim()).filter(Boolean);state.customCourses.push({id,code:code||'KİŞİSEL',name,season:'Güz',ects:0,group:'Kişisel ders',required:false,desc:'Kullanıcı tarafından eklenen kişisel ders.',topics});save();render();toast('Kişisel ders eklendi.')}
function exportBackup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),version:2},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='calisma-atolyem-yedek-'+todayKey()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(){const f=document.getElementById('backupFile').files[0];if(!f){toast('Önce yedek dosyası seç.');return}const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.done)||!Array.isArray(x.sessions))throw Error('invalid');if(!confirm('Mevcut kayıtların yedek dosyasındaki kayıtlarla değiştirilsin mi?'))return;state=Object.assign({done:[],wrong:[],sessions:[],notes:{},goal:40,customCourses:[]},x);save();render();toast('Yedek başarıyla geri yüklendi.')}catch(e){toast('Dosya geçerli bir Çalışma Atölyem yedeği değil.')}};r.readAsText(f)}
function saveLessonNote(id,i){state.notes[id+'_'+i]=document.getElementById('lessonNote').value;save();toast('Notun kaydedildi.')}
function bindDynamic(){const s=document.getElementById('courseSearch');if(s)s.oninput=filterCourses;['seasonFilter','typeFilter'].forEach(id=>{const el=document.getElementById(id);if(el)el.onchange=filterCourses});document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{selectedCourse=b.dataset.course;lessonTopic=null;render()})}
function filterCourses(){const q=(document.getElementById('courseSearch')?.value||'').toLocaleLowerCase('tr'),season=document.getElementById('seasonFilter')?.value||'all',type=document.getElementById('typeFilter')?.value||'all';const arr=allCourses().filter(c=>(season==='all'||c.season===season)&&(type==='all'||(type==='required'?c.required:!c.required))&&(c.name.toLocaleLowerCase('tr').includes(q)||c.code.toLowerCase().includes(q)||c.topics.some(t=>t.toLocaleLowerCase('tr').includes(q))));document.getElementById('courseResults').innerHTML=arr.map(courseCard).join('')||'<div class="empty">Aramana uygun ders bulunamadı.</div>';document.getElementById('courseCount').textContent=arr.length+' ders';document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{selectedCourse=b.dataset.course;render()})}
function copyText(s){navigator.clipboard?.writeText(s).then(()=>toast('Formül kopyalandı.')).catch(()=>toast('Kopyalama desteklenmiyor.'))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script></body></html>
